<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --main: #6c5ce7; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .quiz-card { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .option-btn { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e1e1e1; border-radius: 12px; cursor: pointer; transition: 0.3s; background: white; }
        .option-btn:hover { border-color: var(--main); background: #f9f9ff; }
        .option-btn.selected { border-color: var(--main); background: var(--main); color: white; }
        .btn-next { width: 100%; padding: 15px; background: var(--main); color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="quiz-card" id="app">
    <div id="start-screen">
        <h2>تاقیکردنەوەی فیزیا</h2>
        <input type="text" id="name" placeholder="ناڤێ خۆ بنڤیسە" style="width: 100%; padding: 12px; margin: 10px 0;">
        <button class="btn-next" onclick="start()">دەستپێکردن</button>
    </div>
    
    <div id="quiz-screen" style="display:none;">
        <div id="q-container"></div>
        <button class="btn-next" onclick="nextQuestion()">پرسیاری داهاتوو</button>
    </div>
</div>

<script>
let currentQ = 0;
let userAnswers = {};

function start() {
    const name = document.getElementById('name').value;
    if(!name) return alert("ناڤێ خۆ بنڤیسە!");
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    renderQuestion();
}

function renderQuestion() {
    const q = quizData[currentQ];
    document.getElementById('q-container').innerHTML = `
        <h3>${q.id}. ${q.q}</h3>
        ${q.options.map((opt, i) => `<button class="option-btn" onclick="select(${i}, this)">${opt}</button>`).join('')}
    `;
}

function select(idx, btn) {
    userAnswers[currentQ] = idx;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function nextQuestion() {
    if(currentQ < quizData.length - 1) {
        currentQ++;
        renderQuestion();
    } else {
        alert("تاقیکرن تەمام بوو!");
    }
}
</script>
</body>
</html>
