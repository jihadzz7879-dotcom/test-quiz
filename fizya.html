const container = document.getElementById('quiz-container');
quizData.forEach((item, index) => {
    let img = item.img ? `<img src="${item.img}" class="question-img">` : "";
    let options = item.options.map((opt, i) => `<button class="option-btn" onclick="select(${index}, ${i}, this)">${opt}</button>`).join("");
    container.innerHTML += `<div class="question-card"><b>${item.id}. ${item.q}</b>${img}${options}</div>`;
});

let userAnswers = {};
function select(qIdx, optIdx, btn) {
    userAnswers[qIdx] = optIdx;
    btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function checkAnswers() {
    let score = 0;
    quizData.forEach((item, index) => {
        if(userAnswers[index] === item.ans) score++;
    });
    alert("نمرەیا تە: " + score + " ژ " + quizData.length);
}
