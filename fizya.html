<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تاقیکرنا نیشتمانی یا فیزیایێ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2d3436; color: #2d3436; display: flex; justify-content: center; padding: 20px; }
        .main-box { background: white; padding: 40px; border-radius: 30px; width: 100%; max-width: 700px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #6c5ce7; width: 0%; border-radius: 5px; transition: 0.5s; }
        .q-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .opt-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #f1f1f1; border-radius: 12px; cursor: pointer; text-align: right; background: #fff; transition: 0.2s; }
        .opt-btn:hover { border-color: #6c5ce7; }
        .opt-btn.active { background: #6c5ce7; color: white; }
    </style>
</head>
<body>

<div class="main-box" id="app">
    <div id="login-view">
        <h1 style="text-align:center;">تاقیکرنا فیزیایێ 2026</h1>
        <input type="text" id="stuName" placeholder="ناڤێ تە" style="width:100%; padding:15px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
        <input type="number" id="stuAge" placeholder="تەمەن" style="width:100%; padding:15px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
        <select id="stuGender" style="width:100%; padding:15px; margin:10px 0; border-radius:10px;">
            <option value="کور">کور</option><option value="کچ">کچ</option>
        </select>
        <button onclick="begin()" style="width:100%; padding:15px; background:#6c5ce7; color:white; border:none; border-radius:10px; cursor:pointer;">دەستپێکرنا تاقیکرنێ</button>
    </div>

    <div id="quiz-view" style="display:none;">
        <div class="progress-bar"><div class="progress-fill" id="pBar"></div></div>
        <div id="qArea"></div>
    </div>
</div>

<script>
    let p = { name: "", age: 0, gender: "" };
    
    function begin() {
        p.name = document.getElementById("stuName").value;
        p.age = document.getElementById("stuAge").value;
        p.gender = document.getElementById("stuGender").value;
        
        if(!p.name) return alert("ناڤێ خۆ بنڤیسە!");
        
        document.getElementById("login-view").style.display = "none";
        document.getElementById("quiz-view").style.display = "block";
        loadQ(0);
    }

    function loadQ(idx) {
        let q = quizData[idx];
        document.getElementById("pBar").style.width = ((idx/quizData.length)*100) + "%";
        document.getElementById("qArea").innerHTML = `
            <div class="q-text">${q.id}. ${q.q}</div>
            ${q.options.map((o, i) => `<button class="opt-btn" onclick="select(${i})">${o}</button>`).join('')}
        `;
    }
</script>
</body>
</html>
