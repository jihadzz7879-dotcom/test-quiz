<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تاقیکردنەوەی فیزیای پۆلی ١٢</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f3; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .option-btn { display: block; width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; text-align: right; }
        .selected { background: #3498db !important; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <h2>تاقیکردنەوەی فیزیا</h2>
        <input type="text" id="student-name" placeholder="ناڤێ خۆ ل ڤێرێ بنڤیسە">
        <button onclick="startQuiz()">دەستپێکرنا تاقیکرنێ</button>
    </div>

    <div id="quiz-section" class="hidden">
        <div id="timer" style="color: red; font-weight: bold;">دەم: 60:00</div>
        <div id="quiz-container"></div>
        <button onclick="submitQuiz()">ناردنی تاقیکردنەوە</button>
    </div>
</div>

<script>
let studentName = "";
let timeLeft = 3600; // 60 خولەک

function startQuiz() {
    studentName = document.getElementById('student-name').value;
    if(!studentName) return alert("تکایە ناڤێ خۆ بنڤیسە");
    
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('quiz-section').classList.remove('hidden');
    
    // تایمەر
    setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = "دەم: " + Math.floor(timeLeft/60) + ":" + (timeLeft%60);
    }, 1000);
}

function submitQuiz() {
    // ل ڤێرێ دەتوانیت کۆدێ ناردنا ئەنجامان بۆ Database یان Email لێ زێدە بکەی
    alert("سلاڤ " + studentName + "، تاقیکرنا تە هاتە ناردن!");
}
</script>

</body>
</html>
