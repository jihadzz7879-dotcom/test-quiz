<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی فیزیا - خولی دووەم 2024-2025</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0 0; opacity: 0.9; }

        .question-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .question-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .options-container { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: #f1f3f5;
            border: 2px solid #e9ecef;
            border-radius: 30px; /* شێوازی هێلکەیی/بازنەیی مۆدێرن */
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #e2e6ea;
            border-color: var(--accent-color);
        }

        .option-btn.selected {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s;
        }

        .submit-btn:hover { background: #1a252f; }

        #result-section {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 30px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
        }

        /* ستایلی پێداچوونەوەی وەڵامەکان */
        .review-card {
            border-right: 5px solid transparent;
            padding: 15px;
            margin: 15px 0;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: right;
        }
        .review-card.correct { border-right-color: var(--success-color); background: #e8f5e9; }
        .review-card.wrong { border-right-color: var(--danger-color); background: #ffebee; }
        
        .status-text { font-weight: bold; margin-top: 5px; }
        .status-text.correct { color: var(--success-color); }
        .status-text.wrong { color: var(--danger-color); }
    </style>
</head>

<div class="container">

    <div id="result-section">

// دروستکردنی پرسیارەکان لە لاپەڕەکەدا
const container = document.getElementById('questions-container');
quizData.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${index}`;

    let imgHtml = item.img ? `<img src="${item.img}" class="question-img" alt="پرسیاری ${item.id}">` : '';

    let optionsHtml = '';
    item.options.forEach((opt, optIdx) => {
        optionsHtml += `<button type="button" class="option-btn" id="opt-${index}-${optIdx}" onclick="selectOption(${index}, ${optIdx})">${opt}</button>`;
    });

    card.innerHTML = `
        <div class="question-text">${item.id}. ${item.q}</div>
        ${imgHtml}
        <div class="options-container">${optionsHtml}</div>
    `;
    container.appendChild(card);
});

// پاشەکەوتکردنی وەڵامەکانی قوتابی
const userAnswers = new Array(quizData.length).fill(null);

function selectOption(qIdx, optIdx) {
    // لادانی نیشانەی پێشوو
    quizData[qIdx].options.forEach((_, idx) => {
        document.getElementById(`opt-${qIdx}-${idx}`).classList.remove('selected');
    });
    // دیاریکردنی نوێ
    document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add('selected');
    userAnswers[qIdx] = optIdx;
}

function calculateResult() {
    let correctCount = 0;
    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    quizData.forEach((item, index) => {
        const isCorrect = userAnswers[index] === item.ans;
        if (isCorrect) correctCount++;

        // دروستکردنی کارتی پێداچوونەوە
        const reviewCard = document.createElement('div');
        reviewCard.className = `review-card ${isCorrect ? 'correct' : 'wrong'}`;
        
        let userAnsText = userAnswers[index] !== null ? item.options[userAnswers[index]] : "وەڵام نەدراوەتەوە";
        let correctAnsText = item.options[item.ans];

        reviewCard.innerHTML = `
            <div><strong>پرسیاری ${item.id}:</strong> ${item.q}</div>
            <div class="status-text ${isCorrect ? 'correct' : 'wrong'}">
                ${isCorrect ? '✓ وەڵامت ڕاستە' : '✗ وەڵامت خەڵەتە'}
            </div>
            <div>وەڵامی تۆ: <span style="color: ${isCorrect ? 'green' : 'red'}">${userAnsText}</span></div>
            ${!isCorrect ? `<div>وەڵامی ڕاست: <span style="color: green; font-weight: bold;">${correctAnsText}</span></div>` : ''}
        `;
        reviewContainer.appendChild(reviewCard);
    });

    // هەژمارکردنی نمرە لەسەر 100
    const finalScore = (correctCount / quizData.length) * 100;
    
    document.getElementById('score-text').innerText = `${finalScore} / 100`;
    document.getElementById('stats-text').innerText = `تۆ وەڵامی ${correctCount} پرسیارت بە ڕاستی داوەتەوە لە کۆی ${quizData.length} پرسیار.`;
    
    // پیشاندانی بەشی ئەنجام و چوونە سەرەوەی لاپەڕەکە
    document.getElementById('result-section').style.display = 'block';
    window.scrollTo({ top: document.getElementById('result-section').offsetTop, behavior: 'smooth' });
}
