<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کوردۆلۆجی | سلایدێن خواندنێ و کوێزا ئینتەراکتیڤ (لاپەڕە ١ - ١٤)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f292e 100%);
    --card-bg: rgba(255, 255, 255, 0.96);
    --card-border: rgba(255, 255, 255, 0.25);
    --text-main: #1e293b;
    --text-muted: #475569;
    --accent: #0ea5e9;
    --accent-dark: #0369a1;
    --gold: #d97706;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Noto Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.85;
    transition: background 0.6s ease;
    padding-bottom: 50px;
  }

  /* Dynamic slide background themes */
  body.theme-1 { background: linear-gradient(135deg, #0f172a, #1e3a8a, #0f766e); }
  body.theme-2 { background: linear-gradient(135deg, #1e1b4b, #4c1d95, #0f172a); }
  body.theme-3 { background: linear-gradient(135deg, #064e3b, #0f766e, #1e293b); }
  body.theme-4 { background: linear-gradient(135deg, #3b0764, #701a75, #1e1b4b); }
  body.theme-5 { background: linear-gradient(135deg, #172554, #1e40af, #312e81); }
  body.theme-6 { background: linear-gradient(135deg, #0c4a6e, #0284c7, #0f172a); }
  body.theme-7 { background: linear-gradient(135deg, #14532d, #15803d, #0f292e); }
  body.theme-8 { background: linear-gradient(135deg, #451a03, #92400e, #1e1b4b); }
  body.theme-9 { background: linear-gradient(135deg, #4c0519, #881337, #1e1b4b); }
  body.theme-10 { background: linear-gradient(135deg, #0f172a, #0369a1, #1e3a8a); }
  body.theme-11 { background: linear-gradient(135deg, #1e1b4b, #3730a3, #0f766e); }
  body.theme-12 { background: linear-gradient(135deg, #31102f, #6b21a8, #0f172a); }
  body.theme-13 { background: linear-gradient(135deg, #064e3b, #047857, #1e3a8a); }
  body.theme-14 { background: linear-gradient(135deg, #7c2d12, #b45309, #1e1b4b); }

  /* Header */
  .top-header {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    color: #fff;
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .header-row {
    max-width: 1050px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .brand h1 {
    font-size: 1.2rem;
    font-weight: 800;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand p {
    font-size: 0.8rem;
    color: #cbd5e1;
  }

  .stats-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .stat-pill {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    color: #f8fafc;
  }

  .stat-pill.score {
    background: rgba(22, 163, 74, 0.25);
    border-color: #4ade80;
    color: #86efac;
  }

  /* Slide Navigation Strip */
  .nav-strip {
    max-width: 1050px;
    margin: 10px auto 0;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
  }

  .nav-strip::-webkit-scrollbar { height: 5px; }
  .nav-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }

  .slide-tab {
    flex: 0 0 auto;
    background: rgba(255, 255, 255, 0.1);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 13px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .slide-tab:hover { background: rgba(255, 255, 255, 0.22); }
  .slide-tab.active {
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    color: #fff;
    border-color: #7dd3fc;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.45);
  }

  /* Main Container */
  .container {
    max-width: 980px;
    margin: 22px auto;
    padding: 0 14px;
  }

  .slide-card {
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--card-border);
    animation: fadeSlide 0.35s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-banner {
    background: linear-gradient(135deg, #0284c7, #1e40af);
    color: #fff;
    padding: 22px 24px;
    position: relative;
  }

  .slide-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.2);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .slide-banner h2 {
    font-size: 1.45rem;
    font-weight: 800;
    line-height: 1.4;
  }

  .slide-banner .subtitle {
    font-size: 0.92rem;
    color: #e0f2fe;
    margin-top: 4px;
  }

  .slide-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* Sections inside slide */
  .section-box {
    border-radius: 18px;
    padding: 18px 20px;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
  }

  .section-box.explain {
    background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
    border-right: 6px solid #0284c7;
  }

  .section-box.tip {
    background: linear-gradient(180deg, #fffbeb 0%, #ffffff 100%);
    border-right: 6px solid #d97706;
  }

  .section-box.defs {
    background: linear-gradient(180deg, #f5f3ff 0%, #ffffff 100%);
    border-right: 6px solid #7c3aed;
  }

  .section-box.blanks {
    background: linear-gradient(180deg, #ecfeff 0%, #ffffff 100%);
    border-right: 6px solid #0891b2;
  }

  .section-box.mcqs {
    background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
    border-right: 6px solid #16a34a;
  }

  .section-box.qa {
    background: linear-gradient(180deg, #fff1f2 0%, #ffffff 100%);
    border-right: 6px solid #e11d48;
  }

  .section-title {
    font-size: 1.12rem;
    font-weight: 800;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #0f172a;
  }

  .explain-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .explain-list li {
    background: #fff;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid #e0f2fe;
    font-size: 0.98rem;
  }

  .hl {
    background: #fef08a;
    color: #854d0e;
    padding: 1px 6px;
    border-radius: 6px;
    font-weight: 700;
  }

  .hl-blue {
    background: #e0f2fe;
    color: #075985;
    padding: 1px 6px;
    border-radius: 6px;
    font-weight: 700;
  }

  /* Definition cards */
  .def-item {
    background: #fff;
    border: 1px solid #ddd6fe;
    border-radius: 14px;
    padding: 12px 15px;
    margin-bottom: 10px;
  }

  .def-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .def-term {
    font-weight: 800;
    color: #5b21b6;
    font-size: 1.02rem;
  }

  .reveal-btn {
    background: #7c3aed;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }

  .reveal-btn:hover { background: #6d28d9; }
  .reveal-btn:active { transform: scale(0.96); }

  .reveal-btn.rose { background: #e11d48; }
  .reveal-btn.rose:hover { background: #be123c; }

  .def-answer, .qa-answer {
    margin-top: 10px;
    padding: 10px 14px;
    background: #f5f3ff;
    border-radius: 10px;
    color: #1e293b;
    font-weight: 600;
    display: none;
    border-right: 4px solid #7c3aed;
  }

  .qa-answer {
    background: #fff1f2;
    border-right-color: #e11d48;
  }

  .def-answer.show, .qa-answer.show {
    display: block;
    animation: fadeSlide 0.25s ease;
  }

  /* Fill-in-the-blanks */
  .blank-item {
    background: #fff;
    border: 1px solid #cffafe;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .blank-text {
    font-size: 1rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 10px;
  }

  .blank-slot {
    display: inline-block;
    min-width: 110px;
    padding: 2px 10px;
    margin: 0 4px;
    border-bottom: 3px dashed #0891b2;
    background: #ecfeff;
    color: #0e7490;
    border-radius: 8px;
    text-align: center;
    font-weight: 800;
    transition: all 0.25s;
  }

  .blank-slot.filled-correct {
    background: var(--success-bg);
    color: var(--success);
    border-bottom: 3px solid var(--success);
  }

  .blank-slot.filled-wrong {
    background: var(--danger-bg);
    color: var(--danger);
    border-bottom: 3px solid var(--danger);
  }

  .blank-choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .chip-btn {
    background: #f1f5f9;
    border: 2px solid #cbd5e1;
    color: #1e293b;
    padding: 6px 13px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .chip-btn:hover { border-color: #0891b2; background: #ecfeff; }
  .chip-btn.correct { background: var(--success-bg); border-color: var(--success); color: #14532d; }
  .chip-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #7f1d1d; }

  /* Multiple Choice */
  .mcq-item {
    background: #fff;
    border: 1px solid #dcfce7;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 14px;
  }

  .mcq-q {
    font-size: 1.02rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 12px;
  }

  .mcq-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
  }

  .opt-btn {
    text-align: right;
    background: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #1e293b;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .opt-btn:hover:not(:disabled) {
    border-color: #0ea5e9;
    background: #f0f9ff;
    transform: translateY(-1px);
  }

  .opt-btn.correct {
    background: #dcfce7 !important;
    border-color: #16a34a !important;
    color: #14532d !important;
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
  }

  .opt-btn.wrong {
    background: #fee2e2 !important;
    border-color: #dc2626 !important;
    color: #7f1d1d !important;
  }

  .feedback-msg {
    margin-top: 10px;
    font-size: 0.92rem;
    font-weight: 800;
    padding: 8px 12px;
    border-radius: 10px;
    display: none;
  }

  .feedback-msg.show { display: block; }
  .feedback-msg.ok { background: #dcfce7; color: #166534; }
  .feedback-msg.err { background: #fee2e2; color: #991b1b; }

  /* Q&A item */
  .qa-item {
    background: #fff;
    border: 1px solid #fecdd3;
    border-radius: 14px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }

  /* Footer Nav Buttons */
  .slide-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 22px;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    gap: 12px;
    flex-wrap: wrap;
  }

  .nav-btn {
    background: linear-gradient(135deg, #0284c7, #1d4ed8);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 0.96rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
    transition: all 0.2s;
  }

  .nav-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .nav-btn.secondary { background: #334155; box-shadow: none; }

  .action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .mini-action {
    background: #0f172a;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .mini-action:hover { background: #334155; }

  table.info-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
  }
  table.info-table th, table.info-table td {
    border: 1px solid #cbd5e1;
    padding: 9px 12px;
    text-align: right;
    font-size: 0.93rem;
  }
  table.info-table th {
    background: #e0f2fe;
    color: #0c4a6e;
    font-weight: 800;
  }

  @media (max-width: 640px) {
    .slide-banner h2 { font-size: 1.2rem; }
    .slide-body { padding: 14px; }
    .section-box { padding: 14px; }
    .mcq-options { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="theme-1">

<header class="top-header">
  <div class="header-row">
    <div class="brand">
      <h1>📚 کوردۆلۆجی — وەرزی ئێکێ (لاپەڕە ١ هەتا ١٤ ب تنێ)</h1>
      <p>مامۆستا: سەعد ملا میکائیل | سلایدێن تێر و تەسەل + کوێزێ ١٠٠٪</p>
    </div>
    <div class="stats-bar">
      <div class="stat-pill" id="slideCounter">سلاید ١ ژ ١٤</div>
      <div class="stat-pill score" id="scoreCounter">✅ نمرە: ٠ / ٠</div>
      <button class="mini-action" onclick="resetAllProgress()" title="دووبارەکرنا ئەزموونێ">🔄 سفرکرنا ئەزموونێ</button>
    </div>
  </div>
  <nav class="nav-strip" id="navStrip"></nav>
</header>

<main class="container">
  <div id="slideContainer"></div>
</main>

<script>
const slidesData = [
  // ================= SLIDE 1 =================
  {
    id: 1,
    pageRef: "لاپەڕە ١",
    title: "دەرازێنک و ناساندنا بابەتێ کوردۆلۆجیێ",
    subtitle: "چەوا و کەنگی کوردۆلۆجی ل زانکۆیێن کوردستانێ هاتە دانان؟",
    explain: [
      "پشتی <span class='hl'>راپەڕینا گەلێ کورد ل سالا ١٩٩١</span>، هاتنەکایەیا ئازادیێ و هەلبژاردنا دیموکراسی بۆ پەرلەمانی، ئێکەم کابینەیا حکومەتا هەرێما کوردستانێ هاتە دامەزراندن.",
      "بڕیار هاتە دان کو بابەتەک ب ناڤێ <span class='hl-blue'>«کوردۆلۆجی»</span> ل هەمی زانکۆ و پەیمانگەهێن کوردستانێ ل <span class='hl'>قۆناغا ئێکێ</span> بهێتە خواندن (وەک بابەتەکێ گرنگێ نەتەوەیی).",
      "<strong>کوردۆلۆجی (کوردناسی) ل چ دکۆلیتەڤە؟</strong> ل <span class='hl-blue'>مێژوو، زمان، ئەدەب، جوگرافیا، ئەتنۆگرافیا و کەلتورێ</span> مللەتێ کورد دکۆلیتەڤە.",
      "<strong>رۆلێ کوردناسێن بیانی:</strong> کوردناسێن بیانی <span class='hl'>بەری کوردان</span> دەست ب ڤەکۆلینێ لسەر کوردان کرینە، پاشی کوردناسێن کورد هاتن.",
      "<strong>هەلسەنگاندنا کارێ بیانیان:</strong> هەولێن وان کارەکێ پیرۆزە و خزمەتەکا باش ب نەتەوە و فۆلکلۆر و زمانێ کوردی کریە و بەلگەنامەیا مێژوویینە، بەلێ زۆر جاران ژ قالبێ پیرۆز دەرکەفتینە و ب بێ بەلگە و بێ بنەما لسەر نەژاد و نەتەوەیێ کورد گۆتینە کو زیان گەهاندیە کوردان. لەورا پێدڤییە کورد ب عەقلانی و رەخنەیەکا بابەتیانە پێداچوونێ بکەن."
    ],
    tip: "💡 بیرتیژی بۆ ژبەرکرنێ: ١٩٩١ (راپەڕین) ⬅️ ئێکەم کابینە ⬅️ خواندنا کوردۆلۆجی ل قۆناغا ئێکێ. هەروەسا بزانە بیانیان دوو رۆل هەبوون: خزمەت (فۆلکلۆر و زمان و مێژوو) + زیان (تشتێن بێ بنەما لسەر نەژادی).",
    defs: [
      { term: "کوردۆلۆجی (کوردناسی) د دەرازێنکێ دا", def: "ئەو زانستە کو ل مێژوو و زمان و ئەدەب و جوگرافیا و ئەتنۆگرافیا و کەلتورێ مللەتێ کورد دکۆلیتەڤە." }
    ],
    blanks: [
      { before: "پشتی راپەڕینا گەلێ کورد ل سالا", after: "بڕیار هاتە دان بابەتێ کوردۆلۆجی ل قۆناغا ئێکێ بهێتە خواندن.", answer: "١٩٩١", options: ["١٩٩١", "١٩٧٥", "٢٠٠٣", "١٩٨٨"] },
      { before: "کوردناسیێ بەری کوردان ژ لایێ", after: "ڤە دەست ب لێکۆلینێ لسەر کوردان هاتە کرن.", answer: "کوردناسێن بیانی", options: ["کوردناسێن بیانی", "مامۆستایێن زانکۆیێ", "ميرێن بابان", "ئیمپراتۆریەتا میدی"] }
    ],
