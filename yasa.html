        { id: 44, q: "کیژ هەڤالکار ب هەمان یاسایا ( هێمنانه ) دروستبوویە ؟", choices: { A: "دلێرانه", B: "شێرانە", C: "سالانە", D: "هەمی ڕاستن" }, key: "A" },
        { id: 45, q: "کیژ هەڤالناڤ ب یاسایا ( ناڤ + ڕەگێ کار + پاشگر ) درست نەبوویە ؟", choices: { A: "تێکۆشەر", B: "ڕاوکەر", C: "جل شۆر", D: "ڕەنجدەر" }, key: "A" },
        { id: 46, q: "د ڕستەیا ( گەلێ کورد ئاشتیخوازە ) هەڤالناڤێ ( ئاشتیخواز ) دروستبوویە ب دەستووری :", choices: { A: "ناڤ + ناڤ", B: "هەڤالناڤ + ڕەگێ کاری", C: "ناڤ + پاشگر", D: "ناڤ + ڕەگێ کاری" }, key: "D" },
        { id: 47, q: "کیژ نەڤان هەڤالناڤان ب دەستوورێ ( ناڤ + پاشگر ) دروست نە بوویە ؟", choices: { A: "بەختیار", B: "ڕەنجدەر", C: "بریندار", D: "چ ژوان نینن" }, key: "B" },
        { id: 48, q: "کیژ هەڤالناڤ ب هەمان یاسایا ( نەگۆڕ ) دروستبوویە ؟", choices: { A: "بۆێر", B: "بێهێز", C: "بێ شەرم", D: "هەمی دروستن" }, key: "A" },
        { id: 49, q: "د کیژ ڕستەیا ( کارێ مەهەج ) دا هەڤالکار ب دەستوورێ ( ناڤ + پاشگر ) دروستبوویە ؟", choices: { A: "ئەگەر چالاکانە کاربکەین، دێ سەرکەڤین", B: "هەرکە ب دلسۆزی خەباتی بکەی، مەهانە دێ تە خەلاتکەم", C: "تا ڕۆژانە نە خوینی ، دەرناچی", D: "هەمی دروستن" }, key: "C" },
        { id: 50, q: "( خەباتی کۆڵنەدەرانە ئاسۆکە ) هەڤالناڤێ ( کۆڵنەدەر ) ب چ دەستوورێ دروست بوویە ؟", choices: { A: "ناڤ + ناڤ + هەڤالناڤ", B: "هەڤالناڤ + ناڤ + ناڤ", C: "ناڤ + ناڤ + ناڤ", D: "هەڤالناڤ + ناڤ + هەڤالناڤ" }, key: "C" }
    ];

    // Generate HTML for Questions dynamically
    const form = document.getElementById('quizForm');
    questionsData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${q.id}`;

        let optionsHTML = '';
        for (const [letter, text] of Object.entries(q.choices)) {
            optionsHTML += `
                <label class="option-label" id="label-${q.id}-${letter}">
                    <input type="radio" name="question-${q.id}" value="${letter}">
                    <span>${letter} ) ${text}</span>
                </label>
            `;
        }

        card.innerHTML = `
            <div class="question-title">${q.id}. ${q.q}</div>
            <div class="options-container">
                ${optionsHTML}
            </div>
            <div class="feedback-text" id="feedback-${q.id}"></div>
        `;
        form.appendChild(card);
    });

    function checkAnswers() {
        let correctCount = 0;
        const totalQuestions = questionsData.length;

        questionsData.forEach(q => {
            const selectedInput = document.querySelector(`input[name="question-${q.id}"]:checked`);
            const feedbackText = document.getElementById(`feedback-${q.id}`);
            
            // Reset background for all options in this question
            for (const letter of Object.keys(q.choices)) {
                const lbl = document.getElementById(`label-${q.id}-${letter}`);
                if(lbl) lbl.classList.remove('correct-choice', 'wrong-choice');
            }

            if (selectedInput) {
                const userAns = document.querySelector(`input[name="question-${q.id}"]:checked`).value;
                if (userAns === q.key) {
                    correctCount++;
                    document.getElementById(`label-${q.id}-${q.key}`).classList.add('correct-choice');
                    feedbackText.style.display = 'block';
                    feedbackText.style.color = '#4caf50';
                    feedbackText.innerText = '✓ بەرسفا تە ڕاستە!';
                } else {
                    document.getElementById(`label-${q.id}-${userAns}`).classList.add('wrong-choice');
                    document.getElementById(`label-${q.id}-${q.key}`).classList.add('correct-choice');
                    feedbackText.style.display = 'block';
                    feedbackText.style.color = '#f44336';
                    feedbackText.innerText = `✗ خەلتە! بەرسفا ڕاست دێ بیتە: ${q.key}`;
                }
            } else {
                document.getElementById(`label-${q.id}-${q.key}`).classList.add('correct-choice');
                feedbackText.style.display = 'block';
                feedbackText.style.color = '#ff9800';
                feedbackText.innerText = `تە بەرسف نەدایە! بەرسفا ڕاست: ${q.key}`;
            }
        });

        // Calculate score out of 100
        const finalScore = Math.round((correctCount / totalQuestions) * 100);
        
        // Show Results
        const resultBox = document.getElementById('result-box');
        const scoreText = document.getElementById('score-text');
        const scoreDetails = document.getElementById('score-details');

        resultBox.style.display = 'block';
        scoreText.innerText = `${finalScore} / 100`;
        scoreDetails.innerText = `تە بەرسفا ${correctCount} پرسیاران ژ کۆما ${totalQuestions} پرسیاران ب دروستی دایە.`;

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
