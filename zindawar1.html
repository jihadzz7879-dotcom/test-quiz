<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمێ ئەزموونێ: ئەرکێن جێناوێ لکاو</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #7e57c2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            line-height: 1.6;
        }

        .container {
            max-width: 750px;
            margin: 10px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        h3 {
            text-align: center;
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn {
            background-color: #ffffff;
            color: var(--primary-color);
            border: 2px solid #e2e8f0;
            padding: 18px 20px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            font-weight: 600;
        }

        .btn:hover {
            border-color: var(--accent-color);
            background-color: #fcfaff;
            transform: translateY(-1px);
        }

        .btn-main {
            grid-column: 1 / -1;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            border: none;
        }

        .btn-main:hover {
            background-color: #6a45b3;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        .question-card {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
        }

        .question-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .option-item:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .option-item.selected {
            background-color: #f3e8ff !important;
            border-color: var(--accent-color) !important;
            font-weight: bold;
        }

        /* ستایلێن دوماهیا تاقیکردنێ */
        .option-item.correct-reveal {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-item.wrong-reveal {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24;
        }

        .feedback {
            margin-top: 12px;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .feedback.correct { background: #e8f5e9; color: var(--success-color); }
        .feedback.wrong { background: #ffebee; color: var(--error-color); }

        .score-section {
            text-align: center;
            padding: 20px 0;
        }

        .percentage {
            font-size: 56px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 15px 0;
        }

        .btn-back {
            background-color: #94a3b8;
            color: white;
            margin-top: 20px;
            width: 100%;
            text-align: center;
        }
        .btn-back:hover { background-color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <h1>ئەزموونا ڕێزمانا کوردی</h1>
        <h3>بابەتێ سەرەکی: ئەرکێن جێناوێ لکاو</h3>
        
        <div class="menu-grid">
            <button class="btn" onclick="startQuiz('بکەر')">١. جێناوێ لکاو وەکو بکەر (هەموو پسیار)</button>
            <button class="btn" onclick="startQuiz('بەرکار')">٢. جێناوێ لکاو وەکو بەرکار (هەموو پسیار)</button>
            <button class="btn" onclick="startQuiz('تەمامکەر')">٣. جێناوێ لکاو وەکو تەمامکەرێ بەدیاریدە</button>
            <button class="btn" onclick="startQuiz('دیارکەر')">٤. جێناوێ لکاو وەکو دیارکەرێ ناڤی</button>
            <button class="btn btn-main" onclick="startQuiz('گشتی')">تاقیکردنا گشتی (هەمی بابەت پێکەوە)</button>
        </div>
    </div>

    <div id="quiz-section" class="hidden">
        <h2 id="quiz-title" style="text-align: center; margin-bottom: 20px;"></h2>
        <div id="questions-container"></div>
        <button class="btn btn-main" style="width: 100%; margin-top: 15px;" onclick="calculateResults()">دوماهی هێنان و دەرخستنا ئەنجامی</button>
    </div>

    <div id="result-section" class="hidden score-section">
        <h2>ئەنجامێ ئەزموونا تە</h2>
        <div class="percentage" id="result-percent">0%</div>
        <p id="score-text" style="font-size: 20px; margin-bottom: 8px; font-weight: bold;"></p>
        <p id="total-questions-text" style="font-size: 15px; margin-bottom: 25px; color: #64748b;"></p>
        
        <h3 style="text-align: right; color: var(--primary-color); border-top: 2px solid #e2e8f0; padding-top: 20px;">پێداچوونەوا بەرسڤان:</h3>
        <div id="review-container"></div>

        <button class="btn btn-back" onclick="goToMenu()">زڤڕین بۆ لاپەرێ سەرەکی</button>
    </div>
</div>

<script>
    // بانکەکا پڕ و تەواو ژ هەمی پسیارێن د ناڤ ١٠ وێنەیێن تە دا هەی
    const allQuestions = {
        'بکەر': [
            { q: "د ڕستەیا (نامەکەم نووسی) دا، جێناوێ لکاو (م) چ ئەرکەک هەیە؟", a: ["بکەر", "بەرکار", "دیارکەرێ ناڤی", "تەمامکەر"], correct: 0 },
            { q: "جێناوێن لکاو د ڕستەیا لێکدراوێ تێپەڕی دەمێ بۆری دا، دەبنە چ؟", a: ["بەرکار", "بکەر", "جێناوێ لکاوێ دۆند", "هیچ کام"], correct: 1 }
        ],
        'بەرکار': [
            { q: "جێناوێن لکاو ( م ، یت ، ــ ، ین ، ون ، ن ) دبنە بەرکار دگەل کیش جۆری کارێ؟", a: ["A - بۆریێ تێپەڕ", "B - بۆریێ تێنەپەڕ", "C - نەبۆریێ تێپەڕ", "D - بێژیێ تێنەپەڕ"], correct: 0 },
            { q: "جێناوێن لکاو ( ین ) دبیته بەرکار دگەل کارێ:", a: ["A - داخوازیێ تێپەڕ", "B - بۆریێ تێپەڕ", "C - نەبۆریێ تێپەڕ", "D - نەبۆریێ تێنەپەڕ"], correct: 1 },
            { q: "جێناوێ لکاوێ ( ین ) نەشێت ببیته بەرکار دگەل کارێ:", a: ["A - بۆریێ تێپەڕ", "B - داخوازیێ تێپەڕ", "C - نەبۆریێ تێپەڕ", "D - داخوازیێ تێپەڕ (تایبەت)"], correct: 3 },
            { q: "د ڕستەیا ( هاتی بژاردین ) ئەڤ دۆخی کێ هەیە؟", a: ["A - بۆریێ تێپەڕ", "B - بۆریێ تێنەپەڕ", "C - داخوازیێ تێپەڕ", "D - نەبۆریێ تێپەڕ"], correct: 2 },
            { q: "د ڕستەیا ( وەرەتان گرتین ) ئەڤ دۆخی کێ هەیە؟", a: ["A - نەبۆریێ تێپەڕ", "B - بۆریێ تێپەڕ", "C - داخوازیێ تێپەڕ", "D - ئەڕێنیێ تێپەڕ"], correct: 1 },
            { q: "د ڕستەیا ( بانگمان دکەردیت ) ئەڤ دۆخی کێ هەیە؟", a: ["A - بۆریێ تێپەڕ", "B - بۆریێ تێنەپەڕ", "C - داخوازیێ تێپەڕ", "D - نەبۆریێ تێپەڕ"], correct: 0 },
            { q: "جێناوێ لکاوێ ( تان ) نەشێت ببیته بەرکار دگەل کارێ:", a: ["A - داخوازیێ تێپەڕ", "B - ئەڕێنیێ تێپەڕ", "C - تێپەڕ و داخوازی", "D - نەبۆریێ ڕاگەیاندن"], correct: 3 },
            { q: "جێناوێن لکاو ( ت ، تان ) تایبەتە ب بەرکارێ دگەل کارێ:", a: ["A - بۆریێ تێپەڕ", "B - داخوازیێ تێپەڕ", "C - نەبۆریێ تێپەڕ", "D - نەبۆریێ ڕاگەیاندن"], correct: 1 },
            { q: "کێش جێناوێ لکاوێ کارێ ( بکڕە ) دبیته بەرکار:", a: ["A - ی", "B - ت", "C - تان", "D - وەرگرتن"], correct: 0 },
            { q: "ئەگەر جێناوێ لکاوێ بەرکاری دا بۆ کەسی ئێکی کۆم ل گەل کارێ ( هاتی ) دێ ببیته:", a: ["A - هان داین", "B - هاتمان دای", "C - هاتی دامان", "D - هاتی داین"], correct: 3 },
            { q: "جێناوێ کەسیێ لکاو ( ین ) دگەل کێش ئەڤان دێ ببیته بەرکار:", a: ["A - وەرگرت", "B - وەرگرتبا", "C - دەبوو وەرگرتبا", "D - وەرگرتبێت"], correct: 0 }
        ],
        'تەمامکەر': [
            { q: "جێناوێن لکاو ( ین ) دبنە تەمامکەرێ بەدیاریدە دگەل کیش جۆری کارێ؟", a: ["A - بۆریێ تێپەڕ", "B - بۆریێ تێنەپەڕ", "C - نەبۆریێ تێپەڕ", "D - هەمی بەرسڤ دروستن"], correct: 3 },
            { q: "جێناوێن لکاو ( ین ) تایبەتە تەمامکەرێ بەدیاریدە دگەل کارێ:", a: ["A - بۆریێ تێپەڕ", "B - بۆریێ تێنەپەڕ", "C - نەبۆریێ تێپەڕ", "D - داخوازیێ تێپەڕ"], correct: 3 },
            { q: "دڕستەیا ( زەوییەکەی بۆ فرۆشتم ) جێناوێ ( مان ) وەکی تەمامکەرێ بەدیاریدە دچیته دوماهیا:", a: ["A - ئامرازێ پەیوەندیێ", "B - بکەر", "C - دوماهیا کارێ", "D - بەرکار"], correct: 2 },
            { q: "دڕستەیا ( جانتاکەی بۆم داگرت ) ئەگەر ( بەرکار ) بهێته لادان ڕستە دێ ببیته:", a: ["A - بۆی داگرت", "B - بۆم داگرت", "C - بۆمی داگرت", "D - بۆیم داگرت"], correct: 2 },
            { q: "دڕستەیا ( گۆژەکانی بۆ تان ئاودان نەکرد ) ئەگەر بەرکاری لادەین ڕستە دێ ببیته:", a: ["A - بۆتانی ئاودان نەکرد", "B - بۆ تان ئاودان نەکرد", "C - بۆ تان ئاودان نەکردی", "D - بۆ تانی ئاودان نەکردتان"], correct: 0 },
            { q: "دڕستەیا ( کتێبێکی پێم بەخشی ) دڕستەیا کارێ مەرجیدا جێناوێ لکاوێ تەمامکەرێ بەدیاریدە کەوتبێتە:", a: ["A - پێشی بەشێن کار", "B - پێم بەخشی (ناڤەڕۆک)", "C - پاش کۆتا", "D - هیچ کام"], correct: 1 },
            { q: "دڕستەیا ( دیاردیەکمان بۆ ناردیت ) ئەرکێ جێناوێ لکاوێ ( یت ) چییە؟", a: ["A - بکەر", "B - بەرکار", "C - تەمامکەرێ بەدیاریدە", "D - دیارکەرێ ناڤی"], correct: 2 }
        ],
        'دیارکەر': [
            { q: "جێناوێ لکاوێ ( ین ) دبیته دیارکەرێ ناڤی دگەل کارێ:", a: ["A - داخوازی", "B - نەبۆری", "C - بۆریێ تێپەڕ", "D - دگەل هەموویان"], correct: 2 },
            { q: "جێناوێ لکاوێ ( یت ) دبیته دیارکەرێ ناڤی دگەل کارێ:", a: ["A - بۆریێ تێپەڕ", "B - نەبۆریێ تێپەڕ", "C - تەمامکەر", "D - دگەل هەموویان"], correct: 0 },
            { q: "ئەگەر جێناوێ کەسیێ لکاو ببیته دیارکەرێ ناڤی، پشت بە چی دەبەستێت؟", a: ["A - ئامرازی لکاو", "B - ئامرازی پێشگر", "C - ئامرازی دانەپاڵێ ( هـ ) هەیە", "D - چوونەپاڵ"], correct: 2 },
            { q: "د ڕستەیا ( سروودە نوێیەکەمان تۆمارکرد ) ئەرکێ ( مان ) چییە؟", a: ["A - دیارکەرێ پێشگر", "B - بکەر", "C - بەرکار", "D - دیارکەرێ ناڤی"], correct: 3 },
            { q: "نەشێین بێژین ( قەڵەمەکەت نەسرین شکا ) چونکی:", a: ["A - قەڵەمەکە ناسیاوە", "B - پشت پێ بەستراوە", "C - تێکچوونی ڕستەیە", "D - قەڵەمەکە ناڤەکێ ناسراوە دگەل دوو دیارکەران"], correct: 3 },
            { q: "د ڕستەیا ( کتێبەکەم ئازاد جوانە ) بۆچی یا خەلەتە؟", a: ["A - کار نەهاتیە", "B - جێناوێ لکاو دیارکەرێ ناڤی یە و دیارکەرێ دی نابێت", "C - بکەر نەهاتیە", "D - چوانا ڕستێ"], correct: 1 },
            { q: "ئەگەر جێناوێ لکاو ( ت ) وەک دیارکەر بەکاربهێنین د ( میوانەکانمان گەیاندبوو ) دا دێ ببیته:", a: ["A - میوانەکانتان گەیاندبوو", "B - میوانەکەتان", "C - میوانەکان گەیاندبووتان", "D - گەیاندبووتان میوانەکە"], correct: 0 }
        ]
    };

    let activeQuestions = [];
    let selectedAnswers = {};

    function startQuiz(category) {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        
        selectedAnswers = {};
        
        if (category === 'گشتی') {
            document.getElementById('quiz-title').innerText = "تاقیکردنا گشتی (هەمی پسیارێن د ناڤ وێنەیاندا پێکەوە)";
            activeQuestions = [
                ...allQuestions['بکەر'],
                ...allQuestions['بەرکار'],
                ...allQuestions['تەمامکەر'],
                ...allQuestions['دیارکەر']
            ];
        } else {
            document.getElementById('quiz-title').innerText = "تاقیکردنا: جێناوێ لکاو وەکو " + category;
            activeQuestions = [...allQuestions[category]];
        }

        renderQuestions();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        activeQuestions.forEach((qObj, qIdx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            const qTitle = document.createElement('div');
            qTitle.className = 'question-text';
            qTitle.innerText = `پسیارا ${qIdx + 1}: ${qObj.q} (٢ نمرە)`;
            card.appendChild(qTitle);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            qObj.a.forEach((opt, oIdx) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.id = `q-${qIdx}-o-${oIdx}`;
                li.innerText = opt;
                li.onclick = () => selectOption(qIdx, oIdx);
                optionsList.appendChild(li);
            });

            card.appendChild(optionsList);
            container.appendChild(card);
        });
    }

    function selectOption(qIdx, oIdx) {
        // لادانی ستایلێ هەلبژاردنێن کۆن یێن وێ پسیارێ
        activeQuestions[qIdx].a.forEach((_, id) => {
            document.getElementById(`q-${qIdx}-o-${id}`).classList.remove('selected');
        });
        
        // جێگیرکرنا هەلبژاردنا نوو
        selectedAnswers[qIdx] = oIdx;
        document.getElementById(`q-${qIdx}-o-${oIdx}`).classList.add('selected');
    }

    function calculateResults() {
        // پشکنین کا ئەرێ هەموو پسیار بەرسڤ دراون؟
        let answeredCount = Object.keys(selectedAnswers).length;
        if (answeredCount < activeQuestions.length) {
            alert("تکایە بەرسڤا هەمی پسیاران بدە پێش وێ چەندێ ئەنجامی ببینی!");
            return;
        }

        let correctCount = 0;
        let totalQuestions = activeQuestions.length;

        activeQuestions.forEach((qObj, qIdx) => {
            if (selectedAnswers[qIdx] === qObj.correct) {
                correctCount++;
            }
        });

        let totalScore = totalQuestions * 2;
        let userScore = correctCount * 2;
        let percent = Math.round((correctCount / totalQuestions) * 100);

        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');

        document.getElementById('result-percent').innerText = percent + "%";
        document.getElementById('score-text').innerText = `نمرەیا تە: ${userScore} ژ کۆی ${totalScore} نمرەیان`;
        document.getElementById('total-questions-text').innerText = `تە بەرسڤا (${correctCount}) پسیاران داوە ب دروستی ژ کۆی (${totalQuestions}) پسیارێن تاقیکردنێ.`;

        renderReview();
    }

    function renderReview() {
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';

        activeQuestions.forEach((qObj, qIdx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            const qTitle = document.createElement('div');
            qTitle.className = 'question-text';
            qTitle.innerText = `پسیارا ${qIdx + 1}: ${qObj.q}`;
            card.appendChild(qTitle);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            qObj.a.forEach((opt, oIdx) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = opt;

                // دیارکرنا دۆخێ بەرسڤدانێ ل دوماهییێ
                if (oIdx === qObj.correct) {
                    li.classList.add('correct-reveal');
                } else if (selectedAnswers[qIdx] === oIdx && selectedAnswers[qIdx] !== qObj.correct) {
                    li.classList.add('wrong-reveal');
                }

                optionsList.appendChild(li);
            });

            card.appendChild(optionsList);

            const feedback = document.createElement('div');
            if (selectedAnswers[qIdx] === qObj.correct) {
                feedback.className = 'feedback correct';
                feedback.innerText = "✓ بەرسڤا تە دروست بوو!";
            } else {
                feedback.className = 'feedback wrong';
                feedback.innerText = `✗ بەرسڤا تە خەلەت بوو! بەرسڤا دروست: ${qObj.a[qObj.correct]}`;
            }
            card.appendChild(feedback);

            reviewContainer.appendChild(card);
        });
    }

    function goToMenu() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }
</script>

</body>
</html>
