<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEKO787 - تیک تۆک داونلۆدەر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #16161a;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #24242b;
        }

        .logo-area {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #24242b;
            border-radius: 12px;
            background-color: #1f1f24;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #fe2c55;
            background-color: #24242b;
            box-shadow: 0 0 10px rgba(254, 44, 85, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #fe2c55 0%, #ee1d52 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.4);
        }

        button:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-bottom: 15px;
            background-color: rgba(248, 113, 113, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(248, 113, 113, 0.2);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="password-section">
        <div class="logo-area">🔒</div>
        <h2>پێویستە لۆگین ببی</h2>
        <p>بۆ چوونە ناڤ داونلۆدکەری، هیڤییە پاسوۆردی بنووسە</p>
        <div id="error-message" class="error-msg">پاسوۆرد خەڵتە! دووبارە تاقی بکەوە.</div>
        <div class="input-group">
            <input type="password" id="password-input" placeholder="پاسوۆرد لێرە بنووسە...">
        </div>
        <button onclick="checkPassword()">چوونە ژوورێ</button>
    </div>

    <div id="download-section" class="hidden">
        <div class="logo-area">📥</div>
        <h2>تیک تۆک داونلۆدەر بێ لۆگۆ</h2>
        <p>بەستەرێ (Link) ڤیدیۆیا تیک تۆکێ لێرە پەیست بکە بۆ داونلۆدکرنێ</p>
        <div class="input-group">
            <input type="text" id="tiktok-url" placeholder="https://www.tiktok.com/...">
        </div>
        <button id="dl-btn" onclick="startDownload()">داونلۆدکرن</button>
    </div>

</div>

<script>
    // نوێکردنەوەی پاسوۆرد بۆ ئەوەی جەنابەت ویستووتە
    const CORRECT_PASSWORD = "JEKO787";

    // پشکنینی پاسوۆرد
    function checkPassword() {
        const userInput = document.getElementById("password-input").value;
        const errorMsg = document.getElementById("error-message");

        if (userInput === CORRECT_PASSWORD) {
            document.getElementById("password-section").classList.add("hidden");
            document.getElementById("download-section").classList.remove("hidden");
        } else {
            errorMsg.style.display = "block";
        }
    }

    // داونلۆدکردنی ڕاستەقینەی ڤیدیۆ بێ ئاڕم و لۆگۆ
    async function startDownload() {
        const tiktokUrl = document.getElementById("tiktok-url").value;
        const downloadButton = document.getElementById("dl-btn");

        if (tiktokUrl.trim() === "") {
            alert("هیڤییە بەستەرەکێ دروست یێ تیک تۆکێ بنووسە!");
            return;
        }

        downloadButton.innerText = "چاوەڕێبە... لۆد دەبێت";
        downloadButton.disabled = true;

        try {
            // بەکارهێنانی سێرڤەری خێرا بۆ گەڕاندنەوەی فایلی MP4
            const apiEndpoint = `https://www.tikwm.com/api/?url=${encodeURIComponent(tiktokUrl)}`;
            const response = await fetch(apiEndpoint);
            const result = await response.json();

            if (result.code === 0 && result.data.play) {
                const videoLink = result.data.play;
                
                // دروستکردنی لایەنێکی کاتی بۆ داونلۆدکردنی ڕاستەقینە
                const linkContainer = document.createElement("a");
                linkContainer.href = videoLink;
                linkContainer.download = "tiktok_video.mp4";
                linkContainer.target = "_blank"; 
                document.body.appendChild(linkContainer);
                linkContainer.click();
                document.body.removeChild(linkContainer);

                alert("ڤیدیۆ بە سەرکەوتوویی ئامادەکرا و داونلۆد بوو!");
            } else {
                alert("ببوورە! کێشەیەک د بەستەری دا هەیە یان ڤیدیۆ یا تایبەتە (Private).");
            }
        } catch (error) {
            console.error("Error downloading video:", error);
            alert("کێشەیەک د هێڵێ دا هەیە، هیڤییە دووبارە تاقی بکەوە.");
        } finally {
            downloadButton.innerText = "داونلۆدکرن";
            downloadButton.disabled = false;
        }
    }
</script>

</body>
</html>
