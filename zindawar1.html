<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700&display=swap');

        body {
            background: #05070a;
            font-family: 'Almarai', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* پشتێنەیا جووڵەیی */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(212, 175, 55, 0.15);
            filter: blur(150px);
            border-radius: 50%;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            padding: 50px;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header i { font-size: 3em; color: #d4af37; margin-bottom: 15px; }
        .header h2 { color: #fff; margin: 0; font-size: 1.8em; }

        .input-group { margin-bottom: 20px; }
        input, select {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            color: #fff;
            font-size: 1em;
            transition: 0.3s;
        }
        input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        button {
            width: 100%;
            padding: 18px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.5s;
        }
        button:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }

        /* تێبینی: ژمارا تەلەفۆنی */
        input[type="tel"] { letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <i class="fas fa-tooth"></i>
        <h2>Dr. Firdaws</h2>
    </div>
    
    <form onsubmit="alert('ب سەرکەفتیانە هاتە تومارکرن!'); return false;">
        <div class="input-group">
            <input type="text" placeholder="ناڤێ نەخۆشی" required>
        </div>
        
        <div class="input-group">
            <input type="tel" pattern="075[01][0-9]{7}" placeholder="ژمارا تەلەفۆنی (075x...)" required>
        </div>

        <div class="input-group">
            <select required>
                <option value="">جۆرێ چارەسەریێ</option>
                <option>راستکرنا ددانا</option>
                <option>سپیکرنا ددانا</option>
                <option>پشکنین و نەشتەرگەری</option>
            </select>
        </div>

        <div class="input-group">
            <input type="date" required>
        </div>

        <div class="input-group">
            <input type="time" required>
        </div>

        <button type="submit">تومارکرنا سەرەدانێ</button>
    </form>
</div>

</body>
</html>
