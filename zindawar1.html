<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مایسترۆ AI - هاریكارێ زیرەک</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* دیزاینێ کانتێنەرێ سەرەکی یێ چاتێ */
        .chat-container {
            width: 100%;
            max-width: 450px;
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .chat-header {
            background-color: #2d2d2d;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #ffcc00;
            font-size: 1.1rem;
            border-bottom: 2px dashed #ffcc00;
            position: relative;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #ffcc00;
            color: #000000;
            align-self: flex-start;
            border-top-right-radius: 2px;
            font-weight: 500;
        }
        .bot-msg {
            background-color: #2d2d2d;
            color: #ffffff;
            align-self: flex-end;
            border-top-left-radius: 2px;
            border: 1px solid #444;
        }
        .chat-input-area {
            padding: 12px;
            background-color: #1a1a1a;
            display: flex;
            gap: 8px;
            border-top: 1px solid #333;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-input-area button {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background-color: #e6b800;
        }
        /* ستایلێ سکڕۆڵ باڕ */
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background-color: #444;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            مايستروۆ AI (هاوشێوەی Gemini)
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-msg">
                سلاو قوتابییێ هێژا! ئەز بۆتەکێ زیرەکم ب هێزا ژیرییا دەستکرد (AI). هەر پسیارەکا تە د هەر بابەتەکی دا هەبیت بنووسە، ئەز دێ بەرسڤا تە دەم!
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="پسیارەکێ بکە (ب فیزیا، مێژوو، کوردی...)" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">ناردن</button>
        </div>
    </div>

<script>
    // مێشکێ ناڤخۆیی یێ بۆتی بۆ بەرسڤدانا هەمی بابەتان
    function simulateSmartAI(input, loadingId) {
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        const cleanInput = input.trim();
        let reply = "پسیارەکا جوانە قوتابیێ هێژا! وەک بۆتێ مایسترۆ ئەز پێشنیار دکەم تۆ سەیری پشکا بابەتان بکەی د مالپەری دا، چونکی ل وێرێ زانیاریێن تەمام یێن ل سەر ڤی بابەتی هاتینە دانان.";

        if (cleanInput.includes("سلاو") || cleanInput.includes("سلاف")) {
            reply = "سلاو و ڕێز قوتابیێ خۆشەویست! ئەز مایسترۆ مە، هاریكارێ تە یێ زیرەک. د چ بابەت دا پسیارا تە هەیە؟ ل سەر (فیزیا، مێژوو, کوردی، یاسا، ئیسلامی، ژیندەوەر) بنووسە دا بەرسڤێ بدەم.";
        } 
        else if (cleanInput.includes("فیزیا")) {
            reply = "فیزیا زانستا لێکۆڵینێ یا ل سەر سروشت، وزە، و لڤینێ یە. یاسایا سەرەکی یا لڤینێ دبێژیت کو هێز یەکسانە ب بارستە جاران تاودان ($F=ma$).";
        } 
        else if (cleanInput.includes("مێژوو")) {
            reply = "مێژوو تۆمارا مەزنترین ڕووداوێن مرۆڤایەتیێ یە. خواندنا مێژوویێ مە فێری وانەیێن مەزن دکەت بۆ پاشەڕۆژێ. تە پسیار ل سەر چ سەردەمەکی هەیە؟";
        } 
        else if (cleanInput.includes("کوردی")) {
            reply = "زمانێ کوردی (بادینی) زمانێ مە یێ ئەدەبی و ڕەسەنە. پێکدهێت ژ ناڤ، کار، و ئاوەڵناڤ د ڕێزمانێ دا کو ڕستێ ڕێک دکەن.";
        } 
        else if (cleanInput.includes("عەرەبی")) {
            reply = "اللغة العربية هي لغة غنية جداً بالقواعد والبلاغة. ئەگەر پسیارەک ل سەر المبتدأ والخبر یان الفاعل هەبیت، ئەز ل ڤێرەم.";
        }
        else if (cleanInput.includes("ئینگلیزی") || cleanInput.includes("ئێنگلیزی")) {
            reply = "English is dynamic! زمانێ ئینگلیزی دەرگەهێ زانستێ یە. ئەگەر تە پێدڤی ب ڕێزمانێ (Grammar) یان ڕامانا پەیڤان هەبیت، تەنها بنووسە.";
        }
        else if (cleanInput.includes("یاسا")) {
            reply = "یاسا کۆمەڵە ڕێسایەکا دەستووری یە بۆ پاراستنا مافێن گشتی و بەرقەرارکرنا دادپەروەریێ د ناڤبەرا هەمی وەلاتیان دا.";
        } 
        else if (cleanInput.includes("ئیسلامی")) {
            reply = "بابەتێن ئیسلامی باسی فەرموودە، تەفسیر، و سیرەیا پێغەمبەری (س.خ) دکەن کو ڕەوشتێ جوان فێری مرۆڤی دکەن.";
        }
        else if (cleanInput.includes("ژیندەوەر") || cleanInput.includes("زیندەزانی")) {
            reply = "زیندەزانی (Biology) ل سەر پێکهاتەیا گیانەوەر و ڕووەکان دکۆڵیت. خانە ($Cell$) یەکەکا بنەڕەتی یا ژیانێ یە و DNA زانیاریێن بۆماوەیی تێدا دپارێزیت.";
        }
        else if (cleanInput.includes("سوپاس")) {
            reply = "شایەنی چ نینە قوتابیێ هێژا! هیوادارەم نمرێن بەرز د تاقیکردنەوەیان دا بزانی و سەرکەفتی بی. 👍";
        }

        appendMessage(reply, 'bot-msg');
    }

    function sendMessage() {
        const inputElement = document.getElementById('userInput');
        if (!inputElement) return;
        
        const messageText = inputElement.value.trim();
        if (messageText === "") return;

        // ١. لێدانا نامەیا بەکارهێنەری
        appendMessage(messageText, 'user-msg');
        inputElement.value = "";

        // ٢. لێدانا نیشانا بارکرنێ
        const loadingId = appendMessage("مایسترۆ یێ هزردکەت... 🧠", 'bot-msg');

        // ٣. ڕاستەوخۆ ناردن بۆ مێشکێ ناڤخۆیی دا کو تووشی شاشەیا سپی نەبیت
        setTimeout(() => {
            simulateSmartAI(messageText, loadingId);
        }, 500);
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return "";
        
        const messageElement = document.createElement('div');
        const id = 'msg-' + Date.now();
        messageElement.id = id;
        messageElement.className = `message ${className}`;
        messageElement.innerText = text;
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return id;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
