<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Firdaws Dental Clinic</title>
    <style>
        :root {
            --primary-color: #00a896;
            --secondary-color: #028090;
            --dark-color: #020c1b;
            --light-color: #f4f9f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border-top: 5px solid var(--primary-color);
            margin: 20px;
        }

        h1 {
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-size: 24px;
        }

        h2 {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--dark-color);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 168, 150, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        #booking-section {
            display: none;
        }

        .error-msg {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .success-msg {
            color: #2b9348;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }
        
        .icon {
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🦷</div>
    <h1>Dr. Firdaws Dental Clinic</h1>
    <h2>کلینیکا دکتور فیردەوس بۆ ددانا</h2>

    <!-- پشکێ پاسپۆردێ -->
    <div id="password-section">
        <div class="form-group">
            <label for="password">بۆچوونا ناڤ سیستەمی، پاسپۆردی بنڤێسە:</label>
            <input type="password" id="password" placeholder="پاسپۆردی لێرە بنڤێسە...">
        </div>
        <button onclick="checkPassword()">چوونەژوور</button>
        <p class="error-msg" id="pass-error">پاسپۆرد خەلەتە! دیسان تاقی بکەوە.</p>
    </div>

    <!-- پشکێ گرتنا ژڤانی -->
    <div id="booking-section">
        <div class="form-group">
            <label for="patient-name">ناڤێ نەخۆشی:</label>
            <input type="text" id="patient-name" placeholder="ناڤێ خۆ یێ سیانی بنڤێسە">
        </div>

        <div class="form-group">
            <label for="appointment-date">ڕێکەفت و ڕۆژا ژڤانی (هەمی ڕۆژا ژبۆلی ئەینی):</label>
            <input type="date" id="appointment-date">
        </div>

        <button onclick="submitBooking()">تۆمارکرنا ژڤانی</button>
        <p class="success-msg" id="success-text"></p>
    </div>
</div>

<script>
    // پشکنینا پاسپۆردی
    function checkPassword() {
        const passInput = document.getElementById('password').value;
        const passError = document.getElementById('pass-error');
        const passwordSection = document.getElementById('password-section');
        const bookingSection = document.getElementById('booking-section');

        if (passInput === "Firdaws") {
            passwordSection.style.display = "none";
            bookingSection.style.display = "block";
            
            // ڕێگری ل گرتنا ژڤانێن ڕابردوو بکە (تەنها ژ ئەڤڕۆ و پێدا)
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('appointment-date').setAttribute('min', today);
        } else {
            passError.style.display = "block";
        }
    }

    // تۆمارکرنا ژڤانی
    function submitBooking() {
        const name = document.getElementById('patient-name').value;
        const dateInput = document.getElementById('appointment-date').value;
        const successText = document.getElementById('success-text');

        if (name.trim() === "" || !dateInput) {
            alert("تکایە ناڤێ خۆ بنڤێسە و ڕێکەفتەکێ هەلبژێرە!");
            return;
        }

        // پشکنین کا ئەرێ ڕۆژا ئەینییە؟
        const selectedDate = new Date(dateInput);
        const dayOfWeek = selectedDate.getUTCDay(); // 5 رامانا وێ ئەینییە (Friday)

        if (dayOfWeek === 4) { // د سیستەمێ ئۆتۆماتیکی دا 4 ل سەر ته‌قویما UTC دبیته‌ ڕۆژا ئه‌ینی ل دەڤ مه‌
            alert("ببورە! کلینیک ڕۆژێن ئەینی داخستییە. تکایە ڕۆژەکا دی هەلبژێرە.");
            return;
        }

        // ناڤێن ڕۆژان ب کوردی
        const daysInKurdish = ["یەکشەمبی", "دووشەمبی", "سێشەمبی", "چوارشەمبی", "پێنجشەمبی", "ئەینی", "شەمبی"];
        const dayName = daysInKurdish[selectedDate.getDay()];

        // دیارکرنا سەرکەفتنا نامێ
        successText.innerHTML = `سلاڤ نەخۆش: <b>${name}</b><br> ژڤانێ تە ب سەرکەفتن هاتە تۆمارکرن ل ڕۆژا <b>${dayName} (${dateInput})</b>.`;
        successText.style.display = "block";
        
        // پاقژکرنا فۆڕمی
        document.getElementById('patient-name').value = "";
        document.getElementById('appointment-date').value = "";
    }
</script>

</body>
</html>
