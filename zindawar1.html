<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆتێ زیرەک یێ قوتابیان</title>
    <style>
        /* دیزاینەکێ مۆدێرن و گونجای دگەل ڕەنگێن ماڵپەرێ تە */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* دوگمەیا کلیک ل سەرکرنێ بۆ دەرکەفتنا بۆتی */
        .bot-toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 2px dashed #ffcc00;
            padding: 14px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 9999;
            transition: all 0.3s ease;
        }

        .bot-toggle-btn:hover {
            background-color: #ffcc00;
            color: #121212;
            transform: scale(1.05);
        }

        /* پەنجەرەیا چاتی */
        .chat-container {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 380px;
            max-width: 90%;
            height: 500px;
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; 
            flex-direction: column;
            overflow: hidden;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* سەرێ پەنجەرێ */
        .chat-header {
            background-color: #222222;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 2px dashed #ffcc00;
            position: relative;
            color: #ffcc00;
        }

        .close-btn {
            position: absolute;
            left: 15px;
            top: 16px;
            background: none;
            border: none;
            color: #ff4444;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            color: #ff0000;
        }

        /* لایێ نامەکان */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #151515;
        }

        .message {
            max-width: 82%;
            padding: 11px 15px;
            border-radius: 15px;
            font-size: 14.5px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* نامەیا بۆتی */
        .bot-msg {
            background-color: #262626;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-right-radius: 3px;
            border: 1px solid #333;
        }

        /* نامەیا قوتابی */
        .user-msg {
            background-color: #ffcc00;
            color: #121212;
            align-self: flex-end;
            border-bottom-left-radius: 3px;
            font-weight: bold;
        }

        /* لایێ نڤیسینێ */
        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: #1e1e1e;
            border-top: 1px solid #2d2d2d;
        }

        .chat-input {
            flex: 1;
            background-color: #121212;
            border: 1px solid #3c3c3c;
            color: white;
            padding: 12px;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .chat-input:focus {
            border-color: #ffcc00;
        }

        .send-btn {
            background-color: #ffcc00;
            border: none;
            color: #121212;
            padding: 0 18px;
            margin-right: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .send-btn:hover {
            background-color: #e6b800;
        }
    </style>
</head>
<body>

    <button class="bot-toggle-btn" onclick="toggleChat()">🤖 پسیار ژ هاریكارێ زیرەک بکە</button>

    <div class="chat-container" id="chatBox">
        <div class="chat-header">
            <button class="close-btn" onclick="toggleChat()">✕</button>
            مایسترۆ (بۆتێ زیرەک یێ قوتابیان)
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-msg">
                بخێربێی قوتابیێ هێژا! ئەز هاریكارێ تە یێ زیرەكم د هەمی بابه تاندا. هەر پسیارەکا تە هەبیت (فیزیا، مێژوو، کوردی، یاسا، ژیندەوەر، ئینگلیزی، هتد...) ل خوارێ بنووسە دا بەرسڤا تە بدەم!
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="پسیارا خۆ ل ڤێرە بنووسە..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">ناردن</button>
        </div>
    </div>

    <script>
        // داتابەیسا بەرسڤێن بۆتی ل سەر بابەتان (تو دشێی بابەت و پسیارێن زێدەتر ل ڤێرە زێدە بكەی)
        const knowledgeBase = {
            // پسیارێن گشتی
            "سلاو": "سلاو و ڕێز! ئەز ل ڤێرەم بۆ هاریكاریا تە. پسیارا خۆ بکە.",
            "چەوانی": "سلاو، ئەز گەلەک باشم سوپاس بۆ تە! ئەز ئامادەم بۆ بەرسڤدانا پسیارێن تە.",
            "سوپاس": "شایەنی چ نینە هێژا! هیوایا سەرکەفتنێ بۆ تە دخوازم. ئەگەر پسیارەکا دی هەبیت ئەز ل ڤێرەم.",

            // بابەتێ فیزیا
            "فیزیا": "فیزیا زانستا لێكۆلینێیە ل سەر سروشت، ماددە، وزە و لڤینێ. تە چ پسیار ل سەر هەیە؟",
            "نیوتن": "ئیسحاق نیوتن سێ یاسایێن سەرەكی یێن لڤینێ داناینە: ١- بەردەوامبوونا لڤینێ یان سكونێ. ٢- هێز یەکسانە ب بارستە جاران تاودان ($F=ma$). ٣- بۆ هەر كارەكی بەركارەك هەیە یێ یەکسان د هێزێ دا و بەڕوڤاژی د ئاراستەی دا.",
            "وزە": "وزە شیانا ئەنجامدانا کارە، و چەندین جۆرێن هەی وەک وزەیا لڤینێ، وزەیا شاراوە، وزەیا گەرمی و ڕووناكی.",

            // بابەتێ مێژوو
            "مێژوو": "مێژوو زانستا تۆمارکرن و شرۆڤەکرنا ڕووداوێن بورینە. حەز دکەی ل سەر کیش سەردەم یان ڕووداوێ بزانی؟",
            "جەنگێ جیهانی": "جەنگێ جیهانیێ ئێکێ (1914-1918) و جەنگێ جیهانیێ دووێ (1939-1945) دوو مەزنترین ڕووداوێن مێژوویا مرۆڤایەتیێ بوون کو نەخشێ جیهانێ گۆهرین.",

            // بابەتێ کوردی
            "کوردی": "زمانێ كوردی زمانەكێ دەولەمەند و ڕەسەنە ژ خێزانا زمانێن هیندۆ-ئەوروپی. پسیارا تە ل سەر ڕێزمانێ یە یان ئەدەبی؟",
            "ڕێزمان": "ڕێزمانا کوردی پێکدهێت ژ یاسایێن ڕێکخستنا پەیڤ و ڕستان وەک (ناڤ، جێناو، کار، ئاوەڵناو) د ڕستێ دا.",

            // بابەتێ عەرەبی
            "عەرەبی": "اللغة العربية هي لغة القرآن الكريم ولغة ضاد غنية جداً بالبلاغة والقواعد. د چ دا هاریكاریا تە بكەم؟",
            "قواعد": "القواعد النحوية في اللغة العربية تشمل المبتدأ والخبر، الفاعل والمفعول به، وإن وأخواتها، وكان وأخواتها.",

            // بابەتێ ئینگلیزی
            "ئینگلیزی": "English is a global language. ئەز دشێم د وەرگێڕان، ڕێزمان (Grammar)، یان پەیڤێن نوو دا هاریكاریا تە بكەم. پسیارا خۆ بنووسە.",
            "grammar": "English grammar includes tenses (Past, Present, Future), nouns, verbs, pronouns, and adjectives. What do you need help with?",

            // بابەتێ یاسا
            "یاسا": "یاسا کۆمەلا ڕێسا و دەستوورانە کو دەسەڵات د دەتە دەوڵەتێ بۆ ڕێکخستنا جڤاکی و پاراستنا مافێن وەلاتیان.",
            "دەستوور": "دەستوور (Constituion) بلندترین یاسایە د دەوڵەتێ دا کو سیستەمێ حوکمرانیێ و ماف و ئەرکێن سەرەکی یێن گشتی دیار دکەت.",

            // بابەتێ ژیندەوەر
            "ژیندەوەر": "زانستا ژیندەوەر (Biology) ل سەر گیانەوەران، ڕووەکان، مرۆڤ و خانەیێن زیندوو لێکۆڵینێ دکەت.",
            "خانە": "خانە (Cell) یەکەکا سەرەکی و بنیاتنەرە بۆ پێکهاتە و فەرمانا هەمی زیندەوەران.",
            "دی ئێن ئەی": "DNA یان (دی ئێن ئەی) ئەو ترشە کۆمەڵەیە کو پێزانینێن بۆماوەیی یێن زیندەوەران هەڵدەگریت.",

            // بابەتێ ئیسلامی
            "ئیسلامی": "پەرتووکێن ئیسلامی ل سەر عەقیدە، فیقهـ، سیرەیا پێغەمبەری (س.خ) و تەفسیرێ بەحس دکەن. تە چ پسیار هەیە؟"
        };

        // نیشاندان و شاردنەوەیا چاتی
        function toggleChat() {
            const chatBox = document.getElementById('chatBox');
            if (chatBox.style.display === 'none' || chatBox.style.display === '') {
                chatBox.style.display = 'flex';
            } else {
                chatBox.style.display = 'none';
            }
        }

        // پرۆسێسا ناردنا نامێ
        function sendMessage() {
            const inputElement = document.getElementById('userInput');
            const messageText = inputElement.value.trim();
            
            if (messageText === "") return;

            // ١- نیشاندانا نامەیا قوتابی
            appendMessage(messageText, 'user-msg');
            inputElement.value = "";

            // ٢- بەرسڤدانا بۆتی پشتی ٤٠٠ ملی چرکە
            setTimeout(() => {
                const botResponse = getBotResponse(messageText);
                appendMessage(botResponse, 'bot-msg');
            }, 400);
        }

        // مێشکێ بۆتی بۆ دۆزینەوەیا باشترین بەرسڤ
        function getBotResponse(input) {
            const cleanInput = input.toLowerCase();
            
            // گەڕیان د ناڤ داتابەیسێ دا بۆ دۆزینەوەیا پەیڤێن هاوبەش
            for (let key in knowledgeBase) {
                if (cleanInput.includes(key.toLowerCase())) {
                    return knowledgeBase[key];
                }
            }
            
            // ئەگەر پسیارەک بوو کو د داتابەیسێ دا نەبوو، بۆت ب ڤی شێوازی بەرسڤێ ددەت دا کو یێ زیرەک دیار بیت:
            return "پسیارەکا جوانە! ئەز نوکە یێ فێردبم ل سەر ڤی بابەتی و بەرسڤا تەمام ل دەڤ من نینە. بەلێ تۆ دشێی پسیارێ ڕوونتر بکەی یان ناڤێ بابەتەکی بنووسی وەک (فیزیا، مێژوو، یاسا، ژیندەوەر، کوردی، عەرەبی) دا کو ڕاستەوخۆ هاریکاریا تە بکەم.";
        }

        // دروستکرنا ئێلیمێنتێ نامێ د ناڤ چاتی دا
        function appendMessage(text, className) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', className);
            messageElement.innerText = text;
            chatMessages.appendChild(messageElement);
            
            // ئۆتۆماتیک دچیتە خوارێ بۆ بینینی نامێن نوو
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // کارکرن ب دوگمەیا Enter
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
