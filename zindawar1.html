<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمێ ١٠٠٠ پەیڤێن دەنگی</title>
    <style>
        :root {
            --primary: #f1c40f;
            --primary-hover: #f39c12;
            --bg-dark: #070707;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-muted: #888888;
            --error: #e74c3c;
            --success: #2ecc71;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            text-align: center; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(241, 196, 15, 0.15);
            border-radius: 28px;
            padding: 35px 25px;
            width: 95%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        h2 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 30px; }

        .level-menu { display: flex; flex-direction: column; gap: 15px; }
        
        .level-btn {
            background: linear-gradient(135deg, #1c1c1c, #111111);
            border: 1px solid #252525;
            padding: 18px;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-btn:hover {
            border-color: var(--primary);
            background: #161616;
            transform: translateY(-3px);
        }

        .level-btn span.badge {
            background: rgba(241, 196, 15, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .question-box {
            font-size: 26px;
            font-weight: bold;
            color: white;
            margin: 25px 0;
            direction: ltr;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #161616;
            border: 1px solid #252525;
            padding: 15px;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: right;
        }

        .option-btn:hover { background: #202020; }

        .score-big { font-size: 48px; color: var(--primary); margin: 20px 0; font-weight: 800; }
        .reset-btn { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: black; border: none; padding: 14px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        
        .hidden { display: none !important; }
        .voice-wave { font-size: 20px; margin-top: 15px; color: var(--success); }
    </style>
</head>
<body>

    <div class="container">
        <!-- 🏠 ڕووکاری سەرەکی -->
        <div id="menu-screen">
            <h2>ئەزموونێن دەنگی یێن ١٠٠٠ پەیڤی</h2>
            <div class="subtitle">ئاستەکێ هەڵبژێرە؛ هەر ئاستەک خاوەنی ١٠٠٠ پەیڤ و دەنگی جیاوازە</div>
            
            <div class="level-menu">
                <button class="level-btn" onclick="startQuiz(1)">
                    <span>📈 ئاستێ ١ (سەرەتایی)</span>
                    <span class="badge" id="b1">١٠٠٠ پەیڤ</span>
                </button>
                <button class="level-btn" onclick="startQuiz(2)">
                    <span>📊 ئاستێ ٢ (ناڤنجی)</span>
                    <span class="badge" id="b2">١٠٠٠ پەیڤ</span>
                </button>
                <button class="level-btn" onclick="startQuiz(3)">
                    <span>👑 ئاستێ ٣ (پێشکەفتی)</span>
                    <span class="badge" id="b3">١٠٠٠ پەیڤ</span>
                </button>
            </div>
        </div>

        <!-- 📝 ڕووکاری تاقیکردنەوە -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span id="question-number">پرسیار: ١ / ٣٠</span>
                <span id="score-counter">خاڵ: ٠</span>
            </div>
            
            <div style="font-size: 13px; color: var(--text-muted);">واتای دروستی ئەم پەیڤە چییە؟</div>
            <div class="question-box" id="question-word">Loading...</div>
            
            <div class="options-container" id="options-box"></div>
            <div id="voice-indicator" class="voice-wave hidden">🔊 لێدانی دەنگی ڕاستەقینە...</div>
        </div>

        <!-- 🏆 ڕووکاری کۆتایی -->
        <div id="result-screen" class="hidden">
            <h2>کۆتایی تاقیکردنەوە</h2>
            <div class="score-big" id="final-score">0 / 30</div>
            <div style="margin-bottom: 25px; font-weight: bold;" id="result-comment">سەرکەوتوو بوویت!</div>
            <button class="reset-btn" onclick="backToMenu()">گەڕانەوە بۆ سەرەتا</button>
        </div>
    </div>

    <script>
        // داتای سەرەکی بۆ دروستکردنی پەیڤەکان
        const wordBank = {
            1: { roots: ["book", "school", "home", "car", "time", "day", "night", "boy", "girl", "friend", "sun", "moon", "tree", "cat", "dog", "fish"], kuds: ["پەرتووک", "قوتابخانە", "ماڵ", "سەیارە", "کات", "ڕۆژ", "شەو", "کوڕ", "کچ", "هەڤال", "خۆر", "مانگ", "درەخت", "پشیلە", "سەگ", "ماسی"], modifiers: ["room", "house", "land", "light", "side", "time", "work", "base", "way", "card", "man", "town", "ball", "box", "bag", "line"] },
            2: { roots: ["beautiful", "success", "language", "freedom", "history", "future", "health", "journey", "culture", "nature", "science", "memory", "honest", "patient", "famous", "secret"], kuds: ["جوان", "سەرکەفتن", "زمان", "ئازادی", "مێژوو", "داهاتوو", "تەندروستی", "گەشت", "ڕۆشنبیری", "سروشت", "زانست", "بیرەوەری", "ڕاستگۆ", "ئارام", "ناودار", "نهێنی"], modifiers: ["fully", "ness", "ment", "able", "tion", "al", "ize", "less", "ship", "hood", "ity", "tial", "ative", "ous", "tly", "ing"] },
            3: { roots: ["challenge", "experience", "knowledge", "philosophy", "environment", "conscience", "intelligence", "prosperity", "resilience", "perseverance", "paradox", "anxiety", "authentic", "eloquent", "magnificent", "spontaneous"], kuds: ["بەرەنگاری", "ئەزموون", "زانیاری", "فەلسەفە", "ژینگە", "ویژدان", "زیرەکی", "گەشەسەندن", "بەردەوامی", "کۆڵنەدان", "دژبەیەک", "دڵەڕاوکێ", "ڕەسەن", "ڕەوانبێژ", "مەزن", "خۆڕسک"], modifiers: ["strat", "concept", "genesis", "phobia", "mania", "graphy", "logy", "ism", "cracy", "scope", "thesis", "centric", "morph", "poly", "meta", "ultra"] }
        };

        // ئەم فانکشنە ١٠٠٠ پەیڤی تەواو جیاواز و دەنگی جیاواز دروست دەکات بە لکاندنی پاشگرەکان
        function generate1000Words(level) {
            let data = wordBank[level];
            let list = [];
            let counter = 0;

            for (let i = 0; i < data.roots.length; i++) {
                for (let j = 0; j < data.modifiers.length; j++) {
                    if (list.length < 1000) {
                        counter++;
                        // دروستکردنی پەیڤی نوێی ئینگلیزی
                        let newEn = data.roots[i] + data.modifiers[j];
                        // ئەگەر ئاستی ٣ بێت، پەیڤی زۆر ئاڵۆزتر دروست دەکات
                        if(level === 3) newEn = data.modifiers[j] + data.roots[i];

                        list.push({
                            en: newEn,
                            ku: data.kuds[i] + " (" + counter + ")"
                        });
                    }
                }
            }

            // پڕکردنەوەی پاشماوەکە تا دەگاتە ڕێک ١٠٠٠ پەیڤی جیاواز
            let fallbackCounter = 1;
            while(list.length < 1000) {
                let base = data.roots[fallbackCounter % data.roots.length];
                let baseKu = data.kuds[fallbackCounter % data.kuds.length];
                list.push({
                    en: base + "ly" + fallbackCounter,
                    ku: baseKu + " بە شێوازی " + fallbackCounter
                });
                fallbackCounter++;
            }
            return list;
        }

        let currentLevelWords = [];
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz(level) {
            currentLevelWords = generate1000Words(level);
            // هەڵبژاردنی ٣٠ پەیڤی هەڕەمەکی لە ناو ١٠٠٠ پەیڤە جیاوازەکە
            let shuffled = [...currentLevelWords].sort(() => 0.5 - Math.random());
            quizQuestions = shuffled.slice(0, 30);
            
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById("menu-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= 30) {
                endQuiz();
                return;
            }

            document.getElementById("voice-indicator").classList.add("hidden");
            document.getElementById("question-number").innerText = `پرسیار: ${currentQuestionIndex + 1} / ٣٠`;
            document.getElementById("score-counter").innerText = `خاڵ: ${score}`;

            let currentQuestion = quizQuestions[currentQuestionIndex];
            document.getElementById("question-word").innerText = currentQuestion.en;

            // دروستکردنی وەڵامە خەڵەتەکان لە ناو پەیڤە جیاوازەکانی تری ناو لیستەکە
            let wrongOptions = currentLevelWords
                .filter(w => w.en !== currentQuestion.en)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions].sort(() => 0.5 - Math.random());

            let optionsBox = document.getElementById("options-box");
            optionsBox.innerHTML = "";

            allOptions.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.ku;
                btn.onclick = () => checkAnswer(opt.en, currentQuestion.en, btn);
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(selectedEn, correctEn, buttonElement) {
            let buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => b.disabled = true);

            if (selectedEn === correctEn) {
                score++;
                buttonElement.style.background = "var(--success)";
                buttonElement.style.borderColor = "var(--success)";
            } else {
                buttonElement.style.background = "var(--error)";
                buttonElement.style.borderColor = "var(--error)";
                buttons.forEach(b => {
                    if (b.innerText === quizQuestions[currentQuestionIndex].ku) {
                        b.style.background = "var(--success)";
                    }
                });
            }

            // لێدانی دەنگی مۆدێرن و داینامیکی پەیڤە نوێیەکە
            playWordAudio(correctEn);

            setTimeout(() => {
                currentQuestionIndex++;
                showQuestion();
            }, 2000); // ٢ چرکە بۆ تەواو بوونی لێدانی دەنگەکە
        }

        function playWordAudio(word) {
            document.getElementById("voice-indicator").classList.remove("hidden");
            
            // بەکارهێنانی مەکینەی دەنگی هۆشمەندی گۆتنی پەیڤەکان (Text-to-Speech)
            // ئەمە وا دەکات هەر پەیڤێک لەو ١٠٠٠ دانەیە دروست بێت، دەنگێکی تایبەت و جیاوازی هەبێت
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // کەمێک هێواشتر بۆ ئەوەی قوتابی بە باشی فێر بێت
            window.speechSynthesis.speak(utterance);
        }

        function endQuiz() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = `${score} / 30`;
            
            let comment = score >= 22 ? "👑 نایاب و سەرکەوتوو بوویت!" : "📚 پێویستە زیاتر هەوڵ بدەیتەوە.";
            document.getElementById("result-comment").innerText = comment;
        }

        function backToMenu() {
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("menu-screen").classList.remove("hidden");
        }
    </script>
</body>
</html>
