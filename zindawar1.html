<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESAM BARBER - گرتنی سرا</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 25px;
            position: relative;
        }

        .logo-container img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .location-tag {
            background-color: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            display: inline-block;
            margin-top: 10px;
        }

        .phone-display {
            color: #f1c40f;
            font-size: 1.1em;
            margin-top: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h1 {
            color: #f1c40f;
            margin-top: 15px;
            margin-bottom: 20px;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #bbb;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 1em;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #f1c40f;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.5);
        }

        button {
            background-color: #f1c40f;
            color: #121212;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #34af23;
            color: white;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <!-- Vê wêneya ku te şandî li vir zêde bike -->
        <img src="image.png" alt="ESAM BARBER Akre">
        <div class="location-tag">Akre, Iraq</div>
        <div class="phone-display">📞 07503062183</div>
    </div>

    <h1>سرا گرتن</h1>

    <form id="barberForm">
        <div class="form-group">
            <label for="naum">ناو:</label>
            <input type="text" id="naum" placeholder="ناوی خۆت بنووسە" required>
        </div>

        <div class="form-group">
            <label for="mobayl">ژمارەی مۆبایل:</label>
            <input type="tel" id="mobayl" placeholder="07XX XXX XXXX" required>
        </div>

        <div class="form-group">
            <label for="betek">بەروار (ساڵ/مانگ/ڕۆژ):</label>
            <input type="date" id="betek" required>
        </div>

        <div class="form-group">
            <label for="kat">کاتژمێر:</label>
            <input type="time" id="kat" required>
        </div>

        <button type="button" onclick="sendToWhatsApp()">ناردنی داواکاری بۆ واتسئاپ</button>
    </form>
</div>

<script>
    function sendToWhatsApp() {
        var name = document.getElementById('naum').value;
        var phone = document.getElementById('mobayl').value;
        var date = document.getElementById('betek').value;
        var time = document.getElementById('kat').value;

        if(name == "" || phone == "" || date == "" || time == ""){
            alert("تکایە هەمی خانەکان پڕ بکە!");
            return;
        }

        // ژمارا حەلاقی یا تە
        var myPhoneNumber = "9647503062183"; 

        // ناما کۆ کڕیار بۆ تە دهنێریت
        var message = "سڵاو کاک عیسام، من دکەم سرا بگرم:\n\n" +
                      "👤 ناو: " + name + "\n" +
                      "📱 مۆبایل: " + phone + "\n" +
                      "📅 ڕۆژ: " + date + "\n" +
                      "⏰ کاتژمێر: " + time + "\n\n" +
                      "تکایە پشتڕاست بکەوە (لایک بکە) ئەگەر گونجاوە.";

        var encodedMessage = encodeURIComponent(message);
        var whatsappUrl = "https://wa.me/" + myPhoneNumber + "?text=" + encodedMessage;

        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
