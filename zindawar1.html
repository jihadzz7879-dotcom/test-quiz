<script>
    // 🔑 کلیلێ خۆ یێ نوو یێ Gemini API ل ڤێرێ د ناڤ کەوانان دا دابنێ
    const API_KEY = "AQ.Ab8RN6K9oGZtVwxSiNo6Q7M5la37e9L6xcF9UzI_DNThfLL38w"; 

    function toggleChat() {
        const chatBox = document.getElementById('chatBox');
        if (chatBox) {
            chatBox.style.display = (chatBox.style.display === 'none' || chatBox.style.display === '') ? 'flex' : 'none';
        }
    }

    async function sendMessage() {
        const inputElement = document.getElementById('userInput');
        if (!inputElement) return;
        
        const messageText = inputElement.value.trim();
        if (messageText === "") return;

        // ١. نیشاندانا نامەیا قوتابی
        appendMessage(messageText, 'user-msg');
        inputElement.value = "";

        // ٢. نیشاندانا نامەیا چاوەڕێبوونێ
        const loadingId = appendMessage("مایسترۆ یێ هزردکەت... 🧠", 'bot-msg');

        // پشکنین ئەگەر کلیل نەهاتبێتە گۆهرین، ڕاستەوخۆ دچێتە سەر مێشکێ ناڤخۆیی
        if (!API_KEY || API_KEY === "" || API_KEY.includes("کلیلێ")) {
            setTimeout(() => { simulateSmartAI(messageText, loadingId); }, 400);
            return;
        }

        try {
            // گرێدان دگەل سێرڤەرێ سەرەکی یێ Gemini بۆ بەرسڤدانا هەر پسیارەکێ
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `تۆ مامۆستایەکێ هاریكار و گەلەک زیرەکی د قوتابخانێ دا. ب زمانێ کوردی بادینی (کرمانجیا سەری) بەرسڤا ڤێ پسیارا قوتابی بدە ب شێوازەکێ کورت و ڕوون: ${messageText}` }] }]
                })
            });

            if (!response.ok) {
                throw new Error("API_Error");
            }

            const data = await response.json();
            
            const loadingEl = document.getElementById(loadingId);
            if (loadingEl) loadingEl.remove();

            // ئەگەر وەڵام ژ لایێ کلیلێ ڕاستەقینە هات، ل ڤێرە نیشان دە
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let aiReply = data.candidates[0].content.parts[0].text;
                appendMessage(aiReply, 'bot-msg');
            } else {
                simulateSmartAI(messageText, loadingId);
            }

        } catch (error) {
            // ئەگەر کلیل ل سەر GitHub کار نەکرد، مێشکێ ناڤخۆیی دێ پاراستنێ کەت
            simulateSmartAI(messageText, loadingId);
        }
    }

    // 🧠 مێشکێ ناڤخۆیی (بۆ حالەتێ کۆمەکێ یان کێشەیا کلیلی)
    function simulateSmartAI(input, loadingId) {
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        const cleanInput = input.trim().toLowerCase();
        let reply = "پسیارەکا جوانە قوتابیێ هێژا! وەک بۆتێ مایسترۆ، ئەز پێشنیار دکەم تۆ سەیری پشکا بابەتێن ناڤبری بکەی د ماڵپەری دا، چونکی ل وێرێ زانیاریێن تەمام یێن پێدڤی بۆ تاقیکردنەوەیان هاتینە ڕێکخستن.";

        if (cleanInput.includes("سلاو") || cleanInput.includes("سلاف")) {
            reply = "سلاو و ڕێز قوتابیێ خۆشەویست! ئەز مایسترۆ مە، هاریكارێ تە یێ زیرەک. د چ بابەت دا پسیارا تە هەیە؟ ناڤێ بابەتەکی بنووسە (وەک فیزیا، مێژوو، کوردی، یاسا، ئیسلامی، ژیندەوەر) دا وەڵامێ بدەم.";
        } 
        else if (cleanInput.includes("فیزیا")) {
            reply = "فیزیا زانستا لێکۆڵینێ یا ل سەر سروشت، وزە، و لڤینێ یە. یاسایا سەرەکی یا لڤینێ (یاسایا دووێ یا نیوتنی) دبێژیت کو هێز یەکسانە ب بارستە جاران تاودان: $F=ma$.";
        } 
        else if (cleanInput.includes("مێژوو")) {
            reply = "مێژوو تۆمارا مەزنترین ڕووداوێن مرۆڤایەتیێ یە. خواندنا مێژوویێ مە فێری وانەیێن مەزن دکەت بۆ پاشەڕۆژێ.";
        } 
        else if (cleanInput.includes("کوردی")) {
            reply = "زمانێ کوردی (بادینی) زمانێ مە یێ ڕەسەن و نازکە. پێکدهێت ژ ناڤ، کار، و ئاوەڵناڤ د ڕێزمانێ دا.";
        } 
        else if (cleanInput.includes("ئینگلیزی") || cleanInput.includes("english")) {
            reply = "Welcome! English is wonderful. ئەگەر تە پێدڤی ب ڕێزمانێ (Grammar) یان ڕامانا پەیڤان هەبیت، تەنها پرسیار بکە.";
        }
        else if (cleanInput.includes("یاسا")) {
            reply = "یاسا کۆمەڵە ڕێسایەکا دەستووری یە بۆ پاراستنا مافێن گشتی و بەرقەرارکرنا دادپەروەریێ د ناڤبەرا هەمی مرۆڤان دا.";
        } 
        else if (cleanInput.includes("ئیسلامی")) {
            reply = "بابەتێن پەروەردەیا ئیسلامی باسی قورئانێ، فەرموودەیێن پێغەمبەری (س.خ) و ئەخلاقێ جوان دکەن.";
        }
        else if (cleanInput.includes("ژیندەوەر") || cleanInput.includes("زیندەزانی")) {
            reply = "زیندەزانی (Biology) ل سەر پێکهاتەیا گیانەوەر و ڕووەکان دکۆڵیت. خانە ($Cell$) یەکەکا بنەڕەتی یا ژیانێ یە.";
        }
        else if (cleanInput.includes("سوپاس")) {
            reply = "شایەنی چ نینە قوتابیێ هێژا و سەرکەفتی! هیمی د سەرکەفتنێ دا بی. 👍";
        }

        appendMessage(reply, 'bot-msg');
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return "";
        
        const messageElement = document.createElement('div');
        const id = 'msg-' + Date.now();
        messageElement.id = id;
        messageElement.className = `message ${className}`;
        messageElement.innerText = text;
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return id;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>
