<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Bot</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 30px auto;
    padding: 20px;
}
input, button {
    padding: 10px;
    font-size: 16px;
}
#chat {
    border: 1px solid #ccc;
    padding: 10px;
    min-height: 200px;
    margin-bottom: 10px;
}
</style>
</head>
<body>

<h2>Chat Bot</h2>

<div id="chat"></div>

<input type="text" id="question" placeholder="پرسیار بنووسە">
<button onclick="askBot()">ناردن</button>

<script>
async function askBot() {
    const question = document.getElementById("question").value;
    const chat = document.getElementById("chat");

    chat.innerHTML += `<p><b>تۆ:</b> ${question}</p>`;

    const response = await fetch("YOUR_API_URL", {AQ.Ab8RN6K9oGZtVwxSiNo6Q7M5la37e9L6xcF9UzI_DNThfLL38w
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            question: question
        })
    });

    const data = await response.json();

    chat.innerHTML += `<p><b>بۆت:</b> ${data.answer}</p>`;
}
</script>

</body>
</html>
