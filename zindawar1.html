<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونێن وەزاری - JEHAD ZEBARI</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #020617, #0f172a, #1e1b4b);
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.6);
            --accent-color: #6366f1;
            --card-hover: rgba(99, 102, 241, 0.15);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f8fafc, #f1f5f9, #e2e8f0);
            --panel-bg: rgba(255, 255, 255, 0.75);
            --panel-border: rgba(15, 23, 42, 0.08);
            --text-color: #0f172a;
            --accent-glow: 0 0 15px rgba(79, 70, 229, 0.2);
            --accent-color: #4f46e5;
            --card-hover: rgba(79, 70, 229, 0.08);
            --shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* دوگمەیا گۆهرینا ستایلی */
        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
        }

        /* كۆنتێنەرێ مۆدێرن */
        .container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
        }

        /* ناڤێ تە ل سەرێ شاشێ */
        .developer-name {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color);
            margin-bottom: 5px;
        }
        
        [data-theme="light"] .developer-name {
            color: var(--accent-color);
            text-shadow: none;
        }

        .system-title {
            font-size: 1.4rem;
            opacity: 0.9;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* سێكشەنێن هەڵبژارتنێ */
        .section-label {
            text-align: right;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
        }

        .grid-options {
            display: grid;
            grid-template-columns: 14fr 14fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* كارتێن هه لبژارتنێ */
        .selection-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        [data-theme="light"] .selection-card {
            background: rgba(0, 0, 0, 0.02);
        }

        .selection-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            background: var(--card-hover);
            box-shadow: var(--accent-glow);
        }

        /* كارتێ هاتیە هەڵبژارتن */
        .selection-card.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff !important;
            box-shadow: var(--accent-glow);
        }

        .selection-card.active .card-desc {
            color: rgba(255, 255, 255, 0.8);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        /* دوگمەیا دەستپێكرنێ */
        .start-btn {
            width: 100%;
            background: linear-gradient(90deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
            filter: brightness(1.1);
        }

        /* لاپەرێ تاقیكرنێ */
        .quiz-section {
            display: none;
            text-align: right;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--panel-border);
        }

        .badge {
            background: var(--accent-color);
            color: white;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body data-theme="dark">

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ ڕۆهن</button>

    <div class="container">
        <div id="selection-page">
            <div class="developer-name">JEHAD ZEBARI</div>
            <div class="system-title">Chemistryسیستەمێ تاقیكرنێن وەزاری</div>
            
            <div class="section-label">📅 سالا ئەزموونێ هەڵبژێڕە:</div>
            <div class="grid-options">
                <div class="selection-card" id="year-2024" onclick="selectYear(2024)">
                    <div class="card-title">٢٠٢٤</div>
                    <div class="card-desc">پرسیارێن سالا بورى</div>
                </div>
                <div class="selection-card" id="year-2025" onclick="selectYear(2025)">
                    <div class="card-title">٢٠٢٥</div>
                    <div class="card-desc">پرسیارێن ئەڤساڵە</div>
                </div>
            </div>

            <div class="section-label">📝 خولێ هەڵبژێڕە:</div>
            <div class="grid-options">
                <div class="selection-card" id="round-1" onclick="selectRound(1)">
                    <div class="card-title">خۆلا ئێكێ</div>
                    <div class="card-desc">٥٠ پرسیارێن گشتی</div>
                </div>
                <div class="selection-card" id="round-2" onclick="selectRound(2)">
                    <div class="card-title">خۆلا دووێ</div>
                    <div class="card-desc">٥٠ پرسیارێن گشتی</div>
                </div>
            </div>

            <button class="start-btn" onclick="validateAndStart()">دەستپێبکە 🚀</button>
        </div>

        <div id="quiz-page" class="quiz-section">
            <div class="quiz-header">
                <span id="quiz-title" style="font-weight: bold; font-size: 1.2rem;"></span>
                <span class="badge">پرسیار ١ ژ ٥٠</span>
            </div>
            <div style="font-size: 1.3rem; margin-bottom: 30px; line-height: 1.6;" id="question-text">
                لڤێرە دێ پرسیار هێتە نیشاندان...
            </div>
        </div>
    </div>

    <script>
        let selectedYear = null;
        let selectedRound = null;

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '🌙 تاری';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ ڕۆهن';
            }
        }

        function selectYear(year) {
            selectedYear = year;
            document.getElementById('year-2024').classList.remove('active');
            document.getElementById('year-2025').classList.remove('active');
            document.getElementById(`year-${year}`).classList.add('active');
        }

        function selectRound(round) {
            selectedRound = round;
            document.getElementById('round-1').classList.remove('active');
            document.getElementById('round-2').classList.remove('active');
            document.getElementById(`round-${round}`).classList.add('active');
        }

        function validateAndStart() {
            if (!selectedYear || !selectedRound) {
                alert('هیڤیە بەری لێبەتانی، سال و خولێ هەڵبژێڕە!');
                return;
            }
            
            document.getElementById('selection-page').style.display = 'none';
            document.getElementById('quiz-page').style.display = 'block';
            
            const roundText = selectedRound === 1 ? 'خۆلا ئێكێ' : 'خۆلا دووێ';
            document.getElementById('quiz-title').innerText = `ئەزموونا سالا ${selectedYear} - ${roundText}`;
            document.getElementById('question-text').innerText = `بۆخێر بێی بۆ ئەزموونا سالا ${selectedYear} (${roundText}). لڤێرە پرسیارێن تە دێ دەستپێكەن.`;
        }
    </script>
</body>
</html>
