
<div class="video-player-card">
    <h2 class="header-title">فێرکاریێن ب زمانێ کوردی</h2>
    
    <div class="lang-selector">
        <button class="lang-btn active" onclick="switchVideo('badini', this)">بادینی</button>
        <button class="lang-btn" onclick="switchVideo('sorani', this)">سۆرانی</button>
        <button class="lang-btn" onclick="switchVideo('kurmanji', this)">کرمانجی</button>
    </div>

    <div class="video-box">
        <video id="mainVideo" controls poster="background.jpg">
            <source id="videoSrc" src="badini.mp4" type="video/mp4">
        </video>
    </div>

    <div class="footer-actions">
        <a id="downloadLink" href="badini.mp4" download class="btn-download">📥 دابەزاندنا ڤیدیۆیێ</a>
        <a href="https://www.instagram.com/gehad.zebare78" target="_blank" class="btn-ig">
            📸 سەرەدانا ئینستگرامێ بکە
        </a>
    </div>
</div>

<style>
    .video-player-card { max-width: 900px; margin: 50px auto; background: #ffffff; padding: 30px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; }
    .header-title { color: #2c3e50; font-size: 24px; margin-bottom: 20px; font-weight: 700; }
    
    /* ستایلێ زمانان */
    .lang-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .lang-btn { padding: 10px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: all 0.3s; background: #e1e8ed; color: #555; }
    .lang-btn.active { background: #007bff; color: white; transform: scale(1.05); }

    .video-box { width: 100%; border-radius: 20px; overflow: hidden; border: 5px solid #f4f4f4; }
    video { width: 100%; display: block; }

    /* ستایلێ دوگمەیان */
    .footer-actions { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
    .btn-download { padding: 12px 30px; background: #28a745; color: white; border-radius: 50px; text-decoration: none; font-weight: bold; }
    .btn-ig { padding: 12px 30px; background: #e1306c; color: white; border-radius: 50px; text-decoration: none; font-weight: bold; }
</style>

<script>
    function switchVideo(lang, btn) {
        // گۆهرینا سەرچاوەیا ڤیدیۆیێ
        const video = document.getElementById("mainVideo");
        const source = document.getElementById("videoSrc");
        const download = document.getElementById("downloadLink");
        
        source.src = lang + ".mp4";
        download.href = lang + ".mp4";
        video.load();
        video.play();

        // گۆهرینا رەنگێ دوگمەیان
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
