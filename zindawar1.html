<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆتێ هاریكارێ قوتابیان</title>
    <style>
        /* دیزاینی گشتی هاوشێوەی وێنەی ماڵپەرەکەت */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* دوگمەی ڕەئیسی بۆ هێنانە پێشەوەی بۆت */
        .bot-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2c2c2c;
            color: #fff;
            border: 2px dashed #ffcc00;
            padding: 15px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            transition: 0.3s;
        }

        .bot-toggle-btn:hover {
            background-color: #ffcc00;
            color: #121212;
        }

        /* پەنجەرەی چات بۆت */
        .chat-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 360px;
            max-width: 90%;
            height: 450px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            display: none; /* ل سەرەتادا شاراوەیە */
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        /* سەرێ بۆت */
        .chat-header {
            background-color: #2c2c2c;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px dashed #ffcc00;
            position: relative;
        }

        .close-btn {
            position: absolute;
            left: 15px;
            top: 12px;
            background: none;
            border: none;
            color: #ff3333;
            font-size: 18px;
            cursor: pointer;
        }

        /* شوێنی نامەکان */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .bot-msg {
            background-color: #2c2c2c;
            color: #fff;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .user-msg {
            background-color: #ffcc00;
            color: #121212;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
            font-weight: 500;
        }

        /* شوێنی نوسین و ناردن */
        .chat-input-area {
            display: flex;
            padding: 10px;
            background-color: #222;
            border-top: 1px solid #333;
        }

        .chat-input {
            flex: 1;
            background-color: #121212;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        .send-btn {
            background-color: #ffcc00;
            border: none;
            color: #121212;
            padding: 0 15px;
            margin-right: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn:hover {
            background-color: #e6b800;
        }
    </style>
</head>
<body>

    <!-- الدکمه التی تفتح البوت -->
    <button class="bot-toggle-btn" onclick="toggleChat()">🤖 پسیار ژ بۆتی بکە</button>

    <!-- پەنجەرەی چات بۆت -->
    <div class="chat-container" id="chatBox">
        <div class="chat-header">
            <button class="close-btn" onclick="toggleChat()">✕</button>
            مایسترۆ (بۆتێ هاریكارێ قوتابیان)
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-msg">
                بخێربێی قوتابیێ هێژا! ئەز ل ڤێدەرێ مە بۆ هاریكاریا تە. ل سەر هەر بابەتەكی پسیار دكەی (فیزیا، مێژوو، كوردی، ئینگلیزی، یاسا، ژیندەوەر...) بنووسە دا بەرسڤا تە بدەم.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="پسیارا خۆ ل ڤێرە بنووسە..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">ناردن</button>
        </div>
    </div>

    <script>
        // لێرەدا وەڵامە زیرەکەکانی بۆت دادەنێین (دەتونیت لێرە زانیاری زۆرتر زێدە بکەیت)
        const botBrain = {
            "فیزیا": "فیزیا زانستا لێكۆلینێیە ل سەر سروشت، وزە، و ماددەی. تە چ پسیار ل سەر هەیە؟ (بۆ نموونە: یاسایێن نیوتنی)",
            "نیوتن": "ئیسحاق نیوتن سێ یاسایێن سەرەكی یێن لڤینێ دانان: ١- بەردەوامبوونا لڤینێ یان سكونێ، ٢- هێز یەکسانە ب بارستە جاران تاودان ($F=ma$), ٣- بۆ هەر كارەكی بەركارەك هەیە.",
            "مێژوو": "مێژوو تۆمارا روودانێن بورینە. حەز دكەی ل سەر كیش سەردەم یان ڕووداو بزانی؟",
            "کوردی": "زمانێ كوردی زمانەكێ دەولەمەندە و ژ چەندین دیالێكتان پێكهاتیە وەك (کرمانجیا سەری، کرمانجیا ناڤەراست).",
            "ئینگلیزی": "English is easy! ئەز دشێم هاریكاریا تە بكەم د وەرگێران یان ڕێزمانێ دا. چ تشت ل دەڤ تە ڕوون نینە؟",
            "یاسا": "یاسا كۆمەكا ڕێسا و دەستوورانە كو جڤاكی ڕێكدێخیت و مافێن هەمی لایەكی دپارێزیت.",
            "ژیندەوەر": "زانستا ژیندەوەر (Biology) ل سەر گیانەوەر، ڕووەك، و خانەیێن زیندوو لێكۆلینێ دكەت.",
            "سلاو": "سلاو ل تە بیت! چەوان دشێم هاریكاریا تە بكەم؟",
            "سوپاس": "شایەنی چ نینە، هیوایا سەركەفتنێ بۆ تە دخوازم! 👍"
        };

        // بۆ پیشاندان و شاردنەوەی بۆت
        function toggleChat() {
            const chatBox = document.getElementById('chatBox');
            if (chatBox.style.display === 'none' || chatBox.style.display === '') {
                chatBox.style.display = 'flex';
            } else {
                chatBox.style.display = 'none';
            }
        }

        // بۆ ناردنی نامەی بەکارهێنەر
        function sendMessage() {
            const inputElement = document.getElementById('userInput');
            const messageText = inputElement.value.trim();
            
            if (messageText === "") return;

            // ١- زێدەكرنا نامەیا قوتابی
            appendMessage(messageText, 'user-msg');
            inputElement.value = "";

            // ٢- بەرسڤدانا بۆتی ب شێوازەكێ زیرەك
            setTimeout(() => {
                const botResponse = getBotResponse(messageText);
                appendMessage(botResponse, 'bot-msg');
            }, 500);
        }

        // دۆزینەوەی باشترین وەڵام
        function getBotResponse(input) {
            const cleanInput = input.toLowerCase();
            
            // گەڕان بەدوای پەیڤێن سەرەکی د ڕستێ دا
            for (let key in botBrain) {
                if (cleanInput.includes(key)) {
                    return botBrain[key];
                }
            }
            
            // ئەگەر وەڵامەکە نەبوو د مێشكێ بۆت دا
            return "ببورە، ئەز نوكە ل سەر ڤێ پسیارێ یێ نەزانم، بەلێ ئەز دێ خۆ پێشخەم! تەمامتر ل سەر بابەتەكی بنووسە (بۆ نموونە: فیزیا، یاسا، ژیندەوەر).";
        }

        // بۆ دروستکردنی شێوازی نامەکە د چاتەکەدا
        function appendMessage(text, className) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', className);
            messageElement.innerText = text;
            chatMessages.appendChild(messageElement);
            
            // ئۆتۆماتیک چاتەکە دەچێتە خوارەوە بۆ بینینی نامەی نوێ
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // بۆ ناردن ب دوگمەی Enter
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
