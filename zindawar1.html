<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆتێ ژیرییا دەستکرد بۆ قوتابیان</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* دوگمەیا لایێ ڕاستێ */
        .bot-toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 2px dashed #ffcc00;
            padding: 14px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 9999;
            transition: all 0.3s ease;
        }

        .bot-toggle-btn:hover {
            background-color: #ffcc00;
            color: #121212;
            transform: scale(1.05);
        }

        /* پەنجەرەیا چاتی */
        .chat-container {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 380px;
            max-width: 90%;
            height: 520px;
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; 
            flex-direction: column;
            overflow: hidden;
            z-index: 9999;
        }

        .chat-header {
            background-color: #222222;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 2px dashed #ffcc00;
            position: relative;
            color: #ffcc00;
        }

        .close-btn {
            position: absolute;
            left: 15px;
            top: 16px;
            background: none;
            border: none;
            color: #ff4444;
            font-size: 20px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #151515;
        }

        .message {
            max-width: 82%;
            padding: 11px 15px;
            border-radius: 15px;
            font-size: 14.5px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .bot-msg {
            background-color: #262626;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-right-radius: 3px;
            border: 1px solid #333;
        }

        .user-msg {
            background-color: #ffcc00;
            color: #121212;
            align-self: flex-end;
            border-bottom-left-radius: 3px;
            font-weight: bold;
        }

        /* نامەیا دۆخێ چەڕەڕێبوونێ (Loading) */
        .loading-msg {
            color: #888;
            font-style: italic;
            align-self: flex-start;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: #1e1e1e;
            border-top: 1px solid #2d2d2d;
        }

        .chat-input {
            flex: 1;
            background-color: #121212;
            border: 1px solid #3c3c3c;
            color: white;
            padding: 12px;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
        }

        .send-btn {
            background-color: #ffcc00;
            border: none;
            color: #121212;
            padding: 0 18px;
            margin-right: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button class="bot-toggle-btn" onclick="toggleChat()">🤖 پسیار ژ ژیرییا دەستکرد بکە</button>

    <div class="chat-container" id="chatBox">
        <div class="chat-header">
            <button class="close-btn" onclick="toggleChat()">✕</button>
            مایسترۆ AI (هاوشێوەی Gemini)
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-msg">
                سلاو قوتابیێ هێژا! ئەز بۆتەکێ زیرەکم ب هێزا ژیرییا دەستکرد (AI). هەر پسیارەکا تە د هەر بابەتەکی دا هەبیت بنووسە، ئەز وەک مروڤەکێ پسپۆر دێ بەرسڤا تە دەم!
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="پسیارەکێ بکە (ب فیزیا، مێژوو، کوردی...)" onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">ناردن</button>
        </div>
    </div>

    <script>
        // ⚠️ ل ڤێرە کلیلێ خۆ یێ API دابنێ (ژ لایێ OpenAI یان هەر کۆمپانیەکا دی)
        // بۆ ئەڤێ نموونێ ئەز دێ هێزا لێکۆڵینێ دۆزینەوەیا زیرەک دیار کەم
        const API_KEY =  کلیلێ خۆ یێ API دابنێ"; 

        function toggleChat() 
            const chatBox = document.getElementById('chatBox');
            chatBox.style.display = (chatBox.style.display === 'none' || chatBox.style.display === '') ? 'flex' : 'none';
        }

        async function sendMessage() {
            const inputElement = document.getElementById('userInput');
            const messageText = inputElement.value.trim();
            if (messageText === "") return;

            appendMessage(messageText, 'user-msg');
            inputElement.value = "";

            // دروستکرنا نامەیا چاوەڕێبوونێ
            const loadingId = appendMessage("مایسترۆ یێ هزردکەت... 🧠", 'bot-msg loading-msg');

            try {
                // ل ڤێرە فەرماندەکێ ژیرییا دەستکرد دەنێرین بۆ دەستکەوتنا وەڵامێ ڕاستەقینە
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `تۆ مامۆستایەکێ هاریكار و گەلەک زیرەکی د قوتابخانێ دا. ب زمانێ کوردی بادینی (کرمانجیا سەری) بەرسڤا ڤێ پسیارا قوتابی بدە ب شێوازەکێ ڕوون: ${messageText}` }] }]
                    })
                });

                const data = await response.json();
                removeLoadingMessage(loadingId);

                // وەرگرتنا بەرسڤێ ژ ڕێکا AI
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'bot-msg');
                } else {
                    appendMessage("ببورە، من نەشیا نوکە بەرسڤێ چێکەم. ل لایێ کلیلێ API پشکنینێ بکە.", 'bot-msg');
                }

            } catch (error) {
                removeLoadingMessage(loadingId);
                // ئەگەر API نەبوو، وەک پشتیوانی (Backup) ب ژیرییەکا ناڤخۆیی بەرسڤێ ددەت:
                simulateSmartAI(messageText);
            }
        }

        // سیستەمێ پشتیوانیێ ئەگەر ئەینتەرنێت یان کلیل نەبوو
        function simulateSmartAI(input) {
            let reply = "ئەز وەک ژیرییا دەستکرد ل سەر ڤێ پسیارێ دکۆڵم: '" + input + "'. ئەڤ بابەتە گەلەک گرنگە بۆ قوتابیان! دڤێت پتر ل سەر بخوینین چونکی هەمیا فەلسەفە و زانستەکا تایبەت هەیە.";
            if(input.includes("فیزیا")) reply = "فیزیا بیرکارییا سروشتی یە! ل سەر هێز، تاودان و گەردوونێ دکۆڵیت. تە پسیار ل سەر چ قانونەکێ هەیە؟";
            if(input.includes("یاسا")) reply = "یاسا ستونا جڤاکی یە. هەمی ماف د ناڤ یاسایێ دا دهێنە پاراستن دا کو دادپەروەری بەرقەرار بیت.";
            setTimeout(() => { appendMessage(reply, 'bot-msg'); }, 500);
        }

        function appendMessage(text, className) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            const id = 'msg-' + Date.now();
            messageElement.id = id;
            messageElement.className = `message ${className}`;
            messageElement.innerText = text;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function removeLoadingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
