<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیكرنێن وەزاری ٢٠٢٥</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b);
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            --panel-bg: rgba(255, 255, 255, 0.65);
            --panel-border: rgba(15, 23, 42, 0.08);
            --text-color: #0f172a;
            --accent-color: #4f46e5;
            --accent-hover: #3730a3;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* دوگمەیا گۆهرینا ڕەنگی */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow);
        }

        /* كۆنتێنەرێ سەرەكی */
        .container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 35px;
        }

        /* بەشێ هەڵبژارتنا خولێ */
        .round-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .round-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
        }

        [data-theme="light"] .round-card {
            background: rgba(0, 0, 0, 0.02);
        }

        .round-card:hover {
            transform: translateY(-3px);
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent-color);
        }

        .round-info {
            text-align: right;
        }

        .round-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .round-details {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .badge {
            background: var(--accent-color);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* بەشێ پرسیاران (دێ پاشان دیار بیت) */
        .quiz-section {
            display: none;
            text-align: right;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--panel-border);
        }

        .question-text {
            font-size: 1.25rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 15px 20px;
            border-radius: 12px;
            text-align: right;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        [data-theme="light"] .option-btn {
            background: rgba(0, 0, 0, 0.01);
        }

        .option-btn:hover {
            background: rgba(99, 102, 241, 0.08);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body data-theme="dark">

    <!-- دوگمەیا گۆهرینا ستایلی -->
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ ڕۆهن</button>

    <div class="container">
        <!-- لاپەرێ هەڵبژارتنێ -->
        <div id="selection-page">
            <h1>ئەزموونێن وەزاری ٢٠٢٥</h1>
            <p class="subtitle">خۆلا حەز ژێ دكەی هەڵبژێڕە بۆ دەستپێكرنا تاقیكرنێ</p>
            
            <div class="round-selection">
                <!-- خولا ئێكێ -->
                <div class="round-card" onclick="startQuiz(1)">
                    <div class="round-info">
                        <div class="round-title">خۆلا ئێكێ</div>
                        <div class="round-details">ئەزموونا گشتی - سالا ٢٠٢٥</div>
                    </div>
                    <span class="badge">٥٠ پرسیار</span>
                </div>

                <!-- خولا دووێ -->
                <div class="round-card" onclick="startQuiz(2)">
                    <div class="round-info">
                        <div class="round-title">خۆلا دووێ</div>
                        <div class="round-details">ئەزموونا گشتی - سالا ٢٠٢٥</div>
                    </div>
                    <span class="badge">٥٠ پرسیار</span>
                </div>
            </div>
        </div>

        <!-- لاپەرێ تاقیكرنێ (ئۆتۆماتیك دێ دیار بیت) -->
        <div id="quiz-page" class="quiz-section">
            <div class="quiz-header">
                <span id="quiz-title" style="font-weight: bold;"></span>
                <span id="question-counter" class="badge">پرسیار ١ ژ ٥٠</span>
            </div>
            
            <div class="question-text" id="question-container">
                لڤێرە دێ دەقێ پرسیارێ دیار بیت...
            </div>

            <div class="options-list">
                <button class="option-btn">ئەڤژینا (A)</button>
                <button class="option-btn">ئەڤژینا (B)</button>
                <button class="option-btn">ئەڤژینا (C)</button>
                <button class="option-btn">ئەڤژینا (D)</button>
            </div>
        </div>
    </div>

    <script>
        // گۆهرینا ڕەنگێ سپی و ڕەش
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '🌙 تاری';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ ڕۆهن';
            }
        }

        // دەستپێكرنا تاقیكرنێ
        function startQuiz(round) {
            document.getElementById('selection-page').style.display = 'none';
            document.getElementById('quiz-page').style.display = 'block';
            
            const titleElement = document.getElementById('quiz-title');
            if(round === 1) {
                titleElement.innerText = 'خۆلا ئێكێ - ٢٠٢٥';
            } else {
                titleElement.innerText = 'خۆلا دووێ - ٢٠٢٥';
            }
            
            // ل ڤێرە تو دشێی كۆدێ پرسیارێن خۆ یێن داینامۆك زێدە بكەی
            document.getElementById('question-container').innerText = `بۆخێر بێی! تە ${round === 1 ? 'خۆلا ئێكێ' : 'خۆلا دووێ'} هەڵبژارت. ئەڤە نموونەیا پرسیارا ئێكێ یە؟`;
        }
    </script>
</body>
</html>
