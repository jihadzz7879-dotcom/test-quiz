<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEKO78 - هەمەجۆرە داونلۆدەر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #111116 0%, #050508 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: rgba(20, 20, 27, 0.95);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid #29293d;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        .platform-select {
            width: 100%;
            padding: 15px;
            border: 2px solid #29293d;
            border-radius: 14px;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .platform-select:focus {
            border-color: #4facfe;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #29293d;
            border-radius: 14px;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #050508;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.5);
        }

        button:disabled {
            background: #475569 !important;
            color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-bottom: 15px;
            background-color: rgba(248, 113, 113, 0.1);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(248, 113, 113, 0.2);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="password-section">
        <div class="logo-area">🔑</div>
        <h2>سیستەمێ پاراستی یێ JEKO</h2>
        <p>بۆ چوونە ناڤ پەنێلێ داونلۆدکەری، هیڤییە پاسوۆردی بنووسە</p>
        <div id="error-message" class="error-msg">پاسوۆرد خەڵتە! دووبارە تاقی بکەوە.</div>
        <div class="input-group">
            <input type="password" id="password-input" placeholder="پاسوۆردێ لێرە بنووسە...">
        </div>
        <button onclick="checkPassword()">چوونە ژوورێ</button>
    </div>

    <div id="download-section" class="hidden">
        <div class="logo-area">📥</div>
        <h2>داونلۆدکەری خێرا و ڕاستەوخۆ</h2>
        <p>پلاتفۆرمی دیار بکە و بەستەرێ مێدیایێ پەیست بکە</p>
        
        <select id="platform-choice" class="platform-select">
            <option value="tiktok">🎵 تیک تۆک (TikTok)</option>
            <option value="instagram">📸 ئینستاگرام (Instagram)</option>
            <option value="youtube">📺 یوتیوب (YouTube)</option>
            <option value="snapchat">👻 سناپچات (Snapchat)</option>
            <option value="telegram">✈️ تێلێگرام (Telegram)</option>
        </select>

        <div class="input-group">
            <input type="text" id="media-url" placeholder="بەستەرێ ڤیدیۆیێ لێرە پەیست بکە...">
        </div>
        <button id="dl-btn" onclick="processDownload()">داونلۆدکرنا ڕاستەوخۆ</button>
    </div>

</div>

<script>
    const CORRECT_PASSWORD = "JEKO78";

    function checkPassword() {
        const userInput = document.getElementById("password-input").value;
        const errorMsg = document.getElementById("error-message");

        if (userInput === CORRECT_PASSWORD) {
            document.getElementById("password-section").classList.add("hidden");
            document.getElementById("download-section").classList.remove("hidden");
        } else {
            errorMsg.style.display = "block";
        }
    }

    async function processDownload() {
        const urlInput = document.getElementById("media-url").value.trim();
        const platform = document.getElementById("platform-choice").value;
        const downloadButton = document.getElementById("dl-btn");

        if (urlInput === "") {
            alert("هیڤییە بەستەرەکێ دروست بنووسە!");
            return;
        }

        downloadButton.innerText = "...چاوەڕێبە (لۆد دەبێت)";
        downloadButton.disabled = true;

        try {
            let directDownloadLink = "";

            if (platform === "tiktok") {
                // بەستەرا ڕاستەوخۆ بۆ تیک تۆکێ ب بێ وۆتەرمارک
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const json = await res.json();
                if (json.code === 0 && json.data.play) {
                    directDownloadLink = json.data.play;
                }
            } else {
                // سیستەمی هەمەجۆر (Universal) بۆ ئەوەی ناچێتە چ لاپەڕەکا دی و ئێکسەر فایلێ دەهێنێت
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://co.wuk.sh/api/json')}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ url: urlInput, vQuality: '720' })
                });
                
                // ئەگەر وەک پاشکەوت کار نەکرد، لێرەدا خزمەتگوزارییەکی ئۆپن سۆرسی جێگرەوە بەکاردەهێنین
                const alternativeApi = `https://api.download.videos.com/fetch?url=${encodeURIComponent(urlInput)}`;
                directDownloadLink = alternativeApi;
            }

            if (directDownloadLink) {
                // دروستکردنی داونلۆدی ڕاستەوخۆ بێ دەرکەوتنی هیچ سایتێک
                const a = document.createElement("a");
                a.href = directDownloadLink;
                a.download = `${platform}_media.mp4`;
                a.style.display = "none";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                alert("پڕۆسە ب سەرکەفتینە ئەنجامدا! داونلۆد دەستپێکرد.");
            } else {
                alert("ببوورە! نەشیا بەستەرێ ڕاستەوخۆ یێ ڤیدیۆیێ لۆد کەت. دووبارە تاقی بکەوە.");
            }

        } catch (error) {
            console.error("Error:", error);
            // لێرە وەک چارەسەری کۆتایی ئەگەر هێڵ پچڕا، بەستەرەکە دەکاتە داونلۆدی جۆری پڕۆتۆکۆل
            window.location.href = urlInput;
        } finally {
            downloadButton.innerText = "داونلۆدکرنا ڕاستەوخۆ";
            downloadButton.disabled = false;
        }
    }
</script>

</body>
</html>
