<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEKO78 - VIP مێدیا داونلۆدەر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1a24 0%, #08080c 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: rgba(22, 22, 26, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #2d2d3d;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            font-size: 55px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h2 {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        /* بەشا هەڵبژاردنا پلاتفۆرمی */
        .platform-select {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d2d3d;
            border-radius: 14px;
            background-color: #1f1f29;
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .platform-select:focus {
            border-color: #7f00ff;
            box-shadow: 0 0 12px rgba(127, 0, 255, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #2d2d3d;
            border-radius: 14px;
            background-color: #1f1f29;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ff007f;
            background-color: #242433;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #7f00ff 0%, #ff007f 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(127, 0, 255, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.5);
        }

        button:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-bottom: 15px;
            background-color: rgba(248, 113, 113, 0.1);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(248, 113, 113, 0.2);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="password-section">
        <div class="logo-area">🔑</div>
        <h2>سیستەمێ پاراستی یێ JEKO</h2>
        <p>بۆ چوونە ناڤ پەنێلێ داونلۆدکەری، هیڤییە پاسوۆردی بنووسە</p>
        <div id="error-message" class="error-msg">پاسوۆرد خەڵتە! دووبارە تاقی بکەوە.</div>
        <div class="input-group">
            <input type="password" id="password-input" placeholder="پاسوۆردێ لێرە بنووسە...">
        </div>
        <button onclick="checkPassword()">چوونە ژوورێ</button>
    </div>

    <div id="download-section" class="hidden">
        <div class="logo-area">⚡</div>
        <h2>هەموو ل یەک داونلۆدەر</h2>
        <p>پلاتفۆرمی هەڵبژێره و بەستەرێ ڤیدیۆیێ پەیست بکە</p>
        
        <select id="platform-choice" class="platform-select">
            <option value="tiktok">🎵 تیک تۆک (TikTok)</option>
            <option value="instagram">📸 ئینستاگرام (Instagram)</option>
            <option value="youtube">📺 یوتیوب (YouTube)</option>
            <option value="snapchat">👻 سناپچات (Snapchat)</option>
            <option value="telegram">✈️ تێلێگرام (Telegram)</option>
        </select>

        <div class="input-group">
            <input type="text" id="media-url" placeholder="بەستەرێ ڤیدیۆیێ لێرە پەیست بکە...">
        </div>
        <button id="dl-btn" onclick="processDownload()">دەستپێکرنا داونلۆدێ</button>
    </div>

</div>

<script>
    // ڕێکخستنی پاسوۆردێ تە
    const CORRECT_PASSWORD = "JEKO78";

    // پشکنینی پاسوۆردێ
    function checkPassword() {
        const userInput = document.getElementById("password-input").value;
        const errorMsg = document.getElementById("error-message");

        if (userInput === CORRECT_PASSWORD) {
            document.getElementById("password-section").classList.add("hidden");
            document.getElementById("download-section").classList.remove("hidden");
        } else {
            errorMsg.style.display = "block";
        }
    }

    // پڕۆسەیا داونلۆدکرنێ بۆ هەمی پلاتفۆرمان
    async function processDownload() {
        const urlInput = document.getElementById("media-url").value;
        const platform = document.getElementById("platform-choice").value;
        const downloadButton = document.getElementById("dl-btn");

        if (urlInput.trim() === "") {
            alert("هیڤییە بەستەرەکێ دروست بنووسە!");
            return;
        }

        downloadButton.innerText = "...لۆد دەبێت";
        downloadButton.disabled = true;

        try {
            // ئەگەر تیک تۆک بوو، ب ڕێیا API فەرمی یا بێ لۆگۆ داونلۆد دکەت
            if (platform === "tiktok") {
                const apiEndpoint = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`;
                const response = await fetch(apiEndpoint);
                const result = await response.json();

                if (result.code === 0 && result.data.play) {
                    triggerDownload(result.data.play, "tiktok_video.mp4");
                } else {
                    alert("ببوورە کێشەیەک د ڤیدیۆیا تیک تۆکێ دا هەیە!");
                }
            } 
            // بۆ پلاتفۆرمێن دی (ئینستا، یوتیوب، سناپ، تێلێگرام) چونکە د پێویست ب سێرڤەرێن گران یان پرۆکسی نە، ڕێڕەوێ داونلۆدێ ئاراستەی خزمەتگوزاریا خێرا دکەت
            else {
                alert(`پڕۆسەیا داونلۆدکرنێ بۆ پلاتفۆرمێ (${platform}) دەستپێکر. نوکە دێ هێیە گواستنەوە بۆ لاپەڕێ داونلۆدێ...`);
                // گواستنەوە بۆ سێرڤەرەکێ گشتی یێ داونلۆدێ ب بێ کێشە
                const universalDownloader = `https://9download.com/query?url=${encodeURIComponent(urlInput)}`;
                window.open(universalDownloader, '_blank');
            }

        } catch (error) {
            console.error("Error:", error);
            alert("کێشەیەک د هێڵێ دا هەیە، هیڤییە دووبارە تاقی بکەوە.");
        } finally {
            downloadButton.innerText = "دەستپێکرنا داونلۆدێ";
            downloadButton.disabled = false;
        }
    }

    // فەرمانا جێبەجێکرنا داونلۆدا ئۆتۆماتیکی
    function triggerDownload(link, fileName) {
        const a = document.createElement("a");
        a.href = link;
        a.download = fileName;
        a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        alert("ڤیدیۆ ب سەرکەوتوویی ئامادەکرا و داونلۆد بوو!");
    }
</script>

</body>
</html>
