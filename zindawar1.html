<div class="main-container">
    <h2 class="title">فێرکاریێن مینیستەری</h2>

    <!-- تابلۆ یێن زمانان -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openVideo(event, 'badini')">بادینی</button>
        <button class="tab-btn" onclick="openVideo(event, 'sorani')">سۆرانی</button>
        <button class="tab-btn" onclick="openVideo(event, 'kurmanji')">کرمانجی</button>
    </div>

    <!-- ڤیدیۆ -->
    <div id="video-box" class="video-content">
        <video id="myVideo" controls>
            <source id="videoSource" src="video-badini.mp4" type="video/mp4">
        </video>
        <!-- دوگمەیا دابەزاندنێ -->
        <a id="downloadBtn" href="video-badini.mp4" download class="dl-btn">📥 دابەزاندنا ڤیدیۆیێ</a>
    </div>

    <!-- بۆکسێ ئینستگرامێ -->
    <div class="footer-social">
        <p>ژبۆ زانیاریێن پتر، مێڤانییا تە دکەین ل:</p>
        <a href="https://www.instagram.com/gehad.zebare78" target="_blank" class="ig-link">
            <i class="fab fa-instagram"></i> جیھاد زێباری - Instagram
        </a>
    </div>
</div>

<style>
    .main-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; font-family: 'Segoe UI', sans-serif; }
    .tabs { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
    .tab-btn { padding: 8px 20px; border: none; cursor: pointer; border-radius: 30px; background: #f0f0f0; transition: 0.3s; }
    .tab-btn.active { background: #3498db; color: #fff; }
    .video-content video { width: 100%; border-radius: 15px; margin-bottom: 15px; }
    .dl-btn { display: inline-block; padding: 10px 25px; background: #27ae60; color: #fff; text-decoration: none; border-radius: 50px; font-weight: bold; }
    .footer-social { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
    .ig-link { color: #e1306c; font-weight: bold; text-decoration: none; font-size: 1.1em; }
</style>

<script>
    function openVideo(evt, lang) {
        let video = document.getElementById("myVideo");
        let source = document.getElementById("videoSource");
        let dl = document.getElementById("downloadBtn");
        
        // ڤیدیۆیا هەر زمانەکی دیار بکە
        source.src = "video-" + lang + ".mp4";
        dl.href = source.src;
        video.load();
        
        let btns = document.getElementsByClassName("tab-btn");
        for (let b of btns) b.classList.remove("active");
        evt.currentTarget.classList.add("active");
    }
</script>
