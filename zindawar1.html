<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونێن وەزاری - JEHAD ZEBARI</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #020617, #0f172a, #1e1b4b);
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.6);
            --accent-color: #6366f1;
            --correct-color: #ef4444; /* خەتا سۆر بۆ وەڵامێ ڕاست */
            --card-hover: rgba(99, 102, 241, 0.15);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f8fafc, #f1f5f9, #e2e8f0);
            --panel-bg: rgba(255, 255, 255, 0.75);
            --panel-border: rgba(15, 23, 42, 0.08);
            --text-color: #0f172a;
            --accent-glow: 0 0 15px rgba(79, 70, 229, 0.2);
            --accent-color: #4f46e5;
            --card-hover: rgba(79, 70, 229, 0.08);
            --shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            z-index: 100;
        }

        .container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .developer-name {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color);
            margin-bottom: 5px;
        }
        
        [data-theme="light"] .developer-name {
            color: var(--accent-color);
            text-shadow: none;
        }

        .system-title {
            font-size: 1.4rem;
            opacity: 0.9;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .section-label {
            text-align: right;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
        }

        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .selection-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
        }

        [data-theme="light"] .selection-card {
            background: rgba(0, 0, 0, 0.02);
        }

        .selection-card:hover, .selection-card.active {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            background: var(--card-hover);
            box-shadow: var(--accent-glow);
        }

        .selection-card.active {
            background: var(--accent-color);
            color: #ffffff !important;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        .start-btn {
            width: 100%;
            background: linear-gradient(90deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .quiz-section {
            display: none;
            text-align: right;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--panel-border);
        }

        .badge {
            background: var(--accent-color);
            color: white;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 15px 20px;
            border-radius: 12px;
            text-align: right;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.08);
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 20px 0;
        }

        .review-item {
            text-align: right;
            padding: 15px;
            border-bottom: 1px solid var(--panel-border);
            margin-bottom: 10px;
        }

        .review-correct {
            color: var(--correct-color);
            font-weight: bold;
            border-right: 3px solid var(--correct-color);
            padding-right: 10px;
            margin-top: 5px;
        }

        .ball {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            animation: drop 2.5s linear infinite;
            z-index: 999;
        }

        @keyframes drop {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .chem-image-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
        }
    </style>
</head>
<body data-theme="dark">

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ ڕۆهن</button>

    <div class="container">
        <div id="selection-page">
            <div class="developer-name">JEHAD ZEBARI</div>
            <div class="system-title">سیستەمێ تاقیكرنێن وەزاری (کیمیا)</div>
            
            <div class="section-label">📅 سالا ئەزموونێ هەڵبژێڕە:</div>
            <div class="grid-options">
                <div class="selection-card" id="year-2024" onclick="selectYear(2024)">
                    <div class="card-title">٢٠٢٤</div>
                    <div class="card-desc">پرسیارێن سالا بورى</div>
                </div>
                <div class="selection-card" id="year-2025" onclick="selectYear(2025)">
                    <div class="card-title">٢٠٢٥</div>
                    <div class="card-desc">پرسیارێن ئەڤساڵە</div>
                </div>
            </div>

            <div class="section-label">📝 خولێ هەڵبژێڕە:</div>
            <div class="grid-options">
                <div class="selection-card" id="round-1" onclick="selectRound(1)">
                    <div class="card-title">خۆلا ئێكێ</div>
                    <div class="card-desc">٥٠ پرسیارێن گشتی</div>
                </div>
                <div class="selection-card" id="round-2" onclick="selectRound(2)">
                    <div class="card-title">خۆلا دووێ</div>
                    <div class="card-desc">٥٠ پرسیارێن گشتی</div>
                </div>
            </div>

            <button class="start-btn" onclick="validateAndStart()">دەستپێبکە 🚀</button>
        </div>

        <div id="quiz-page" class="quiz-section">
            <div class="quiz-header">
                <span id="quiz-title" style="font-weight: bold; font-size: 1.2rem;"></span>
                <span class="badge" id="question-counter">پرسیار ١ ژ ٥٠</span>
            </div>
            <div style="font-size: 1.3rem; margin-bottom: 30px; line-height: 1.6; text-align: right;" id="question-text">
                بارکرنا پرسیارێ...
            </div>
            <div id="image-area"></div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div id="result-box" class="result-screen">
            <h2>تاقیکرن ب دوماهی هات!</h2>
            <div class="score-big" id="final-score">0/100</div>
            <p id="final-percentage" style="font-size: 1.2rem; margin-bottom: 30px;"></p>
            <button class="start-btn" style="background:var(--accent-color);" onclick="location.reload()">دووبارە دەستپێبکە 🔄</button>
            
            <h3 style="text-align:right; margin-top: 40px; margin-bottom: 15px;">📌 پێداچوونا وەڵامێن ڕاست (ب خەتا سۆر):</h3>
            <div id="review-area"></div>
        </div>
    </div>

    <script>
        let selectedYear = null;
        let selectedRound = null;
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        let currentQuestionsList = [];

        // داتابەیسا ٥٠ پرسیارێن تەمام یێن کیمیایێ
        const database = {
            "2024_1": [
                { q: "١. ئاوێتەیەکی کیمیاییە کو د ئاڤێدا دحەلیت ئایۆنین دکەت و [H₃O⁺] زێدە دکەت:", a: ["کلۆریدی ئامۆنیۆم", "نیشان", "فلۆریدی هایدرۆجین", "ئەمۆنیا"], c: 2 },
                { q: "٢. ئایۆنەکا نیشتی پێکدینیت دگەل ئایۆنی گۆگردات (SO₄²⁻):", a: ["Ca²⁺", "NH₄⁺", "Mg²⁺", "Al³⁺"], c: 0 },
                { q: "٣. چەند مۆل ژ کلۆریدی مەگنیسیۆم (MgCl₂) پێدڤییە بۆ هەر 500g ئاڤێ داکو پلا کەلینی پێشبینیکری بکەتە 103.06°C؟ (Kb=0.51°C/m)", a: ["0.5", "1", "2", "1.5"], c: 1 },
                { q: "٤. بەهایێ پێشبینیکری نزمبوونا پلا بەستنی گێراوێ KCl ب بەراورد ب گێراوێ سوکەرۆز ب هەمان خەستی:", a: ["ب تەواوی هەمان تشتە", "ب تەواوی دوو هێندەی مەزنترە", "کیمەکێ بچویکترە", "ب نێزیکی دوو هێندی مەزنترە"], c: 1 },
                { q: "٥. هژمارا مۆلێن ئایۆنین بەرهەم هاتی د لێکەلهوشانا 0.5mol د NH₄Br دکەتە:", a: ["0.5", "1", "2", "3"], c: 1 },
                { q: "٦. ل دەما تێکەلکرنا هەر دوو ئاڤە گێراوین کاربۆناتی سۆدیۆم و کلۆریدی کالسیۆم، کیژ ژ ڤان ئایۆنێ نە دپشکدارە؟", a: ["Cl⁻, Na⁺", "Ca²⁺, Cl⁻", "Na⁺, CO₃²⁻", "Ca²⁺, CO₃²⁻"], c: 0 },
                { q: "٧. هێزا ترشی بەندە ل سەر:", a: ["هژمارا گەردیلێن هایدرۆجینی د شێوگێ کیمیایی ترشیدا", "خەستییا ترشی", "جەمسەرداری و وێزا بەندی", "هەمی"], c: 2 },
                { q: "٨. د کیژ ژڤان کارلیکان ناف وەکی ترش و تفتێ برۆنشتەد-لۆری ڕەفتارێ دکەت؟", a: ["HCN(aq) + H₂O(l) ⇌ H₃O⁺(aq) + CN⁻(aq)", "NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)", "H₂O(l) + H₂O(l) ⇌ H₃O⁺(aq) + OH⁻(aq)", "چ ژڤان نینن"], c: 2 },
                { q: "٩. دەما ترشی هایدرۆکلۆریک HCl دگەل کانزایی باریۆم کارلێکێ دکەت:", a: ["خەستیا ئایۆنێ هایدرۆنیۆم زێدە دبیت", "نیشتی پێکدهێت", "گازا هایدرۆجین بەرهەم دهێت", "گازا کلۆر بەرهەم دهێت"], c: 2 },
                { q: "١٠. ئاوهەڵگرتنێ ترشی کلۆریک پێکدهێت ژ:", a: ["کلۆرات", "کلۆریت", "کلۆرید", "پیرکلۆرات"], c: 0 },
                { q: "١١. کیژ ژڤان ماددان وەکی ترش ڕەفتارێ دکەت ل دەمێ کارلیککرنا دگەل گێراوێ ئەرمۆنیا NH₃؟", a: ["CN⁻", "H₂PO₄⁻", "HCOO⁻", "(B+C) پێکڤە"], c: 1 },
                { q: "١٢. کیژ ژڤان تفتێ لویسە؟", a: ["وەرگری جووتەک نە ئەلەکترۆنان", "بەخشەری جووتەک نە ئەلەکترۆنان", "پڕۆتۆن بەخش", "پڕۆتۆن وەرگر"], c: 1 },
                { q: "١٣. ترشی فۆسفۆریک دهێتە بکارئینان ژ:", a: ["پێشەسازیا پاقژکەران و سیرامیکیدا", "دەرهێخستنا مەگنیسیۆم ژ ئاڤا دەریاودا", "فراکرنا کەروومەیندا", "پێشەسازیا لاستیک و کەرەستین پلاستیکدا"], c: 0 },
                { q: "١٤. چەند مۆل ژ Ba(OH)₂ د بێاڤی بڕێدا هاوهێزیا کیمیایی 0.20mol ژ HF دبیت؟", a: ["0.20", "0.40", "0.12", "0.10"], c: 3 },
                { q: "١٥. ل دەمێ بەراوردکرنا قەبارەکا یەکسان ژ هەر دوو ئاڤە گێراوێن HCl و HCN ب هەمان خەستی د 25°C دا کیژ ژڤان یا دروستە؟", a: ["بەهایێ pH یێ د هەردوو گێراواندا د یەکسانن", "بەهایێ pOH یێ گێراوێ HCl کیمترە ژ HCN", "هژمارا مۆلێن د هەردوو گێراواندا د یەکسانن", "[OH⁻] د هەردوو گێراواندا د یەکسانن"], c: 2 },

                { q: "١٧. د ئاڤا گێراوێ Ca(OH)₂ دا ب خەستیا 1.0x10⁻³M د 25°C دا دکەتە:", a: ["5.0x10⁻³ M", "0.002 M", "1.0x10⁻¹¹ M", "5.0x10⁻¹٢ M"], c: 3 },
                { q: "١٨. د کریارەکا سەکاندنێدا 36mL ژ گێراوێ 0.02M KOH هاوکێش دبیت دگەل 12mL ژ گێراوێ H₂SO₄. کیژ ژ ڤان یا دروستە؟", a: ["pH یێ خالا هاوهێزی مەزنترە ژ 7", "[H₂SO₄] = 0.03M", "pH یێ خالا هاوهێزی بچویکترە ژ 7", "چ ژڤان نینن"], c: 1 },
                { q: "١٩. 4.0g ژ شویشە 32J ژ وێزا گەرمی دەمژیت دەمێ پلەیا گەرمی ژ 274K بۆ 314K بهێتە گەرمکرن، چەند ژ وێزا دەمژیت ئەگەر ژ 314K بهێتە گەرمکرن بۆ 344K؟", a: ["32J", "0.2J", "24J", "بژاردان پێدانا د شیان دانینە دیار بکەی"], c: 2 },
                { q: "٢٠. د ڤێ کارلیکێدا: NO₂(g) + ½O₂(g) -> NO₃(g). ئەگەر ڕێژەیا کارلێکی بۆ سووتنا 2mol گازا نایترۆجین بژمێرە هەکە بەهایێ ΔH°f یێ هەر ئێک ژ NO, NO₂ ب یەکەیان kJ/mol نێزیک بکەتە (+90.3, +33.2):", a: "-57.1kJ", b: "+114.2kJ", c: "-114.2kJ", d: "+57.1kJ", c: 2 },
                { q: "٢١. بەهایێ ΔG هەمە ڕوو و هەر سالب دبیت ئەگەر:", a: "(ΔH=+ , ΔS=-)", b: "(ΔH=+ , ΔS=+)", c: "(ΔH=- , ΔS=+)", d: "(ΔH=- , ΔS=-)", c: 2 },
                { q: "٢٢. د کارلیکەکیدا بەهایێ ΔH دکەتە 98.112kJ/mol و ΔS دکەتە 292J/(mol.K) د چ پلەیەکا گەرمیدا ئەڤ کارلیکە بخۆ دبیت؟", a: "T = 336K", b: "T > 336K", c: "T < 336K", d: "ناهێتە دەستنیشانکرن", c: 1 },

                { q: "٢٦. بەهایێ جێگیرێ لەزاتییا جۆری زێدە دبیت ب:", a: "زێدەکرنا خەستیا کارلێککەری", b: "بلندبوونا پلا گەرمیێ", "زۆربوونا ڕووبەرێ ڕوویێ کارلێکی", "هەمی", c: 1 },
                { q: "٢٧. د کارلیکێدا: 3A -> C ، خەستیا دەستپێکی A دکەتە 0.2M و لەزاتییا کارلێکی 1.0M/s و ب دوو جایی کرنا [A] لەزاتییا کارلێکی 4.0M/s زێدە کر، کیژ ژڤان یا یاسایا لەزاتییا کارلێکی دنوێبیت؟", a: "R = k[A]", b: "R = k[A]²", c: "R = k[A]³", d: "چ ژڤان نینن", c: 1 },

            "2024_2": [], "2025_1": [], "2025_2": [] // دشێی ل داهاتوودا پرسیارێن دی ل ڤێرە زێدە بکەی
        };

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '🌙 تاری';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ ڕۆهن';
            }
        }

        function selectYear(year) {
            selectedYear = year;
            document.getElementById('year-2024').classList.remove('active');
            document.getElementById('year-2025').classList.remove('active');
            document.getElementById(`year-${year}`).classList.add('active');
        }

        function selectRound(round) {
            selectedRound = round;
            document.getElementById('round-1').classList.remove('active');
            document.getElementById('round-2').classList.remove('active');
            document.getElementById(`round-${round}`).classList.add('active');
        }

        function validateAndStart() {
            if (!selectedYear || !selectedRound) {
                alert('هیڤیە بەری دەستپێبکەی، سال و خولێ هەڵبژێڕە!');
                return;
            }
            
            const apiKey = `${selectedYear}_${selectedRound}`;
            currentQuestionsList = database[apiKey] || [];
            
            if (currentQuestionsList.length === 0) {
                alert('ئەڤ پرسیارە هێشتا د سیستەمی دا نەهاتینە زێدەکرن! تەنێ ٢٠٢٤ خۆلا ١ یا ئامادەیە.');
                return;
            }

            document.getElementById('selection-page').style.display = 'none';
            document.getElementById('quiz-page').style.display = 'block';
            
            const roundText = selectedRound === 1 ? 'خۆلا ئێكێ' : 'خۆلا دووێ';
            document.getElementById('quiz-title').innerText = `ئەزموونا سالا ${selectedYear} - ${roundText}`;
            
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= currentQuestionsList.length) {
                showResults();
                return;
            }

            const currentQuestion = currentQuestionsList[currentQuestionIndex];
            document.getElementById('question-counter').innerText = `پرسیار ${currentQuestionIndex + 1} ژ ${currentQuestionsList.length}`;
            document.getElementById('question-text').innerText = currentQuestion.q;
            
            // نیشاندانا وێنەیێ کیمیایی ئەگەر هەبیت
            const imgArea = document.getElementById('image-area');
            imgArea.innerHTML = '';
            if (currentQuestion.hasImg) {
                imgArea.className = 'chem-image-container';
                imgArea.innerHTML = `
                    <svg width="100" height="110" viewBox="0 0 100 120">
                        <path d="M35,20 L35,30 L20,100 L80,100 L65,30 L65,20 Z" fill="none" stroke="var(--text-color)" stroke-width="3"/>
                        <path d="M22,95 L78,95 L70,50 L30,50 Z" fill="rgba(99,102,241,0.3)"/>
                    </svg>
                `;
            } else {
                imgArea.className = '';
            }

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            currentQuestion.a.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = option;
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(index) {
            userAnswers.push(index);
            if (index === currentQuestionsList[currentQuestionIndex].c) {
                score += 2; // هەر پرسیارەک ٢ نمرە، کۆم دبیتە ١٠٠
            }
            currentQuestionIndex++;
            showQuestion();
        }

        function createBalls() {
            for (let i = 0; i < 40; i++) {
                const ball = document.createElement('div');
                ball.className = 'ball';
                ball.style.left = Math.random() * 100 + 'vw';
                ball.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
                ball.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(ball);
            }
        }

        function showResults() {
            document.getElementById('quiz-page').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            
            document.getElementById('final-score').innerText = `${score} / 100`;
            document.getElementById('final-percentage').innerText = `ڕێژەیا دروستی: %${score}`;
            
            createBalls(); // ئەنیمەیشنا کەفتنا توپان

            const reviewArea = document.getElementById('review-area');
            reviewArea.innerHTML = '';
            currentQuestionsList.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'review-item';
                div.innerHTML = `
                    <div><b>${q.q}</b></div>
                    <div style="opacity:0.7">وەڵامێ تە: ${q.a[userAnswers[i]] || 'نەهاتیە وەڵامدان'}</div>
                    <div class="review-correct">وەڵامێ ڕاست (خەتا سۆر): ${q.a[q.c]}</div>
                `;
                reviewArea.appendChild(div);
            });
        }
    </script>
