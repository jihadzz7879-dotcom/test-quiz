<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #05070a;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 20% 30%, #1a2a3a 0%, #05070a 70%);
        }
        .card {
            background: rgba(10, 15, 20, 0.7);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        h2 { text-align: center; margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; }
        p.subtitle { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 25px; }
        
        .input-group { position: relative; margin-bottom: 20px; }
        input, select {
            width: 100%;
            padding: 15px 40px 15px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            color: #fff;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: #d4af37; outline: none; background: rgba(212, 175, 55, 0.05); }
        i { position: absolute; right: 15px; top: 18px; color: #d4af37; }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #d4af37, #f3d47d);
            color: #000;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.4s;
        }
        button:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body>

<div class="card">
    <h2>Dr. Firdaws</h2>
    <p class="subtitle">تومارکرنا تاقیکرنا ددانا</p>
    
    <form onsubmit="alert('ب سەرکەفتیانە هاتە تومارکرن!'); return false;">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="ناڤێ تە" required>
        </div>
        <div class="input-group">
            <i class="fas fa-phone"></i>
            <input type="tel" placeholder="ژمارا تەلەفۆنی" required>
        </div>
        <div class="input-group">
            <i class="fas fa-tooth"></i>
            <select>
                <option>جۆرێ چارەسەریێ</option>
                <option>راستکرنا ددانا (Orthodontics)</option>
                <option>سپیکرنا ددانا (Whitening)</option>
                <option>نەشتەرگەری و چاندن</option>
            </select>
        </div>
        <div class="input-group">
            <i class="fas fa-calendar-alt"></i>
            <input type="date" required>
        </div>
        <div class="input-group">
            <i class="fas fa-clock"></i>
            <input type="time" required>
        </div>
        <button type="submit">تومارکرن <i class="fas fa-check" style="color: black; position: static;"></i></button>
    </form>
</div>

</body>
</html>
