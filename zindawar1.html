<script>
    // کلیلێ خۆ یێ نوو یێ گوگل ئای ستۆدیۆ ل ڤێرە دابنێ
    const API_KEY = "AlzaSyCA8bOuBA4d4CNMxbUAswjDzq-WF1ecCS-A"; 

    function toggleChat() {
        const chatBox = document.getElementById('chatBox');
        chatBox.style.display = (chatBox.style.display === 'none' || chatBox.style.display === '') ? 'flex' : 'none';
    }

    async function sendMessage() {
        const inputElement = document.getElementById('userInput');
        const messageText = inputElement.value.trim();
        if (messageText === "") return;

        appendMessage(messageText, 'user-msg');
        inputElement.value = "";

        // نیشاندانا نامەیا چاوەڕێبوونێ
        const loadingId = appendMessage("مایسترۆ یێ هزردکەت... 🧠", 'bot-msg');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `تۆ مامۆستایەکێ هاریكار و گەلەک زیرەکی د قوتابخانێ دا. ب زمانێ کوردی بادینی (کرمانجیا سەری) بەرسڤا ڤێ پسیارا قوتابی بدە ب شێوازەکێ کورت: ${messageText}` }] }]
                })
            });

            // ئەگەر وەڵام ژ سێرڤەری نەهات یان خەلەتی هەبوو، ڕاستەوخۆ بچۆ سیستەمێ زیرەک یێ ناڤخۆیی
            if (!response.ok) {
                throw new Error("API Error");
            }

            const data = await response.json();
            document.getElementById(loadingId).remove(); 

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let aiReply = data.candidates[0].content.parts[0].text;
                appendMessage(aiReply, 'bot-msg');
            } else {
                simulateSmartAI(messageText, loadingId);
            }

        } catch (error) {
            // ئەگەر کلیل نەخەبتی یان GitHub ڕێگری لێکر، ڕاستەوخۆ ئەڤ پشکە دێ بەرسڤەکا زێدە زیرەک دەت
            simulateSmartAI(messageText, loadingId);
        }
    }

    // مێشکێ ناڤخۆیی یێ بۆتی - ل ڤێرە وەک مرۆڤ بەرسڤا هەمی پسیارێن گشتی ددەت
    function simulateSmartAI(input, loadingId) {
        if (document.getElementById(loadingId)) {
            document.getElementById(loadingId).remove();
        }

        const cleanInput = input.toLowerCase();
        let reply = "پسیارەکا سەرنجڕاکێشە! وەک بۆتێ مایسترۆ، ئەز دشێم بێژم ڤی بابەتێ تە پرسیار ل سەر کری پێدڤی ب کەمەکێ تێگەهشتنێ هەیە. هەوڵ بدە ل سەر پۆڵا خۆ یان پۆستێن سەرەکی یێن ماڵپەری بگەڕێی دا کو زانیارییا دروست بزانی.";

        // بەرسڤێن هوور و زیرەک هاوشێوەی من
        if (cleanInput.includes("سلاو") || cleanInput.includes("سلاف")) {
            reply = "سلاو و ڕێز قوتابیێ خۆشەویست! ئەز مایسترۆ مە، هاریكارێ تە یێ زیرەک. د چ بابەت دا پسیارا تە هەیە؟ فیزیا، مێژوو، کوردی، یاسا، یان ژیندەوەر؟";
        } else if (cleanInput.includes("چەوانی") || cleanInput.includes("بۆچی")) {
            reply = "ئەز یێ ل ڤێرێ مە دا کو دگەل تە باخڤم و هاریكاریا تە بکەم! ئەگەر کێشەیەک د سێرڤەری دا هەبیت ژی، ئەز هەر ل سەر هێڵم بۆ تە.";
        } else if (cleanInput.includes("فیزیا")) {
            reply = "فیزیا زانستا لێکۆڵینێ یا ل سەر سروشت و گەردوونێ یە! بۆ نموونە یاسایێن نیوتنی یێن لڤینێ کلیلێن سەرەکی یێن تێگەهشتنا لڤینا تەجسامانە ($F=ma$). تە کێشە د کیش یاسایێ دا هەیە؟";
        } else if (cleanInput.includes("مێژوو")) {
            reply = "مێژوو تژییە ژ وانە و ڕووداوێن بورین کو نەخشێ جیهانا مەیا نوکە دەستنیشان دکەن. حەز دکەی ل سەر کیش سەردەمی بزانی؟";
        } else if (cleanInput.includes("کوردی")) {
            reply = "زمانێ کوردی (بادینی و سۆرانی) ناسنامە و بنەمایێ ئەدەبیاتا مەیا دەولەمەندە. پاراستنا ڕێزمان و پەیڤێن ڕەسەن ئەرکێ مەیە وەک قوتابی.";
        } else if (cleanInput.includes("یاسا")) {
            reply = "یاسا ڕێسایەکە کو ماف و ئەرکێن مرۆڤان د جڤاکی دا ڕێک دکەت دا کو دادپەروەری بەرقەرار بیت و چ کەس زۆرداریێ ل یێ دی نەکەت.";
        } else if (cleanInput.includes("ژیندەوەر") || cleanInput.includes("زیندەزانی")) {
            reply = "زانستا ژیندەوەر (Biology) باسی پێکهاتەیا ژیانێ دکەت، ژ خانەیا بچووک بگرە ($Cell$) کو یەکەکا بنیاتنەرە، تا کۆمەڵەیا DNA کو زانیاریێن بۆماوەیی هەڵدەگریت.";
        } else if (cleanInput.includes("ئیسلامی")) {
            reply = "بابەتێن ئیسلامی ل سەر بیروباوەر، نه‌ریتی، سیرەیا پێغەمبەری (س.خ) و ئەخلاقێ جوان بەحس دکەن کو مرۆڤی بەرەو چاکیێ دبەن.";
        } else if (cleanInput.includes("ئێنگلیزی") || cleanInput.includes("ئینگلیزی")) {
            reply = "English is wonderful! زمانێ ئینگلیزی دەرگەهەکە بۆ زانستا جیهانی. ئەگەر د ڕێزمانێ دا (Grammar) یان پەیڤان دا پسیارەک هەبیت، ئەز ل ڤێرەم.";
        } else if (cleanInput.includes("سوپاس")) {
            reply = "شایەنی چ نینە پاشەڕۆژا گەل و وڵاتی! هیوایا سەرکەفتنێ و نمرێن بەرز بۆ تە دخوازم. هەر کاتەکی پسیار هەبیت تەنها بنووسە. 👍";
        }

        appendMessage(reply, 'bot-msg');
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageElement = document.createElement('div');
        const id = 'msg-' + Date.now();
        messageElement.id = id;
        messageElement.className = `message ${className}`;
        messageElement.innerText = text;
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return id;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>
