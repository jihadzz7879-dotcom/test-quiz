
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پۆلی 12 - سیستەمی تاقیکردنەوە و چاتی ژیر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-tab {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--accent-color);
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-tab.active, .btn-tab:hover {
            background-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .section-panel {
            display: none;
        }

        .section-panel.active {
            display: block;
        }

        /* دیزاینی بەشێ چاتی بۆت */
        .chat-container {
            background-color: var(--card-bg);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            height: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 1.05rem;
            animation: fadeIn 0.3s ease;
        }

        .message.bot {
            background-color: #334155;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .message.user {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #0f172a;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: white;
            font-size: 1rem;
        }

        .btn-send {
            background-color: var(--accent-success);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-send:hover {
            background-color: #059669;
        }

        /* بەشێ تاقیکردنەوەی کویز */
        .quiz-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
        }

        .quiz-question {
            font-size: 1.4rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            text-align: right;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .quiz-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .next-btn {
            background-color: var(--accent-success);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>پلاتفۆرمی پێشکەوتووی پۆلی 12</h1>
        <p>تاقیکردنەوەی خێرا و چاتی هۆشمەند دگەل مامۆستای بۆت</p>
    </header>

    <div class="nav-tabs">
        <button class="btn-tab active" onclick="switchTab('chat')">💬 چات دگەل بۆتی</button>
        <button class="btn-tab" onclick="switchTab('quiz')">📝 دەستپێکرنا تاقیکردنێ</button>
    </div>

    <div id="chat-panel" class="section-panel active">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">سلاڤ قوتابیێ هێژا! ئەز ل ڤێرەم بۆ هاریکاریکردنا تە. هەر پرسیارەکا تە د بابەتێن پۆلا 12 دا هەبیت (فیزیا، زیندەوەر، مێژوو، کوردی، ئینگلیزی)، بۆ من بنووسە دا بەرسڤا تە بدەم! 🎯</div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="پەیام یان پرسیارا خۆ لێرە بنووسە..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">ناردن</button>
            </div>
        </div>
    </div>

    <div id="quiz-panel" class="section-panel">
        <div class="quiz-card">
            <div class="quiz-question" id="questionText">پسیار لێرە دیار دەبێت؟</div>
            <div class="options-list" id="optionsContainer"></div>
            <div class="quiz-footer">
                <div id="scoreBoard" style="color: var(--accent-success); font-weight: bold;">نمرە: 0 / 0</div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">پسیارا پاشتر ➔</button>
            </div>
        </div>
    </div>
</div>

<script>
    // لیستا بەرسڤێن بۆتی (تو دشێی بەرسڤێن زێدەتر دابنێی بۆ ئەوەی وەڵامی هەموو شتێک بداتەوە)
    const botResponses = {
        "سلاو": "سلاڤ و ڕێز چاوانم؟ هیواخوازم د دڵخۆش بی. د چ بابەتەکێدا پێویستیا تە ب هاریکاریێ هەیە؟",
        "فیزیا": "فیزیا پۆلا 12 زۆر یا سەرنجڕاکێشە! بابەتێن کێشکردن، تاودان، و وزە زۆر گرنگن. پرسیارەکا تە هەیە تێدا؟",
        "زیندەوەر": "د زیندەوەرێدا، بابەتێ خانە، مۆلیکول، هۆرمۆن و زانستی بۆماوەیی (Genetics) گەلەک پسیار ل سەر دهێن.",
        "مێژوو": "مێژووی پۆلا 12 باسی شەڕێن جیهانی و پەیماننامێن گرنگ وەک بەڵکان و لۆزان دکەت.",
        "ئینگلیزی": "د زمانی ئینگلیزیدا گرنگیێ بدە بە ڕێزمان (Grammar) و ناسینی ئاوەڵکار و ناوان د ڕستەدا.",
        "تاقیکردنەوە": "دشێی ژ بەشێ سەرەوە دوگمەیا 'دەستپێکرنا تاقیکردنێ' لێبدەی دا کو بزانی ئاستێ تە چەندە!",
        "سوپاس": "سەرچاوان، ئەرکا منە! سەرکەوتووبیت د بەدەستهێنانی بەرزترین نمرەدا."
    };

    // بەشی کویز
    const quizDatabase = [
        { question: "کیش هێز دژی جووڵەی تەنەکان دەوەستێتەوە لەسەر ڕووەکان؟", options: ["هێزی کێشکردن", "هێزی لێکخشاندن", "خێرایی", "تاودان"], correct: 1 },
        { question: "پرۆسەی گۆڕینی تیشکی خۆر بۆ وزەی کیمیایی لە ڕووەکدا چی پێ دەوترێت؟", options: ["میتابۆلیزم", "هەناسەدان", "رووەکەپێکهاتن (Photosynthesis)", "ئەنزیم"], correct: 2 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    window.onload = function() {
        loadQuestion();
    };

    // ناردنی نامە د چاتێدا
    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;

        appendMessage(text, 'user');
        input.value = '';

        // وەڵامی بۆت
        setTimeout(() => {
            let reply = "ببورە، من وەک بۆت تەنیا لە بابەتەکانی (فیزیا، زیندەوەر، مێژوو، کوردی، ئینگلیزی) تێدەگەم. وشەیەکی سەرەکی بنووسە!";
            
            for (let key in botResponses) {
                if(text.toLowerCase().includes(key)) {
                    reply = botResponses[key];
                    break;
                }
            }
            appendMessage(reply, 'bot');
        }, 600);
    }

    function appendMessage(text, sender) {
        const container = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
        if(e.key === 'Enter') sendMessage();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
        
        if(tabName === 'chat') {
            document.getElementById('chat-panel').classList.add('active');
            event.target.classList.add('active');
        } else {
            document.getElementById('quiz-panel').classList.add('active');
            event.target.classList.add('active');
        }
    }

    // سیستەمی کویز
    function loadQuestion() {
        const currentQuiz = quizDatabase[currentQuestionIndex];
        document.getElementById('questionText').innerText = currentQuiz.question;
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        document.getElementById('nextBtn').style.display = 'none';

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = option;
            button.onclick = () => checkAnswer(index, button);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedIndex, clickedButton) {
        const currentQuiz = quizDatabase[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        if(selectedIndex === currentQuiz.correct) {
            clickedButton.style.backgroundColor = 'var(--accent-success)';
            score++;
        } else {
            clickedButton.style.backgroundColor = '#ef4444';
            buttons[currentQuiz.correct].style.backgroundColor = 'var(--accent-success)';
        }

        document.getElementById('scoreBoard').innerText = `نمرە: ${score} / ${quizDatabase.length}`;
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if(currentQuestionIndex < quizDatabase.length) {
            loadQuestion();
        } else {
            document.getElementById('questionText').innerText = `تاقیکردنەوە تەواو بوو! نمرەکەت: ${score} ژ ${quizDatabase.length}`;
            document.getElementById('optionsContainer').innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';
        }
    }
</script>
</body>
</html>
