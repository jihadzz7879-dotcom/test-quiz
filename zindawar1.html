
       <!DOCTYPE html>
<html>
<head>
    <title>یاریا فیزیايی</title>
    <style>
        canvas { background: #f0f0f0; display: block; margin: 0 auto; border: 2px solid #333; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let y = 50, dy = 0, gravity = 0.5;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(200, y, 20, 0, Math.PI * 2);
            ctx.fillStyle = "red";
            ctx.fill();
            ctx.closePath();

            dy += gravity;
            y += dy;

            if (y + 20 > canvas.height) { y = canvas.height - 20; dy *= -0.7; }
            requestAnimationFrame(draw);
        }

        window.addEventListener("keydown", () => { dy = -10; });
        draw();
    </script>
</body>
</html>
