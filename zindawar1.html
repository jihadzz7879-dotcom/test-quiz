<script>
    // کلیلێ تە یێ API
    const API_KEY = "AQ.Ab8RN6LJZMawGnknTEc1qR-5o7wpyiZENjaIz6xt_FlAcvZWGA"; 

    function toggleChat() {
        const chatBox = document.getElementById('chatBox');
        chatBox.style.display = (chatBox.style.display === 'none' || chatBox.style.display === '') ? 'flex' : 'none';
    }

    async function sendMessage() {
        const inputElement = document.getElementById('userInput');
        const messageText = inputElement.value.trim();
        if (messageText === "") return;

        appendMessage(messageText, 'user-msg');
        inputElement.value = "";

        // دروستکرنا نامەیا چاوەڕێبوونێ
        const loadingId = appendMessage("مایسترۆ یێ هزردکەت... 🧠", 'bot-msg');

        try {
            // گۆهرینا لینکێ بۆ مۆدێلێ نوو و پشتڕاستکری
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `تۆ مامۆستایەکێ هاریكار و گەلەک زیرەکی د قوتابخانێ دا. ب زمانێ کوردی بادینی (کرمانجیا سەری) بەرسڤا ڤێ پسیارا قوتابی بدە ب شێوازەکێ کورت و ڕوون: ${messageText}` }] }]
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove(); // ڕەشکرنا نامەیا چاوەڕێبوونێ

            // پشکنینا وەرگرتنا دەقی
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let aiReply = data.candidates[0].content.parts[0].text;
                appendMessage(aiReply, 'bot-msg');
            } else {
                appendMessage("ببۆره‌، هه‌روەک کێشەیەک د کلیلێ API دا هەیە. تکایە پشکنینێ بکە.", 'bot-msg');
            }

        } catch (error) {
            if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
            // ئەگەر کێشەیا CORS هەبیت، سیستەمێ ئۆتۆماتیک یێ ناوخۆیی دێ بەرسڤێ دەت
            simulateSmartAI(messageText);
        }
    }

    // سیستەمێ هاریکاریا خێرا ئەگەر سێرڤەر بلۆک بوو
    function simulateSmartAI(input) {
        let reply = "ببورە قوتابیێ هێژا، هێڵا پەیوەندیێ دگەل سێرڤەری کەمەکێ خاڤە. ئەز دزانم تە پسیارا '" + input + "' کریە. ئەز دشێم بێژم ل سەر ڤی بابەتی دڤێت پتر ل پەرتووکێ بگەڕێی یان پسیارێ سادەتر بکەی.";
        
        if(input.includes("فیزیا")) reply = "فیزیا زانستەکا جوانە! یاسایا لڤینێ یا نیوتنی دبێژیت: بۆ هەر کارەکی بەڕوڤاژیەک هەیە.";
        if(input.includes("کوردی")) reply = "زمانێ کوردی ناسنامەیا مەیا ڕەسەنە. د چ پشک دا پسیارا تە هەیە؟";
        if(input.includes("یاسا")) reply = "یاسا ڕێسایێن جڤاکی ڕێک دکەت دا کو مافێ چ کەسێ بەرزە نەبیت.";
        
        setTimeout(() => { appendMessage(reply, 'bot-msg'); }, 400);
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageElement = document.createElement('div');
        const id = 'msg-' + Date.now();
        messageElement.id = id;
        messageElement.className = `message ${className}`;
        messageElement.innerText = text;
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return id;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>
