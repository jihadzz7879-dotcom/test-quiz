
<script>
    // 🔑 کلیلێ خۆ یێ نوو یێ بەلاش ل ڤێرێ د ناڤبەرا دوو کەواناندا دابنێ
    const API_KEY = "AQ.Ab8RN6K9oGZtVwxSiNo6Q7M5la37e9L6xcF9UzI_DNThfLL38w"; 

    function toggleChat() {
        try {
            const chatBox = document.getElementById('chatBox');
            if (chatBox) {
                chatBox.style.display = (chatBox.style.display === 'none' || chatBox.style.display === '') ? 'flex' : 'none';
            }
        } catch (e) { console.log(e); }
    }

    async function sendMessage() {
        const inputElement = document.getElementById('userInput');
        if (!inputElement) return;
        
        const messageText = inputElement.value.trim();
        if (messageText === "") return;

        // ١. نیشاندانا نامەیا قوتابی
        appendMessage(messageText, 'user-msg');
        inputElement.value = "";

        // ٢. نیشاندانا نامەیا چاوەڕێبوونێ
        const loadingId = appendMessage("مایسترۆ یێ هزردکەت... 🧠", 'bot-msg');

        // ٣. ئەگەر کلیل نەهاتبێتە گۆهرین یان بەتاڵ بێت، ئێکسەر دەچێتە سەر مێشکێ ناڤخۆیی
        if (!API_KEY || API_KEY === "" || API_KEY.includes("کلیلێ")) {
            setTimeout(() => { simulateSmartAI(messageText, loadingId); }, 400);
            return;
        }

        try {
            // ناردنا پرۆمپتێ تایبەت بۆ هندێ کو هەم ب بادینی و هەم ب سۆرانی باخڤیت
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ 
                        parts: [{ 
                            text: `تۆ مامۆستایەکێ هاریكار، ڕێزدار و گەلەک زیرەکی د قوتابخانێ دا. ئەمرێ تە یێ سەرەکی: ئەگەر قوتابی ب زمانێ کوردی شێوەزارێ بادینی (کرمانجیا سەری) پسیار کر، تۆ ژی ب بادینی بەرسڤێ بدە. ئەگەر ب شێوەزارێ سۆرانی (کرمانجیا ناڤەڕاست) پسیار کر، تۆ ژی ب سۆرانی بەرسڤێ بدە. بەرسڤێن تە با کورت، ڕوون و زانستی بن ل سەر ڤێ پسیارێ: ${messageText}` 
                        }] 
                    }]
                })
            });

            const loadingEl = document.getElementById(loadingId);
            if (loadingEl) loadingEl.remove();

            if (response.ok) {
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'bot-msg');
                    return;
                }
            }
            
            // ئەگەر وەڵام ژ سێرڤەری نەهات، مێشکێ ناڤخۆیی کار دکەت
            simulateSmartAI(messageText, loadingId);

        } catch (error) {
            // ئەگەر ئینتەرنێت پەککەوت یان ئەپیای خەلەت بوو، ناڤخۆیی کار دکەت و شاشە سپی نابیت
            simulateSmartAI(messageText, loadingId);
        }
    }

    // 🧠 مێشکێ ناڤخۆیی یێ فرێزەکری بۆ پشتیوانیا بۆتی (Backup)
    function simulateSmartAI(input, loadingId) {
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        const cleanInput = input.trim().toLowerCase();
        let reply = "پسیارەکا جوانە قوتابیێ هێژا! وەک بۆتێ مایسترۆ، پێشنیار دکەم تۆ سەیری پشکا بابەتێن ماڵپەری بکەی، چونکی ل وێرێ زانیاریێن تەمام یێن پێدڤی بۆ تاقیکردنەوەیان هاتینە ڕێکخستن.";

        // ئەگەر بەکارهێنەر ب سۆرانی بنووسیت سڵاو
        if (cleanInput.includes("سلاو") || cleanInput.includes("سڵاو")) {
            reply = "سڵاو و ڕێز قوتابیی خۆشەویست! من مایسترۆم، یاریدەدەری زیرەکی تۆ. ناوی بابەتێک بنووسە (فیزیا، مێژوو، کوردی، یاسا) تاوەکو وەڵامت بدەمەوە.";
        } 
        // ئەگەر ب بادینی بنووسیت سلاف
        else if (cleanInput.includes("سلاف")) {
            reply = "سلاو و ڕێز قوتابیێ خۆشەویست! ئەز مایسترۆ مە، هاریكارێ تە یێ زیرەک. ناڤێ بابەتەکی بنووسە (فیزیا، مێژوو، کوردی، یاسا) دا وەڵامێ بدەم.";
        }
        else if (cleanInput.includes("فیزیا")) {
            reply = "فیزیا زانستا لێکۆڵینێ یا ل سەر سروشت، وزە، و لڤینێ یە. یاسایا دووێ یا نیوتنی: $F=ma$.";
        }
        else if (cleanInput.includes("مێژوو")) {
            reply = "مێژوو تۆمارا مەزنترین ڕووداوێن مرۆڤایەتیێ یە بۆ فێربوونا وانەیان بۆ پاشەڕۆژێ.";
        }
        else if (cleanInput.includes("سوپاس") || cleanInput.includes("سۆپاس")) {
            reply = "شایەنی چ نینە قوتابیێ هێژا! هیوای سەرکەوتن و نمرەی بەرزت بۆ دەخوازم. 👍";
        }

        appendMessage(reply, 'bot-msg');
    }

    function appendMessage(text, className) {
        try {
            const chatMessages = document.getElementById('chatMessages');
            if (!chatMessages) return "";
            
            const messageElement = document.createElement('div');
            const id = 'msg-' + Date.now();
            messageElement.id = id;
            messageElement.className = `message ${className}`;
            messageElement.innerText = text;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        } catch(e) { return ""; }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>
