<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پسیارێن ویزاری - JEHAD ZEBARI</title>
    <style>
        :root {
            --primary-color: #4a00e0;
            --secondary-color: #8e2de2;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --dark-color: #2c3e50;
            --light-color: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .developer {
            background: linear-gradient(45deg, #f1c40f, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .setup-section, .quiz-section, .result-section {
            display: none;
        }

        .active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--dark-color);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .progress-bar {
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: 0.3s;
        }

        .question-card {
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            background-color: var(--light-color);
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }

        .option-item:hover {
            border-color: var(--secondary-color);
            background-color: #f0ebfa;
        }

        .option-item.selected {
            background-color: #e0d4f7;
            border-color: var(--primary-color);
        }

        /* Result Styles */
        .result-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #f8f9fa;
            border: 5px solid var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary-color);
        }

        .review-container {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .review-item {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        .review-item.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .review-item.incorrect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .footer-credit {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>سیستەمێ پسیارێن ویزاری</h1>
        <div class="developer">گەشەپێدەر: JEHAD ZEBARI</div>
    </div>

    <!-- Step 1: Selection -->
    <div id="setup-section" class="setup-section active">
        <div class="form-group">
            <label for="year-select">سالا خواندنێ هەلبژێره:</label>
            <select id="year-select">
                <option value="2021">2021</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
            </select>
        </div>
        <div class="form-group">
            <label for="round-select">خۆلێ هەلبژێره:</label>
            <select id="round-select">
                <option value="1">خۆلا ئێکێ (10 پسیار)</option>
                <option value="2">خۆلا دووێ (10 پسیار)</option>
            </select>
        </div>
        <button onclick="startQuiz()">دەستپێکرنا تاقیکردنێ</button>
    </div>

    <!-- Step 2: Quiz -->
    <div id="quiz-section" class="quiz-section">
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
        <div id="question-container">
            <!-- Question will be injected here by JS -->
        </div>
        <button id="next-btn" onclick="nextQuestion()">پسیارا پاشتر</button>
    </div>

    <!-- Step 3: Results -->
    <div id="result-section" class="result-section">
        <div class="result-info">
            <h2>ئەنجامێ تاقیکردنێ</h2>
            <p id="quiz-details-result"></p>
            <div id="score-display" class="score-circle">0 / 10</div>
            <p id="feedback-message" style="font-weight: bold; font-size: 18px;"></p>
        </div>
        
        <h3>پێداچوونا بەرسڤان:</h3>
        <div id="review-container" class="review-container">
            <!-- Review items injected here -->
        </div>
        
        <button onclick="restartQuiz()" style="margin-top: 20px;">دووبارە دەستپێکرن</button>
    </div>

    <!-- Footer -->
    <div class="footer-credit">
        هەمی ماف دپاراستینە بۆ <strong>JEHAD ZEBARI</strong> &copy; 2026
    </div>
</div>

<script>
// بەنکا پێزانینان: پسیارێن ویزاری بۆ هەر سالەکێ و خولەکێ (١٠ پسیار بۆ هەر ئێکێ)
// تێبینی: تە دشێی دەقێ پسیار و بەرسڤان ل دویف حەزا خۆ بگۆڕی.
const quizData = {};

const years = ['2021', '2022', '2023', '2024', '2025'];
years.forEach(year => {
    quizData[year] = {
        "1": [],
        "2": []
    };
    
    // دروستکرنا ١٠ پسیاران بۆ خۆلا ئێکێ
    for(let i=1; i<=10; i++) {
        quizData[year]["1"].push({
            question: `پسیارا ${i} ژ خۆلا ئێکێ یا سالا ${year} چیە؟`,
            options: [`بەرسڤا ڕاست ل ڤێرە`, `بەرسڤا خەلەت ئێک`, `بەرسڤا خەلەت دوو`, `بەرسڤا خەلەت سێ`],
            correct: 0 // ل ڤێرە ئیندێکسێ بەرسڤا ڕاستە (0 وەک ئێکەم بەرسڤ)
        });
    }
    
    // دروستکرنا ١٠ پسیاران بۆ خۆلا دووێ
    for(let i=1; i<=10; i++) {
        quizData[year]["2"].push({
            question: `پسیارا ${i} ژ خۆلا دووێ یا سالا ${year} چیە؟`,
            options: [`بەرسڤا خەلەت ئێک`, `بەرسڤا ڕاست ل ڤێرە`, `بەرسڤا خەلەت دوو`, `بەرسڤا خەلەت سێ`],
            correct: 1
        });
    }
});

let currentQuestions = [];
let currentQuestionIndex = 0;
let userAnswers = [];
let score = 0;

function startQuiz() {
    const year = document.getElementById('year-select').value;
    const round = document.getElementById('round-select').value;
    
    currentQuestions = quizData[year][round];
    currentQuestionIndex = 0;
    userAnswers = [];
    score = 0;
    
    document.getElementById('setup-section').classList.remove('active');
    document.getElementById('quiz-section').classList.add('active');
    
    showQuestion();
}

function showQuestion() {
    if(currentQuestionIndex >= currentQuestions.length) {
        showResults();
        return;
    }
    
    // نووکرنا پرۆگرێس بار
    const progressPercent = (currentQuestionIndex / currentQuestions.length) * 100;
    document.getElementById('progress').style.width = `${progressPercent}%`;
    
    const q = currentQuestions[currentQuestionIndex];
    const container = document.getElementById('question-container');
    
    // گۆڕینا لایێ بەرسڤان ب شێوەیەکێ هەرەمەکی دا کو تاقیکردن ب سەرنجڕاکێشتر لێ بهێت
    let optionsHtml = '';
    q.options.forEach((option, index) => {
        optionsHtml += `<li class="option-item" onclick="selectOption(${index})" id="opt-${index}">${option}</li>`;
    });
    
    container.innerHTML = `
        <div class="question-card">
            <div class="question-text">پسیارا ${currentQuestionIndex + 1}: ${q.question}</div>
            <ul class="options-list">${optionsHtml}</ul>
        </div>
    `;
    
    document.getElementById('next-btn').innerText = (currentQuestionIndex === currentQuestions.length - 1) ? "دوماهی هێنان و دیتنا ئەنجامی" : "پسیارا پاشتر";
}

let selectedOptionIndex = null;

function selectOption(index) {
    selectedOptionIndex = index;
    const items = document.querySelectorAll('.option-item');
    items.forEach(item => item.classList.remove('selected'));
    document.getElementById(`opt-${index}`).classList.add('selected');
}

function nextQuestion() {
    if (selectedOptionIndex === null) {
        alert("هیڤییە بەرسڤەکێ هەلبژێره بەری بچی پێش!");
        return;
    }
    
    userAnswers.push(selectedOptionIndex);
    if(selectedOptionIndex === currentQuestions[currentQuestionIndex].correct) {
        score++;
    }
    
    selectedOptionIndex = null;
    currentQuestionIndex++;
    showQuestion();
}

function showResults() {
    document.getElementById('quiz-section').classList.remove('active');
    document.getElementById('result-section').classList.add('active');
    
    const year = document.getElementById('year-select').value;
    const round = document.getElementById('round-select').value;
    
    document.getElementById('quiz-details-result').innerText = `سالا ${year} - خۆلا  ${round === '1' ? 'ئێکێ' : 'دووێ'}`;
    document.getElementById('score-display').innerText = `${score} / 10`;
    
    let feedback = "";
    if(score >= 8) feedback = "نمرەکا نایابە! سەرکەفتی بی.";
    else if(score >= 5) feedback = "باشە، بەلێ تۆ دشێی هێشتا باشتر لێ بکەی.";
    else feedback = "دڤێت هێشتا پتر بخوینی و هەول بدەی.";
    
    document.getElementById('feedback-message').innerText = feedback;
    
    // نیشاندانا پێداچوونێ (بەرسڤێن ڕاست و خەلەت)
    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';
    
    currentQuestions.forEach((q, index) => {
        const userAns = userAnswers[index];
        const isCorrect = (userAns === q.correct);
        
        const item = document.createElement('div');
        item.className = `review-item ${isCorrect ? 'correct' : 'incorrect'}`;
        
        item.innerHTML = `
            <strong>پسیارا ${index + 1}: ${q.question}</strong><br>
            <span style="color: ${isCorrect ? 'green' : 'red'}">بەرسڤا تە: ${q.options[userAns]}</span><br>
            ${!isCorrect ? `<span style="color: green; font-weight: bold;">بەرسڤا ڕاست: ${q.options[q.correct]}</span>` : '✔️ بەرسڤا تە یا ڕاستە'}
        `;
        reviewContainer.appendChild(item);
    });
}

function restartQuiz() {
    document.getElementById('result-section').classList.remove('active');
    document.getElementById('setup-section').classList.add('active');
}
</script>

</body>
</html>
