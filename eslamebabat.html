<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تێستێ بابەتێ پەروەردا ئیسلامی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            min-height: 100vh;
            padding: 20px 15px;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .quiz-container {
            width: 100%;
            max-width: 600px;
            background-color: transparent;
        }

        /* کارتا ناڤونیشانێ سەرەکی */
        .header-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border-top: 5px solid #3b82f6;
        }

        .main-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.5;
        }

        /* کارتێن هەلبژارتنا وانەیان */
        .selection-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            color: #374151;
            padding: 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            line-height: 1.5;
        }

        .menu-btn:hover {
            border-color: #3b82f6;
            background-color: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }

        /* کارتێن پرسیاران */
        .question-card {
            background: #ffffff;
            padding: 25px 20px;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-right: 5px solid #3b82f6;
        }

        .question-text {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #1f2937;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #4b5563;
            font-size: 15px;
            font-weight: 500;
        }

        .option-label:hover {
            border-color: #3b82f6;
            background: #f8fafc;
        }

        .option-label input {
            margin-left: 12px;
            transform: scale(1.2);
            accent-color: #3b82f6;
        }

        .section {
            display: none;
        }

        .active {
            display: block;
        }

        /* پشکا دوماهی هاتنێ */
        .oval-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            text-align: center;
            margin-top: 10px;
        }

        .oval-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        /* کارتا ئەنجامی */
        .result-card {
            text-align: center;
            padding: 30px 20px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }

        .score-text {
            font-size: 36px;
            font-weight: bold;
            color: #10b981;
            margin: 15px 0;
        }

        .percentage-text {
            font-size: 22px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .review-card {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid #e5e7eb;
        }

        .correct-review { border-right: 5px solid #10b981; }
        .wrong-review { border-right: 5px solid #ef4444; }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
        }
        .badge-correct { background-color: #10b981; }
        .badge-wrong { background-color: #ef4444; }

        .text-success { color: #10b981; font-weight: bold; }
        .text-danger { color: #ef4444; font-weight: bold; }
        .text-correct-ans { color: #10b981; font-weight: bold; }

        .btn-secondary {
            background-color: #6b7280;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 15px;
            padding: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    
    <div class="header-card">
        <div class="main-title" id="main-header-title">تێستێ بابەتێ پەروەردا ئیسلامی</div>
        <div class="sub-title" id="main-header-sub">خۆشەویست قوتابی، بابەتێ خۆ یێ تاقیکرنێ هەڵبژێره‌</div>
    </div>

    <div id="selection-screen" class="section active">
        <div class="selection-group">
            <button class="menu-btn" onclick="startQuiz(1)">وانەیا ئێکی : باوەری ب رامانخستنا ژیانێ (٨ پرسیار)</button>
            <button class="menu-btn" onclick="startQuiz(2)">وانەیا دووێ : باوەری و ئەرێنیبوون د ژیانێ دا (٢٦ پرسیار)</button>
            <button class="menu-btn" onclick="startQuiz(3)">وانەیا سێێ : پالدەرێن ئەرێنیبوونێ د ژیانێ دا (١٧ پرسیار)</button>
        </div>
    </div>

    <div id="quiz-screen" class="section">
        <form id="quiz-form">
            <div id="questions-container"></div>
            <button type="button" class="oval-btn" onclick="submitQuiz()">دوماهیك هاتن و دیتنا ئەنجامی</button>
        </form>
    </div>

    <div id="result-screen" class="section">
        <div class="result-card">
            <h2>ئەنجامێ تاقیکرنێ</h2>
            <div class="score-text" id="score-display">0 / 0</div>
            <div class="percentage-text" id="percentage-display">ڕێژا سەرکەفتنێ: 0%</div>
            <p id="result-message" style="color: #4b5563; font-weight: 500;"></p>
            <button class="btn-secondary" onclick="goHome()">زڤرین بۆ لاپەرێ سەرەکی</button>
        </div>
        <h3 style="margin-bottom: 15px; color: #1e3a8a; font-weight: 700; padding-right: 5px;">پێداچوونا پرسیاران:</h3>
        <div id="review-container"></div>
    </div>
</div>

<script>
    const quizData = {

                { q: "ئێک ژ ئەرکین سەرەکی یین باوەریی... ئەڤە یە: مەعنایی بدەتە ژیانێ و مروڤی ژ هه ستنکرنا ......... رزگار بکەت .", options: {A:"خوشیێن ژیانێ", B:"نەخوشیێن ژیانێ", C:"ئارمانجا ژیانێ", D:"بێ ئارمانجییا ژیانێ"}, correct: "D" },
                { q: "ئینکەربین ینتیقیا مروڤی ب دینی ژ ڤی لاییڤە ئەوە ناهێن کێم و کاسیێن مروڤی یێن سروشتی ......... .", options: {A:"ڤەدکولیت", B:"ڤەدشێریت", C:"زێدە دکەت", D:"کوم دکەت"}, correct: "A" },
                { q: "کێم و کاسی پشکەک دبینن ژ ......... ، و ژی ناهێنە جوداکرن .", options: {A:"جوانییا مروڤی", B:"سروشتی مروڤی", C:"هزرا مروڤی", D:"دەوروبەرێن مروڤی"}, correct: "B" },
                { q: "ئێک ژ ئەرکێن سەرەکی یێن ......... ئەوە ئەو هاریکارییا مروڤی بکەت کو مروڤ ب سەر کێم و کاسیێن خۆ ب سەرکەڤیت .", options: {A:"ژیانێ", B:"باوەریێ", C:"خۆشیێ", D:"نەخۆشیێ"}, correct: "B" },

                { q: "......... مە فێری هندێ دکەن کو دابیت نەخۆشی ببیته دەلیڤە بۆ تێگەهشتنەکا زیندەتر بۆ ژیانێ .", options: {A:"خۆشی و شادی", B:"کەرب و کین", C:"باوەری و ئیسلام", D:"دل و دەروون"}, correct: "C" },
                { q: "......... دزانت کو نەخۆشی هەمی نە خرابییه، و خودایەک هەیە دشێت خوشیین بدەت .", options: {A:"باوەردار", B:"بێ باوەر", C:"هەر کەسەک", D:"نەخواندەڤان"}, correct: "A" }

                { q: "ئێک ژ ئەگەرێن نەرێنیبوونێ یە :", options: {A:"هەزۆک و دودلی", B:"بێ زەوقی", C:"خۆشی", D:"نەخۆشی"}, correct: "A" },

        },
        3: {
            title: "وانەیا سێێ : پالدەرێن ئەرێنیبوونێ د ژیانێ دا",
            questions: [
                { q: "ئەگەر ئەم باش بەڕێ خۆ بدەینە ئیسلامێ، دێ بینین کو ئەو بۆ ......... گرنگیێ ددەتە گەلەک بها و ڕەفتار و بناغەیان .", options: {A:"ب هێزبوونێ", B:"بێ هێزبوونێ", C:"نەرێنیبوونێ", D:"ئەرێنیبوونێ"}, correct: "D" },
                { q: "ب دیتنا ئیسلامێ بونەوەر و ژیان ......... .", options: {A:"ژێک دویرن", B:"هەڤدژن", C:"ئارمانجدارن", D:"بێ ئارمانجن"}, correct: "C" },
                { q: "فەلسەفەیا ژینێ د ئیسلامێدا؛ نەفەیە، ژین ......... بۆ ئه نجامدانا باشترین کاران .", options: {A:"جەرباندنەکە", B:"جوانییەکە", C:"خۆشییەکە", D:"هێفییەکە"}, correct: "A" },
                { q: "......... ژێدەرێ گەشبینی و ئۆمێدێیە، چونکی ئه و ل سەر هندی دهێتە ئاڤاکرن کو مروڤی باوەری ب خودایەکێ دلوڤان هەبت .", options: {A:"باوەر", B:"هێز", C:"خواندن", D:"هزر"}, correct: "A" },
                { q: "خودایێ مەزن داخوازی ژ ......... دکەت کو ئەو کاری بکەن و پشتڕاست بن کو خودێ و پێغەمبەر د کاری وان دبینن .", options: {A:"نەزانان", B:"بێ باوەران", C:"باوەرداران", D:"نەخواندەڤانان"}, correct: "C" },
                { q: "د چەند ئایەت و فەرموودەیاندا هاتیە کو ......... و کۆمەکا هەڵوێست و چالاکییان پێکڤە د گرێداینە .", options: {A:"باوەری", B:"هێز", C:"خواندن", D:"هزر"}, correct: "A" },
                { q: "پێغەمبەر (سلاڤ لێ بن) د بێژیت : (( مَن رَأى مِنكُم مُنكراً فَلْيُغَيِّرْهُ بِيَدِهِ ... )) . کی ئەڤ فەرموودە ڤەگوهاستیە ؟", options: {A:"ئیمامی ئەحمەد", B:"ئیمامی بوخاری", C:"ئیمامی مسلم", D:"ئیمامی ترمزی"}, correct: "C" },
                { q: "پێغەمبەر (سلاڤ لێ بن) د بێژیت : (( مَن رَأى مِنكُم مُنكراً فَلْيُغَيِّرْهُ بِيَدِهِ ... )) ، ئه‌ڤه‌ فه‌رمووده‌ هه‌می هندێ دگه‌هینیت كو نابیت ......... به‌رانبه‌ر كارێ خراب بێ هه‌ڵوێست بمینیت .", options: {A:"نەزان", B:"بێ باوەر", C:"باوەردار", D:"نەخواندەڤان"}, correct: "C" },
                { q: "خودایێ مەزن باوەرداران یاڵددەت کو ئەو ل سەرێ د کرنا ......... بکەن، و د بەهر ئێکودودا بکەن .", options: {A:"بازرگانیێدا", B:"خێریدا", C:"جوتیاریێدا", D:"خۆشیێدا"}, correct: "B" },
                { q: "خودایێ مەزن باوەرداران یاڵددەت کو ئەو ل سەرێ د کرنا خێریدا بکەن، چونکی ئەڤە نیشانا ......... مروڤییه .", options: {A:"ب هێزبوونێ", B:"بێ هێزبوونێ", C:"ئەرێنیبوونێ", D:"نەرێنیبوونێ"}, correct: "C" },
                { q: "قورئان گرنگی نەدانێ ب تەحفیا لاواز، و هارینەکڕنا وان ژ لایێ جڤاکیڤە، دکەتە نیشانا ......... .", options: {A:"نەبوونا هێزێ", B:"نەبوونا زانینێ", C:"نەبوونا ئارمانجێ", D:"نەبوونا باوەریێ"}, correct: "D" },
                { q: "پێغەمبەر (سلاڤ لێ بن) د بێژیت : (( مَن لَم يَهْتَمَّ بِأَمْرِ الْمُسْلِمِينَ فَلَيْسَ مِنْهُمْ )) ، ئانکو : هرکەسێ خەمێ ژ موسلمانان نەخۆت، ئەو ......... .", options: {A:"نە ژ وانە", B:"بەخیلە", C:"تەمبەلە", D:"ژ وانە"}, correct: "A" },
                { q: "ب دیتنا باوەرداری ژیان کۆمەکا ......... .", options: {A:"خۆشیانە", B:"هێڤیانە", C:"ئارمانجانە", D:"دەلیڤەیانە"}, correct: "D" },
                { q: "ب دیتنا باوەرداری ژیان کۆمەکا دەلیڤەیانە، و پێغەمبەر (سلاڤ لێ بن) داخوازی ژ ......... دکەت کو ئەو وان دەلیڤەیان ژ دەست خۆ نەکەت .", options: {A:"موسلمانی", B:"نەزانی", C:"خەلکی", D:"کارکەری"}, correct: "A" },
                { q: "پێغەمبەر (سلاڤ لێ بن) د بێژیت : (( اغتنم خمسا قبل خمس ... )) . کێ ئەڤ فەرموودە ڤەگوهاستیە ؟", options: {A:"تەمبەرانی", B:"بوخاری", C:"مسلم", D:"نەسائی و بەیهەقی"}, correct: "D" },
                { q: "......... هەستا گرنگییا دەمی ل نک مروڤی په‌یدا دکەت .", options: {A:"هێز", B:"هیڤی", C:"باوەری", D:"زانین"}, correct: "C" },
                { q: "خودایێ مەزن د گەلەک سوورەتێن قورئانێدا سووند خوارییە کو تێچوون و زیان بۆ وی مروڤییە ئەوێ دەمێ خۆ بنی ......... ببورینت .", options: {A:"خۆشی", B:"ئارمانج", C:"باوەری و کارێ چاک", D:"خواندن و زانینێ"}, correct: "C" }
            ]
        }
    };

    let activeSection = null;

    function startQuiz(sectionNum) {
        activeSection = sectionNum;
        const currentData = quizData[sectionNum];
        
        // گوهۆرینا ناڤ و دێمێ سەرەکی د کارتا سەرەکیدا
        document.getElementById('main-header-title').innerText = currentData.title;
        document.getElementById('main-header-sub').innerText = "بەرسڤا هەمی پرسیاران بدە و ل دوماهییێ پشکنینا ئەنجامی بکە";
        
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        currentData.questions.forEach((question, index) => {
            let optionsHtml = '';
            for (const [key, value] of Object.entries(question.options)) {
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q-${index}" value="${key}">
                        <strong>${key} )</strong> &nbsp; ${value}
                    </label>
                `;
            }

            container.innerHTML += `
                <div class="question-card">
                    <div class="question-text">${index + 1}. ${question.q}</div>
                    <div class="options-container">${optionsHtml}</div>
                </div>
            `;
        });

        switchScreen('quiz-screen');
    }

    function submitQuiz() {
        const currentData = quizData[activeSection];
        let correctCount = 0;
        let total = currentData.questions.length;
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';

        currentData.questions.forEach((question, index) => {
            const selected = document.querySelector(`input[name="q-${index}"]:checked`);
            const userChoice = selected ? selected.value : null;
            const isRight = userChoice === question.correct;

            if (isRight) correctCount++;

            const cardClass = isRight ? "correct-review" : "wrong-review";
            const badgeClass = isRight ? "badge-correct" : "badge-wrong";
            const badgeText = isRight ? "یا ڕاستە" : "یا خەلەتە";

            let userText = userChoice ? `${userChoice} ) ${question.options[userChoice]}` : "تە بەرسڤ نەدایە";
            let correctText = `${question.correct} ) ${question.options[question.correct]}`;

            reviewContainer.innerHTML += `
                <div class="review-card ${cardClass}">
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                    <div class="question-text" style="font-size:15px; margin-bottom:10px;">${index + 1}. ${question.q}</div>
                    <div style="font-size: 14px;">
                        <p style="margin-bottom:4px;">بەرسڤا تە: <span class="${isRight ? 'text-success' : 'text-danger'}">${userText}</span></p>
                        ${!isRight ? `<p>بەرسڤا دروست: <span class="text-correct-ans">${correctText}</span></p>` : ''}
                    </div>
                </div>
            `;
        });

        let finalScore = correctCount * 2;
        let maxScore = total * 2;
        let percent = Math.round((finalScore / maxScore) * 100);

        document.getElementById('score-display').innerText = `${finalScore} / ${maxScore}`;
        document.getElementById('percentage-display').innerText = `ڕێژا سەرکەفتنێ: ${percent}%`;
        document.getElementById('result-message').innerText = percent >= 50 ? "پیرۆزە! تو ب سەرکەفتیانە دەرچووی." : "هەول بدە ڤارەکا دی بابەتان پێداچوون بکەی.";

        document.getElementById('main-header-title').innerText = "ئەنجامێ تاقیکرنێ";
        document.getElementById('main-header-sub').innerText = "ل خوارێ دشێی تەماشای پێداچوونا هەمی بەرسڤان بکەی";

        switchScreen('result-screen');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo(0, 0);
    }

    function goHome() {
        document.getElementById('quiz-form').reset();
        document.getElementById('main-header-title').innerText = "تێستێ بابەتێ پەروەردا ئیسلامی";
        document.getElementById('main-header-sub').innerText = "خۆشەویست قوتابی، بابەتێ خۆ یێ تاقیکرنێ هەڵبژێره‌";
        switchScreen('selection-screen');
    }
</script>
