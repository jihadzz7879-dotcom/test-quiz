<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تێستێ بابەتێ پەروەردا ئیسلامی</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --card-bg: #ffffff;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, "Segoe UI", sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 30px 15px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-font-smoothing: antialiased;
        }

        .quiz-container {
            width: 100%;
            max-width: 680px;
        }

        /* کارتا سەرەکی یا ناڤونیشانی */
        .header-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 35px 25px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid var(--primary);
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2563eb, #3b82f6, #10b981);
        }

        .main-title {
            font-size: 26px;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 12px;
        }

        .sub-title {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        /* بەرسڤا هەلبژارتنا وانەیان */
        .selection-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            background: var(--card-bg);
            border: 1px solid #e5e7eb;
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 22px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: right;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            line-height: 1.6;
        }

        .menu-btn::after {
            content: '←';
            font-size: 18px;
            color: var(--primary);
            transition: transform 0.2s;
        }

        .menu-btn:hover {
            border-color: var(--primary);
            background-color: #f8fafc;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -8px rgba(37, 99, 235, 0.15);
        }

        .menu-btn:hover::after {
            transform: translateX(-5px);
        }

        /* کارتا پرسیارێ */
        .question-card {
            background: var(--card-bg);
            padding: 28px 24px;
            margin-bottom: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border-right: 6px solid var(--primary);
        }

        .question-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 22px;
            line-height: 1.8;
            color: #0f172a;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 15px 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #334155;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
        }

        .option-label:hover {
            border-color: var(--primary);
            background: #f1f5f9;
        }

        .option-label input {
            margin-left: 14px;
            transform: scale(1.3);
            accent-color: var(--primary);
            cursor: pointer;
        }

        .section {
            display: none;
        }

        .active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* دوگمێن ئۆڤال */
        .oval-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 18px;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s;
            box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.4);
            text-align: center;
            margin-top: 15px;
        }

        .oval-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        /* کارتا ئەنجامی */
        .result-card {
            text-align: center;
            padding: 40px 24px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .score-text {
            font-size: 42px;
            font-weight: 800;
            color: var(--success);
            margin: 15px 0;
        }

        .percentage-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .review-card {
            background: var(--card-bg);
            padding: 24px;
            margin-bottom: 18px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
        }

        .correct-review { border-right: 6px solid var(--success); }
        .wrong-review { border-right: 6px solid var(--danger); }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
        }
        .badge-correct { background-color: var(--success); }
        .badge-wrong { background-color: var(--danger); }

        .text-success { color: var(--success); font-weight: bold; }
        .text-danger { color: var(--danger); font-weight: bold; }
        .text-correct-ans { color: var(--success); font-weight: bold; }

        .btn-secondary {
            background-color: #64748b;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 15px;
            padding: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    
    <div class="header-card">
        <div class="main-title" id="main-header-title">تێستێ بابەتێ پەروەردا ئیسلامی</div>
        <div class="sub-title" id="main-header-sub">خۆشەویست قوتابی، بابەتێ خۆ یێ تاقیکرنێ هەڵبژێره‌</div>
    </div>

    <div id="selection-screen" class="section active">
        <div class="selection-group">
            <button class="menu-btn" onclick="startQuiz(1)">وانەیا ئێکی : باوەری ب رامانخستنا ژیانێ (٨ پرسیار)</button>
            <button class="menu-btn" onclick="startQuiz(2)">وانەیا دووێ : باوەری و ئەرێنیبوون د ژیانێ دا (٢٦ پرسیار)</button>
            <button class="menu-btn" onclick="startQuiz(3)">وانەیا سێێ : پالدەرێن ئەرێنیبوونێ د ژیانێ دا (١٧ پرسیار)</button>
            <button class="menu-btn" onclick="startQuiz(4)">وانەیا چارێ : دادپەروەری (٢٦ پرسیار)</button>
        </div>
    </div>

    <div id="quiz-screen" class="section">
        <form id="quiz-form">
            <div id="questions-container"></div>
            <button type="button" class="oval-btn" onclick="submitQuiz()">دوماهیك هاتن و دیتنا ئەنجامی</button>
        </form>
    </div>

    <div id="result-screen" class="section">
        <div class="result-card">
            <h2>ئەنجامێ تاقیکرنێ</h2>
            <div class="score-text" id="score-display">0 / 0</div>
            <div class="percentage-text" id="percentage-display">ڕێژا سەرکەفتنێ: 0%</div>
            <p id="result-message" style="color: var(--text-muted); font-weight: bold;"></p>
            <button class="btn-secondary" onclick="goHome()">زڤرین بۆ لاپەرێ سەرەکی</button>
        </div>
        <h3 style="margin-bottom: 18px; color: #1e3a8a; font-weight: bold; padding-right: 5px;">پێداچوونا پرسیاران:</h3>
        <div id="review-container"></div>
    </div>
</div>

<script>
    const quizData = {
        1: {
            title: "وانەیا ئێکی : باوەری ب رامانخستنا ژیانێ",
            questions: [
                { q: "ئێک ژ ئەرکین سەرەکی یین باوەریی، و یین دینی ب گشتی، و دینی ئیسلامی ب تایبەتی، وەک پەیاما خودێ بو مروڤی ئەڤە یە: ......... .", options: {A:"مەعنایی بدەتە مللەتی", B:"مەعنایی بدەتە ژیانێ", C:"مروڤی ژ هه ستکرنا بێ ئارمانجییا ژیانێ رزگاربکەت", D:"هەردوو د ڕاستن (B-C)"}, correct: "D" },
                { q: "ئێک ژ ئەرکین سەرەکی یین باوەریی... ئەڤە یە: مەعنایی بدەتە ژیانێ و مروڤی ژ هه ستنکرنا ......... رزگار بکەت .", options: {A:"خۆشیێن ژیانێ", B:"نەخۆشیێن ژیانێ", C:"ئارمانجا ژیانێ", D:"بێ ئارمانجییا ژیانێ"}, correct: "D" },
                { q: "ئینکەربین ینتیقیا مروڤی ب دینی ژ ڤی لاییڤە ئەوە ناهێن کێم و کاسیێن مروڤی یێن سروشتی ......... .", options: {A:"ڤەدکولیت", B:"ڤەدشێریت", C:"زێدە دکەت", D:"کۆم دکەت"}, correct: "A" },
                { q: "کێم و کاسی پشکەک دبینن ژ ......... ، و ژی ناهێنە جوداکرن .", options: {A:"جوانییا مروڤی", B:"سروشتی مروڤی", C:"هزرا مروڤی", D:"دەوروبەرێن مروڤی"}, correct: "B" },
                { q: "ئێک ژ ئەرکێن سەرەکی یێن ......... ئەوە ئەو هاریکارییا مروڤی بکەت کو مروڤ ب سەر کێم و کاسیێن خۆ ب سەرکەڤیت .", options: {A:"ژیانێ", B:"باوەریێ", C:"خۆشیێ", D:"نەخۆشیێ"}, correct: "B" },
                { q: "......... مە ژ رەوشەکا نەرێنی بۆ ئێک ئەرێنی ڤەدگوهێزیت، و نەئەرکە ئەرکێن باوەری و دینی ب گشتی .", options: {A:"ب رامانخستنا نەخۆشیان", B:"بەریکانەیا نەخۆشیان", C:"ژ دەستدانا خوشتڤیان", D:"هەستکرن ب ترسی"}, correct: "A" },
                { q: "......... مە فێری هندێ دکەن کو دابیت نەخۆشی ببیته دەلیڤە بۆ تێگەهشتنەکا زیندەتر بۆ ژیانێ .", options: {A:"خۆشی و شادی", B:"کەرب و کین", C:"باوەری و ئیسلام", D:"دل و دەروون"}, correct: "C" },
                { q: "......... دزانت کو نەخۆشی هەمی نە خرابییه، و خودایەک هەیە دشێت خوشیین بدەت .", options: {A:"باوەردار", B:"بێ باوەر", C:"هەر کەسەک", D:"نەخواندەڤان"}, correct: "A" }
            ]
        },
        2: {
            title: "وانەیا دووێ : باوەری و ئەرێنیبوون د ژیانێ دا",
            questions: [
                { q: ".........، ئانکو چالاکبوون، و هەستکرن ب بەرپرسیێ، و بەرەنگاربوونا کەفتنا کێشەیێن بۆ ژیانێ، و کارلیکرنا دگەل ئارمانجێ .", options: {A:"ب هێزبوون", B:"بێ هێزبوون", C:"ئەرێنیبوون", D:"نەرێنیبوون"}, correct: "C" },
                { q: ".........، رامانا خەمساری و ڕەشبینی و هەست نەکرن ب بەرپرسیێ و خۆ ڤەکێشان و شکەستنێ ددەت .", options: {A:"ب هێزبوون", B:"بێ هێزبوون", C:"ئەرێنیبوون", D:"نەرێنیبوون"}, correct: "D" },
                { q: "ئەگەر باوەرى جهێ خۆ د دڵێ کەسەکێدا کر، ئەڤە دێ وی کەتە خۆدان ......... .", options: {A:"هشیارییەکا ڕاست و دروست", B:"ڤیانەکا ڕاست و دروست", C:"هێزەکا ڕاست و دروست", D:"مێشکەکێ ڕاست و دروست"}, correct: "C" },

                { q: "......... پالدەرەکێ نافخۆیییە، مروڤی بەرەو چاکخوازی و زێدەکرنا خێراتیێ دبەت .", options: {A:"باوەر", B:"هێز", C:"خواندن", D:"هزر"}, correct: "A" },
                { q: "......... نیشانا لاوازییا کەسایەتیا خودانییە، ژ بەر کو ئەو هێز و شیانا دەستپێشخەری و دانا بریارێ ژ مروڤی دستینیت .", options: {A:"هەزۆک و دودلی", B:"بێزاری", C:"تەمبەڵی", D:"شەرمینی"}, correct: "A" },
                { q: "ئێک ژ ئەگەرێن نەرێنیبوونێ یە :", options: {A:"هەزۆک و دودلی", B:"بێ زەوقی", C:"خۆشی", D:"نەخۆشی"}, correct: "A" },
                { q: "......... نیشانا لاوازییا کەسایەتیا خودانییە، ژ بەر کو ئەو هێز و شیانا دەستپێشخەری و دانا بریارێ ژ مروڤی دستینیت .", options: {A:"هەزۆک و دودلی", B:"بێزاری", C:"تەمبەڵی", D:"شەرمینی"}, correct: "A" },
                { q: "مروڤێ ......... ، ئەو کەسە ئەون ل دەمێ پێدڤی شیانا بریاردانێ ناهەبت، و پشتی دانا بریارێ هەزۆک و دودل نەبت .", options: {A:"باش", B:"خراب", C:"ئەرێنی", D:"نەرێنی"}, correct: "C" },

                { q: "......... نێشەکا نیراویا مروڤی لاواز دکەت, و نەخۆشییە ل نک مروڤی دکوژت .", options: {A:"هەزۆک و دودلی", B:"بێزاری", C:"تەمبەڵی", D:"شەرمینی"}, correct: "C" },
                { q: "......... ئێکە هند ژ مروڤی چیندکەت کو ئەو داخوازا مافێ خۆ نە کەت، و ب ئاشکرایی دەربڕینی ژ بیر و باوەرێن خوه نەکەت .", options: {A:"هەزۆک و دودلی", B:"بێزاری", C:"تەمبەڵی", D:"شەرمینی"}, correct: "D" },

    let activeSection = null;

    function startQuiz(sectionNum) {
        activeSection = sectionNum;
        const currentData = quizData[sectionNum];
        
        document.getElementById('main-header-title').innerText = currentData.title;
        document.getElementById('main-header-sub').innerText = "بەرسڤا هەمی پرسیاران بدە و ل دوماهییێ پشکنینا ئەنجامی بکە";
        
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        currentData.questions.forEach((question, index) => {
            let optionsHtml = '';
            for (const [key, value] of Object.entries(question.options)) {
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q-${index}" value="${key}">
                        <strong>${key} )</strong> &nbsp; ${value}
                    </label>
                `;
            }

            container.innerHTML += `
                <div class="question-card">
                    <div class="question-text">${index + 1}. ${question.q}</div>
                    <div class="options-container">${optionsHtml}</div>
                </div>
            `;
        });

        switchScreen('quiz-screen');
    }

    function submitQuiz() {
        const currentData = quizData[activeSection];
        let correctCount = 0;
        let total = currentData.questions.length;
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';

        currentData.questions.forEach((question, index) => {
            const selected = document.querySelector(`input[name="q-${index}"]:checked`);
            const userChoice = selected ? selected.value : null;
            const isRight = userChoice === question.correct;

            if (isRight) correctCount++;

            const cardClass = isRight ? "correct-review" : "wrong-review";
            const badgeClass = isRight ? "badge-correct" : "badge-wrong";
            const badgeText = isRight ? "یا ڕاستە" : "یا خەلەتە";

            let userText = userChoice ? `${userChoice} ) ${question.options[userChoice]}` : "تە بەرسڤ نەدایە";
            let correctText = `${question.correct} ) ${question.options[question.correct]}`;

            reviewContainer.innerHTML += `
                <div class="review-card ${cardClass}">
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                    <div class="question-text" style="font-size:15px; margin-bottom:10px;">${index + 1}. ${question.q}</div>
                    <div style="font-size: 14px;">
                        <p style="margin-bottom:4px;">بەرسڤا تە: <span class="${isRight ? 'text-success' : 'text-danger'}">${userText}</span></p>
                        ${!isRight ? `<p>بەرسڤا دروست: <span class="text-correct-ans">${correctText}</span></p>` : ''}
                    </div>
                </div>
            `;
        });

        let finalScore = correctCount * 2;
        let maxScore = total * 2;
        let percent = Math.round((finalScore / maxScore) * 100);

        document.getElementById('score-display').innerText = `${finalScore} / ${maxScore}`;
        document.getElementById('percentage-display').innerText = `ڕێژا سەرکەفتنێ: ${percent}%`;
        document.getElementById('result-message').innerText = percent >= 50 ? "پیرۆزە! تو ب سەرکەفتیانە دەرچووی." : "هەول بدە ڤارەکا دی بابەتان پێداچوون بکەی.";

        document.getElementById('main-header-title').innerText = "ئەنجامێ تاقیکرنێ";
        document.getElementById('main-header-sub').innerText = "ل خوارێ دشێی تەماشای پێداچوونا هەمی بەرسڤان بکەی";

        switchScreen('result-screen');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo(0, 0);
    }

    function goHome() {
        document.getElementById('quiz-form').reset();
        document.getElementById('main-header-title').innerText = "تێستێ بابەتێ پەروەردا ئیسلامی";
        document.getElementById('main-header-sub').innerText = "خۆشەویست قوتابی، بابەتێ خۆ یێ تاقیکرنێ هەڵبژێره‌";
        switchScreen('selection-screen');
    }
</script>

</body>
</html>
