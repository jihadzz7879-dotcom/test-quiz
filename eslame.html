<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونێن ویزاری یێن پەروەردەیا ئیسلامی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            width: 100%;
            max-width: 650px;
            background-color: #111111;
            border: 1px solid #1c1c1c;
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .main-title {
            font-size: 26px;
            font-weight: bold;
            color: #2ecc71;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub-title {
            font-size: 14px;
            color: #b3b3b3;
            text-align: center;
            margin-bottom: 30px;
        }
        .selection-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: -5px;
            display: block;
            padding-right: 10px;
        }
        select {
            width: 100%;
            background-color: #161a23;
            border: 1px solid #252c3a;
            color: white;
            padding: 16px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-align: center;
            appearance: none;
            transition: all 0.3s;
        }
        select:focus { border-color: #2ecc71; box-shadow: 0 0 10px rgba(46, 204, 113, 0.2); }
        .oval-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
        }
        .oval-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }
        .quiz-section { display: none; }
        .question-card {
            background-color: #161616;
            border: 1px solid #1c1c1c;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 22px;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.8;
            margin-bottom: 18px;
            color: #f0f0f0;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-label {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            border: 1px solid #2c2c2c;
            border-radius: 50px;
            padding: 14px 22px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .option-label:hover {
            border-color: #2ecc71;
            background-color: #1a241e;
        }
        .option-label input {
            margin-left: 12px;
            accent-color: #2ecc71;
            transform: scale(1.1);
        }
        .result-box {
            display: none;
            background-color: #161616;
            border: 1px solid #252c3a;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-text {
            font-size: 48px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 12px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        .back-btn:hover { color: #ffffff; }

        .answer-feedback {
            margin-top: 15px;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            text-align: right;
            line-height: 1.5;
        }
        .feedback-correct {
            background-color: #132d1b;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .feedback-wrong {
            background-color: #351414;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    
    <!-- مێنیویا دەستپێکێ -->
    <div id="setup-menu">
        <div class="main-title">پەروەردەیا ئیسلامی</div>
        <div class="sub-title">سیستەمێ ئەزموونێن ویزاری (نمرە ژ ١٠٠)</div>
        
        <div class="selection-group">
            <label>ساڵا ئەزموونێ هەڵبژێرە:</label>
            <select id="yearSelect">
                <option value="2014">ساڵا ٢٠١٤ - ٢٠١٥</option>
                <option value="2015">ساڵا ٢٠١٥ - ٢٠١٦</option>
                <option value="2016">ساڵا ٢٠١٦ - ٢٠١٧</option>
                <option value="2017">ساڵا ٢٠١٧ - ٢٠١٨</option>
            </select>
        </div>

        <div class="selection-group" style="margin-bottom: 30px;">
            <label>خولێ هەڵبژێرە:</label>
            <select id="roundSelect">
                <option value="1">📝 خولا ئێکێ (١٠ پرسیار)</option>
                <option value="2">📝 خولا دووێ (١٠ پرسیار)</option>
            </select>
        </div>

        <button class="oval-btn" onclick="buildQuiz()">دەستپێکرنا تاقیکرنێ</button>
        <center><a href="index.html" class="back-btn">زڤڕین بۆ لاپەرێ سەرەکی</a></center>
    </div>

    <!-- بەشێ ئەنجامان -->
    <div id="result-section" class="result-box">
        <div class="main-title" style="color: #d4af37;">ئەنجامێ تاقیکرنێ</div>
        <div class="score-text" id="scoreDisplay">0 / 100</div>
        <p id="feedbackText" style="color: #e0e0e0; margin-bottom: 20px; font-size: 16px;"></p>
        <button class="oval-btn" onclick="resetQuiz()">دووبارە ئەزموونکرن / گۆڕینی ساڵێ</button>
        <p style="font-size: 13px; color: #2ecc71; margin-top: 18px;">👇 ل خوارێ سەیری پرسیاران بکە دا کو بزانی کیژ وەڵام دروست بوون!</p>
    </div>

    <!-- ناڤەڕۆکا پرسیاران -->
    <div id="quiz-area" class="quiz-section">
        <div class="main-title" id="quiz-title">پرسیار</div>
        <div class="sub-title" id="quiz-subtitle">١٠ پرسیار - نمرە ژ ١٠٠</div>
        <form id="quiz-form">
            <div id="questions-place"></div>
            <button type="button" id="submit-btn" class="oval-btn" onclick="gradeQuiz()">دوماهیکپێهینان و دیتنا ئەنجامی</button>
        </form>
    </div>

</div>

<script>

    let currentQuizKey = "";

    //ئاڤاکرنا لیستا پرسیاران ل دویف ساڵ و خولێ
    function buildQuiz() {
        let year = document.getElementById('yearSelect').value;
        let round = document.getElementById('roundSelect').value;
        currentQuizKey = `${year}_${round}`;

        let quizData = quizDatabase[currentQuizKey];
        if (!quizData) {
            alert("ئەڤ ئەزموونە هێشتا بەرهەڤ نەبوویە!");
            return;
        }

        document.getElementById('quiz-title').innerText = quizData.title;
        let place = document.getElementById('questions-place');
        place.innerHTML = ""; 

        quizData.questions.forEach((q, index) => {
            let qNum = index + 1;
            let cardHtml = `
                <div class="question-card" id="q${qNum}-card">
                    <div class="question-text">${qNum}. ${q.q}</div>
                    <div class="options-container">
                        <label class="option-label" id="q${qNum}-A-lbl"><input type="radio" name="q${qNum}" value="A"> A) ${q.a}</label>
                        <label class="option-label" id="q${qNum}-B-lbl"><input type="radio" name="q${qNum}" value="B"> B) ${q.b}</label>
                        <label class="option-label" id="q${qNum}-C-lbl"><input type="radio" name="q${qNum}" value="C"> C) ${q.c}</label>
                        <label class="option-label" id="q${qNum}-D-lbl"><input type="radio" name="q${qNum}" value="D"> D) ${q.d}</label>
                    </div>
                    <div class="answer-feedback" id="q${qNum}-feedback"></div>
                </div>
            `;
            place.insertAdjacentHTML('beforeend', cardHtml);
        });

        document.getElementById('setup-menu').style.display = 'none';
        document.getElementById('result-section').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('submit-btn').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // پشکێن کۆنتڕۆڵ و ئەنجامدانا نمرێ ژ ١٠٠
    function gradeQuiz() {
        let quizData = quizDatabase[currentQuizKey];
        let score = 0;
        let pointsPerQuestion = 10; // هەر پرسیارەک ١٠ نمرەیە بۆ کۆمکرنا ١٠٠ نمرەیان

        for (let i = 1; i <= 10; i++) {
            let selected = document.querySelector(`input[name="q${i}"]:checked`);
            let correctAnswer = quizData.answers[i - 1];
            let feedbackDiv = document.getElementById(`q${i}-feedback`);

            let correctText = "";
            if (correctAnswer === "A") correctText = quizData.questions[i-1].a;
            else if (correctAnswer === "B") correctText = quizData.questions[i-1].b;
            else if (correctAnswer === "C") correctText = quizData.questions[i-1].c;
            else if (correctAnswer === "D") correctText = quizData.questions[i-1].d;

            feedbackDiv.style.display = "block";

            if (selected) {
                if (selected.value === correctAnswer) {
                    score += pointsPerQuestion;
                    feedbackDiv.className = "answer-feedback feedback-correct";
                    feedbackDiv.innerHTML = `✅ وەڵامێ تە دروستە! (وەڵامێ ڕاست: ${correctAnswer} - ${correctText})`;
                } else {
                    feedbackDiv.className = "answer-feedback feedback-wrong";
                    feedbackDiv.innerHTML = `❌ وەڵامێ تە شفت بوو! (وەڵامێ ڕاست: ${correctAnswer} - ${correctText})`;
                }
            } else {
                feedbackDiv.className = "answer-feedback feedback-wrong";
                feedbackDiv.innerHTML = `⚠️ تە چ وەڵام دەستنیشان نەکردینە! (وەڵامێ ڕاست: ${correctAnswer} - ${correctText})`;
            }
            
            let inputs = document.querySelectorAll(`input[name="q${i}"]`);
            inputs.forEach(inp => inp.disabled = true);
        }

        document.getElementById('result-section').style.display = 'block';
        document.getElementById('scoreDisplay').innerText = score + " / 100";
        document.getElementById('submit-btn').style.display = 'none'; 

        if (score >= 50) {
            document.getElementById('feedbackText').innerText = "🎉 پیرۆزە! تە ئەزموون ب سەرکەفتوویی دەرباز کر و نمرەکا باش بدەستڤە ئینا.";
        } else {
            document.getElementById('feedbackText').innerText = "📚 نمرە یا کێمە (دەرنەچووی)، دڤێت پاتەر ل سەر بابەتان بکەی و دووبارە تاقیکەیەوە.";
        }
        
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // پاککرن و زڤڕین بۆ مێنیویا سەرەکی
    function resetQuiz() {
        document.getElementById('quiz-form').reset();
        document.getElementById('result-section').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('setup-menu').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }
