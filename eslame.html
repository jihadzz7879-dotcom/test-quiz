<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستمێ تاقیکرنێن ویزاری - پەروەردا ئیسلامی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 680px;
            background-color: #111111;
            border: 1px solid #1c1c1c;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2, h3 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
        }

        .setup-section, .quiz-section, .result-section {
            display: none;
        }

        .active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            background-color: #161616;
            border: 1px solid #d4af37;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #161a23;
            border: 1px solid #252c3a;
            color: white;
            padding: 14px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin-top: 20px;
        }

        .btn:hover {
            border-color: #d4af37;
            background-color: #1f2635;
            transform: scale(1.02);
        }

        .question-block {
            background-color: #161616;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .option-item {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            border-color: #d4af37;
            background-color: #252525;
        }

        .option-item input {
            margin-left: 10px;
            accent-color: #d4af37;
        }

        .correct-ans {
            border-color: #2ecc71 !important;
            background-color: rgba(46, 204, 113, 0.1) !important;
        }

        .wrong-ans {
            border-color: #e74c3c !important;
            background-color: rgba(231, 76, 60, 0.1) !important;
        }

        .badge-correct {
            color: #2ecc71;
            font-weight: bold;
            margin-right: auto;
        }

        .badge-wrong {
            color: #e74c3c;
            font-weight: bold;
            margin-right: auto;
        }

        .score-display {
            font-size: 22px;
            text-align: center;
            margin-bottom: 25px;
            color: #ffffff;
        }
        
        .score-display span {
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>

<div class="quiz-container">
    <div class="setup-section active" id="setup-screen">
        <h2>ئەزموونێن ویزاری یێن بابەتێ ئیسلامی</h2>
        <div class="form-group">
            <label for="year-select">سالا خواندنێ هەلبژێرە:</label>

                <option value="2014-2015">٢٠١٤-٢٠١٥</option>

                <option value="2020-2021">٢٠٢٠-٢٠٢١</option>
            </select>
        </div>
        <div class="form-group">
            <label for="round-select">خولێ هەلبژێرە:</label>
            <select id="round-select">
                <option value="1">خولا ئێکێ</option>
                <option value="2">خولا دووێ</option>
            </select>
        </div>
        <button class="btn" onclick="startQuiz()">دەستپێکرنا تاقیکرنێ</button>
    </div>

    <div class="quiz-section" id="quiz-screen">
        <h3 id="quiz-title">پرسیار</h3>
        <div id="questions-container"></div>
        <button class="btn" onclick="submitQuiz()">دوماهیپێهینان و دیتنا ئەنجامی</button>
    </div>

    <div class="result-section" id="result-screen">
        <h2>ئەنجامێ تاقیکرنێ</h2>
        <div class="score-display" id="score-text"></div>
        <div id="results-container"></div>
        <button class="btn" onclick="resetQuiz()">دووبارە تاقیکردنەوە</button>
    </div>
</div>

    let currentQuestions = [];
    let userAnswers = {};

    function startQuiz() {
        const year = document.getElementById("year-select").value;
        const round = document.getElementById("round-select").value;
        const key = `${year}_${round}`;

        if (!quizData[key] || quizData[key].length === 0) {
            alert("ببورە! بۆ ڤێ ساڵێ یان خولێ داتایەک نینە. تکایە ساڵەکا دی تاقیکە.");
            return;
        }

        currentQuestions = quizData[key];
        userAnswers = {};

        document.getElementById("quiz-title").innerText = `تاقیکرنا ساڵا ${year} - خولا ${round === '1' ? 'ئێکێ' : 'دووێ'}`;
        
        const container = document.getElementById("questions-container");
        container.innerHTML = "";

        currentQuestions.forEach((item, index) => {
            let optionsHtml = "";
            for (const [key, value] of Object.entries(item.options)) {
                optionsHtml += `
                    <label class="option-item">
                        <input type="radio" name="q-${index}" value="${key}" onclick="saveAnswer(${index}, '${key}')">
                        ${key} ) ${value}
                    </label>
                `;
            }

            container.innerHTML += `
                <div class="question-block">
                    <div class="question-text">${item.q}</div>
                    <div class="options-list">${optionsHtml}</div>
                </div>
            `;
        });

        switchScreen("quiz-screen");
    }

    function saveAnswer(qIndex, selectedOption) {
        userAnswers[qIndex] = selectedOption;
    }

    function submitQuiz() {
        let score = 0;
        const container = document.getElementById("results-container");
        container.innerHTML = "";

        currentQuestions.forEach((item, index) => {
            const userAns = userAnswers[index] || "وەڵام نەداوە";
            const isCorrect = userAns === item.correct;
            
            if (isCorrect) score++;

            let optionsHtml = "";
            for (const [key, value] of Object.entries(item.options)) {
                let statusClass = "";
                let badge = "";

                if (key === item.correct) {
                    statusClass = "correct-ans";
                    if (userAns === key) badge = '<span class="badge-correct">✓ وەڵامێ تە ڕاستە</span>';
                    else badge = '<span class="badge-correct">✓ وەڵامێ ڕاست</span>';
                } else if (userAns === key && !isCorrect) {
                    statusClass = "wrong-ans";
                    badge = '<span class="badge-wrong">✗ وەڵامێ تە خەلەتە</span>';
                }

                optionsHtml += `
                    <div class="option-item ${statusClass}">
                        <span>${key} ) ${value}</span>
                        ${badge}
                    </div>
                `;
            }

            container.innerHTML += `
                <div class="question-block">
                    <div class="question-text">${item.q}</div>
                    <div class="options-list">${optionsHtml}</div>
                </div>
            `;
        });

        document.getElementById("score-text").innerHTML = `نمرەیا تە: <span>${score}</span> ژ <span>${currentQuestions.length}</span>`;
        switchScreen("result-screen");
    }

    function resetQuiz() {
        switchScreen("setup-screen");
    }

    function switchScreen(screenId) {
        document.getElementById("setup-screen").classList.remove("active");
        document.getElementById("quiz-screen").classList.remove("active");
        document.getElementById("result-screen").classList.remove("active");
        
        document.getElementById(screenId).classList.add("active");
        window.scrollTo(0, 0);
    }
