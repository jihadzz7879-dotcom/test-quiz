<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونێن ویزاری یێن پەروەردەیا ئیسلامی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            width: 100%;
            max-width: 600px;
            background-color: #111111;
            border: 1px solid #1c1c1c;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .main-title {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub-title {
            font-size: 14px;
            color: #b3b3b3;
            text-align: center;
            margin-bottom: 25px;
        }
        .selection-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: -5px;
            display: block;
        }
        select {
            width: 100%;
            background-color: #161a23;
            border: 1px solid #252c3a;
            color: white;
            padding: 14px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-align: center;
            appearance: none;
            transition: border-color 0.3s;
        }
        select:focus { border-color: #2ecc71; }
        .start-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }
        .quiz-section { display: none; }
        .question-card {
            background-color: #161616;
            border: 1px solid #1c1c1c;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 15px;
            color: #f0f0f0;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-label {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            border: 1px solid #2c2c2c;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .option-label:hover {
            border-color: #2ecc71;
            background-color: #1a241e;
        }
        .option-label input {
            margin-left: 12px;
            accent-color: #2ecc71;
        }
        .result-box {
            display: none;
            background-color: #161616;
            border: 1px solid #252c3a;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
        }
        .score-text {
            font-size: 42px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

</head>
<body>

<div class="quiz-container">

        <div class="selection-group">
            <label>ساڵا ئەزموونێ هەڵبژێرە:</label>

                <option value="2021">ساڵا ٢٠٢١ - ٢٠٢٢</option>
            </select>
        </div>

        <div class="selection-group" style="margin-bottom: 25px;">
            <label>خولێ هەڵبژێرە:</label>
            <select id="roundSelect">
                <option value="1">📝 خولا ئێکێ (١٠ پرسیار)</option>
                <option value="2">📝 خولا دووێ (١٠ پرسیار)</option>

        </div>

        <button class="start-btn" onclick="buildQuiz()">دەستپێکرنا تاقیکرنێ</button>
        <center><a href="index.html" class="back-btn">زڤڕین بۆ لاپەرێ سەرەکی</a></center>
    </div>

    <!-- شوونا دروستکرنا پرسیاران -->
    <div id="quiz-area" class="quiz-section">
        <div class="main-title" id="quiz-title">پرسیار</div>
        <div class="sub-title" id="quiz-subtitle">١٠ پرسیار - نمرە ژ ٢٠</div>
        <form id="quiz-form">
            <div id="questions-place"></div>
            <button type="button" class="start-btn" onclick="gradeQuiz()">دوماهیکپێهینان و دیتنا ئەنجامی</button>
        </form>
    </div>

    <!-- لاپەرێ ئەنجامی -->
    <div id="result-section" class="result-box">
        <div class="main-title" style="color: #d4af37;">ئەنجامێ تاقیکرنێ</div>
        <div class="score-text" id="scoreDisplay">0 / 20</div>
        <p id="feedbackText" style="color: #e0e0e0; margin-bottom: 20px;"></p>
        <button class="start-btn" onclick="resetQuiz()">دووبارە ئەزموونکرن</button>
        <br>
        <div class="back-btn" onclick="resetQuiz()">گۆڕینا ساڵ یان خولێ</div>
    </div>

</div>

    let currentQuizKey = "";

    function buildQuiz() {
        let year = document.getElementById('yearSelect').value;
        let round = document.getElementById('roundSelect').value;
        currentQuizKey = `${year}_${round}`;

        let quizData = quizDatabase[currentQuizKey];
        if (!quizData) {
            alert("ئەڤ ئەزموونە هێشتا بەرهەڤ نەبوویە!");
            return;
        }

        document.getElementById('quiz-title').innerText = quizData.title;
        let place = document.getElementById('questions-place');
        place.innerHTML = ""; 

        quizData.questions.forEach((q, index) => {
            let qNum = index + 1;
            let cardHtml = `
                <div class="question-card" id="q${qNum}-card">
                    <div class="question-text">${qNum}. ${q.q}</div>
                    <div class="options-container">
                        <label class="option-label"><input type="radio" name="q${qNum}" value="A"> A) ${q.a}</label>
                        <label class="option-label"><input type="radio" name="q${qNum}" value="B"> B) ${q.b}</label>
                        <label class="option-label"><input type="radio" name="q${qNum}" value="C"> C) ${q.c}</label>
                        <label class="option-label"><input type="radio" name="q${qNum}" value="D"> D) ${q.d}</label>
                    </div>
                </div>
            `;
            place.insertAdjacentHTML('beforeend', cardHtml);
        });

        document.getElementById('setup-menu').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function gradeQuiz() {
        let quizData = quizDatabase[currentQuizKey];
        let score = 0;
        let pointsPerQuestion = 2; // ١٠ پرسیار * ٢ نمرە = ٢٠ نمرە شۆف

        for (let i = 1; i <= 10; i++) {
            let selected = document.querySelector(`input[name="q${i}"]:checked`);
            let card = document.getElementById(`q${i}-card`);
            let correctAnswer = quizData.answers[i - 1];

            if (card) {
                card.classList.remove('correct-choice', 'wrong-choice');
                if (selected) {
                    if (selected.value === correctAnswer) {
                        score += pointsPerQuestion;
                        card.classList.add('correct-choice');
                    } else {
                        card.classList.add('wrong-choice');
                    }
                } else {
                    card.classList.add('wrong-choice'); 
                }
            }
        }

        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('scoreDisplay').innerText = score + " / 20";

        if (score >= 10) {
            document.getElementById('feedbackText').innerText = "🎉 نمرەکا نایابە! تە ئەزموون ب سەرکەفتوویی دەرباز کر.";
        } else {
            document.getElementById('feedbackText').innerText = "📚 نمرە یا کێمە، پاتەر و زێدەتر بخوینی و دووبارە تاقیکەوه.";
        }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function resetQuiz() {
        document.getElementById('quiz-form').reset();
        document.getElementById('result-section').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('setup-menu').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
