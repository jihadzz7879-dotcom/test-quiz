<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Essentials - 12 Slides Exam Prep</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #0ea5e9;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 18px;
      line-height: 1.7;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header */
    .topbar {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      padding: 16px 22px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.25rem;
      color: var(--primary-dark);
    }

    .brand p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .controls-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .badge-score {
      background: #eff6ff;
      color: var(--primary-dark);
      border: 1px solid #bfdbfe;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: #fff;
      color: var(--primary-dark);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background: #eff6ff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-success:hover {
      background: #15803d;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Slide Nav Pills */
    .slide-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .pill {
      background: rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 13px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .pill:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .pill.active {
      background: var(--accent);
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.45);
    }

    /* Main Slide Card */
    .slide-card {
      background: var(--surface);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .slide-header {
      background: linear-gradient(120deg, #1d4ed8 0%, #0284c7 100%);
      color: #fff;
      padding: 24px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .slide-num {
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 6px;
    }

    .slide-title-en {
      font-size: 1.55rem;
      font-weight: 800;
      direction: ltr;
      text-align: right;
    }

    .slide-title-ku {
      font-size: 1.15rem;
      color: #e0f2fe;
      margin-top: 4px;
    }

    .slide-body {
      padding: 26px 28px;
    }

    /* Summary Box */
    .summary-section {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-right: 6px solid var(--primary);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 26px;
    }

    .section-heading {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .points-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .point-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
    }

    .point-en {
      direction: ltr;
      text-align: left;
      font-weight: 700;
      color: #1e293b;
      font-size: 0.96rem;
      margin-bottom: 5px;
      background: #f1f5f9;
      padding: 5px 9px;
      border-radius: 7px;
      display: inline-block;
    }

    .point-ku {
      font-size: 0.94rem;
      color: #334155;
      margin-top: 4px;
    }

    .practical-box {
      margin-top: 14px;
      background: var(--warning-bg);
      border: 1px solid #fcd34d;
      border-radius: 12px;
      padding: 14px 16px;
    }

    .practical-box strong {
      color: #92400e;
    }

    .kbd {
      display: inline-block;
      direction: ltr;
      background: #1e293b;
      color: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      margin: 0 2px;
    }

    /* Questions Section */
    .questions-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .question-card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .q-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .q-badge {
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      padding: 3px 11px;
      border-radius: 8px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .q-en {
      direction: ltr;
      text-align: left;
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      width: 100%;
    }

    .q-ku {
      font-size: 0.95rem;
      color: #475569;
      background: #f8fafc;
      padding: 7px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-right: 3px solid var(--accent);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .option-btn {
      direction: ltr;
      text-align: left;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 0.94rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #14532d;
      font-weight: 700;
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #7f1d1d;
    }

    .q-explain {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #86efac;
      color: #14532d;
      font-size: 0.92rem;
      display: none;
    }

    .q-explain.show {
      display: block;
    }

    /* Footer Nav */
    .slide-footer {
      background: #f1f5f9;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .slide-header, .slide-body, .slide-footer { padding: 16px; }
      .slide-title-en { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <h1>ئامادەکاری بۆ ئەزموونا Computer Essentials (١٢ سلاید)</h1>
      <p>هەمی بابەتێن عەمەلی و نەزەری ب ئینگلیزی + وەرگێرانا بادینی بۆ ١٠٠/١٠٠</p>
    </div>
    <div class="controls-top">
      <span class="badge-score" id="scoreDisplay">نمرە: 0 / 60</span>
      <button class="btn btn-success" id="toggleAllBtn" onclick="toggleShowAll()">نیشاندانا هەمی بەرسڤان</button>
    </div>
  </div>

  <!-- Slide Selector Pills -->
  <div class="slide-pills" id="slidePills"></div>

  <!-- Main Slide Card -->
  <div class="slide-card">
    <div class="slide-header">
      <div>
        <span class="slide-num" id="slideNumLabel">سلاید ١ ژ ١٢</span>
        <div class="slide-title-en" id="slideTitleEn"></div>
        <div class="slide-title-ku" id="slideTitleKu"></div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline" style="background:#fff;" id="prevBtnTop" onclick="changeSlide(-1)">⬅ سلایدێ پێشتر</button>
        <button class="btn btn-outline" style="background:#fff;" id="nextBtnTop" onclick="changeSlide(1)">سلایدێ دویڤدا ➡</button>
      </div>
    </div>

    <div class="slide-body">
      <!-- Summary -->
      <div class="summary-section">
        <div class="section-heading">📘 پووختەیا بابەتی و هەنگاڤێن عەمەلی (بۆ ئەزموونێ ژبەر بکە)</div>
        <div class="points-grid" id="summaryGrid"></div>
        <div class="practical-box" id="practicalTip"></div>
      </div>

      <!-- Questions -->
      <div class="questions-header">
        <div class="section-heading" style="margin-bottom:0;">📝 ٥ پسیارێن گرنگ یێن ڤی سلایدی</div>
        <span style="font-size:0.88rem; color:var(--muted);">کلیکێ ل سەر بەرسڤا دروست بکە بۆ تاقیکرنا خۆ</span>
      </div>
      <div id="questionsContainer"></div>
    </div>

    <div class="slide-footer">
      <button class="btn btn-primary" id="prevBtnBottom" onclick="changeSlide(-1)">⬅ سلایدێ پێشتر</button>
      <span id="footerCounter" style="font-weight:700; color:#334155;"></span>
      <button class="btn btn-primary" id="nextBtnBottom" onclick="changeSlide(1)">سلایدێ دویڤدا ➡</button>
    </div>
  </div>
</div>

<script>
const slides = [
  // SLIDE 1
  {
    titleEn: "1. Computer Essentials & Hardware Basics",
    titleKu: "کەلوپەلێن سەرەکی یێن کۆمپیوتەری (Hardware & Software)",
    points: [
      { en: "Hardware (HW)", ku: "پارچێن فیزیکی یێن کۆمپیوتەری کو ب دەست دهێنە گرتن (وەک کیبۆرد، ماوس، شاشە، CPU)." },
      { en: "Software (SW)", ku: "بەرنامە و سیستەمێن ناڤ کۆمپیوتەری کو ب دەست ناهێنە گرتن (وەک Windows، MS Word)." },
      { en: "CPU (Central Processing Unit)", ku: "مێشکێ کۆمپیوتەرییە (Brain of Computer)، هەمی کار و حساباتان جێبەجێ دکەت." },
      { en: "RAM (Random Access Memory)", ku: "بیرگەها کاتی (Temporary)؛ دەمێ کارەب ژ کۆمپیوتەری بچیت زانیاریێن ناڤدا ژناڤدچن." },
      { en: "ROM (Read Only Memory)", ku: "بیرگەها هەمیشەیی (Permanent)؛ زانیاریێن هەلکرنا کۆمپیوتەری تێدا پاراستینە." },
      { en: "Motherboard", ku: "تەختێ سەرەکییە کو هەمی پارچێن ناڤ کۆمپیوتەری (CPU, RAM) پێکڤە گرێددەت." }
    ],
    practical: "💡 <strong>تێبینییا ئەزموونێ:</strong> د ئەزموونێ دا ئەگەر گۆت <strong>Physical parts</strong> یان <strong>Can be touched</strong> مەبەست پێ <strong>Hardware</strong>ـە. ئەگەر گۆت <strong>Programs</strong> مەبەست پێ <strong>Software</strong>ـە.",
    questions: [
      {
        qEn: "Which part is known as the 'Brain of the Computer'?",
        qKu: "کیژ پارچە ب 'مێشکێ کۆمپیوتەری' دهێتە ناسین؟",
        options: ["A) RAM", "B) CPU", "C) Monitor", "D) Keyboard"],
        correct: 1,
        explain: "CPU (Central Processing Unit) مێشکێ کۆمپیوتەرییە چونکی هەمی فرمان و حساباتان جێبەجێ دکەت."
      },
      {
        qEn: "The physical components of a computer that you can touch are called:",
        qKu: "پارچێن فیزیکی یێن کۆمپیوتەری کو تو دشێی دەستی بکەیێ چ دبێژنێ؟",
        options: ["A) Software", "B) Hardware", "C) Operating System", "D) Files"],
        correct: 1,
        explain: "Hardware ئانکو پارچێن ڕەق و فیزیکی یێن کۆمپیوتەری وەک ماوس و کیبۆرد و شاشە."
      },
      {
        qEn: "Which memory is temporary and loses its data when the power is turned off?",
        qKu: "کیژ بیرگەهـ کاتییە و دەمێ کۆمپیوتەر دهێتە گرتن زانیاریێن تێدا دچن؟",
        options: ["A) ROM", "B) Hard Disk", "C) RAM", "D) USB Flash"],
        correct: 2,
        explain: "RAM بیرگەهەکا کاتییە (Temporary/Volatile) و ب تنێ دەمێ کۆمپیوتەر هەلکری زانیاریان هەلدگریت."
      },
      {
        qEn: "Microsoft Word and Windows 10 are examples of:",
        qKu: "بەرنامێ Word و سیستەمێ Windows 10 نموونەنە ل سەر چ؟",
        options: ["A) Hardware", "B) Input Devices", "C) Software", "D) Storage Devices"],
        correct: 2,
        explain: "بەرنامە و سیستەمێن کارپێکرنێ دچنە ناڤ خانەیا Software دا."
      },
      {
        qEn: "What connects the CPU, RAM, and all internal parts together?",
        qKu: "چ تشت CPU و RAM و هەمی پارچێن ناڤخۆیی پێکڤە گرێددەت؟",
        options: ["A) Motherboard", "B) Printer", "C) Scanner", "D) Speaker"],
        correct: 0,
        explain: "Motherboard تەختێ سەرەکییە کو هەمی پارچێن کۆمپیوتەری ل سەر دهێنە گرێدان."
      }
    ]
  },

  // SLIDE 2
  {
    titleEn: "2. Input, Output & Storage Devices",
    titleKu: "ئامێرێن تێخستنێ (Input)، دەرخستنێ (Output) و هەلگرتنێ (Storage)",
    points: [
      { en: "Input Devices", ku: "ئامێرێن تێخستنێ: زانیاریان دکەنە د ناڤ کۆمپیوتەری دا. نموونە: Keyboard، Mouse، Microphone، Scanner، Webcam." },
      { en: "Output Devices", ku: "ئامێرێن دەرخستنێ: زانیاریان ژ کۆمپیوتەری دەرێخنە دەرڤە. نموونە: Monitor (شاشە)، Printer (چاپکەر)، Speakers (بلندگۆ)، Projector." },
      { en: "Storage Devices", ku: "ئامێرێن هەلگرتنێ: فایل و زانیاریان ب هەمیشەیی هەلدگرن. نموونە: Hard Disk (HDD)، SSD، USB Flash Drive." },
      { en: "Touchscreen", ku: "شاشا دەستی (Touchscreen) هەم Inputـە و هەم Outputـە!" },
      { en: "SSD vs HDD", ku: "SSD گەلەک ژ Hard Disk (HDD) بلەزترە (Faster)." },
      { en: "Scanner vs Printer", ku: "Scanner کاغەزێ دکەتە د ناڤ کۆمپیوتەری دا (Input)؛ بەلێ Printer فایلێ دەرێخیتە سەر کاغەزێ (Output)." }
    ],
    practical: "💡 <strong>تێبینییا ئەزموونێ:</strong> جوداهییا گرنگ: <strong>Scanner = Input</strong> (وێنەی دبەتە ناڤ کۆمپیوتەری) | <strong>Printer = Output</strong> (نڤیسینێ دەرێخیتە سەر کاغەزێ).",
    questions: [
      {
        qEn: "Which of the following is an Input device?",
        qKu: "کیژ ژ ڤان ئامێرێ تێخستنێ (Input) یە؟",
        options: ["A) Printer", "B) Monitor", "C) Keyboard", "D) Speaker"],
        correct: 2,
        explain: "Keyboard زانیاریان دکەتە د ناڤ کۆمپیوتەری دا، لەوما Input Deviceـە."
      },
      {
        qEn: "Which device converts digital documents into paper copies (Output)?",
        qKu: "کیژ ئامێر بەلگەنامێن ناڤ کۆمپیوتەری چاپ دکەتە سەر کاغەزێ (Output)؟",
        options: ["A) Scanner", "B) Mouse", "C) Printer", "D) Microphone"],
        correct: 2,
        explain: "Printer ئامێرێ دەرخستنێیە (Output) کو فایلان چاپ دکەتە سەر کاغەزێ."
      },
      {
        qEn: "Which device is used to input sound/voice into the computer?",
        qKu: "کیژ ئامێر بۆ تێخستنا دەنگی بۆ ناڤ کۆمپیوتەری دهێتە بکارئینان؟",
        options: ["A) Speaker", "B) Microphone", "C) Monitor", "D) Projector"],
        correct: 1,
        explain: "Microphone دەنگی دبەتە ناڤ کۆمپیوتەری (Input)، بەلێ Speaker دەنگی دەرێخیت (Output)."
      },
      {
        qEn: "Which of the following is a Storage device?",
        qKu: "کیژ ژ ڤان ئامێرێ هەلگرتنا فایلانە (Storage)؟",
        options: ["A) Hard Disk (HDD)", "B) Mouse", "C) CPU", "D) Webcam"],
        correct: 0,
        explain: "Hard Disk (HDD)، SSD و USB Flash ئامێرێن هەلگرتنا فایلانن."
      },
      {
        qEn: "A device that works as BOTH Input and Output is:",
        qKu: "ئامێرەک کو د هەمان دەم دا هەم Inputـە و هەم Outputـە کیژە؟",
        options: ["A) Keyboard", "B) Touchscreen", "C) Printer", "D) Microphone"],
        correct: 1,
        explain: "Touchscreen (شاشا لەمسێ) هەم وێنەی نیشان ددەت (Output) و هەم ب دەست فەرمانێ وەردگریت (Input)."
      }
    ]
  },

  // SLIDE 3
  {
    titleEn: "3. Operating Computer, Power & Desktop",
    titleKu: "هەلکرن و گرتنا کۆمپیوتەری (تشغيل و إطفاء) و شاشا سەرەکی",
    points: [
      { en: "Start > Power > Shut down", ku: "بۆ گرتنا تەمام یا کۆمپیوتەری: کلیکێ ل Start بکە پاش Power پاش Shut down." },
      { en: "Start > Power > Restart", ku: "بۆ گرتن و دوبارە هەلکرنا کۆمپیوتەری ب ئۆتۆماتیکی." },
      { en: "Start > Power > Sleep", ku: "بۆ نڤاندنا کۆمپیوتەری ب کاتی (کارەبا کێم دچیت و بەرنامە ڤەکرینە)." },
      { en: "Desktop", ku: "شاشا سەرەکییا ویندۆزییە کو Icons و Taskbar تێدانە." },
      { en: "Taskbar", ku: "ئەو شریتێ ل بنێ شاشێیە کو Start button، دەمژمێر و بەرنامێن ڤەکری تێدانە." },

let currentSlide = 0;
let showAll = false;
// Store user answers: key = "slideIndex-qIndex", value = chosenOptionIndex
const userAnswers = {};

function renderPills() {
  const container = document.getElementById("slidePills");
  container.innerHTML = "";
  slides.forEach((s, idx) => {
    const btn = document.createElement("button");
    btn.className = "pill" + (idx === currentSlide ? " active" : "");
    btn.textContent = "سلاید " + (idx + 1);
    btn.onclick = () => {
      currentSlide = idx;
      renderSlide();
    };
    container.appendChild(btn);
  });
}

function updateScore() {
  let correctCount = 0;
  for (const key in userAnswers) {
    const [sIdx, qIdx] = key.split("-").map(Number);
    if (userAnswers[key] === slides[sIdx].questions[qIdx].correct) {
      correctCount++;
    }
  }
  document.getElementById("scoreDisplay").textContent = "نمرە: " + correctCount + " / 60";
}

function selectOption(sIdx, qIdx, optIdx) {
  const key = sIdx + "-" + qIdx;
  if (userAnswers[key] !== undefined) return; // Lock once answered
  userAnswers[key] = optIdx;
  updateScore();
  renderQuestions();
}

function renderQuestions() {
  const slide = slides[currentSlide];
  const qContainer = document.getElementById("questionsContainer");
  qContainer.innerHTML = "";

  slide.questions.forEach((q, qIdx) => {
    const key = currentSlide + "-" + qIdx;
    const chosen = userAnswers[key];
    const isAnswered = chosen !== undefined;

    const card = document.createElement("div");
    card.className = "question-card";

    const top = document.createElement("div");
    top.className = "q-top";
    top.innerHTML = `<span class="q-badge">پسیارا ${qIdx + 1}</span><div class="q-en">${q.qEn}</div>`;
    card.appendChild(top);

    const ku = document.createElement("div");
    ku.className = "q-ku";
    ku.textContent = "وەرگێران: " + q.qKu;
    card.appendChild(ku);

    const optGrid = document.createElement("div");
    optGrid.className = "options-grid";

    q.options.forEach((optText, optIdx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = optText;

      if (isAnswered || showAll) {
        if (optIdx === q.correct) {
          btn.classList.add("correct");
          btn.textContent = optText + "  ✔";
        } else if (isAnswered && optIdx === chosen) {
          btn.classList.add("wrong");
          btn.textContent = optText + "  ✖";
        }
      }

      if (isAnswered) {
        btn.disabled = true;
      } else {
        btn.onclick = () => selectOption(currentSlide, qIdx, optIdx);
      }

      optGrid.appendChild(btn);
    });

    card.appendChild(optGrid);

    const exp = document.createElement("div");
    exp.className = "q-explain" + (isAnswered || showAll ? " show" : "");
    exp.innerHTML = "<strong>✔ ڕۆهنکرن:</strong> " + q.explain;
    card.appendChild(exp);

    qContainer.appendChild(card);
  });
}

function renderSlide() {
  const slide = slides[currentSlide];

  document.getElementById("slideNumLabel").textContent = `سلاید ${currentSlide + 1} ژ ${slides.length}`;
  document.getElementById("footerCounter").textContent = `سلاید ${currentSlide + 1} / ${slides.length}`;
  document.getElementById("slideTitleEn").textContent = slide.titleEn;
  document.getElementById("slideTitleKu").textContent = slide.titleKu;

  // Render summary points
  const summaryGrid = document.getElementById("summaryGrid");
  summaryGrid.innerHTML = "";
  slide.points.forEach(pt => {
    const div = document.createElement("div");
    div.className = "point-item";
    div.innerHTML = `<div class="point-en">${pt.en}</div><div class="point-ku">${pt.ku}</div>`;
    summaryGrid.appendChild(div);
  });

  document.getElementById("practicalTip").innerHTML = slide.practical;

  // Buttons state
  const isFirst = currentSlide === 0;
  const isLast = currentSlide === slides.length - 1;
  document.getElementById("prevBtnTop").disabled = isFirst;
  document.getElementById("prevBtnBottom").disabled = isFirst;
  document.getElementById("nextBtnTop").disabled = isLast;
  document.getElementById("nextBtnBottom").disabled = isLast;

  renderPills();
  renderQuestions();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function changeSlide(step) {
  const next = currentSlide + step;
  if (next >= 0 && next < slides.length) {
    currentSlide = next;
    renderSlide();
  }
}

function toggleShowAll() {
  showAll = !showAll;
  const btn = document.getElementById("toggleAllBtn");
  btn.textContent = showAll ? "ڤەشارتنا بەرسڤان" : "نیشاندانا هەمی بەرسڤان";
  renderQuestions();
}

// Initial render
renderSlide();
</script>
