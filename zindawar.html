// دالەیا بارکرنا پسیاران د ناڤ پەیجێ HTML دا
function loadQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    
    quizQuestions.forEach((q, index) => {
        let optionsHtml = '';
        for (let key in q.options) {
            optionsHtml += `
                <li class="option-item">
                    <label id="label-${index}-${key}">
                        <input type="radio" name="question-${index}" value="${key}">
                        <strong>${key}:</strong> ${q.options[key]}
                    </label>
                </li>
            `;
        }

        container.innerHTML += `
            <div class="question-card" id="card-${index}">
                <div class="question-text">پسیارا ${q.id}: ${q.question}</div>
                <ul class="options-list">${optionsHtml}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            </div>
        `;
    });
}

// دالەیا حسابکرنا نمرێ ل سەر ١٠٠ و دیارکرنا خەلەت و دروستیێ
function calculateResult() {
    let correctCount = 0;
    const totalQuestions = quizQuestions.length;

    quizQuestions.forEach((q, index) => {
        const selectedOption = document.querySelector(`input[name="question-${index}"]:checked`);
        const feedbackDiv = document.getElementById(`feedback-${index}`);
        feedbackDiv.style.display = "block";

        // پاقژکرنا ڕەنگێن پێشتر ئەگەر هەبن
        for (let key in q.options) {
            document.getElementById(`label-${index}-${key}`).className = '';
        }

        if (selectedOption) {
            const userAns = selectedOption.value;
            if (userAns === q.correct) {
                correctCount++;
                document.getElementById(`label-${index}-${userAns}`).className = 'correct-answer';
                feedbackDiv.innerHTML = "<span style='color: #38a169;'>✓ بەرسڤا تە ڕاستە!</span>";
            } else {
                document.getElementById(`label-${index}-${userAns}`).className = 'wrong-answer';
                document.getElementById(`label-${index}-${q.correct}`).className = 'correct-answer';
                feedbackDiv.innerHTML = `<span style='color: #e53e3e;'>✗ بەرسڤا تە شاشە.</span> بەرسڤا دروست ئەڤەیە: (${q.correct})`;
            }
        } else {
            document.getElementById(`label-${index}-${q.correct}`).className = 'correct-answer';
            feedbackDiv.innerHTML = `<span style='color: #dd6b20;'>⚠️ تە بەرسڤ نەدایە.</span> بەرسڤا دروست: (${q.correct})`;
        }
    });

    // کۆمکرنا نمرێ ل سەر ۱۰۰
    const finalScore = Math.round((correctCount / totalQuestions) * 100);
    
    document.getElementById('scoreText').innerText = `${finalScore} / 100`;
    document.getElementById('resultSection').style.display = 'block';
    
    // برنا پەیجی ب شێوەیەکێ نەرم بۆ بەشا نیشاندانا نمرێ
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
}
