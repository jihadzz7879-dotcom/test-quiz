<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆتێ هۆشمەند یێ پۆلا 12</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 { font-size: 1.5rem; }
        .chat-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 5px; }

        /* Controls: Subject Selection */
        .controls {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            overflow-x: auto;
        }
        .subject-select, .mode-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            outline: none;
            background: white;
            cursor: pointer;
        }

        /* Chat Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .bot-message {
            background: #f3f4f6;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
        }
        .user-message {
            background: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-box {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            resize: none;
            height: 45px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-send { background: var(--primary-color); color: white; }
        .btn-send:hover { background: #4338ca; }
        
        .file-input-label {
            background: #e5e7eb;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>بۆتێ هۆشمەند یێ پۆلا 12 🎓</h1>
        <p>هەمی بابەتان شیکار دکەت (کیمیا، فیزیا، بیرکاری، کوردی، عەرەبی، ئینگلیزی، مێژوو، جوگرافی، ئابووری، زیندەوەر)</p>
    </div>

    <div class="controls">
        <select id="subject" class="subject-select">
            <option value="گشتی">هەلبژارتنا بابەتی...</option>
            <option value="بیرکاری">بیرکاری</option>
            <option value="فیزیا">فیزیا</option>
            <option value="کیمیا">کیمیا</option>
            <option value="زیندەوەر">زیندەوەر</option>
            <option value="کوردی">کوردی</option>
            <option value="عەرەبی">عەرەبی</option>
            <option value="ئینگلیزی">ئینگلیزی</option>
            <option value="مێژوو">مێژوو</option>
            <option value="جوگرافی">جوگرافی</option>
            <option value="ئابووری">ئابووری</option>
        </select>

        <select id="mode" class="mode-select">
            <option value="shikar">شیکارکرنا پرسیارێ</option>
            <option value="quiz">دروستکرنا تاقیکرنێ (Quiz)</option>
        </select>
    </div>

    <div class="chat-messages" id="chat-box">
        <div class="message bot-message">
            بخێر بێی پۆلا 12! ئەز بۆتێ تە یێ هۆشمەندم. بابەتەکێ هەلبژێرە، پرسیارا خۆ بنڤیسە یان وێنەکێ پرسیارێ ببارێزە (Upload)، یان داخوازا تاقیکرنەکێ بکە!
        </div>
    </div>

    <div class="chat-input-area">
        <label for="file-input" class="file-input-label" title="بارکرنا وێنەیێ پرسیارێ">
            📷
            <input type="file" id="file-input" accept="image/*">
        </label>
        <textarea id="user-input" class="input-box" placeholder="پرسیارا خۆ ل ڤێرێ بنڤیسە..."></textarea>
        <button class="btn btn-send" onclick="sendMessage()">ناردن</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const subjectSelect = document.getElementById('subject');
    const modeSelect = document.getElementById('mode');
    const fileInput = document.getElementById('file-input');

    function sendMessage() {
        const text = userInput.value.trim();
        const subject = subjectSelect.value;
        const mode = modeSelect.value;
        const hasFile = fileInput.files.length > 0;

        if (text === "" && !hasFile) return;

        // Display User Message
        let userMessageText = `[${subject}] `;
        if (text) userMessageText += text;
        if (hasFile) userMessageText += ` 🖼️ (وێنەیەک هاتە بارکرن: ${fileInput.files[0].name})`;

        appendMessage(userMessageText, 'user-message');
        userInput.value = "";
        
        // Clear file input
        fileInput.value = "";

        // Simulated AI Response (تێبینیا ل خوارێ بخوینە بۆ گرێدانێ ب ژیرییا دەستکرد)
        setTimeout(() => {
            let botResponse = "";
            if (mode === "quiz") {
                botResponse = `📝 ئەڤە تاقیکردنەکا کورتە بۆ بابەتی (${subject}):\n\nپرسیار 1: پێناسەیا ڤی بابەتی چییە؟\nأ) بەرسفا ئێکێ\nب) بەرسفا دووێ\n\n(بۆ گرێدانا راستی ب AI، پێتڤی ب API هەیە)`;
            } else {
                botResponse = `🤖 شیکارکرنا پرسیارا تە ل دۆر بابەتی (${subject}):\n\nئەڤە بەرسڤەکا ئەزموونییە. بۆ هندێ کو بۆت ب راستی وێنەی شی بکەت و بەرسڤا هەمی بابەتێن کیمیا، فیزیا و بیرکاری ب دروستی بدەت، دڤێت کۆدێ پاشبنما (Backend) ب ئەپیەکێ وەک Gemini API یان OpenAI API ڤە بهێتە گرێدان.`;
            }
            appendMessage(botResponse, 'bot-message');
        }, 1000);
    }

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', className);
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
