<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0b081e; color: white; text-align: center; padding: 20px; }
        header h1 { font-size: 2rem; color: #00f2fe; margin-bottom: 20px; }
        
        /* شاشەی لێدەری ڤیدیۆ */
        #player {
            width: 100%;
            max-width: 800px;
            height: 450px;
            background: #000;
            margin: 0 auto 20px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        @media(max-width:600px){ #player { height: 240px; } }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn {
            background: #16113a;
            color: #fff;
            border: 1px solid #3d2b85;
            padding: 15px 10px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover, .btn.active {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <h1>GLOBAL LIVE TV HD</h1>
    </header>

    <div id="player"></div>

    <div class="grid">
        <button class="btn active" onclick="changeLive('https://trtcanlitv.medya.trt.com.tr/master.m3u8', this)">TRT 1 HD</button>
        <button class="btn" onclick="changeLive('https://live.ch9.qa/hls/ch9.m3u8', this)">Qatar TV</button>
        <button class="btn" onclick="changeLive('https://aljazeera-ara-apple-live.akamaized.net/apple/live/ara/master.m3u8', this)">Al Jazeera</button>
        <button class="btn" onclick="changeLive('https://skynewsarabia-live.akamaized.net/hls/live/2002513/skynewsarabia/master.m3u8', this)">Sky News</button>
    </div>

    <script>
        // دروستکردنی لێدەری ڤیدیۆی جیهانی
        var player = new Clappr.Player({
            source: "https://trtcanlitv.medya.trt.com.tr/master.m3u8",
            parentId: "#player",
            width: "100%",
            height: "100%",
            autoPlay: true
        });

        function changeLive(url, element) {
            // گۆڕینی بەستەری لایڤەکە بەبێ کێشە
            player.load(url);
            player.play();

            // گۆڕینی ڕەنگی دوگمەکە
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
