<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکشاندنا لینکێ سه‌لامه‌ت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* پاشبنەما ڕەنگاوڕەنگ بۆ شووشەیی دەرکەوتن */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }
        body::before {
            background: rgba(34, 197, 94, 0.4);
            top: 20%;
            left: 25%;
        }
        body::after {
            background: rgba(239, 68, 68, 0.4);
            bottom: 20%;
            right: 25%;
        }

        .container {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
            border: 1px solid transparent;
        }

        /* ستایلێ لۆدینگێ */
        .loading {
            display: none;
            margin: 1.5rem auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }

        /* ستایلێ لایێ باش (سه‌لامه‌ت) */
        .status-safe {
            display: block;
            background: rgba(22, 101, 52, 0.2);
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.4);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
        }

        /* ستایلێ لایێ خه‌ته‌ر */
        .status-danger {
            display: block;
            background: rgba(153, 27, 27, 0.2);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.15);
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: left;
            direction: ltr;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>پشکنینا مه‌ترسیا لینکی</h2>
        
        <div class="input-group">
            <input type="text" id="linkInput" placeholder="https://example.com" autocomplete="off">
        </div>

        <button onclick="checkLink()">فەحس بکە</button>

        <div class="loading" id="loader"></div>
        <div class="status-box" id="resultBox"></div>
    </div>

    <script>
        function checkLink() {
            const urlInput = document.getElementById('linkInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');

            // پاقژکرنا ئه‌نجامێ کۆن
            resultBox.className = 'status-box';
            resultBox.style.display = 'none';

            if (!urlInput) {
                alert('تکاtransform لێبکە لینکەکێ بنویسە!');
                return;
            }

            // نیشاندانا لۆدینگێ بۆ جوانیێ
            loader.style.display = 'block';

            setTimeout(() => {
                loader.style.display = 'none';

                // ئەڤە تێستەکا سادەیە بۆ نموونە (تو دشێی ل دەمێ پاشەڕۆژێ بگەهینیە API)
                // ل لێرە ئەگەر دەستەواژێن گۆماناوی تێدابن دێ بێژیت خەتەرە
                const dangerousKeywords = ['hack', 'phishing', 'virus', 'free-robux', 'login-security'];
                let isDangerous = false;

                dangerousKeywords.forEach(keyword => {
                    if (urlInput.toLowerCase().includes(keyword)) {
                        isDangerous = true;
                    }
                });

                if (isDangerous) {
                    resultBox.innerText = '⚠️ ئەڤ لینکە یێ خەتەرە و یێ باوەرپێکری نینە!';
                    resultBox.classList.add('status-danger');
                } else {
                    resultBox.innerText = '✅ ئەڤ لینکە یێ باشە و چ مه‌ترسی ل سه‌ر نینن.';
                    resultBox.classList.add('status-safe');
                }
            }, 1200); // پۆزەکا کورت بۆ لۆدینگێ
        }
    </script>

</body>
</html>
