<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کۆڕبەندا قوتابیان یا شاهانە</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0d0e15 0%, #050508 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- لایەرێ ناڤ تۆمارکرنێ (Login Screen) --- */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 45px 35px;
            border-radius: 28px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 50px rgba(0, 242, 254, 0.05);
        }

        .login-card .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
        }

        .login-card h2 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.88rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .login-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            margin-bottom: 22px;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 16px;
            color: #050508;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
        }

        /* --- لایەرێ سەرەکی یێ چاتێ (Main Chat) --- */
        .chat-container {
            width: 95%;
            max-width: 950px;
            height: 88vh;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            display: none; /* ل دەستپێکێ هاتیە بەرزەکرن */
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.4s ease;
        }

        /* سەرێ چاتێ (Header) */
        .chat-header {
            padding: 22px 30px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .group-info { display: flex; align-items: center; gap: 18px; }
        
        .group-avatar {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
        }

        .group-details h2 {
            font-size: 1.25rem; font-weight: 600;
            background: linear-gradient(to left, #fff, #ff007f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .group-details p { font-size: 0.82rem; color: #ff007f; opacity: 0.9; margin-top: 3px; }

        /* ناڤەڕۆکا چاتێ (Chat Body) */
        .chat-messages {
            flex: 1; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 22px;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }

        /* ستایلێ نامەیان */
        .message-wrapper { display: flex; gap: 14px; max-width: 75%; align-self: flex-start; }
        .message-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }

        .user-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000; display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 1rem; box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
        }

        .message-wrapper.me .user-avatar {
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            color: #fff; box-shadow: 0 0 12px rgba(255, 0, 127, 0.25);
        }

        .message-content { display: flex; flex-direction: column; gap: 6px; }
        .user-name { font-size: 0.82rem; color: rgba(255, 255, 255, 0.45); font-weight: 500; }
        
        .message-text {
            padding: 15px 20px; border-radius: 20px; font-size: 0.96rem; line-height: 1.5;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.04);
            border-top-right-radius: 4px; word-break: break-word;
        }

        .message-wrapper.me .message-text {
            background: rgba(0, 242, 254, 0.07); border: 1px solid rgba(0, 242, 254, 0.2);
            border-top-right-radius: 20px; border-top-left-radius: 4px;
        }

        /* ستایلێ وێنەیان */
        .sent-img {
            max-width: 100%; max-height: 280px; border-radius: 16px;
            margin-top: 6px; border: 1px solid rgba(255, 255, 255, 0.08);
            display: block; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* بەشێ نڤیسینێ (Input Bar) */
        .chat-input-area {
            padding: 22px 30px; background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; gap: 14px; align-items: center;
        }

        .input-wrapper { flex: 1; display: flex; gap: 12px; align-items: center; }

        .chat-input-area input[type="text"] {
            flex: 1; padding: 16px 22px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px; color: #fff; font-size: 0.98rem; outline: none; transition: 0.3s;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: #00f2fe; background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.12);
        }

        .image-upload-btn {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            width: 54px; height: 54px; border-radius: 18px; display: flex; justify-content: center;
            align-items: center; cursor: pointer; transition: 0.3s; font-size: 1.4rem;
        }
        .image-upload-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: #ff007f; }

        .send-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none; padding: 0 28px; height: 54px; border-radius: 18px;
            color: #050508; font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }
        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0, 242, 254, 0.4); }
    </style>
</head>
