<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونا زیندەوەر زانی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebd5 0%, #9fa8da 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 2px solid #ffffff;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .time-badge {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 12px 25px;
            border-radius: 50px; /* دوگمەیا شێوازێ هێلکەیی/خر */
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.1);
            border: 1px solid #a5d6a7;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🧬</div>
        <h1>بێهنفڕەهـ بن قوتابیێن هێژا</h1>
        <p>ئەزموونا بابەتێ <b>زیندەوەر زانی</b> یا خولا دوویێ دێ ل دەمژمێر کاتژمێر <b>٨:٠٠ ی شەڤ</b> هێتە بەردەستکرن و دروستکرن.</p>
        <div class="time-badge">
            ⏰ دەمژمێر 8:00 دێ هێتە کاراکردن
        </div>
    </div>

</body>
</html>
