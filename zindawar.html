<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beIN Sports Premium Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a103c 0%, #070514 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ff007f, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
            font-weight: 800;
        }

        header p {
            color: #b3b0cb;
            font-size: 1rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            background: rgba(22, 18, 44, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(138, 43, 226, 0.2);
        }

        /* بەشی ڤیدیۆ مۆدێرن */
        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* بەشی دوگمەی کەناڵەکان بە دیزاینی نایاب */
        .channels-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            padding: 25px;
            background: #110d26;
        }

        .channel-btn {
            background: linear-gradient(135deg, #1f1947 0%, #161135 100%);
            color: #e0e0fc;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .channel-btn:hover {
            background: linear-gradient(135deg, #8a2be2 0%, #4a00e0 100%);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .channel-btn.active {
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            color: #fff;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
            transform: scale(1.03);
        }

        /* گونجاندن بۆ مۆبایل بە جوانترین شێوە */
        @media (max-width: 768px) {
            .channels-list {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 15px;
            }
            header h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .channels-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>beIN SPORTS LIVE</h1>
        <p>پەخشی ڕاستەوخۆی کەناڵە وەرزشییەکان بە کوالیتی FULL HD و بێ ڕیکلام</p>
    </header>

    <div class="main-container">
        <!-- شاشەی لێدانی ڤیدیۆ -->
        <div class="player-container">
            <iframe id="main-player" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <!-- بەشی دوگمەکان کە بەستەرەکانی تێدا ڕێکخراوە -->
        <div class="channels-list">
            <!-- لێرە لە ناو فەرمانی changeChannel بەستەری کەناڵەکان دانراوە -->
            <button class="channel-btn active" onclick="changeChannel('https://www.youtube.com/embed/live_stream?channel=UC77u3YvL78_zDTe2K6Ww6aA', this)">beIN 1 HD</button>
            <button class="channel-btn" onclick="changeChannel('https://www.youtube.com/embed/live_stream?channel=UC4i9F96fV9K_mpxYyvSIsFA', this)">beIN 2 HD</button>
            <button class="channel-btn" onclick="changeChannel('https://www.youtube.com/embed/live_stream?channel=UC14U8Sjd5X_eeC49BxsnNpw', this)">beIN 3 HD</button>
            <button class="channel-btn" onclick="changeChannel('https://www.youtube.com/embed/live_stream?channel=UC0Zp_gY0v27O7KIn_L3rBfA', this)">beIN 4 HD</button>
            <button class="channel-btn" onclick="changeChannel('https://www.youtube.com/embed/live_stream?channel=UC7_gO0_93XgV65vW-K6b50g', this)">beIN 5 HD</button>
        </div>
    </div>

    <script>
        // فەرمانی سەرەکی بۆ گۆڕینی کەناڵەکان بەبێ ڕیفریش
        function changeChannel(videoUrl, buttonElement) {
            const player = document.getElementById('main-player');
            
            // گۆڕینی بەستەری ڤیدیۆکە
            player.src = videoUrl;

            // نوێکردنەوەی ستایلی دوگمە چالاکەکە
            const allButtons = document.querySelectorAll('.channel-btn');
            allButtons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }

        // کاتێک لاپەڕەکە دەکرێتەوە خۆکارانە کەناڵی یەکەم لێبدات
        window.onload = function() {
            const firstChannelBtn = document.querySelector('.channel-btn');
            // لێرە بەستەری یەکەم کەناڵ دووبارە کراوەتەوە بۆ دەستپێکی خۆکار
            changeChannel('https://www.youtube.com/embed/live_stream?channel=UC77u3YvL78_zDTe2K6Ww6aA', firstChannelBtn);
        };
    </script>

</body>
</html>
