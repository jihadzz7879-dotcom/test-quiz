<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنا زیندەوەرانی</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: #1e1e1e;
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }

        h1 {
            color: #d4af37;
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .question-block {
            background-color: #252525;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
        }

        /* ستایلێ تایبەت بۆ وێنەیێن د ناڤ پسیارێ دا */
        .question-img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 15px auto;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 5px;
            background-color: #1a1a1a;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-item label {
            display: block;
            background-color: #333333;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .option-item label:hover {
            background-color: #444444;
            border-color: #d4af37;
        }

        .option-item input[type="radio"] {
            margin-left: 10px;
            accent-color: #d4af37;
        }

        .submit-btn {
            display: block;
            width: 100%;
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: #ffffff;
            transform: scale(1.02);
        }

        .result-box {
            display: none;
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #d4af37;
            margin-top: 20px;
        }

        .score-text {
            font-size: 24px;
            color: #d4af37;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .review-item {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 5px solid #333;
        }

        .review-correct { border-right-color: #2ecc71; }
        .review-wrong { border-right-color: #e74c3c; }

        .your-ans { color: #e74c3c; font-weight: bold; }
        .correct-ans { color: #2ecc71; font-weight: bold; }
        
        .back-btn {
            display: inline-block;
            text-decoration: none;
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 15px;
            transition: 0.2s;
        }
        .back-btn:hover { background-color: #d4af37; color: #121212; }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-window">
    <h1>تاقیکردنا وزاری یا زیندەوەر زانی (پۆلا ١٢)</h1>
    <div class="subtitle">سیستمێ خۆکار بۆ پشکنینا بەرسڤان ل دووماهییێ</div>

    <form id="quiz-form">
        <!-- پسیارا ١ ب وێنە ڤە -->
        <div class="question-block">
            <div class="question-text">١. سەحکە وێنەیێ خوارێ، ئەو شانەیا تیخا ژدەرڤە یا لوولەیێن خوینێ ژێ پێکدهێت چ جۆرە شانەیە؟</div>
            
            <!-- ل ڤێرە ناڤێ وێنەیێ خۆ دابنێ -->
            <img src="q1.png" class="question-img" alt="وێنەیێ پسیارا ئێکێ">

            <ul class="options-list">
                <li class="option-item"><label><input type="radio" name="q1" value="A"> A- شانەبین و د بردەما زۆرا ماددەیێ دنافبەرا شانەاندا نقوم بووینە</label></li>
                <li class="option-item"><label><input type="radio" name="q1" value="B"> B- بەستەرەشانەیە</label></li>
                <li class="option-item"><label><input type="radio" name="q1" value="C"> C- ڕووکەشە شانەیە</label></li>
                <li class="option-item"><label><input type="radio" name="q1" value="D"> D- (A و B) هەرڈوو دروستن</label></li>
            </ul>
        </div>

        <!-- پسیارا ٢ -->
        <div class="question-block">
            <div class="question-text">٢. مێشک ژ چەند پشکان پێکدهێت؟</div>
            <ul class="options-list">
                <li class="option-item"><label><input type="radio" name="q2" value="A"> A- سێ پشکێن سەرەکی</label></li>
                <li class="option-item"><label><input type="radio" name="q2" value="B"> B- دوو پشک</label></li>
                <li class="option-item"><label><input type="radio" name="q2" value="C"> C- چوار پشک</label></li>
            </ul>
        </div>

        <button type="button" class="submit-btn" onclick="calculateResult()">تەواوکرن و دیتنا ئەنجامی</button>
    </form>

    <div class="result-box" id="result-area">
        <div class="score-text" id="score-display"></div>
        <div id="review-display"></div>
        <a href="index.html" class="back-btn">زڤڕین بۆ لاپەڕێ سەرەکی</a>
    </div>
</div>

<script>
    const correctAnswers = {
        q1: "D",
        q2: "A"
    };

    const questionTexts = {
        q1: "١. ئەو شانەیا تیخا ژدەرڤە یا لوولەیێن خوینێ ژێ پێکدهێت...",
        q2: "٢. مێشک ژ چەند پشکان پێکدهێت؟"
    };

    function calculateResult() {
        const form = document.getElementById('quiz-form');
        const formData = new FormData(form);
        
        let totalQuestions = Object.keys(correctAnswers).length;
        let correctCount = 0;
        let reviewHtml = "";

        for (let key in correctAnswers) {
            let userAnswer = formData.get(key);
            let correctAnswer = correctAnswers[key];
            
            if (!userAnswer) {
                userAnswer = "بێ بەرسڤ";
            }

            let isCorrect = (userAnswer === correctAnswer);
            if (isCorrect) {
                correctCount++;
            }

            reviewHtml += `
                <div class="review-item ${isCorrect ? 'review-correct' : 'review-wrong'}">
                    <strong>${questionTexts[key]}</strong><br>
                    <span class="your-ans">بەرسفا تە: ${userAnswer}</span> | 
                    <span class="correct-ans">بەرسفا ڕاست: ${correctAnswer}</span>
                </div>
            `;
        }

        let finalScore = Math.round((correctCount / totalQuestions) * 100);

        form.style.display = 'none';
        document.getElementById('score-display').innerText = `نمریا تە: %${finalScore}`;
        document.getElementById('review-display').innerHTML = reviewHtml;
        document.getElementById('result-area').style.display = 'block';
    }
</script>

</body>
</html>
