<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>تاقیکردنا ڕێزمانێ - ویزاری</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #16a085;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 15px;
        }

        .quiz-info {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #7f8c8d;
        }

        .question-card {
            background: #fafbfc;
            border: 1px solid #eef2f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .options-container {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 25px; /* دیزاینا هێلکەیی/بازنەیی بۆ پشکۆکان */
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .option-btn:hover {
            background: #f1f5f9;
            border-color: var(--primary-color);
        }

        .option-btn.selected {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* ستایلێن ئەنجامان */
        .option-btn.correct {
            background: var(--correct-color) !important;
            color: white !important;
            border-color: var(--correct-color) !important;
        }

        .option-btn.wrong {
            background: var(--wrong-color) !important;
            color: white !important;
            border-color: var(--wrong-color) !important;
        }

        .submit-section {
            text-align: center;
            margin-top: 30px;
        }

        .action-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #117a65;
        }

        #result-card {
            display: none;
            background: #e8f8f5;
            border: 2px solid var(--secondary-color);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 15px 0;
        }

        .feedback-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

        qText.innerText = `${index + 1}. ${data.q}`;
        card.appendChild(qText);
        
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-container';
        
        ['a', 'b', 'c', 'd'].forEach(option => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option-btn';
            btn.id = `btn-${index}-${option}`;
            btn.innerText = `${option.toUpperCase()}- ${data[option]}`;
            btn.onclick = () => selectOption(index, option);
            optionsDiv.appendChild(btn);
        });
        
        card.appendChild(optionsDiv);
        container.appendChild(card);
    });

    // پاشکەوتکرنا بەرسڤێن قوتابی
    let userAnswers = {};

    function selectOption(qIndex, option) {
        // لادانا رەنگێ دەستنیشانکرنێ ژ پشکۆکێن دی یێن هەمان پسیار
        ['a', 'b', 'c', 'd'].forEach(opt => {
            document.getElementById(`btn-${qIndex}-${opt}`).classList.remove('selected');
        });
        
        // دەستنیشانکرنا پشکۆکا نوو
        document.getElementById(`btn-${qIndex}-${option}`).classList.add('selected');
        userAnswers[qIndex] = option;
    }

    // پشکینینا بەرسڤان و نیشادانا ئەنجامی
    function checkAnswers() {
        let correctCount = 0;
        
        quizData.forEach((data, index) => {
            const userAnswer = userAnswers[index];
            const correctAnswer = data.ans;
            
            ['a', 'b', 'c', 'd'].forEach(opt => {
                const btn = document.getElementById(`btn-${index}-${opt}`);
                btn.disabled = true; // ڕاگرتنا پشکۆکان پاش تاقیکردنێ
                
                // ئەگەر ئەڤە بەرسڤا دروست بیت، کەسک بکە
                if (opt === correctAnswer) {
                    btn.classList.add('correct');
                }
                // ئەگەر قوتابی بەرسڤەکا خەلەت دابیت، سور بکە
                if (userAnswer === opt && userAnswer !== correctAnswer) {
                    btn.classList.add('wrong');
                }
            });

            if (userAnswer === correctAnswer) {
                correctCount++;
            }
        });

        // حسابکرنا نمرێ ژ 100 (هەر پسیارەک 2 نمرە)
        const finalScore = (correctCount / quizData.length) * 100;
        
        // نیشادانا کاردێ ئەنجامان
        const resultCard = document.getElementById('result-card');
        const scoreText = document.getElementById('score-text');
        const feedbackMsg = document.getElementById('feedback-msg');
        
        scoreText.innerText = `${finalScore} / 100`;
        feedbackMsg.innerText = `تە بەرسڤا ${correctCount} پسیاران ژ کۆما ٥٠ پسیاران ب دروستی دایە.`;
        
        resultCard.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // ڤەشارتنا پشکۆکا دوماهیک ئینانێ
        document.getElementById('submit-btn').style.display = 'none';
    }
</script>
