<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تاقیکرنا عەمەلی یا C# — هەردوو PDF ب بادینی</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --card: #1e293b;
      --card-light: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #0ea5e9;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --border: #cbd5e1;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #e2e8f0;
      color: var(--text-main);
      line-height: 1.75;
    }

    /* Header */
    .topbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #fff;
      padding: 18px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .topbar-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
    }

    .brand p {
      font-size: 0.9rem;
      color: #bfdbfe;
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .stat-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
    }

    .progress-wrap {
      max-width: 1320px;
      margin: 10px auto 0;
      background: rgba(255,255,255,0.18);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Layout */
    .app-container {
      max-width: 1320px;
      margin: 22px auto;
      padding: 0 16px 50px;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Sidebar */
    .sidebar {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 4px 15px rgba(15,23,42,0.08);
      border: 1px solid var(--border);
      position: sticky;
      top: 112px;
      max-height: calc(100vh - 130px);
      overflow-y: auto;
    }

    @media (max-width: 960px) {
      .sidebar {
        position: static;
        max-height: none;
      }
    }

    .nav-group-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #1e3a8a;
      background: #eff6ff;
      padding: 8px 12px;
      border-radius: 8px;
      margin: 12px 0 8px;
      border-right: 4px solid var(--primary);
    }

    .nav-group-title:first-child {
      margin-top: 0;
    }

    .nav-btn {
      width: 100%;
      text-align: right;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary-dark);
      font-weight: 700;
    }

    .nav-btn.final-btn {
      background: linear-gradient(135deg, #b45309, #d97706);
      color: #fff;
      border: none;
      font-weight: 800;
      margin-top: 10px;
      padding: 13px 14px;
    }

    .nav-btn.final-btn.active {
      background: linear-gradient(135deg, #15803d, #16a34a);
    }

    .nav-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,0.08);
      white-space: nowrap;
    }

    .nav-btn.active .nav-badge {
      background: rgba(255,255,255,0.22);
      color: #fff;
    }

    /* Main Content */
    .main-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: 0 4px 18px rgba(15,23,42,0.08);
      border: 1px solid var(--border);
    }

    .lesson-header {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .slide-tag {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .lesson-header h2 {
      font-size: 1.55rem;
      color: #0f172a;
    }

    /* Explanation Box */
    .explain-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-right: 5px solid var(--primary);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .explain-box h3 {
      color: #1e3a8a;
      margin-bottom: 10px;
      font-size: 1.12rem;
    }

    .explain-box ul {
      padding-right: 22px;
      margin-top: 8px;
    }

    .explain-box li {
      margin-bottom: 8px;
    }

    .exam-tip {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-right: 5px solid #f59e0b;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 22px;
      color: #78350f;
      font-weight: 600;
    }

    /* Inline code & Code / Console Boxes */
    .inline-code {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
      background: #e2e8f0;
      color: #b91c1c;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 0.9em;
      font-weight: 700;
    }

    .code-console-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    @media (max-width: 780px) {
      .code-console-grid {
        grid-template-columns: 1fr;
      }
    }

    .code-panel, .console-panel {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .panel-bar {
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-panel .panel-bar {
      background: #1e293b;
      color: #93c5fd;
    }

    .console-panel .panel-bar {
      background: #18181b;
      color: #4ade80;
    }

    pre.code-pre {
      direction: ltr;
      text-align: left;
      unicode-bidi: isolate;
      background: #0f172a;
      color: #f1f5f9;
      padding: 14px 16px;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 0.92rem;
      line-height: 1.55;
      overflow-x: auto;
      margin: 0;
      white-space: pre;
    }

    pre.console-pre {
      direction: ltr;
      text-align: left;
      unicode-bidi: isolate;
      background: #000000;
      color: #e5e7eb;
      padding: 14px 16px;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 0.92rem;
      line-height: 1.55;
      overflow-x: auto;
      margin: 0;
      min-height: 90px;
      white-space: pre;
    }

    /* Interactive Practical Task Box */
    .practice-box {
      background: #f0f9ff;
      border: 2px dashed #0284c7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 26px;
    }

    .practice-box h3 {
      color: #0369a1;
      margin-bottom: 8px;
    }

    .practice-input {
      width: 100%;
      direction: ltr;
      text-align: left;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #94a3b8;
      background: #0f172a;
      color: #f8fafc;
      margin: 10px 0;
      resize: vertical;
    }

    .run-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .run-btn:hover {
      background: #0369a1;
    }

    /* Questions */
    .questions-section h3 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
    }

    .q-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .q-title {
      font-weight: 800;
      font-size: 1.03rem;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .q-code {
      margin-bottom: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 650px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .opt-btn {
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 11px 14px;
      text-align: right;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
      transition: all 0.18s;
    }

    .opt-btn.ltr-opt {
      direction: ltr;
      text-align: left;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #14532d;
      font-weight: 800;
    }

    .opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #7f1d1d;
    }

    .feedback-box {
      margin-top: 12px;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.ok {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #14532d;
    }

    .feedback-box.bad {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }

    .joke-line {
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .lesson-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 2px solid #e2e8f0;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .nav-action-btn.secondary {
      background: #475569;
    }

    .nav-action-btn:hover {
      opacity: 0.92;
    }

    .final-banner {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #fff;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 22px;
    }

    .final-result-box {
      padding: 20px;
      border-radius: 14px;
      margin-top: 20px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .table-mini {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9rem;
    }

    .table-mini th, .table-mini td {
      border: 1px solid #cbd5e1;
      padding: 7px 10px;
      text-align: right;
    }

    .table-mini th {
      background: #e2e8f0;
      color: #0f172a;
    }

    .ltr-cell {
      direction: ltr;
      text-align: left !important;
      font-family: 'Cascadia Code', 'Consolas', monospace;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>💻 تاقیکرنا عەمەلی یا C# — ئامادەکاری بۆ ئەزموونا ١ شەمبیێ</h1>
        <p>شلوڤەکرنا هەمی ٤٨ سلایدێن هەردوو PDFـان ب بادینی + شاشا ڕەش (Console) + تاقیکرن</p>
      </div>
      <div class="stats-bar">
        <div class="stat-pill" id="stat-score">✅ دروست: ٠ / ٠</div>
        <div class="stat-pill" id="stat-progress">📊 تەمامبوون: ٠٪</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-card" id="main-content"></main>
  </div>

<script>

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ==================== ALL LESSONS (COVERS EVERY SLIDE OF BOTH PDFs) ====================

      {
