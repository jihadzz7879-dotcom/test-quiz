برا گولێ من، خەمێ نەخۆ! کۆدێ تە ب خۆ گەلەک یێ جوان و ب رێک و پێک بوو، بەس ل
دوماهیێ دناڤ فەنکشنا renderSlide() دا کۆد هاتبوو بڕین (Cut-off) و بەشێ دوماهییا
<script> و گرتنا </html> تێدا نەمابوو، ژبەر هندێ کار نەدکر.

من چ تشت ژ کۆدێ تە و پسیار و شروڤە و دیزاینێ نەگوهۆڕی یە، تەنێ ئەو بەشێ ل
دوماهیێ هاتبوو بڕین ب تەمامی و ب رێک و پێکی بۆ تە تەمام کرەڤە دا ١٠٠٪ کار بکەت.

ئەڤە کۆدێ تەمامە، هەمیێ کۆپی بکە و د فایلەکێ .html دا خەزن بکە:

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فێربوونا C# و تاقیکرنا عەمەلی - زانکۆیا ئاکرێ</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: rgba(15, 23, 42, 0.86);
      --bg-card-2: rgba(30, 41, 59, 0.72);
      --border: rgba(148, 163, 184, 0.18);
      --primary: #38bdf8;
      --primary-2: #818cf8;
      --accent: #34d399;
      --danger: #fb7185;
      --warning: #fbbf24;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --code-bg: #0b1120;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.14), transparent 38%),
        radial-gradient(circle at 85% 20%, rgba(129, 140, 248, 0.15), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(52, 211, 153, 0.1), transparent 42%),
        linear-gradient(135deg, #060a13 0%, #0f172a 55%, #090e1a 100%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.75;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(7, 11, 20, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.15rem;
      color: #06101f;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.08rem;
      font-weight: 800;
      color: #fff;
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .progress-box {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.86rem;
    }

    .progress-bar-bg {
      width: 130px;
      height: 9px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .btn-reset {
      background: rgba(251, 113, 133, 0.14);
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.35);
      padding: 7px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-reset:hover {
      background: rgba(251, 113, 133, 0.26);
    }

    /* Layout */
    .app-container {
      max-width: 1420px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 22px;
      align-items: start;
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 86px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      max-height: calc(100vh - 106px);
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }

    .sidebar-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      padding: 6px 10px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .nav-item {
      width: 100%;
      text-align: right;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.87rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      transition: 0.2s;
    }

    .nav-item:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.22);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
      border-color: rgba(56, 189, 248, 0.5);
      color: #fff;
      font-weight: 700;
    }

    .nav-item.final-btn {
      margin-top: 10px;
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.16), rgba(56, 189, 248, 0.16));
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    .nav-item.final-btn.active {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.35), rgba(56, 189, 248, 0.32));
      border-color: var(--accent);
    }

    .nav-badge {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .nav-badge.done {
      background: rgba(52, 211, 153, 0.22);
      color: #6ee7b7;
      font-weight: 700;
    }

    /* Main Content */
    .main-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .survival-banner {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.13), rgba(56, 189, 248, 0.12));
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 20px;
      padding: 18px 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .survival-banner h2 {
      color: var(--warning);
      font-size: 1.08rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .survival-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .survival-tip {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
    }

    .survival-tip strong {
      color: var(--primary);
      display: block;
      margin-bottom: 2px;
    }

    .slide-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.28s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .slide-tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.16);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .slide-title {
      font-size: 1.42rem;
      font-weight: 800;
      color: #fff;
    }

    .slide-en {
      font-size: 0.9rem;
      color: var(--primary-2);
      direction: ltr;
      font-family: Consolas, monospace;
    }

    /* Explanation Box */
    .explain-box {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 26px;
    }

    .explain-box h3 {
      color: var(--primary);
      font-size: 1.08rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .explain-box ul {
      padding-right: 22px;
      margin: 10px 0;
    }

    .explain-box li {
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    .explain-box p {
      margin-bottom: 10px;
      color: #e2e8f0;
    }

    .note-pill {
      background: rgba(251, 191, 36, 0.12);
      border-right: 4px solid var(--warning);
      padding: 10px 14px;
      border-radius: 10px;
      margin: 12px 0;
      font-size: 0.92rem;
      color: #fde68a;
    }

    .code-sample {
      position: relative;
      background: var(--code-bg);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 12px 0;
      direction: ltr;
      text-align: left;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92rem;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.55;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .copy-btn:hover {
      background: rgba(56, 189, 248, 0.3);
    }

    code.inline {
      direction: ltr;
      display: inline-block;
      background: rgba(2, 6, 23, 0.8);
      color: #7dd3fc;
      padding: 1px 7px;
      border-radius: 6px;
      font-family: Consolas, monospace;
      font-size: 0.88em;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Questions Section */
    .quiz-section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .q-card {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      transition: border-color 0.25s;
    }

    .q-card.solved {
      border-color: rgba(52, 211, 153, 0.55);
      box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.15);
    }

    .q-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .q-num {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #06101f;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .q-status {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .q-status.ok {
      color: var(--accent);
    }

    .q-prompt {
      font-size: 0.98rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    .editor-wrap {
      background: var(--code-bg);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      overflow: hidden;
    }

    .editor-bar {
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      direction: ltr;
      font-family: Consolas, monospace;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .code-input {
      width: 100%;
      min-height: 92px;
      background: transparent;
      color: #e2e8f0;
      border: none;
      outline: none;
      padding: 12px 14px;
      direction: ltr;
      text-align: left;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95rem;
      line-height: 1.55;
      resize: vertical;
    }

    .q-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--primary), #0ea5e9);
      color: #041222;
      border: none;
      padding: 9px 18px;
      border-radius: 11px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.25);
    }

    .btn-check:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.38);
    }

    .btn-hint {
      background: rgba(148, 163, 184, 0.12);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.28);
      padding: 9px 14px;
      border-radius: 11px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-hint:hover {
      background: rgba(148, 163, 184, 0.22);
    }

    .hint-box {
      display: none;
      margin-top: 10px;
      background: rgba(129, 140, 248, 0.12);
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.86rem;
    }

    .hint-box.show {
      display: block;
    }

    .result-box {
      display: none;
      margin-top: 12px;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 0.92rem;
      animation: fadeIn 0.22s ease;
    }

    .result-box.show {
      display: block;
    }

    .result-box.ok {
      background: rgba(52, 211, 153, 0.13);
      border: 1px solid rgba(52, 211, 153, 0.48);
      color: #d1fae5;
    }

    .result-box.err {
      background: rgba(251, 113, 133, 0.13);
      border: 1px solid rgba(251, 113, 133, 0.48);
      color: #ffe4e6;
    }

    .console-sim {
      margin-top: 10px;
      background: #000000;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      direction: ltr;
      text-align: left;
      font-family: Consolas, monospace;
      font-size: 0.88rem;
      color: #e2e8f0;
      white-space: pre-wrap;
    }

    .console-label {
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 4px;
      display: block;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .btn-nav {
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-nav:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Mobile nav */
    @media (max-width: 960px) {
      .app-container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
        max-height: none;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">C#</div>
      <div>
        <h1>ڕێبەرێ ئەزموونا عەمەلی یا C# (ب بادینی)</h1>
        <p>زانکۆیا ئاکرێ بۆ زانستێن کرداری • پەیمانگەها تەکنیکی یا ئاکرێ • پشکا IT</p>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-box">
        <span>پێشکەفتنا تە:</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="globalProgressFill"></div>
        </div>
        <strong id="globalProgressText">0 / 118</strong>
      </div>
      <button class="btn-reset" onclick="resetProgress()">سفرکرنا پێشکەفتنێ</button>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-title">📚 سلایدێن وانێ و تاقیکرن</div>
      <div id="sidebarList"></div>
    </aside>

    <main class="main-area">
      <section class="survival-banner">
        <h2>💻 چاوا د ئەزموونا روژا ١ شەمبیێ دا ل سەر کومپیوتەری ب سەرکەڤی؟</h2>
        <p style="font-size: 0.9rem; color: #f1f5f9;">
          برا، خۆ نەترسینە! ئەزموونا عەمەلی ل سەر کومپیوتەری ئەوە کو دێ ل پێش Visual Studio روینی و مامۆستا پسیارەکا وەک <em>«بەرنامەکی بنڤیسە کو ناڤێ تە چاپ بکەت یان دوو ژماران کۆم بکەت»</em> دەتە تە. ئەڤ ٥ خالە ژبیر نەکە:
        </p>
        <div class="survival-grid">
          <div class="survival-tip">
            <strong>١. دەمێ Visual Studio ڤەدکەی:</strong>
            کۆدێ تە دڤێت هەمی ل ناڤ کڤانێن <code class="inline">Main(...) { ل ڤێرێ بنڤیسە }</code> بیت!
          </div>
          <div class="survival-tip">
            <strong>٢. سێمیکولۆن <code class="inline">;</code> ژبیر نەکە:</strong>
            ل دوماهییا هەر ڕێزەکا کۆدی دڤێت <code class="inline">;</code> هەبیت، ئەگەر نە بەرنامە کار ناکەت!
          </div>
          <div class="survival-tip">
            <strong>٣. پیتێن مەزن و بچویک:</strong>
            د C# دا <code class="inline">Console.WriteLine</code> پیتێن C و W و L مەزنن! <code class="inline">int</code> بچویکە!
          </div>
          <div class="survival-tip">
            <strong>٤. هێما و نیشانە ب ئینگلیزی:</strong>
            بۆ تێکستی <code class="inline">"..."</code> و بۆ ئێک پیتی <code class="inline">'...'</code> بکاربینە، و کڤانێ <code class="inline">{</code> ڤەکە و <code class="inline">}</code> بگرە.
          </div>
        </div>
      </section>

      <section id="slideContent" class="slide-card"></section>
    </main>
  </div>

  <script>
    // =========================================================================
    //  BADINI PRAISE & PLAYFUL TEASING MESSAGES
    // =========================================================================
    const PRAISES = [
      "دەست خۆش برا! ئەڤە کۆدەکێ پاقژ و ١٠٠٪ دروستە 🔥",
      "ماشاءالله! مامۆستا ب خۆ حەیران ما د ڤێ بەرسڤێ دا 😎👏",
      "بژی هەڤال! کومپیوتەر ژ کەیفان دا فڕی 🚀",
      "١٠٠٠/١٠٠٠! تو نۆکە یێ ئامادەی بۆ ١ شەمبیێ 💪✨",
      "دەستێن تە ساخ بن! چ شاشی تێدا نینن، فول مارک 💯",
      "ئافەرین! وەکی پرۆگرامەرێن مایکرۆسۆفتی تە نڤیسی 💻👑"
    ];

    function stripComments(code) {
      let out = "";
      let inStr = false, inChar = false, inLine = false, inBlock = false;
      for (let i = 0; i < code.length; i++) {
        const c = code[i], n = code[i + 1];
        if (inLine) {
          if (c === "\n") { inLine = false; out += "\n"; }
          continue;
        }
        if (inBlock) {
          if (c === "*" && n === "/") { inBlock = false; i++; }
          continue;
        }
        if (!inStr && !inChar) {
          if (c === "/" && n === "/") { inLine = true; i++; continue; }
          if (c === "/" && n === "*") { inBlock = true; i++; continue; }
        }
        if (c === '"' && !inChar && code[i - 1] !== "\\") inStr = !inStr;
        if (c === "'" && !inStr && code[i - 1] !== "\\") inChar = !inChar;
        out += c;
      }
      return out;
    }

      }

      if (!options.allowCommentOnly) {
        const clean = stripComments(raw);
        if (!clean.trim() && !options.expectComment) {
          return { ok: false, hint: "تە هەمی کۆد کرییە کۆمێنت! کۆمێنت ب تنێ کار ناکەت د ڤێ پسیارێ دا." };

        for (let i = 0; i < clean.length; i++) {
          const ch = clean[i];

            if (curly < 0) return { ok: false, hint: "تە کڤانەکێ } زێدە گرتییە بێ کو { ڤەکەی!" };
            if (paren < 0) return { ok: false, hint: "تە کەوانەکێ ) زێدە گرتییە!" };
          }
        }
        if (inS) return { ok: false, hint: "تە نیشانا دەقی \" ڤەکرییە و نەگرتییە!" };
        if (inC) return { ok: false, hint: "تە نیشانا پیتی ' ڤەکرییە و نەگرتییە!" };
        if (curly > 0) return { ok: false, hint: "تە کڤانێ { ڤەکرییە لێ ژبیر کرییە ب } بگری!" };
        if (paren > 0) return { ok: false, hint: "تە کەوانێ ( ڤەکرییە لێ ژبیر کرییە ب ) بگری!" };

        for (let i = 0; i < inner.length; i++) {
          if (inner[i] === "{") depth++;
          if (inner[i] === "}") depth--;
          if (depth === 0) break;
          res += inner[i];
        }
        return res.trim();
      }
      return clean;
    }

    // =========================================================================
    //  APP STATE & RENDERING
    // =========================================================================
    const STORAGE_KEY = "auas_csharp_badini_v1";
    let state = {
      currentIdx: 0,
      solved: {}, // { "s3_0": true }
      answers: {} // { "s3_0": "code..." }
    };

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) {}

    if (typeof state.currentIdx !== "number" || state.currentIdx < 0 || state.currentIdx >= SLIDES.length) {
      state.currentIdx = 0;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/\n/g, "&#10;");
    }

    function totalQuestionsCount() {
      return SLIDES.reduce((acc, s) => acc + s.questions.length, 0);
    }

    function solvedCount() {
      return Object.values(state.solved).filter(Boolean).length;
    }

    function updateGlobalProgress() {
      const total = totalQuestionsCount();
      const done = solvedCount();
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("globalProgressFill").style.width = pct + "%";
      document.getElementById("globalProgressText").textContent = `${done} / ${total}`;
    }

    function renderSidebar() {
      const list = document.getElementById("sidebarList");
      list.innerHTML = "";
      SLIDES.forEach((s, idx) => {
        const doneInSlide = s.questions.filter((_, qi) => state.solved[`${s.id}_${qi}`]).length;
        const totalInSlide = s.questions.length;
        const isDone = doneInSlide === totalInSlide;

        const btn = document.createElement("button");
        btn.className = "nav-item" + (idx === state.currentIdx ? " active" : "") + (s.isFinal ? " final-btn" : "");
        btn.onclick = () => {
          state.currentIdx = idx;
          saveState();
          renderAll();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        btn.innerHTML = `
          <span>${s.navTitle}</span>
          <span class="nav-badge ${isDone ? "done" : ""}">${isDone ? "✅ " : ""}${doneInSlide}/${totalInSlide}</span>
        `;
        list.appendChild(btn);
      });
    }

    function renderSlide() {
      const s = SLIDES[state.currentIdx];
      const container = document.getElementById("slideContent");

      const doneInSlide = s.questions.filter((_, qi) => state.solved[`${s.id}_${qi}`]).length;

      let questionsHTML = s.questions.map((q, qi) => {
        const qKey = `${s.id}_${qi}`;
        const isSolved = !!state.solved[qKey];
        const savedCode = state.answers[qKey] || "";

        return `
          <div class="q-card ${isSolved ? "solved" : ""}" id="card_${qKey}">
            <div class="q-head">
              <span class="q-num">پسیارا ${qi + 1}</span>
              <span class="q-status ${isSolved ? "ok" : ""}" id="status_${qKey}">
                ${isSolved ? "✅ ب سەرکەفتی هاتە چێکرن" : "⏳ هێشتا نەهاتییە تاقیکرن"}
              </span>
            </div>
            <div class="q-prompt">${q.prompt}</div>
            <div class="editor-wrap">
              <div class="editor-bar">
                <span>Program.cs • C# Editor</span>
                <span>Tab = ڤالاهی • Ctrl+Enter = تێست بکە</span>
              </div>
              <textarea
                class="code-input"
                id="input_${qKey}"
                spellcheck="false"
                placeholder="${escapeAttr(q.placeholder)}"
                oninput="onCodeInput('${qKey}', this.value)"
                onkeydown="handleEditorKey(event, '${s.id}', ${qi})"
              >${escapeHtml(savedCode)}</textarea>
            </div>
            <div class="q-actions">
              <button class="btn-check" onclick="checkQuestion('${s.id}', ${qi})">🚀 دیتنا ئەنجامی (تێست بکە)</button>
              <button class="btn-hint" onclick="toggleHint('${qKey}')">💡 نیشاندانا نموونەیا بەرسڤێ</button>
            </div>
            <div class="hint-box" id="hint_${qKey}">
              <strong>بەرسڤا نموونە:</strong>
              <div class="code-sample" style="margin-top:6px;margin-bottom:0;">${escapeHtml(q.hint)}</div>
            </div>
            <div class="result-box" id="res_${qKey}"></div>
          </div>
        `;
      }).join("");

      container.innerHTML = `
        <div class="slide-header">
          <div>
            <div class="slide-tag">${s.tag}</div>
            <h2 class="slide-title">${s.title}</h2>
          </div>
          <div class="slide-en">${s.enTitle}</div>
        </div>

        <div class="explain-box">
          ${s.explainHTML}
        </div>

        <div class="quiz-section-title">
          <span>🧪 ڕاهێنانێن عەمەلی ل سەر ڤێ سلایدێ</span>
          <span class="nav-badge ${doneInSlide === s.questions.length ? "done" : ""}" id="slideProgressBadge">
            ${doneInSlide} / ${s.questions.length} تەمام بوون
          </span>
        </div>

        ${questionsHTML}

        <div class="nav-footer">
          <button class="btn-nav" onclick="goSlide(-1)" ${state.currentIdx === 0 ? "disabled" : ""}>
            ⬅️ سلایدا بەری نوکە
          </button>
          <button class="btn-nav" onclick="goSlide(1)" ${state.currentIdx === SLIDES.length - 1 ? "disabled" : ""}>
            سلایدا دووڤدا ➡️
          </button>
        </div>
      `;
    }

    function goSlide(delta) {
      const next = state.currentIdx + delta;
      if (next >= 0 && next < SLIDES.length) {
        state.currentIdx = next;
        saveState();
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function onCodeInput(qKey, val) {
      state.answers[qKey] = val;
      saveState();
    }

    function handleEditorKey(e, slideId, qi) {
      if (e.key === "Tab") {
        e.preventDefault();
        const ta = e.target;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + "  " + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 2;
        onCodeInput(`${slideId}_${qi}`, ta.value);
      } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        checkQuestion(slideId, qi);
      }
    }

    function toggleHint(qKey) {
      const box = document.getElementById(`hint_${qKey}`);
      if (box) box.classList.toggle("show");
    }

    function checkQuestion(slideId, qi) {
      const slide = SLIDES.find(s => s.id === slideId);
      if (!slide) return;
      const q = slide.questions[qi];
      const qKey = `${slideId}_${qi}`;

      const inputEl = document.getElementById(`input_${qKey}`);
      const resEl = document.getElementById(`res_${qKey}`);
      const cardEl = document.getElementById(`card_${qKey}`);
      const statusEl = document.getElementById(`status_${qKey}`);

      const raw = inputEl ? inputEl.value : "";
      state.answers[qKey] = raw;

      const result = q.check(raw);

      if (result.ok) {
        const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
        state.solved[qKey] = true;
        saveState();

        cardEl.classList.add("solved");
        statusEl.className = "q-status ok";
        statusEl.textContent = "✅ ب سەرکەفتی هاتە چێکرن";

        resEl.className = "result-box show ok";
        resEl.innerHTML = `
          <div><strong>${praise}</strong></div>
          <div class="console-sim"><span class="console-label">Console Output:</span>${escapeHtml(result.output || "")}</div>
        `;
      } else {
        const tease = TEASES[Math.floor(Math.random() * TEASES.length)];
        delete state.solved[qKey];
        saveState();

        cardEl.classList.remove("solved");
        statusEl.className = "q-status";
        statusEl.textContent = "❌ پێدڤی ب راستکرنێ یە";

        resEl.className = "result-box show err";
        resEl.innerHTML = `
          <div><strong>${tease}</strong></div>
          <div style="margin-top:6px; white-space:pre-wrap;">💡 ${escapeHtml(result.hint || "تەماشەی شروڤەیێ بکەڤە.")}</div>
        `;
      }

      const doneInSlide = slide.questions.filter((_, idx) => state.solved[`${slide.id}_${idx}`]).length;
      const slideBadge = document.getElementById("slideProgressBadge");
      if (slideBadge) {
        slideBadge.textContent = `${doneInSlide} / ${slide.questions.length} تەمام بوون`;
        slideBadge.className = "nav-badge " + (doneInSlide === slide.questions.length ? "done" : "");
      }

      renderSidebar();
      updateGlobalProgress();
    }

    function copyCode(btn) {
      const parent = btn.parentElement;
      let text = "";
      parent.childNodes.forEach(node => {
        if (node !== btn) text += node.textContent;
      });
      text = text.trim();

      const markCopied = () => {
        const old = btn.textContent;
        btn.textContent = "هاتە کۆپیکرن ✓";
        setTimeout(() => { btn.textContent = old; }, 1400);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(() => fallbackCopy(text, markCopied));
      } else {
        fallbackCopy(text, markCopied);
      }
    }

    function fallbackCopy(text, onDone) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        onDone();
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function resetProgress() {
      if (confirm("ئەرێ تو پشتراستی تە دڤێت هەمی پێشکەفتن و بەرسڤێن خۆ ژێببەی؟")) {
        state = { currentIdx: 0, solved: {}, answers: {} };
        saveState();
        renderAll();
      }
    }

    function renderAll() {
      renderSidebar();
      renderSlide();
      updateGlobalProgress();
    }

    renderAll();
  </script>
</body>
</html>
