<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکرنێن ویزاری</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        h2 { color: #f1c40f; margin-bottom: 20px; }
        
        #timer { font-size: 20px; color: gold; padding: 15px; border: 2px dashed gold; border-radius: 15px; margin: 0 auto 30px; width: 90%; max-width: 400px; }
        
        .btn-container { display: flex; flex-direction: column; align-items: center; }
        .btn { display: block; width: 90%; max-width: 350px; padding: 15px; margin: 8px 0; background-color: #1e1e1e; color: #fff; text-decoration: none; border-radius: 25px; border: 1px solid #333; transition: 0.3s; font-weight: bold; }
        .btn:hover { background-color: #333; border-color: gold; color: gold; }
        
        .hidden { display: none !important; }

        /* شاشەیا پاراستنێ */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #121212; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #1e1e1e; padding: 35px 30px; border-radius: 24px; border: 2px solid gold; box-shadow: 0 0 25px rgba(241, 196, 15, 0.25); width: 90%; max-width: 380px; box-sizing: border-box; }
        .login-box h3 { color: gold; margin-top: 0; font-size: 22px; margin-bottom: 10px; }
        .login-box p { color: #aaa; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 25px; border: 1px solid #444; background: #262626; color: white; text-align: center; font-size: 18px; font-weight: bold; letter-spacing: 2px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .login-box input:focus { border-color: gold; box-shadow: 0 0 12px rgba(241, 196, 15, 0.4); }
        .login-box button { width: 100%; padding: 14px; border-radius: 25px; border: none; background: linear-gradient(135deg, #f1c40f, #f39c12); color: #121212; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-box button:hover { transform: translateY(-2px); }
        #error-msg { color: #e74c3c; font-size: 13px; margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <!-- شاشەیا لێدانا کۆدی -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h3>پێویست ب کۆدێ کاراکرنێ یە</h3>
            <p>تکایە کۆدێ خۆ یێ تایبەت بنڤیسە. تێبینی: هەر کۆدەک تەنها ل سەر ئێک مۆبایل کار دکەت!</p>
            <input type="text" id="code-input" placeholder="کۆدی لێرە بنووسە..." onkeypress="handleKeyPress(event)">
            <button onclick="validateDeviceCode()">پشکنیـن و چالاککرن</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- ناڤەڕۆک و هەموو بابەتێن تە ل سەر پەیجی -->
    <div id="main-content" class="hidden">
        <h2>تاقیکرنێن ویزاری ٢٠٢٦</h2>
        
        <div id="timer">دەستپێکرنا دەمژمێرێ...</div>
        
        <div class="btn-container">
            <a href="fizya.html" class="btn">فیزیا</a>
            <a href="mejo.html" class="btn">مێژوو</a>
            <a href="kurdish.html" class="btn">کوردی</a>
            <a href="arabic.html" class="btn">عەرەبی</a>
            <a href="english.html" class="btn">ئینگلیزی</a>
            <a href="yasa.html" class="btn">یاسا</a>
            <a href="ark.html" class="btn">ئارک (ARK)</a>
            <a href="eslame.html" class="btn">ئیسلامی</a>
            <a href="zindawar.html" class="btn">ژیندەوار (زیندەزانی)</a>
            <a href="zindawar1.html" class="btn">ژیندەوار ١</a>
        </div>
    </div>

    <script>
        // لیستا ئەو ٧ کۆدێن تایبەت یێن مۆبایلان
        const validCodes = ["JEKO01", "JEKO02", "JEKO03", "JEKO04", "JEKO05", "JEKO06", "JEKO07"];

        // پشکنین ل دەستپێکا ڤەکرنا لاپەرەی
        document.addEventListener("DOMContentLoaded", function() {
            const savedCode = localStorage.getItem("activated_code");
            if (savedCode && validCodes.includes(savedCode)) {
                showSiteContent();
            }
        });

        function validateDeviceCode() {
            const inputField = document.getElementById("code-input");
            const inputVal = inputField.value.trim();
            const errorElement = document.getElementById("error-msg");

            if (validCodes.includes(inputVal)) {
                let globalUsedCodes = JSON.parse(localStorage.getItem("all_used_codes")) || [];

                if (globalUsedCodes.includes(inputVal) && localStorage.getItem("activated_code") !== inputVal) {
                    errorElement.innerHTML = "ئەڤ کۆدە ل سەر ئامادەکێ دی یێ بەکارهاتییە و ناتوانی لێرە بەکاری بێنی!";
                    inputField.value = "";
                    return;
                }

                localStorage.setItem("activated_code", inputVal);
                globalUsedCodes.push(inputVal);
                localStorage.setItem("all_used_codes", JSON.stringify(globalUsedCodes));

                showSiteContent();
            } else {
                errorElement.innerHTML = "کۆدێ لێدای خەلەتە! تکایە کۆدەکێ ڕاست بنڤیسە.";
                inputField.value = "";
                inputField.focus();
            }
        }

        function showSiteContent() {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-content").classList.remove("hidden");
            startTimer();
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") { validateDeviceCode(); }
        }

        // بەشێ کatژمێرێ
        function startTimer() {
            const examDate = new Date("June 14, 2026 07:30:00").getTime();
            const timerInterval = setInterval(function() {
                const now = new Date().getTime();
                const distance = examDate - now;
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("timer").innerHTML = days + " ڕۆژ و " + hours + " دەمژمێر و " + minutes + " خولەک و " + seconds + " چرکە ";
                
                if (distance < 0) { 
                    clearInterval(timerInterval); 
                    document.getElementById("timer").innerHTML = "تاقیکرن دەستپێکر!"; 
                }
            }, 1000);
        }
    </script>
</body>
</html>
