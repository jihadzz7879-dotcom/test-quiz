<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; transition: 0.3s; }
        .dark { background-color: #121212; color: white; }
        .light { background-color: #f4f4f4; color: black; }
        .blue { background-color: #003366; color: white; }
        
        .btn { display: block; width: 80%; margin: 10px auto; padding: 15px; border-radius: 10px; border: 1px solid #555; cursor: pointer; font-size: 18px; }
        .theme-btns { margin-bottom: 30px; }
        
        .footer-insta { margin-top: 50px; font-weight: bold; color: #d4af37; }
    </style>
</head>
<body class="dark">

    <h1>تاقیکرنا ویزاری</h1>
    <p>خولا دووی 2025-2026</p>

    <div class="theme-btns">
        <button onclick="document.body.className='dark'">تاری</button>
        <button onclick="document.body.className='light'">سپی</button>
        <button onclick="document.body.className='blue'">شین</button>
    </div>

    <button class="btn">تاقیکردنا کوردی پولا ١٢ خولا دووي ٢٠٢٥-٢٠٢٦</button>
    <button class="btn">تاقیکردنا عەرەبی</button>
    <button class="btn">تاقیکردنا ئینگلیزی</button>
    <button class="btn">تاقیکرنا یاسایێن هەڤالناڤ و هەڤالکار ژلایی پێکئینانیڤە</button>

    <div class="footer-insta">
        <p>Instagram: @GehadZebari</p>
    </div>

</body>
</html>
