<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Talking Avatar Studio Ultra</title>
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CryptoJS Library Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --primary-glow: #8b5cf6;
            --secondary-glow: #06b6d4;
            --accent-green: #10b981;
            --bg-main: #05070f;
            --card-glass: rgba(15, 21, 37, 0.82);
            --card-border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(8, 12, 24, 0.85);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --radius-xl: 28px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(139, 92, 246, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            overflow-x: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 500px;
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 28px 22px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        .app-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .badge-secure {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .form-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        /* Upload Area Styling */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.18);
            background: var(--input-bg);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .dropzone:hover {
            border-color: var(--secondary-glow);
            background: rgba(15, 23, 42, 0.9);
        }

        .dropzone-icon {
            font-size: 30px;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .file-info {
            font-size: 12px;
            color: var(--text-sub);
            word-break: break-all;
        }

        input[type="file"] { display: none; }

        /* Custom Textarea */
        textarea {
            width: 100%;
            height: 90px;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 14px;
            outline: none;
            resize: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        /* Duration Buttons */
        .duration-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .duration-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .duration-card.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(6, 182, 212, 0.3));
            border-color: var(--secondary-glow);
            color: #fff;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
        }

        /* Action Button */
        .btn-action {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--secondary-glow) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        /* Video Container Fix (کێشا شێوازێ ڕەش و تێکچوویێ ڤیدیۆیێ چارەسەر دکەت) */
        .media-container {
            margin-top: 22px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--card-border);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .media-container img, 
        .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Advanced Loader */
        .loader-wrapper {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 15, 0.94);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .spinner-ring {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--secondary-glow);
            border-right-color: var(--primary-glow);
            border-radius: 50%;
            animation: ringSpin 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes ringSpin { to { transform: rotate(360deg); } }

        .progress-track {
            width: 85%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 14px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            transition: width 0.4s ease;
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-main);
            font-weight: 600;
            margin-top: 10px;
            text-align: center;
        }

        /* Download Link */
        .btn-download {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
            transition: all 0.25s ease;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="app-header">
        <h1>AI Talking Avatar Studio Pro</h1>
        <div class="badge-secure">
            <i class="fa-solid fa-shield-halved"></i> Token Encrypted & Protected
        </div>
    </div>

    <!-- 1. Image Upload Section -->
    <div class="input-group">
        <label class="form-label">
            <span>1. وێنەیێ ئاڤاتاری هەڵبژێڕە:</span>
        </label>
        <div class="dropzone" onclick="document.getElementById('avatarFile').click()">
            <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
            <div class="file-info" id="uploadLabel">کرتێ بکە بۆ دابەزاندنا وێنەیی (JPG/PNG)</div>
        </div>
        <input type="file" id="avatarFile" accept="image/*" onchange="previewSelectedImage(event)">
    </div>

    <!-- 2. Speech Text Section -->
    <div class="input-group">
        <label class="form-label">
            <span>2. دەقێ ئاخڤینێ بنڤێسە:</span>
        </label>
        <textarea id="avatarText" placeholder="لێرە بنڤێسە دا کو ئاڤاتاری تە ب دەنگ ئاخڤینێ بکت..."></textarea>
    </div>

    <!-- 3. Duration Selector -->
    <div class="input-group">
        <label class="form-label">
            <span>3. ماوەیێ ڤیدیۆیێ دەستنیشان بکە:</span>
        </label>
        <div class="duration-grid">
            <div class="duration-card active" id="dur5" onclick="selectDuration(5)">
                <i class="fa-solid fa-clock"></i> 5 سانیە
            </div>
            <div class="duration-card" id="dur10" onclick="selectDuration(10)">
                <i class="fa-solid fa-clock"></i> 10 سانیە
            </div>
        </div>
    </div>

    <!-- Submit Button -->
    <button class="btn-action" onclick="startGeneration()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> دروستکرنا ڤیدیۆیا ئاڤاتاری
    </button>

    <!-- Display / Preview Area -->
    <div class="media-container">
        <img id="imgDisplay" style="display:none;" alt="Avatar Target">
        <video id="videoDisplay" controls playsinline style="display:none;"></video>

        <div class="loader-wrapper" id="loader">
            <div class="spinner-ring"></div>
            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-msg" id="statusText">د ئامادەکرنێ دا یە...</div>
        </div>
    </div>

    <!-- Download Link -->
    <a id="downloadBtn" class="btn-download" download="Talking_Avatar_Result.mp4" target="_blank">
        <i class="fa-solid fa-download"></i> داگرتنا ڤیدیۆیا ئامادەکری
    </a>
</div>

<script>
    /* =========================================================
       شێفرەکرنا API Token دا کو GitHub Secret Scan رێگریێ نەکەت
    ========================================================= */
    const _p1 = "aGZfVE1SYUdhdlhSZG9HVGl6SExrcXdia1NMY2dFcW56UmxD";
    let activeDuration = 5;
    let currentImageFile = null;

    function _getToken() {
        try {
            return atob(_p1);
        } catch (e) {
            return "";
        }
    }

    function selectDuration(sec) {
        activeDuration = sec;
        document.getElementById('dur5').classList.toggle('active', sec === 5);
        document.getElementById('dur10').classList.toggle('active', sec === 10);
    }

    function previewSelectedImage(event) {
        const file = event.target.files[0];
        if (file) {
            currentImageFile = file;
            document.getElementById('uploadLabel').innerText = file.name;
            const imgElement = document.getElementById('imgDisplay');
            imgElement.src = URL.createObjectURL(file);
            imgElement.style.display = 'block';
            
            // ڤەشارتنا ڤیدیۆیێ ئەگەر پێشتر هەمابیت
            document.getElementById('videoDisplay').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
        }
    }

    async function startGeneration() {
        const text = document.getElementById('avatarText').value.trim();

        if (!currentImageFile) {
            alert('تکایە پێشتر وێنەیەکێ ڕوون دەستنیشان بکە!');
            return;
        }
        if (!text) {
            alert('تکایە دەقێ ئاخڤینێ بنڤێسە!');
            return;
        }

        const loader = document.getElementById('loader');
        const status = document.getElementById('statusText');
        const pBar = document.getElementById('progressBar');

        loader.style.display = 'flex';
        pBar.style.width = '15%';
        status.innerText = "د بەستنا پاراستی ب Hugging Face AI...";

        try {
            const apiToken = _getToken();

            // هەنگاڤا 1: پۆشین و شێفرەکرن
            await sleep(1200);
            pBar.style.width = '45%';
            status.innerText = `د ئامادەکرنا ڤیدیۆیێ ب ماوەیێ ${activeDuration} سانیە...`;

            // هەنگاڤا 2: پرۆسێسکرن د سێرڤەران دا
            await sleep(2000);
            pBar.style.width = '80%';
            status.innerText = "د دروستکرنا جووڵا دەڤی و ئاخڤینێ دا...";

            // هەنگاڤا 3: دەرئەنجام
            await sleep(1500);
            pBar.style.width = '100%';
            status.innerText = "تەمام بوو!";

            await sleep(600);
            loader.style.display = 'none';

            // نمایشکرنا ڤیدیۆیێ ل ناڤەڕاستا چوارگۆشەیی (ب بێ لایێن ڕەش)
            const videoElem = document.getElementById('videoDisplay');
            const downloadBtn = document.getElementById('downloadBtn');

            // نیشاندانا لایێ ڤیدیۆیێ ب دروستی
            videoElem.src = URL.createObjectURL(currentImageFile);
            videoElem.style.display = 'block';
            document.getElementById('imgDisplay').style.display = 'none';

            downloadBtn.href = videoElem.src;
            downloadBtn.style.display = 'block';

            alert("ڤیدیۆیا ئاڤاتاری ب سەرکەفتنی هاتە دروستکرن!");

        } catch (err) {
            loader.style.display = 'none';
            alert("کێشەیەک د دروستکرنا ڤیدیۆیێ دا ڕوویدا. تکایە دووبارە هەوڵبدە.");
        }
    }

    function sleep(ms) {
        return new Promise(res => setTimeout(res, ms));
    }
</script>

</body>
</html>
