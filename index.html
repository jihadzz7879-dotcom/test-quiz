<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونێن ویزاری</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: #111111;
            border: 1px solid #1c1c1c;
            border-radius: 24px;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header-section {
            margin-bottom: 35px;
            text-align: center;
            width: 100%;
        }

        .main-title {
            font-size: 26px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .sub-title {
            font-size: 15px;
            color: #b3b3b3;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .subject-btn {
            display: block;
            background-color: #161a23;
            border: 1px solid #252c3a;
            border-radius: 50px;
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            padding: 15px 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        .subject-btn:hover {
            border-color: #d4af37;
            background-color: #1f2635;
            transform: translateY(-2px);
        }

        .footer-text {
            color: #444444;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 35px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-section">
        <div class="main-title">تاقیکرنا ویزاری</div>
        <div class="sub-title">خولا دووێ 2025-2026</div>
    </div>

    <div class="buttons-container">
        <!-- هەمی بابەت ل ڤێرە بێ کۆد ڕاستەوخۆ ڤەدبن -->
        <a href="kurdish.html" class="subject-btn">کوردی</a>
        <a href="arabic.html" class="subject-btn">عەرەبی</a>
        <a href="english.html" class="subject-btn">ئینگلیزی</a>
        <a href="yasa.html" class="subject-btn">یاسا</a>
        <!-- ئەڤە ژی مێژووە کو دچیتە سەر پەیجێ مێژوویێ یێ کۆدکری -->
        <a href="mejo.html" class="subject-btn">مێژوو</a>
        <a href="zindawar.html" class="subject-btn">زیندەوەر</a>
    </div>

    <div class="footer-text">GEHAD ZEBARI</div>
</div>

</body>
</html>
