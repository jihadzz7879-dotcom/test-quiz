<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Smart Assistant Pro - ژیریا دەستکرد</title>
    
    <!-- FontAwesome Pro Icons & CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Web Fonts for Kurdish/Arabic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CORE SYSTEM VARIABLES AND COLOR PALETTE (CSS DESIGN SYSTEM)
           ========================================================================== */
        :root {
            --primary-glow: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-glow: #06b6d4;
            --secondary-hover: #0891b2;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-pink: #ec4899;
            --accent-amber: #f59e0b;
            
            --bg-deep-space: #030712;
            --bg-card-glass: rgba(17, 24, 39, 0.75);
            --bg-card-hover: rgba(31, 41, 55, 0.85);
            --bg-input-field: rgba(15, 23, 42, 0.8);
            
            --bg-bubble-user: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25));
            --bg-bubble-bot: linear-gradient(135deg, rgba(17, 24, 39, 0.9), rgba(30, 41, 59, 0.9));
            
            --border-glass: rgba(255, 255, 255, 0.12);
            --border-glow: rgba(99, 102, 241, 0.4);
            
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            
            --radius-3xl: 32px;
            --radius-2xl: 24px;
            --radius-xl: 18px;
            --radius-lg: 14px;
            --radius-md: 10px;
            
            --shadow-card: 0 30px 60px -12px rgba(0, 0, 0, 0.85);
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.3);
            
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. RESET & BASE STYLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Naskh Arabic', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep-space);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Custom Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-glow);
        }

        /* ==========================================================================
           3. MAIN LAYOUT AND CHAT CONTAINER
           ========================================================================== */
        .app-viewport {
            width: 100%;
            height: 100vh;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card-glass);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
            box-shadow: var(--shadow-card);
            position: relative;
        }

        /* ==========================================================================
           4. APPLICATION HEADER AREA
           ========================================================================== */
        .chat-header {
            padding: 18px 24px;
            background: rgba(10, 15, 30, 0.7);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-avatar-box {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .brand-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .online-indicator {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            background-color: var(--accent-green);
            border: 2px solid var(--bg-deep-space);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .brand-info h2 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .brand-info p {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* ==========================================================================
           5. CHAT MESSAGES SCROLL AREA
           ========================================================================== */
        .chat-messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 82%;
            animation: fadeInMsg 0.35s ease forwards;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user-row {
            align-self: flex-start;
            flex-direction: row;
        }

        .message-row.bot-row {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .user-row .msg-avatar {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-purple));
            color: #fff;
        }

        .bot-row .msg-avatar {
            background: linear-gradient(135deg, var(--secondary-glow), var(--accent-green));
            color: #fff;
        }

        .msg-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: var(--radius-xl);
            font-size: 14px;
            line-height: 1.65;
            word-break: break-word;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .user-row .msg-bubble {
            background: var(--bg-bubble-user);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-top-right-radius: 4px;
            color: #f3f4f6;
        }

        .bot-row .msg-bubble {
            background: var(--bg-bubble-bot);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 4px;
            color: #f9fafb;
        }

        .msg-footer-tools {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-muted);
        }

        .tool-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .tool-action-btn:hover {
            color: var(--secondary-glow);
        }

        /* Voice Waves Indicator for Audio Output */
        .speaking-pulse {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-right: 8px;
        }

        .speaking-bar {
            width: 3px;
            height: 12px;
            background: var(--secondary-glow);
            border-radius: 3px;
            animation: soundWave 0.6s infinite alternate ease-in-out;
        }

        .speaking-bar:nth-child(2) { animation-delay: 0.15s; }
        .speaking-bar:nth-child(3) { animation-delay: 0.3s; }

        @keyframes soundWave {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        /* Typing Indicator dots */
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--text-sub);
            border-radius: 50%;
            animation: typingBounce 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); background: var(--secondary-glow); }
        }

        /* ==========================================================================
           6. INPUT CONTROLS & FOOTER TOOLBAR
           ========================================================================== */
        .chat-input-area {
            padding: 18px 24px 24px;
            background: rgba(10, 15, 30, 0.85);
            border-top: 1px solid var(--border-glass);
            position: relative;
        }

        .input-controls-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-input-field);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-2xl);
            padding: 8px 12px 8px 18px;
            transition: var(--transition-smooth);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .input-controls-wrapper:focus-within {
            border-color: var(--primary-glow);
            box-shadow: var(--shadow-glow), inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .chat-text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.5;
            max-height: 120px;
            resize: none;
        }

        .chat-text-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-purple));
            border: none;
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Settings Bar Options */
        .voice-settings-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 6px;
        }

        .toggle-voice-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: var(--transition-smooth);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        input[type="checkbox"]:checked + .toggle-switch {
            background: var(--accent-green);
        }

        input[type="checkbox"]:checked + .toggle-switch::after {
            transform: translateX(16px);
        }

        input[type="checkbox"] { display: none; }

        /* Quick Suggestion Chips */
        .suggestion-chips-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 8px;
        }

        .chip-item {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .chip-item:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-glow);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="app-viewport">
    
    <!-- Top Header -->
    <header class="chat-header">
        <div class="header-brand">
            <div class="brand-avatar-box">
                <div class="brand-avatar-img">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="online-indicator"></div>
            </div>
            <div class="brand-info">
                <h2>دەنگ و ژیریا دەستکرد</h2>
                <p><i class="fa-solid fa-bolt" style="color: var(--accent-amber);"></i> ئامادەیە بۆ بەرسڤدانێ</p>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-btn" onclick="clearChatHistory()" title="پاککرنا ئاخڤینێ">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            <button class="icon-btn" onclick="toggleAudioMute()" id="muteBtn" title="دەنگ">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </header>

    <!-- Chat Scroll Container -->
    <main class="chat-messages-container" id="chatContainer">
        
        <!-- Welcome Message -->
        <div class="message-row bot-row">
            <div class="msg-avatar">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <div class="msg-content-wrapper">
                <div class="msg-bubble">
                    سلاڤ! ئەز ژیریا دەستکرد مە. هەر پرسیارەکا تە هەبیت بنڤێسە، ئەز دێ ب تەمامی ب کوردی بەرسڤا تە دەم و ب دەنگژی بۆ تە خوێنمەوە!
                </div>
                <div class="msg-footer-tools">
                    <span class="msg-time" id="initTime"></span>
                    <button class="tool-action-btn" onclick="speakText(this.parentNode.previousElementSibling.innerText)">
                        <i class="fa-solid fa-volume-low"></i> دەنگ
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Controls Area -->
    <footer class="chat-input-area">
        
        <!-- Suggestion Chips -->
        <div class="suggestion-chips-wrapper">
            <div class="chip-item" onclick="sendQuickPrompt('چەوا خۆ ب باشی فێری زمانەکێ نوو بکەم؟')">💡 فێربوونا زمانان</div>
            <div class="chip-item" onclick="sendQuickPrompt('کورتەیەک ل سەر چەمکێ ژیریا دەستکرد بنڤێسە')">🤖 ژیریا دەستکرد چییە؟</div>
            <div class="chip-item" onclick="sendQuickPrompt('چەند ئامۆژگاریان بۆ سەرکەفتنا د ژیانێ دا بدە')">⭐ ئامۆژگاریێن ژیانێ</div>
        </div>

        <div class="input-controls-wrapper">
            <textarea class="chat-text-input" id="userInput" rows="1" placeholder="پەیاما خۆ لێرە بنڤێسە..." onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <div class="voice-settings-bar">
            <label class="toggle-voice-label">
                <input type="checkbox" id="autoSpeechToggle" checked>
                <div class="toggle-switch"></div>
                <span>خوێندنەڤەیا دەنگییا ئۆتۆماتیکی (Auto Speech)</span>
            </label>
            <span style="font-size: 11px; color: var(--text-muted);">AI Voice Engine v2.0</span>
        </div>
    </footer>

</div>

<script>
    /* ==========================================================================
       JAVASCRIPT AI CHAT ENGINE & TTS VOICE SYNTHESIS
       ========================================================================== */

    let isAudioMuted = false;

    // Set initial timestamp
    document.getElementById('initTime').innerText = getCurrentTime();

    function getCurrentTime() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        hours = hours < 10 ? '0' + hours : hours;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        return `${hours}:${minutes}`;
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function sendQuickPrompt(promptText) {
        document.getElementById('userInput').value = promptText;
        sendMessage();
    }

    function toggleAudioMute() {
        isAudioMuted = !isAudioMuted;
        const muteBtn = document.getElementById('muteBtn');
        if (isAudioMuted) {
            speechSynthesis.cancel();
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark" style="color:#ef4444;"></i>';
        } else {
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
        }
    }

    function clearChatHistory() {
        if (confirm("ئەرێ تە ڤێت هەموو ئاخڤین پاک ببیت؟")) {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            speechSynthesis.cancel();
        }
    }

    async function sendMessage() {
        const inputElem = document.getElementById('userInput');
        const text = inputElem.value.trim();

        if (!text) return;

        // Display User Message
        appendUserMessage(text);
        inputElem.value = '';

        // Show Typing Indicator
        const typingId = showTypingIndicator();

        // Generate Smart Response
        try {
            const aiResponse = await generateAIResponse(text);
            removeTypingIndicator(typingId);
            appendBotMessage(aiResponse);

            // Auto Speech Synthesis if enabled
            const autoSpeech = document.getElementById('autoSpeechToggle').checked;
            if (autoSpeech && !isAudioMuted) {
                speakText(aiResponse);
            }

        } catch (error) {
            removeTypingIndicator(typingId);
            appendBotMessage("ببوورە، کێشەیەک د وەرگرتنا بەرسڤێ دا ڕوویدا. تکایە دووبارە هەوڵبدەوه.");
        }
    }

    function appendUserMessage(text) {
        const container = document.getElementById('chatContainer');
        const row = document.createElement('div');
        row.className = 'message-row user-row';

        row.innerHTML = `
            <div class="msg-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="msg-content-wrapper">
                <div class="msg-bubble">${escapeHTML(text)}</div>
                <div class="msg-footer-tools">
                    <span class="msg-time">${getCurrentTime()}</span>
                </div>
            </div>
        `;

        container.appendChild(row);
        scrollToBottom();
    }

    function appendBotMessage(text) {
        const container = document.getElementById('chatContainer');
        const row = document.createElement('div');
        row.className = 'message-row bot-row';

        row.innerHTML = `
            <div class="msg-avatar">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <div class="msg-content-wrapper">
                <div class="msg-bubble">${escapeHTML(text)}</div>
                <div class="msg-footer-tools">
                    <span class="msg-time">${getCurrentTime()}</span>
                    <button class="tool-action-btn" onclick="speakText('${escapeQuotes(text)}')">
                        <i class="fa-solid fa-volume-low"></i> دەنگ
                    </button>
                    <button class="tool-action-btn" onclick="copyToClipboard('${escapeQuotes(text)}')">
                        <i class="fa-solid fa-copy"></i> کۆپی
                    </button>
                </div>
            </div>
        `;

        container.appendChild(row);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const container = document.getElementById('chatContainer');
        const id = 'typing_' + Date.now();
        const row = document.createElement('div');
        row.className = 'message-row bot-row';
        row.id = id;

        row.innerHTML = `
            <div class="msg-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="msg-bubble typing-bubble">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;

        container.appendChild(row);
        scrollToBottom();
        return id;
    }

    function removeTypingIndicator(id) {
        const elem = document.getElementById(id);
        if (elem) elem.remove();
    }

    // Smart Local Fallback Response Engine
    async function generateAIResponse(query) {
        await new Promise(res => setTimeout(res, 800)); // Simulate thinking delay

        const q = query.toLowerCase();

        if (q.includes("سلاف") || q.includes("سڵاو") || q.includes("مرحبا")) {
            return "سلاڤ و ڕێز! سەرچاڤان، ئەز چەوا دکارم هاریکارییا تە بکەم ئەڤرۆ؟";
        } else if (q.includes("چەوا") || q.includes("چۆن") || q.includes("چبکەم")) {
            return "بۆ ڤێ بابەتێ، هەمی دەمان باشترین ڕێکار ئەوە کو ئامانجێن خۆ دیار بکەی و هەنگاو ب هەنگاو دەست پێ بکەی. ئەگەر تە زانیاریێن زێدەتر ڤێن، تەنێ وردەکارییان بنڤێسە!";
        } else if (q.includes("سوپاس") || q.includes("دەست خۆش")) {
            return "سەرچاڤان برا! ئەز گەلەک دڵخۆشم کو شیام هاریکارییا تە بکەم. بێگومان هەر دەم لێرەم بۆ تە.";
        } else if (q.includes("ناڤێ تە چییە") || q.includes("تو کەی")) {
            return "ئەز ئۆتۆماتیک سیستمێ ژیریا دەستکردم کو تایبەت بۆ بەرسڤدانا تە ب دەنگ و دەق هاتییە دروستکرن.";
        } else {
            return `تە گۆت: "${query}". ئەڤە بابەتەکێ زۆر گرنگە! ژیریا دەستکرد تەواو پشتگیرییا ئاخڤینێن تە دکەت و دکاریت د هەموو بواران دا وەڵامێن بەرفراوانت پێ ببات.`;
        }
    }

    // High quality Web Speech API implementation
    function speakText(text) {
        if (isAudioMuted) return;

        speechSynthesis.cancel(); // Stop current playing sound

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA'; // Native pitch fallback for Kurdish syntax
        utterance.rate = 0.95;
        utterance.pitch = 1.0;

        speechSynthesis.speak(utterance);
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert("دەق ب سەرکەفتنی کۆپی بوو!");
    }

    function scrollToBottom() {
        const container = document.getElementById('chatContainer');
        container.scrollTop = container.scrollHeight;
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    function escapeQuotes(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
</script>
