<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیكرنا یاسا</title>
    <style>
        /* ستایلێ گشتی یێ لاپەرەی */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* كادرێ سەرەكی یێ تاقیكرنێ */
        .quiz-container {
            background-color: #121212;
            border: 2px solid #d4af37; /* رەنگێ زێری */
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.1);
        }

        /* ناڤنیشانێ سەرەکی */
        .quiz-title {
            color: #d4af37;
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* بن-ناڤنیشان */
        .quiz-subtitle {
            text-align: center;
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* كادرێ هەر پرسیارەكێ */
        .question-section {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffffff;
        }

        /* ستایلێ پۆپۆلا بەرسڤان */
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 14px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* گوهۆرینا رەنگی دەما مشك دچیتە سەر */
        .option-item:hover {
            border-color: #d4af37;
            background-color: #222222;
        }

        .option-text {
            font-size: 15px;
            color: #e0e0e0;
        }

        /* ستایلێ بازنێ هەلبژارتنێ (Radio Button) */
        .option-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #666666;
            border-radius: 50%;
            outline: none;
            margin: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        /* دەما بەرسڤ دهێتە هەلبژارتن */
        .option-item input[type="radio"]:checked {
            border-color: #d4af37;
            background-color: #d4af37;
        }

        .option-item input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            background-color: #121212;
            border-radius: 50%;
        }

        /* دوگمەیا ئەنجامان */
        .submit-btn {
            display: block;
            width: 100%;
            background-color: #d4af37;
            color: #121212;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: #bfa030;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-title">تاقیکرنا یاسا</div>
        <div class="quiz-subtitle">بۆ دەستپێکرنا تاقیکرنێ بەرسڤا پرسیاران بدە</div>

        <form>
            <!-- پرسیارا ئێکێ -->
            <div class="question-section">
                <div class="question-text">١. پرسیار ل ڤێرە دێ هێتە نڤیساندن؟</div>
                <ul class="options-list">
                    <label class="option-item">
                        <span class="option-text">بەرسڤا ئێکێ (یا راست)</span>
                        <input type="radio" name="q1" value="a">
                    </label>
                    <label class="option-item">
                        <span class="option-text">بەرسڤا دووێ</span>
                        <input type="radio" name="q1" value="b">
                    </label>
                    <label class="option-item">
                        <span class="option-text">بەرسڤا سێیێ</span>
                        <input type="radio" name="q1" value="c">
                    </label>
                </ul>
            </div>

            <!-- پرسیارا دووێ -->
            <div class="question-section">
                <div class="question-text">٢. پرسیارا دووێ ل ڤێرە بنڤیسە؟</div>
                <ul class="options-list">
                    <label class="option-item">
                        <span class="option-text">بەرسڤا ئێکێ</span>
                        <input type="radio" name="q2" value="a">
                    </label>
                    <label class="option-item">
                        <span class="option-text">بەرسڤا دووێ (یا راست)</span>
                        <input type="radio" name="q2" value="b">
                    </label>
                    <label class="option-item">
                        <span class="option-text">بەرسڤا سێیێ</span>
                        <input type="radio" name="q2" value="c">
                    </label>
                </ul>
            </div>

            <!-- دوگمەیا رەوانەكرنێ -->
            <button type="submit" class="submit-btn">ئەنجامێن تاقیکرنێ دیار بکه</button>
        </form>
    </div>

</body>
</html>
