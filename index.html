<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکرنا ڤیزاری</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .golden-box { border: 2px dashed #f1c40f; padding: 15px; border-radius: 20px; background: #1e1e1e; margin: 20px 0; }
        .subject-btn { display: block; width: 100%; padding: 18px; margin: 10px 0; background: #1a2a6c; color: white; border: 1px solid #2d3e8e; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .subject-btn:hover { background: #2d3e8e; }
    </style>
</head>
<body>

<div class="container">
    <h1>تاقیکرنا ڤیزاری</h1>
    <p style="color: #888;">خولا دووی 2026-2025</p>

    <div class="golden-box">
        <p style="font-size: 14px;">⭐ "هیچ تشتەک مەحال نینە کاتێ تو بریاری بدەی بگەهییە خەونا خۆ... هێشتا دەم یێ ل پێشیا تە، ب هێز بە!"</p>
        <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">
        <p style="font-weight: bold;">ماوە بۆ ئەزموونێ:</p>
        <h3 id="timer" style="color: #f1c40f;">دەم دهێتە بارکرن...</h3>
    </div>

    <a href="eslam.html" class="subject-btn">ئیسلامی</a>
    <a href="fizya.html" class="subject-btn">فیزیا</a>
    <a href="english.html" class="subject-btn">ئینگلیزی</a>
    <a href="arabic.html" class="subject-btn">عەرەبی</a>
    <a href="kurdish.html" class="subject-btn">کوردی</a>
    <a href="yasa.html" class="subject-btn">یاسا</a>
    <a href="ark.html" class="subject-btn">ئەرک</a>
</div>

<script>
    // رێکەفتێ ئەزموونێ: 14 حوزەیران 2026، دەمژمێر 07:30 سبێدێ
    const targetDate = new Date("June 14, 2026 07:30:00").getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("timer").innerHTML = days + " رۆژ و " + hours + " سەعەت و " + minutes + " دەقە و " + seconds + " چرکە";

        if (distance < 0) {
            clearInterval(timer);
            document.getElementById("timer").innerHTML = "ئەزموون دەست پێ کر!";
        }
    }, 1000);
</script>
</body>
</html>
