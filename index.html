<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروستکەرێ لینکان | Bio Link Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      direction: rtl;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      width: 100%;
      max-width: 900px;
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .form-section, .preview-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      font-size: 1.2rem;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 8px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    /* Preview Card */
    .preview-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #38bdf8;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .name-preview {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .bio-preview {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-item {
      display: block;
      width: 100%;
      padding: 12px;
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid #334155;
      font-weight: 500;
      transition: 0.2s;
    }

    .link-item:hover {
      background: #38bdf8;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Form Side -->
    <div class="form-section">
      <h2>زانیاریێن خۆ بنڤێسە</h2>
      <input type="text" id="nameInput" placeholder="ناڤێ تە" oninput="updatePreview()">
      <input type="text" id="bioInput" placeholder="دەربارەی تە (Bio)" oninput="updatePreview()">
      
      <h2>زێدەکرنا لینکەکی</h2>
      <input type="text" id="linkTitle" placeholder="سەردێڕێ لینکی (مێنک: اینستاگرام)">
      <input type="url" id="linkUrl" placeholder="لینک (https://...)">
      <button onclick="addLink()">زێدەکرنا لینکی</button>
    </div>

    <!-- Preview Side -->
    <div class="preview-section">
      <h2>دیمەنێ پێشوەختە (Preview)</h2>
      <div class="preview-card">
        <div class="avatar-preview" id="avatarText">؟</div>
        <div class="name-preview" id="nameDisplay">ناڤێ تە ل ڤێرە</div>
        <div class="bio-preview" id="bioDisplay">دەربارەی تە دا ل ڤێرە دیار بێت</div>
        <div class="links-list" id="linksContainer"></div>
      </div>
    </div>
  </div>

  <script>
    function updatePreview() {
      const name = document.getElementById('nameInput').value;
      const bio = document.getElementById('bioInput').value;

      document.getElementById('nameDisplay').innerText = name || 'ناڤێ تە ل ڤێرە';
      document.getElementById('bioDisplay').innerText = bio || 'دەربارەی تە دا ل ڤێرە دیار بێت';
      
      const avatarText = name ? name.charAt(0).toUpperCase() : '؟';
      document.getElementById('avatarText').innerText = avatarText;
    }

    function addLink() {
      const title = document.getElementById('linkTitle').value;
      const url = document.getElementById('linkUrl').value;

      if (!title || !url) {
        alert('تکایە هەردوو خانەیان پڕبکە!');
        return;
      }

      const linksContainer = document.getElementById('linksContainer');
      const newLink = document.createElement('a');
      newLink.href = url;
      newLink.target = '_blank';
      newLink.className = 'link-item';
      newLink.innerText = title;

      linksContainer.appendChild(newLink);

      // Clear inputs
      document.getElementById('linkTitle').value = '';
      document.getElementById('linkUrl').value = '';
    }
  </script>

</body>
</html>
