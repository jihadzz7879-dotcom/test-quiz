<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلاتفۆرما تاقیکردنێن پۆلا 12</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --hover-color: #0284c7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-in-out;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .subjects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            padding: 1rem;
        }

        .subject-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .subject-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #f1f5f9;
        }

        .btn-start {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
            width: 100%;
            display: block;
        }

        .btn-start:hover {
            background: var(--hover-color);
        }

        /* تایبەت مەندیا فۆکەس بۆ فیزیا */
        .physics-featured {
            border: 2px solid rgba(56, 189, 248, 0.5);
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(14, 165, 233, 0.15));
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .subjects-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>تاقیکردنێن ویزاری پۆلا 12</h1>
        <p>خۆلا دووێ 2025-2026 - بابەتێ خۆ هەلبژێره بۆ دەستپێکرنێ</p>
    </header>

    <div class="subjects-container">

        <!-- فیزیا - ل سەر داخوازا تە هاتیە پێشخستن -->
        <div class="subject-card physics-featured" onclick="location.href='fizya.html'">
            <div>
                <div class="icon">⚛️</div>
                <h3>فیزیا</h3>
            </div>
            <a href="fizya.html" class="btn-start">دەستپێبکە</a>
        </div>

        <!-- کوردی -->
        <div class="subject-card" onclick="location.href='kurdish.html'">
            <div>
                <div class="icon">📜</div>
                <h3>کوردی</h3>
            </div>
            <a href="kurdish.html" class="btn-start">دەستپێبکە</a>
        </div>

        <!-- عەرەبی -->
        <div class="subject-card" onclick="location.href='arabic.html'">
            <div>
                <div class="icon">✍️</div>
                <h3>عەرەبی</h3>
            </div>
            <a href="arabic.html" class="btn-start">دەستپێبکە</a>
        </div>

        <!-- ئینگلیزی -->
        <div class="subject-card" onclick="location.href='english.html'">
            <div>
                <div class="icon">🇬🇧</div>
                <h3>ئینگلیزی</h3>
            </div>
            <a href="english.html" class="btn-start">دەستپێبکە</a>
        </div>

        <!-- زیندەوەرزانی -->
        <div class="subject-card" onclick="location.href='zindawar.html'">
            <div>
                <div class="icon">🧬</div>
                <h3>زیندەوەرزانی</h3>
            </div>
            <a href="zindawar.html" class="btn-start">دەستپێبکە</a>
        </div>

        <!-- مێژوو -->
        <div class="subject-card" onclick="location.href='mejo.html'">
            <div>
                <div class="icon">⏳</div>
                <h3>مێژوو</h3>
            </div>
            <a href="mejo.html" class="btn-start">دەستپێبکە</a>
        </div>

        <!-- ئیسلامی -->
        <div class="subject-card" onclick="location.href='eslame.html'">
            <div>
                <div class="icon">🕌</div>
                <h3>ئیسلامی</h3>
            </div>
            <a href="eslame.html" class="btn-start">دەستپێبکە</a>
        </div>

    </div>

</body>
</html>
