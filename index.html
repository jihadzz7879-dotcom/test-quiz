<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلاتفۆرمی شاهانە یا قوتابیان & JEHAD</title>
    <!-- گەهاندنا پەرتووکخانا PeerJS بۆ چاتا لایڤ و دەنگی -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;900&display=swap');

        :root {
            --bg-gradient: linear-gradient(180deg, #0f1123 0%, #070814 100%);
            --gold: #facc15;
            --gold-glow: rgba(250, 204, 21, 0.4);
            --card-glass: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --cyan-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --pink-gradient: linear-gradient(135deg, #e100ff 0%, #7928ca 100%);
            --admin-gradient: linear-gradient(135deg, #ff0055 0%, #990033 100%);
            --text-light: #f8fafc;
            --text-muted: #6b7280;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg-gradient); 
            color: var(--text-light); 
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        .main-wrapper {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .main-wrapper { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            .main-card { height: 85vh !important; }
        }

        .main-card {
            background: rgba(21, 24, 46, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- بەشێ پلاتفۆرمی ئەزموونان --- */
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h1 { font-size: 32px; font-weight: 900; text-shadow: 0 0 20px var(--gold-glow); }
        .brand-header p { color: var(--text-muted); font-size: 13px; font-weight: 600; margin-top: 4px; }
        .section-title { font-size: 17px; font-weight: 900; color: var(--gold); margin-bottom: 20px; text-align: center; }
        .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; overflow-y: auto; }
        
        .subject-item { 
            display: flex; align-items: center; justify-content: space-between; padding: 15px 14px; 
            background: rgba(255,255,255,0.02); color: #f1f5f9; border-radius: 20px; border: 1px solid var(--card-border); font-weight: 700; font-size: 14px; transition: 0.3s; text-decoration: none;
        }
        .subject-item:hover { border-color: var(--gold); background: rgba(250, 204, 21, 0.06); transform: translateY(-3px); }

        .lock-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #040815, #090d1f);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 999;
        }
        .code-input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: white; text-align: center; margin-bottom: 15px; font-size: 16px; font-weight: 700; }
        .activate-btn { width: 100%; background: linear-gradient(90deg, var(--gold), #fbbf24); color: #020617; border: none; padding: 14px; border-radius: 14px; font-weight: 900; cursor: pointer; }

        /* --- بەشێ کۆڕبەندا لایڤ و دەنگی یا قوتابیان --- */
        .chat-header { padding: 15px; background: rgba(255, 255, 255, 0.02); border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 10px; }
        .group-info-chat { display: flex; align-items: center; gap: 12px; text-align: right; width: 100%; }
        .group-avatar-chat { width: 46px; height: 46px; background: var(--cyan-gradient); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .group-details-chat h2 { font-size: 1.1rem; font-weight: 700; }
        .group-details-chat p { font-size: 0.8rem; color: #00f2fe; font-weight: 600; }
        
        /* کۆنترۆلا تەلەفۆنێ */
        .call-controls { display: flex; gap: 10px; width: 100%; margin-top: 5px; }
        .call-btn { flex: 1; padding: 10px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #000; }
        .btn-start-call { background: var(--cyan-gradient); }
        .btn-end-call { background: #ff0055; color: #fff; display: none; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; text-align: right; }
        .message-wrapper { display: flex; gap: 10px; max-width: 85%; align-self: flex-start; }
        .message-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }
        
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--pink-gradient); color: #fff; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
        .message-wrapper.me .user-avatar { background: var(--cyan-gradient); color: #000; }
        .message-wrapper.admin-msg .user-avatar { background: var(--admin-gradient) !important; color: #fff !important; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
        
        .message-content { display: flex; flex-direction: column; gap: 4px; }
        .user-name { font-size: 0.78rem; color: rgba(255, 255, 255, 0.45); font-weight: 600; }
        .admin-badge { background: #ff0055; color: #fff; padding: 1px 6px; border-radius: 6px; font-size: 10px; font-weight: 900; margin-right: 5px; }
        
        .message-text { padding: 10px 16px; border-radius: 18px; font-size: 0.92rem; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.04); border-top-right-radius: 4px; color: #e2e8f0; }
        .message-wrapper.me .message-text { background: rgba(0, 242, 254, 0.06); border: 1px solid rgba(0, 242, 254, 0.2); border-top-right-radius: 18px; border-top-left-radius: 4px; }
        .message-wrapper.admin-msg .message-text { border: 1px solid rgba(255, 0, 85, 0.3); background: rgba(255, 0, 85, 0.05); }

        .typing-indicator { font-size: 0.8rem; color: #00f2fe; padding: 0px 15px 8px 15px; font-weight: 600; display: none; text-align: right; animation: pulseText 1.5s infinite; }
        @keyframes pulseText { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .chat-input-area { padding: 15px; background: rgba(7, 8, 20, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; gap: 10px; align-items: center; }
        .input-wrapper { flex: 1; display: flex; gap: 10px; align-items: center; flex-direction: row-reverse; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 14px; color: #fff; font-size: 0.92rem; outline: none; text-align: right; }
        
        .send-btn { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border: none; padding: 0 20px; height: 44px; border-radius: 14px; color: #020204; font-weight: 900; font-size: 0.9rem; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- بەشێ یەکەم: ئەزموونێن JEHAD -->
        <div class="main-card">
            <div id="lock-screen" class="lock-container">
                <div style="font-size:18px; font-weight:900; color:var(--gold); margin-bottom:8px;">سیستەم یێ قوفڵکریە!</div>
                <input type="text" id="code-field" class="code-input" placeholder="کۆدێ داخڵبوونێ لێدە...">
                <button class="activate-btn" onclick="validateActivationCode()">پشکنین و چوونە ژوورێ</button>
            </div>

            <div id="subjects-menu">
                <div class="brand-header">
                    <h1>JEHAD PROVISOR</h1>
                    <p>سیستەمێ ئەلیکترۆنی یێ پۆلا ١٢</p>
                </div>
                <div class="section-title">✨ بابەتێن تاقیکردنەوەیێ</div>
                <div class="grid-layout">
                    <a href="#" class="subject-item"><span class="btn-text">فیزیا</span><span>⚛️</span></a>
                    <a href="#" class="subject-item"><span class="btn-text">مێژوو</span><span>📜</span></a>
                    <a href="#" class="subject-item"><span class="btn-text">کوردی</span><span>✒️</span></a>
                    <a href="#" class="subject-item"><span class="btn-text">کیمیا</span><span>🔬</span></a>
                </div>
            </div>
        </div>

        <!-- بەشێ دووەم: کۆڕبەندا لایڤ و دەنگی یا قوتابیان -->
        <div class="main-card">
            <div class="chat-header">
                <div class="group-info-chat">
                    <div class="group-avatar-chat">📞</div>
                    <div class="group-details-chat">
                        <h2>کۆڕبەندا لایڤ یا قوتابیان</h2>
                        <p id="connectionStatus">ل هێڤیا گرێدانێ یە...</p>
                    </div>
                </div>
                <!-- بەشێ تەلەفۆنا دەنگی -->
                <div class="call-controls">
                    <button class="call-btn btn-start-call" id="startCallBtn">🎙️ دەستپێکرنا تەلەفۆنا دەنگی</button>
                    <button class="call-btn btn-end-call" id="endCallBtn">🛑 داخستنا تەلەفۆنێ</button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>
            <div class="typing-indicator" id="typingIndicator">قوتابیەک نامەکێ دنڤیسیت...</div>

            <div class="chat-input-area">
                <button class="send-btn" id="sendBtn">ناردن</button>
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="نامەکێ تایبەت بنڤیسە..." autocomplete="off">
                </div>
            </div>
        </div>

    </div>

    <script>
        const ALLOWED_ACCESS_CODES = ["JEHAD78", "JEHAD79"];
        
        // جوداکرنا ناسنامەیا ئەدمینی ژ قوتابیان
        const isAdmin = confirm("تۆ خودانێ پلاتفۆرمێ (ADMIN)؟");
        const myAnonymousID = isAdmin ? "خودانێ پلاتفۆرمێ (ADMIN)" : "قوتابی_" + Math.floor(1000 + Math.random() * 9000);

        function validateActivationCode() {
            const inputVal = document.getElementById("code-field").value.trim().toUpperCase();
            if (ALLOWED_ACCESS_CODES.includes(inputVal)) {
                document.getElementById("lock-screen").classList.add("hidden");
            } else { alert("❌ کۆد خەلەتە!"); }
        }

        // --- سیستەمێ چات و تەلەفۆنا دەنگی ب PeerJS ---
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const typingIndicator = document.getElementById('typingIndicator');
        const startCallBtn = document.getElementById('startCallBtn');
        const endCallBtn = document.getElementById('endCallBtn');

        let localStream;
        let currentCall;
        let typingTimeout;

        // دروستکرنا ژوورەکا جێگیر بۆ پەیوەندیێ
        const peer = new Peer('student-premium-voice-room');
        let connections = [];

        peer.on('open', () => { updateOnlineCount(); });
        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                const clientPeer = new Peer();
                clientPeer.on('open', () => {
                    const conn = clientPeer.connect('student-premium-voice-room');
                    handleConnection(conn);
                });
                // وەرگرتنا تەلەفۆنێ ل دەف قوتابیان
                clientPeer.on('call', (call) => {
                    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                        call.answer(stream);
                        handleIncomingCall(call);
                    });
                });
            }
        });

        peer.on('connection', handleConnection);
        
        // ئەگەر پەیوەندی بۆ ئەدمینی هات
        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                call.answer(stream);
                handleIncomingCall(call);
            });
        });

        function handleConnection(conn) {
            connections.push(conn);
            conn.on('open', () => { updateOnlineCount(); });
            conn.on('data', (data) => {
                if (data.type === "TYPING") {
                    if (data.isTyping) {
                        typingIndicator.innerText = `${data.sender} نامەکێ دنڤیسیت...`;
                        typingIndicator.style.display = 'block';
                    } else { typingIndicator.style.display = 'none'; }
                    return;
                }
                typingIndicator.style.display = 'none';
                renderMessageHTML(data.sender, data.text, data.sender.includes("ADMIN"));
            });
        }

        // دەستپێکرنا تەلەفۆنێ
        startCallBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                startCallBtn.style.display = 'none';
                endCallBtn.style.display = 'flex';
                
                // تەلەفۆن بۆ هەمی سەرخەتان بچیت
                connections.forEach(conn => {
                    const call = peer.call(conn.peer, localStream);
                    handleIncomingCall(call);
                });
                alert("🎙️ تەلەفۆنا دەنگی دەستپێکر! دەنگێ تە یێ لایڤە.");
            } catch (err) {
                alert("پێویستە مۆڵەتا مایکرۆفۆنی بدەی بۆ باخفتنێ!");
            }
        });

        function handleIncomingCall(call) {
            currentCall = call;
            const audio = document.createElement('audio');
            call.on('stream', (remoteStream) => {
                audio.srcObject = remoteStream;
                audio.play();
            });
            endCallBtn.style.display = 'flex';
            startCallBtn.style.display = 'none';
        }

        endCallBtn.addEventListener('click', () => {
            if (currentCall) currentCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            startCallBtn.style.display = 'flex';
            endCallBtn.style.display = 'none';
            alert("🛑 تەلەفۆن هاتە داخستن.");
        });

        // سیستەمێ نڤیسینێ
        messageInput.addEventListener('input', () => {
            connections.forEach(conn => { if (conn.open) conn.send({ type: "TYPING", sender: myAnonymousID, isTyping: true }); });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                connections.forEach(conn => { if (conn.open) conn.send({ type: "TYPING", sender: myAnonymousID, isTyping: false }); });
            }, 2000);
        });

        function handleSend() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            // ناردن بتنێ بۆ کەسێ بەرامبەر (نامە د لایەنێ سێیەم دا دیار نابن)
            connections.forEach(conn => {
                if (conn.open) conn.send({ sender: myAnonymousID, text: text });
            });

            renderMessageHTML(myAnonymousID, text, isAdmin, true);
            messageInput.value = '';
        }

        function renderMessageHTML(sender, text, isSenderAdmin, isMe = false) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper');
            if (isMe) wrapper.classList.add('me');
            if (isSenderAdmin) wrapper.classList.add('admin-msg');

            wrapper.innerHTML = `
                <div class="user-avatar">${isSenderAdmin ? '👑' : (isMe ? 'تۆ' : 'ق')}</div>
                <div class="message-content">
                    <span class="user-name">${sender} ${isSenderAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}</span>
                    <div class="message-text">${text}</div>
                </div>
            `;
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSend);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

        function updateOnlineCount() {
            let activeCount = connections.filter(c => c.open).length + 1;
            connectionStatus.innerText = `● ل سەر هێڵ: ${activeCount} قوتابی یێ پشکدارن`;
        }
    </script>
</body>
</html>
