<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Sports Live HD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090615 0%, #020106 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* بەشی قفڵ بە ڕەمز */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #05030b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .lock-box {
            background: #110c24;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            border: 1px solid rgba(0, 242, 254, 0.2);
            max-width: 360px;
            width: 90%;
        }

        .lock-box h2 {
            margin-bottom: 20px;
            color: #00f2fe;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .lock-box input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid #1e173e;
            background: #090615;
            color: #00f2fe;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 6px;
            outline: none;
        }

        .lock-box button {
            background: linear-gradient(45deg, #00f2fe, #ff007f);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .lock-box button:hover {
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ff3838;
            margin-top: 12px;
            display: none;
            font-size: 0.95rem;
        }

        /* بەشی سەرەکی ماڵپەڕ */
        #main-content {
            display: none;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        header {
            margin-bottom: 30px;
            margin-top: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(45deg, #00f2fe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        header p {
            color: #797393;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* دوگمەی کەناڵەکان بە شێوازی مۆدێرن */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .btn-ch {
            background: linear-gradient(135deg, #18123a 0%, #0f0b24 100%);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px 15px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-ch:hover {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
        }

        .btn-ch:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h2>تکایە ڕەمزەکە بنووسە</h2>
            <input type="password" id="pin-input" placeholder="••••" maxlength="4">
            <button onclick="checkPin()">چوونە ژوورەوە</button>
            <p class="error-msg" id="error-txt">ڕەمزەکە هەڵەیە! دووبارە تاقیکەرەوە.</p>
        </div>
    </div>

    <div id="main-content">
        <header>
            <h1>GLOBAL SPORTS LIVE</h1>
            <p>کلیك لەسەر هەر کەناڵێک بکە بۆ سەیرکردنی لایڤی یارییەکان بەبێ کێشە</p>
        </header>

        <div class="channels-grid">
            <a href="https://www.youtube.com/c/beINSPORTS/live" target="_blank" class="btn-ch">beIN Sports Live</a>
            <a href="https://www.youtube.com/c/alkasstv/live" target="_blank" class="btn-ch">Al Kass Live</a>
            <a href="https://www.youtube.com/c/AbuDhabiSportsTV/live" target="_blank" class="btn-ch">AD Sports Live</a>
            <a href="https://www.youtube.com/c/SaudiSportsTV/live" target="_blank" class="btn-ch">KSA Sports Live</a>
            <a href="https://www.youtube.com/c/aljazeera/live" target="_blank" class="btn-ch">Al Jazeera Live</a>
            <a href="https://www.youtube.com/c/SkyNewsArabia/live" target="_blank" class="btn-ch">Sky News Live</a>
        </div>
    </div>

    <script>
        // پشکنینی ڕەمزی 2222
        function checkPin() {
            const input = document.getElementById('pin-input').value;
            const error = document.getElementById('error-txt');
            
            if (input === '2222') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                error.style.display = 'block';
                document.getElementById('pin-input').value = '';
            }
        }

        // بۆ ئەوەی بە Enter-ی کیبۆردیش ڕەمزەکە کار بکات
        document.getElementById('pin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { checkPin(); }
        });
    </script>

</body>
</html>
