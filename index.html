<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ئامڕازێن ڕۆژانە | Daily Utility Hub</title>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #38bdf8;
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
    }

    .tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      flex: 1 1 40%;
      text-align: center;
    }

    .tab-btn.active, .tab-btn:hover {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card.active {
      display: block;
    }

    .card h2 {
      font-size: 1.2rem;
      color: #38bdf8;
      margin-bottom: 15px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #38bdf8;
    }

    button.action-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button.action-btn:hover {
      background: #0369a1;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: #38bdf8;
    }

    #qrcode-box {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>کۆمکەرێ ئامڕازێن خێرا</h1>
    <p>ئامڕازێن سادە و مفادار بۆ کارهێنانا ڕۆژانە</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('qr')">دروستکەرێ QR</button>
    <button class="tab-btn" onclick="switchTab('bmi')">کێش و تەندروستی (BMI)</button>
    <button class="tab-btn" onclick="switchTab('counter')">ژمێرەرا پەیڤان</button>
    <button class="tab-btn" onclick="switchTab('grade')">بژمێرا نمران</button>
  </div>

  <!-- 1. QR Code Generator -->
  <div id="qr" class="card active">
    <h2>دروستکەرێ کۆدێ QR</h2>
    <div class="input-group">
      <label>لینک یان دەق بنڤێسە:</label>
      <input type="text" id="qrText" placeholder="https://example.com">
    </div>
    <button class="action-btn" onclick="generateQR()">دروستکرن</button>
    <div id="qrcode-box" style="display:none;"></div>
  </div>

  <!-- 2. BMI Calculator -->
  <div id="bmi" class="card">
    <h2>حسابکرنا کێشێ (BMI)</h2>
    <div class="input-group">
      <label>درێژی (ب سەنتیمەتر):</label>
      <input type="number" id="height" placeholder="مێنک: 175">
    </div>
    <div class="input-group">
      <label>کێش (ب کیلوگرام):</label>
      <input type="number" id="weight" placeholder="مێنک: 70">
    </div>
    <button class="action-btn" onclick="calcBMI()">حسابکرن</button>
    <div class="result" id="bmiResult" style="display:none;"></div>
  </div>

  <!-- 3. Word Counter -->
  <div id="counter" class="card">
    <h2>ژمێرەرا پەیڤ و پیتان</h2>
    <div class="input-group">
      <label>دەقێ خۆ ل ڤێرە بنڤێسە یان پەست بکە:</label>
      <textarea id="textInput" rows="5" oninput="countText()"></textarea>
    </div>
    <div class="result" id="textResult">پەیڤ: 0 | پیت: 0</div>
  </div>

  <!-- 4. Grade Calculator -->
  <div id="grade" class="card">
    <h2>بژمێرا تێکڕایێ نمران</h2>
    <div class="input-group">
      <label>نمرێن خۆ ب فاریزە (,) ژێک جودا بکە:</label>
      <input type="text" id="gradesInput" placeholder="مێنک: 85, 90, 78, 92">
    </div>
    <button class="action-btn" onclick="calcGrade()">حسابکرنا تێکڕایێ</button>
    <div class="result" id="gradeResult" style="display:none;"></div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // QR Generator
    let qrcode = null;
    function generateQR() {
      const text = document.getElementById('qrText').value;
      const box = document.getElementById('qrcode-box');
      if (!text) return;

      box.innerHTML = '';
      box.style.display = 'flex';
      new QRCode(box, {
        text: text,
        width: 150,
        height: 150
      });
    }

    // BMI Calculator
    function calcBMI() {
      const h = parseFloat(document.getElementById('height').value) / 100;
      const w = parseFloat(document.getElementById('weight').value);
      const res = document.getElementById('bmiResult');

      if (!h || !w) return;
      const bmi = (w / (h * h)).toFixed(1);
      
      let status = '';
      if (bmi < 18.5) status = 'کێشا تە کەمە';
      else if (bmi < 25) status = 'کێشا تە ئاسایی و تەندروستە';
      else if (bmi < 30) status = 'زێدەدەهیا کێشێ هەیا';
      else status = 'قەلەویا پلە بەرز';

      res.style.display = 'block';
      res.innerText = `ئەنجام (BMI): ${bmi} - (${status})`;
    }

    // Word Counter
    function countText() {
      const txt = document.getElementById('textInput').value.trim();
      const words = txt ? txt.split(/\s+/).length : 0;
      const chars = txt.length;
      document.getElementById('textResult').innerText = `پەیڤ: ${words} | پیت: ${chars}`;
    }

    // Grade Calculator
    function calcGrade() {
      const val = document.getElementById('gradesInput').value;
      const res = document.getElementById('gradeResult');
      if (!val) return;

      const arr = val.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
      if (arr.length === 0) return;

      const sum = arr.reduce((a, b) => a + b, 0);
      const avg = (sum / arr.length).toFixed(1);

      res.style.display = 'block';
      res.innerText = `تێکڕایێ نمرێن تە: %${avg}`;
    }
  </script>

</body>
</html>
