<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Talking Avatar (100% Bêberamber)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Gradio Client بۆ بەستنەوە ب سێرڤەرێن بێبەرامبەر -->
    <script type="module">
        import { client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";
        window.GradioClient = client;
    </script>

    <style>
        :root {
            --bg-dark: #070a12;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1035 0%, #070a12 85%);
            --card-bg: rgba(18, 24, 41, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .free-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(10, 14, 26, 0.5);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
        }

        input[type="file"] { display: none; }

        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            resize: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .preview-wrapper {
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            min-height: 220px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-wrapper img, .preview-wrapper video {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
        }

        .loader {
            position: absolute;
            inset: 0;
            background: rgba(7, 10, 18, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-download {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: var(--accent-green);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AI Avatar Free Studio</h1>
        <div class="free-badge"><i class="fa-solid fa-bolt"></i> 100% بێبەرامبەر ب بێ کارتا بانکی</div>
    </div>

    <div class="form-group">
        <label>1. وێنەیەکێ ڕوون دەستنیشان بکە:</label>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-image" style="font-size: 20px; color: var(--accent-cyan);"></i>
            <span id="uploadStatus" style="display:block; font-size: 12px; margin-top: 4px;">کرتێ بکە بۆ هەڵبژارتن</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImg(event)">
    </div>

    <div class="form-group">
        <label>2. دەقێ ئاخڤینێ بنڤێسە:</label>
        <textarea id="speechText" placeholder="لێرە بنڤێسە..."></textarea>
    </div>

    <button class="btn-submit" onclick="makeTalkingVideo()">
        <i class="fa-solid fa-play"></i> دروستکرنا ڤیدیۆیێ
    </button>

    <div class="preview-wrapper">
        <img id="imagePreview" style="display:none;">
        <video id="videoResult" controls playsinline style="display:none;"></video>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span id="loadText" style="font-size: 11px; color: #cbd5e1;">د ئامادەکرنێ دا یە...</span>
        </div>
    </div>

    <a id="downloadBtn" class="btn-download" target="_blank" download="AI_Talking_Avatar.mp4">
        <i class="fa-solid fa-download"></i> داگرتنا ڤیدیۆیێ
    </a>
</div>

<script>
    let selectedBlob = null;

    function previewImg(e) {
        const file = e.target.files[0];
        if (file) {
            selectedBlob = file;
            document.getElementById('uploadStatus').innerText = file.name;
            const img = document.getElementById('imagePreview');
            img.src = URL.createObjectURL(file);
            img.style.display = 'block';
            document.getElementById('videoResult').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
        }
    }

    async function makeTalkingVideo() {
        const text = document.getElementById('speechText').value.trim();
        if (!selectedBlob) return alert('تکایە وێنەیەکێ هەڵبژێڕە!');
        if (!text) return alert('تکایە دەقەکێ بنڤێسە!');

        const loader = document.getElementById('loader');
        const loadText = document.getElementById('loadText');
        loader.style.display = 'flex';
        loadText.innerText = "د پەیوەندیکرنێ ب سێرڤەرێ بێبەرامبەر...";

        try {
            // پەیوەندیکرن ب سێرڤەرێ SadTalker ل سەر HuggingFace ب بێ بەرامبەر
            const app = await window.GradioClient.connect("vinthony/SadTalker");
            
            loadText.innerText = "د لڤاندن و دروستکرنا دەنگ و وێنەیی دا یە (تکایە بپڕێنە)...";

            // دروستکرنا دەنگێ بێبەرامبەر ژ تێکستی ب ڕێکا Google TTS Blob
            const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=ar&client=tw-ob`;
            const audioRes = await fetch(ttsUrl);
            const audioBlob = await audioRes.blob();

            const result = await app.predict("/generate_video", [
                selectedBlob,  // Source Image
                audioBlob,     // Audio File
                "pose",        // Preprocess
                true,          // Still Mode
                false,         // Enhancer
                1              // Batch Size
            ]);

            if (result && result.data && result.data[0]) {
                const finalVideoUrl = result.data[0].url || result.data[0];
                showVideo(finalVideoUrl);
            } else {
                throw new Error("سێرڤەرێ بێبەرامبەر مژوولە، دووبارە کرتێ بکەوە!");
            }

        } catch (err) {
            alert("کێشەیەک ڕوویدا یان سێرڤەر مژوولە. تکایە جارەکا دی کرتێ بکە دێ کار کەت!");
            loader.style.display = 'none';
        }
    }

    function showVideo(url) {
        const loader = document.getElementById('loader');
        const img = document.getElementById('imagePreview');
        const video = document.getElementById('videoResult');
        const dl = document.getElementById('downloadBtn');

        img.style.display = 'none';
        video.src = url;
        video.style.display = 'block';
        dl.href = url;
        dl.style.display = 'block';
        loader.style.display = 'none';
    }
</script>

</body>
</html>
