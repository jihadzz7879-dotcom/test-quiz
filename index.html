<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکرنێن ویزاری پۆلا ١٢</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #06060c 100%);
            --primary: #ffcc00;
            --primary-hover: #ffa500;
            --card-bg: rgba(20, 20, 35, 0.65);
            --card-border: rgba(255, 204, 0, 0.15);
            --btn-bg: linear-gradient(135deg, rgba(35, 35, 55, 0.8) 0%, rgba(20, 20, 35, 0.8) 100%);
            --text-main: #ffffff;
            --text-muted: #a0a0be;
            --error: #ff4757;
            --success: #2ed573;
            --warning-bg: rgba(230, 126, 34, 0.15);
            --warning-border: #e67e22;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-gradient);
            color: var(--text-main); 
            text-align: center; 
            margin: 0; 
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            backdrop-filter: blur(10px);
        }

        .header-container { 
            margin-top: 10px; 
            margin-bottom: 30px; 
            width: 100%; 
            max-width: 500px; 
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h2 { color: var(--primary); margin: 0 0 8px 0; font-size: 28px; font-weight: 900; text-shadow: 0 0 20px rgba(255, 204, 0, 0.3); }
        .subtitle { color: var(--text-muted); font-size: 13px; font-weight: 500; }
        
        /* دوگمەیێن ماددەیان */
        .btn-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            width: 100%; 
            max-width: 500px; 
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 25px;
        }
        .btn { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 22px 12px; 
            background: var(--btn-bg); 
            color: var(--text-main); 
            text-decoration: none; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            font-weight: 700; 
            font-size: 16px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn:not(.disabled):hover { 
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.15) 0%, rgba(20, 20, 35, 0.9) 100%);
            border-color: var(--primary); 
            color: var(--primary); 
            transform: translateY(-5px); 
            box-shadow: 0 12px 25px rgba(255, 204, 0, 0.2);
        }
        .btn span { font-size: 24px; margin-bottom: 8px; }
        
        .hidden { display: none !important; }

        /* سیستەمێ قفلکرنێ و چووناژوورێ */
        .section-box {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 25px 20px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            margin-top: 10px;
        }

        .warning-box {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: #f39c12;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .account-link { display: block; margin-bottom: 15px; color: var(--primary); text-decoration: underline; font-size: 14px; font-weight: 600; cursor: pointer; }
        
        .login-box input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 50px; border: 1px solid #2d2d35; background: rgba(10, 10, 12, 0.9); color: white; text-align: center; font-size: 15px; font-weight: bold; box-sizing: border-box; outline: none; }
        .login-box button { width: 100%; padding: 14px; border-radius: 50px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #000; font-size: 15px; font-weight: bold; cursor: pointer; }
        
        #error-msg { font-size: 14px; margin-top: 12px; font-weight: bold; min-height: 20px; text-align: center; }
        .status-badge { background: rgba(46, 213, 115, 0.2); color: var(--success); border: 1px solid var(--success); padding: 8px 15px; border-radius: 50px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="main-content">
        <div class="header-container">
            <h2>تاقیکرنێن ویزاری ٢٠٢٥-٢٠٢٦</h2>
            <div class="subtitle">سیستەمێ گەهشتنا بلەز یا مەلزەمە و تاقیکردنان - خولا دووێ</div>
        </div>

        <!-- دوگمەیێن بابەتان -->
        <div class="btn-container">
            <div onclick="navigateTo('fizya.html')" class="btn" id="m-fizya"><span>⚛️</span>فیزیا</div>
            <div onclick="navigateTo('mejo.html')" class="btn" id="m-mejo"><span>📜</span>مێژوو</div>
            <div onclick="navigateTo('kurdish.html')" class="btn" id="m-kurdish"><span>✒️</span>کوردی</div>
            <div onclick="navigateTo('arabic.html')" class="btn" id="m-arabic"><span>🕌</span>عەرەبی</div>
            <div onclick="navigateTo('english.html')" class="btn" id="m-english"><span>🇬🇧</span>ئینگلیزی</div>
            <div onclick="navigateTo('yasa.html')" class="btn" id="m-yasa"><span>⚖️</span>یاسا</div>
            <div onclick="navigateTo('ark.html')" class="btn" id="m-ark"><span>🌐</span>ئارک (ARK)</div>
            <div onclick="navigateTo('eslame.html')" class="btn" id="m-eslame"><span>📖</span>ئیسلامی</div>
            <div onclick="navigateTo('zindawar.html')" class="btn" id="m-zindawar"><span>🧬</span>ژیندەوار</div>
            <div onclick="navigateTo('zindawar1.html')" class="btn" id="m-zindawar1"><span>🔬</span>ژیندەوار ١</div>
        </div>
    </div>

    <!-- پەنەلێ ڕێکخستنا رووژانە و ئەکاونتان -->
    <div class="section-box">
        <div id="status-container" class="hidden"></div>
        
        <div id="limit-msg" class="warning-box hidden">
            ⚠️ تە ئەڤرۆ پشکداری کریە! (بۆ دووبارەکرنی حسابی داخل کە)
        </div>
        
        <span id="account-link-btn" class="account-link" onclick="toggleLoginBox()">🔐 چووناژوورێ ب حسابی (بۆ ئەزموونکرنا بێ سنوور)</span>

        <!-- فۆڕما چووناژوورێ -->
        <div id="login-panel" class="login-box hidden">
            <input type="text" id="username-input" placeholder="ناڤێ بەکارهێنەر (Username)">
            <input type="password" id="password-input" placeholder="پێپەیڤ (Password)">
            <button onclick="validateUserAccount()">پشکنین و بەستن ➔</button>
        </div>

        <div id="error-msg"></div>
    </div>

    <script>
        // لیستا ١٠ حسابێن کارا
        const studentAccounts = {
            "student1": "pass123", "student2": "pass456", "student3": "pass789",
            "student4": "pass2026", "student5": "user555", "student6": "user666",
            "student7": "user777", "student8": "user888", "student9": "user999", "student10": "vip2026"
        };

        document.addEventListener("DOMContentLoaded", function() {
            checkAccessLock();
        });

        // پشکنینا بارێ قفلێ یان حسابێ
        function checkAccessLock() {
            const isVIP = localStorage.getItem("is_vip_account") === "true";
            const lastClickDate = localStorage.getItem("last_exam_click_date");
            const todayStr = new Date().toDateString();
            
            const limitMsg = document.getElementById("limit-msg");
            const badge = document.getElementById("status-container");
            const accountBtn = document.getElementById("account-link-btn");

            if (isVIP) {
                badge.className = "status-badge";
                badge.innerHTML = "👑 حسابی تایبەت کارایە (هەمی گاڤا بێ سنوور)";
                badge.classList.remove("hidden");
                limitMsg.classList.add("hidden");
                accountBtn.style.display = "none";
                enableButtons();
            } else {
                if (lastClickDate === todayStr) {
                    limitMsg.classList.remove("hidden");
                    disableButtons();
                } else {
                    limitMsg.classList.add("hidden");
                    enableButtons();
                }
            }
        }

        // کارپێکرنا دوگمەیان
        function enableButtons() {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('disabled'));
        }

        // قفلکرنا دوگمەیان
        function disableButtons() {
            document.querySelectorAll('.btn').forEach(b => b.classList.add('disabled'));
        }

        // چوونە د ناڤ لێنکێ بابەتان دا
        function navigateTo(url) {
            const isVIP = localStorage.getItem("is_vip_account") === "true";
            const lastClickDate = localStorage.getItem("last_exam_click_date");
            const todayStr = new Date().toDateString();

            if (!isVIP && lastClickDate === todayStr) {
                alert("تە ئەڤرۆ ئەزموون کریە! ناتوانیت پشکداری کەیە ڤە ئیلا حسابی داخل کەی.");
                return;
            }

            // ئەگەر میوان بیت، سیستەم دێ هێتە قفلکرن بۆ پاشەڕۆژێ
            if (!isVIP) {
                localStorage.setItem("last_exam_click_date", todayStr);
            }

            // دەرپەڕین بۆ لاپەڕێ بابەتی
            window.location.href = url;
        }

        function toggleLoginBox() {
            document.getElementById("login-panel").classList.toggle("hidden");
        }

        // پشکنینا حسابێ
        function validateUserAccount() {
            const user = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();

            if (studentAccounts[user] && studentAccounts[user] === pass) {
                localStorage.setItem("is_vip_account", "true");
                showMsg("چووناژوورێ سەرکەفتی بوو! سیستەم بێ سنوور لێهات.", "var(--success)");
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                showMsg("ناڤ یان پێپەیڤ خەلەتە!", "var(--error)");
            }
        }

        function showMsg(text, color) {
            const msg = document.getElementById("error-msg");
            msg.innerHTML = text; msg.style.color = color;
        }
    </script>
</body>
</html>
