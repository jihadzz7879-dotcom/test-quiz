<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونێن ویزاری</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            background-color: #111111;
            border: 1px solid #1c1c1c;
            border-radius: 24px;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header-section {
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
        }

        .main-title {
            font-size: 26px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .sub-title {
            font-size: 15px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        .countdown-container {
            background-color: #161616;
            border: 1px dashed #d4af37;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            margin-bottom: 25px;
            text-align: center;
        }

        .motivation-text {
            font-size: 14px;
            color: #e0e0e0;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .timer-display {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 50px;
            display: inline-block;
            width: 95%;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }

        .timer-display span {
            color: #d4af37;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .subject-btn {
            display: block;
            background-color: #161a23;
            border: 1px solid #252c3a;
            border-radius: 50px;
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            padding: 15px 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        .subject-btn:hover {
            border-color: #d4af37;
            background-color: #1f2635;
            transform: scale(1.02);
        }

        .footer-text {
            color: #444444;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-section">
        <div class="main-title">تاقیکرنا ویزاری</div>
        <div class="sub-title">خولا دووێ 2026-2025</div>
    </div>

    <div class="countdown-container">
        <div class="motivation-text">
            🌟 "هیچ تشتەک مەحاڵ نینە کاتێ تو بڕیارێ بدەی بگەهیە خەونا خۆ... هێشتا دەم یێ ل پێشیا تە، ب هێز بە!"
        </div>
        <div class="timer-display" id="countdown-timer">
            دهێتە بارکرن...
        </div>
    </div>

    <div class="buttons-container">
        <a href="kurdish.html" class="subject-btn">کوردی</a>
        <a href="arabic.html" class="subject-btn">عەرەبی</a>
        <a href="english.html" class="subject-btn">ئینگلیزی</a>
        <a href="yasa.html" class="subject-btn">یاسا</a>
        <a href="mejo.html" class="subject-btn">مێژوو</a>
        <a href="zindawar.html" class="subject-btn">زیندەوەر</a>
    </div>

    <div class="footer-text">GEHAD ZEBARI</div>
</div>

<script>
    // ڕێکەفتی تاقیکرنێ: 14ێ حوزەیرانا 2026 ل دەمژمێر 07:30 سپێدێ
    const examDate = new Date("June 14, 2026 07:30:00").getTime();

    const timerInterval = setInterval(function() {
        const now = new Date().getTime();
        const distance = examDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        if (distance > 0) {
            document.getElementById("countdown-timer").innerHTML = 
                `ماوە بۆ ئەزموونێ: <span>${days} ڕۆژ</span> و <span>${hours} دەمژمێر</span> و <span>${minutes} دەقە</span> و <span>${seconds} چرکە</span>`;
        } else {
            clearInterval(timerInterval);
            document.getElementById("countdown-timer").innerHTML = "🚀 دەمێ تاقیکرنێ دەستپێکر! سەرکەفتن بۆ هەمی لایەکی.";
        }
    }, 1000);
</script>

</body>
</html>
