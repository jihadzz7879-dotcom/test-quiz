<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یاریدەدەرێ ژیر و خێرا | AI Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #38bdf8;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .key-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .key-box input {
      flex: 1;
      padding: 8px;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .chat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 85%;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .user-msg {
      background: var(--accent);
      color: #fff;
      align-self: flex-start;
      border-bottom-right-radius: 2px;
    }

    .ai-msg {
      background: #334155;
      color: var(--text);
      align-self: flex-end;
      border-bottom-left-radius: 2px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    button {
      padding: 12px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>پلاتفۆڕما بەرسڤدانا ژیر (AI Assistant)</h1>
      <p>پرسیارا خۆ بنڤێسە دا ڕاستەڕاست بەرسڤا تە ب دەت.</p>
    </div>

    <div class="key-box">
      <span style="font-size: 0.85rem; color: #94a3b8;">API Key:</span>
      <input type="password" id="userApiKey" placeholder="AQ.Ab8RN6KSrHRJAKBmvOB1b0_blzPH7qDr68UUXT_vXCS_rDDW9g">
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message ai-msg">سڵاڤ! کلیلا خۆ بنڤێسە و پرسیار بکە.</div>
    </div>

    <div class="input-group">
      <input type="text" id="userInput" placeholder="پرسیارا خۆ بنڤێسە..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">ناردن</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const apiKeyInput = document.getElementById('userApiKey').value.trim();
      const chatBox = document.getElementById('chatBox');
      const question = inputField.value.trim();

      if (!question) return;
      if (!apiKeyInput) {
        alert('تکایە سەرەتا کلیلا API Key یا خۆ ل سەرێ بنڤێسە!');
        return;
      }

      appendMessage(question, 'user-msg');
      inputField.value = '';

      const loadingMsg = appendMessage('د پرۆسەکرنێ دایە...', 'ai-msg');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKeyInput}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: question }] }]
          })
        });

        const data = await response.json();

        if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
          loadingMsg.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          loadingMsg.innerText = "شاشی: " + data.error.message;
        } else {
          loadingMsg.innerText = 'کێشەیەک چێبوو د وەرگرتنا بەرسڤێ دا.';
        }
      } catch (error) {
        loadingMsg.innerText = 'کێشەیەک د پەیوەندییا تۆڕێ دا چێبوو.';
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>

</body>
</html>
