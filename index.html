<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکرنا یاسا</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* ڕەنگێکی شینی تار و مۆدێرن */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            max-width: 450px;
            width: 100%;
        }
        .brand-name {
            font-size: 14px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }
        h1 { color: #f8fafc; font-size: 28px; margin-bottom: 20px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        .btn {
            display: block;
            background-color: #d4af37;
            color: #0f172a;
            padding: 15px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            background-color: #b8962f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <span class="brand-name">Gehad Zebari</span>
    <h1>تاقیکرنا یاسا</h1>
    <p>بۆ دەستپێکرنا تاقیکرنێ کلیکێ ل ڤێرێ بکه</p>
    <a href="index.html" class="btn">زڤرین بۆ پەرا سەرەکی</a>
</div>

</body>
</html>
