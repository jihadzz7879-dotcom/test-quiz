<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمێ پێشکەفتی یێ ئەنجامان</title>
    <style>
        :root {
            --bg: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
            --glass: rgba(17, 24, 39, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --gold: linear-gradient(90deg, #fbbf24, #f59e0b);
            --gold-glow: rgba(245, 158, 11, 0.3);
            --blue: #06b6d4;
            --blue-glow: rgba(6, 182, 212, 0.2);
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
        }

        h2 {
            font-size: 2rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            color: #9ca3af;
            font-size: 0.88rem;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 1.1rem;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        button {
            width: 100%;
            padding: 1.1rem;
            background: var(--gold);
            color: #030712;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 15px var(--gold-glow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
        }

        .result-box, .admin-box {
            display: none;
            text-align: right;
            animation: cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s scaleUp;
        }

        /* بەشێ وێنەی و پڕۆفایلی قوتابی */
        .profile-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #f59e0b;
            box-shadow: 0 0 15px var(--gold-glow);
            object-fit: cover;
            background: #1f2937;
            margin-bottom: 0.75rem;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        .status-pass { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
        .status-fail { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }

        .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        .marks-table th, .marks-table td {
            padding: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-top: 0.5rem;
        }

        .btn-upload {
            border: 1px dashed rgba(255,255,255,0.3);
            color: #9ca3af;
            background-color: transparent;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: none;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .admin-link {
            background: transparent;
            color: var(--danger);
            border: 1px dashed rgba(239, 68, 68, 0.4);
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            width: auto;
            display: inline-block;
            margin-top: 2rem;
            box-shadow: none;
        }

        .back-btn {
            background: transparent;
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection">
        <h2>ئەنجامێن پۆلا 12 ئەدەبی</h2>
        <p class="subtitle">سیستەمێ هۆشمەندێ پاراستنا پاسوۆرد و وێنەیان</p>
        
        <div class="input-group">
            <label>کۆدێ قوتابی</label>
            <input type="text" id="studentCode" placeholder="2001">
        </div>

        <div class="input-group">
            <label>ژمارا نهێنی (Password)</label>
            <input type="password" id="studentPass" placeholder="••••••">
        </div>

        <button onclick="loginStudent()">چوونەژوورێ</button>
        <button class="admin-link" onclick="showAdminLogin()">پانێلا ئەدمینی ⚙</button>
    </div>

    <div id="resultSection" class="result-box">
        <div class="profile-area">
            <div class="avatar-container">
                <img id="studentAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239ca3af'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v2h-16v-2c0-2.66 5.33-4 8-4z'/></svg>" alt="پڕۆفایل">
            </div>
            
            <div class="upload-btn-wrapper">
                <button class="btn-upload">📷 بارکرنا وێنەی</button>
                <input type="file" id="imageUploader" accept="image/*" onchange="previewImage(event)">
            </div>

            <h3 id="resName" style="color: #fff; font-size: 1.3rem; margin-top: 1rem;">-</h3>
            <div id="resStatus" class="status-badge">-</div>
        </div>
        
        <table class="marks-table">
            <thead>
                <tr>
                    <th>وانە</th>
                    <th>نمرە</th>
                </tr>
            </thead>
            <tbody id="marksBody"></tbody>
        </table>

        <div style="background: rgba(6,182,212,0.05); border: 1px solid rgba(6,182,212,0.15); padding: 1.25rem; border-radius: 18px; margin-bottom: 1.5rem;">
            <label style="color: var(--blue); font-weight: bold;">🔒 گۆڕینا ڕاستەوخۆ یا پاسوۆردێ</label>
            <input type="password" id="newStudentPass" placeholder="پاسوۆردا نوو لێرە بنڤێسه" style="margin-top: 0.5rem; padding: 0.7rem; font-size: 0.9rem;">
            <button style="background: var(--blue); color: #030712; padding: 0.7rem; font-size: 0.9rem; margin-top: 0.6rem; box-shadow: 0 4px 10px var(--blue-glow);" onclick="changePasswordInstant()">گۆڕین و ژێبرنا یا کۆن</button>
        </div>

        <button class="back-btn" onclick="goBack()">دەرکەفتن</button>
    </div>

    <div id="adminSection" class="admin-box">
        <h3 style="color: var(--danger); margin-bottom: 1rem; font-size: 1.4rem;">کۆنترۆلا ئەدمینی</h3>
        <p id="adminPassDisplay" style="color: var(--blue); margin-bottom: 1.5rem; font-size: 0.95rem; font-weight: bold; background: rgba(6,182,212,0.1); padding: 0.6rem; border-radius: 10px; text-align: center;">پاسوۆردا کارا: -</p>
        
        <div class="input-group">
            <label>قوتابی هەلبژێره:</label>
            <select id="adminSelectStudent" onchange="loadAdminStudentMarks()"></select>
        </div>

        <div id="adminMarksEditArea"></div>

        <button style="background: var(--danger); color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,0.3);" onclick="saveAdminChanges()">تۆمارکرنا نمرەیان</button>
        <button class="back-btn" onclick="goBack()">پاشەکێش</button>
    </div>
</div>

<script>
    // داتابەیسا سەرەکی دگەل پاراستنا جهێ وێنەی (Avatar)
    let studentsData = {
        "2001": { 
            name: "نرمین حسن احمد", pass: "1234", avatar: null,
            marks: { "مێژوو": 85, "جوگرافیا": 92, "ئابووری": 78, "عەرەبی": 54, "ئینگلیزی": 88, "کوردی": 98, "ئیسلامی": 95 }
        },
        "2002": { 
            name: "ئازاد علی حسین", pass: "5678", avatar: null,
            marks: { "مێژوو": 74, "جوگرافیا": 45, "ئابووری": 65, "عەرەبی": 55, "ئینگلیزی": 70, "کوردی": 88, "ئیسلامی": 90 }
        },
        "2003": { 
            name: "شهناز صدقی احمد", pass: "4321", avatar: null,
            marks: { "مێژوو": 95, "جوگرافیا": 88, "ئابووری": 90, "عەرەبی": 76, "ئینگلیزی": 82, "کوردی": 94, "ئیسلامی": 100 }
        }
    };

    let currentStudent = "";
    const ADMIN_PASSWORD = "admin";

    function checkStatus(marks) {
        for(let key in marks) { if(marks[key] < 50) return { text: "موعید / کەفتی", className: "status-fail" }; }
        return { text: "ناجح / دەرچووی", className: "status-pass" };
    }

    function loginStudent() {
        let code = document.getElementById("studentCode").value.trim();
        let pass = document.getElementById("studentPass").value;

        if(studentsData[code] && studentsData[code].pass === pass) {
            currentStudent = code;
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("resultSection").style.display = "block";
            
            document.getElementById("resName").innerText = studentsData[code].name;
            
            // ئەگەر وێنە هەبیت دێ هێتە گۆڕین
            if(studentsData[code].avatar) {
                document.getElementById("studentAvatar").src = studentsData[code].avatar;
            } else {
                document.getElementById("studentAvatar").src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239ca3af'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v2h-16v-2c0-2.66 5.33-4 8-4z'/></svg>";
            }

            let status = checkStatus(studentsData[code].marks);
            let badge = document.getElementById("resStatus");
            badge.innerText = status.text;
            badge.className = "status-badge " + status.className;
            
            let tbody = document.getElementById("marksBody");
            tbody.innerHTML = "";
            for (let subject in studentsData[code].marks) {
                let mark = studentsData[code].marks[subject];
                tbody.innerHTML += `<tr><td style="color:#9ca3af">${subject}</td><td style="font-weight:700; color:${mark >= 50 ? 'var(--success)' : 'var(--danger)'}">${mark}</td></tr>`;
            }
        } else {
            alert("کۆد یان پاسوۆرد خەلەتە!");
        }
    }

    // فەنکشنا گۆڕینا ئێکسەر یا پاسوۆردێ و سڕینەوەی یا کۆن
    function changePasswordInstant() {
        let newPass = document.getElementById("newStudentPass").value.trim();
        if(newPass === "") { alert("تکایە پاسوۆردەکێ بنڤێسه!"); return; }
        
        studentsData[currentStudent].pass = newPass; // ئێکسەر یا نوو کەتە جهێ یا کۆن
        alert("پاسوۆردا کەفن هاتە سڕین و یا نوو ئێکسەر کەفتە کار!");
        document.getElementById("newStudentPass").value = "";
    }

    // فەنکشنا زێدەکرن و پێشاندانا وێنەی
    function previewImage(event) {
        let reader = new FileReader();
        reader.onload = function() {
            let output = document.getElementById('studentAvatar');
            output.src = reader.result;
            studentsData[currentStudent].avatar = reader.result; // پاشەکەفتکرن د داتابەیسێ دا
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    function showAdminLogin() {
        let inputPass = prompt("کۆدێ ئەدمینی لێدە:");
        if (inputPass === ADMIN_PASSWORD) {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("adminSection").style.display = "block";
            
            let select = document.getElementById("adminSelectStudent");
            select.innerHTML = "";
            for(let code in studentsData) { select.innerHTML += `<option value="${code}">${studentsData[code].name}</option>`; }
            loadAdminStudentMarks();
        } else if(inputPass !== null) { alert("خەلەتە!"); }
    }

    function loadAdminStudentMarks() {
        let code = document.getElementById("adminSelectStudent").value;
        document.getElementById("adminPassDisplay").innerText = `پاسوۆردا نوو و کارا یا ڤی قوتابیی: ${studentsData[code].pass}`;

        let area = document.getElementById("adminMarksEditArea");
        area.innerHTML = "";
        for(let subject in studentsData[code].marks) {
            area.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); padding:0.8rem; margin-bottom:0.8rem; border-radius:12px; border:1px solid var(--border);">
                    <label style="color:#fff; margin:0;">${subject}</label>
                    <input type="number" class="admin-mark-input" data-subject="${subject}" value="${studentsData[code].marks[subject]}" min="0" max="100" style="width:90px; padding:0.5rem; border-radius:8px;">
                </div>`;
        }
    }

    function saveAdminChanges() {
        let code = document.getElementById("adminSelectStudent").value;
        let inputs = document.querySelectorAll(".admin-mark-input");
        inputs.forEach(input => {
            let subject = input.getAttribute("data-subject");
            let newMark = parseInt(input.value);
            if(!isNaN(newMark)) studentsData[code].marks[subject] = newMark;
        });
        alert("نمرە هاتنە نووکرن!");
    }

    function goBack() {
        document.getElementById("resultSection").style.display = "none";
        document.getElementById("adminSection").style.display = "none";
        document.getElementById("loginSection").style.display = "block";
        currentStudent = "";
    }
</script>
</body>
</html>
