<html lang="ku" dir="rtl">
<head>

        :root {
            --primary-color: #0f2c59;
            --accent-color: #b89443;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --success-color: #2e7d32;
            --error-color: #c62828;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 25px 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .creator {
            background-color: var(--accent-color);
            color: white;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .progress-bar {
            background-color: rgba(255,255,255,0.2);
            height: 8px;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress {
            background-color: var(--accent-color);
            height: 100%;
            width: 2%;
            transition: width 0.3s ease;
        }

        .quiz-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 13px;
            color: #757575;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .options-list {
            list-style: none;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: right;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #f0f4f8;
            border-color: var(--primary-color);
        }

        .option-btn.selected {
            background-color: #e8f0fe;
            border-color: var(--primary-color);
            font-weight: bold;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
        }

        .next-btn:hover {
            background-color: #174280;
        }

        .next-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .result-screen {
            display: none;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 6px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary-color);
        }

        .review-section {
            margin-top: 30px;
            text-align: right;
        }

        .review-title {
            font-size: 18px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .review-item {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-right: 5px solid #ccc;
            background-color: #fafafa;
        }

        .review-item.correct-item {
            border-right-color: var(--success-color);
            background-color: #e8f5e9;
        }

        .review-item.wrong-item {
            border-right-color: var(--error-color);
            background-color: #ffebee;
        }

        .review-q {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .review-ans {
            font-size: 14px;
            margin-top: 4px;
        }

        .text-success { color: var(--success-color); font-weight: bold; }
        .text-danger { color: var(--error-color); font-weight: bold; }
    </style>
</head>

<div class="container">
    <div id="quiz-container">
        <div class="header">
            <h1>تاقیکرنا ویزاری یا زمانی زمانی کوردی - پۆلا ١٢</h1>
            <div class="creator">ئامادەکرن: JEHAD ZEBARI</div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="quiz-card">
            <div class="question-number" id="q-num">پرسیارا ١ ژ ٥٠</div>
            <div class="question-text" id="q-text">بارکرنا پرسیارێ...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div class="navigation">
            <button class="nav-btn next-btn" id="next-btn" onclick="nextQuestion()" disabled>دوواتر (Next)</button>
        </div>
    </div>

    <div class="result-screen" id="result-container">
        <div class="header">
            <h1>ئەنجامێ تاقیکردنێ</h1>
            <div class="creator">JEHAD ZEBARI</div>
        </div>
        <p style="font-size: 16px; font-weight: bold;">کۆی گشتی نمرێن تە:</p>
        <div class="score-circle" id="score-box">0 / 100</div>
        <p id="feedback-text" style="font-size: 15px; margin-bottom: 20px; font-weight: bold;"></p>

        <div class="review-section">
            <h2 class="review-title">پێداچوونا بەرسڤان:</h2>
            <div id="review-list"></div>
        </div>
    </div>
</div>

<script>
    const questions = [
        { q: "د ڕستەیا (تابلۆکۆنەکانم بۆ بگەرێنەوە.) چ دەرنەکەفتییە؟", o: ["تەمامکەری بەنداو", "بکەر", "ئامرازی دانەپاڵ", "(B + C) ڕاستن"], a: 2 },
        { q: "د ڕستەیا هاوەڵییا مەڕجیدا کێژ نەڤان کاران نەشێت بیتە کاری وەڵاما مەڕجی؟", o: ["پێشدەکەوێت", "تەواوکەردە", "مەهێنە", "سەردەکەوین"], a: 1 },
        { q: "د کیژ نەڤان ڕستانەیااندا ڕێژەیا کاری بوریێ نێزیکە؟", o: ["دەبوو پەرتووکەکانت کۆکردبایەوە.", "دەبوو لە ناهەنگەکە ئامادەبووبا.", "یارییەکە درەنگ تەواوبوو.", "هەمی ڕاستن"], a: 3 },
        { q: "کێژ نەڤان هەڤالناڤە و پێکهاتییە ژ (ناڤ + ئامراز + ناڤ)؟", o: ["ڕوو بە خاڵ", "گوڵە هێرۆ", "ڕەشەبا", "هەمی ڕاستن"], a: 0 },
        { q: "د ڕستەیا (ئەو قوتابییەکێ زۆر چەلەنگە.) دا، (زۆر چەلەنگ) چییە？", o: ["گرنێیا هەڤالناڤییە، تەمامکەری کاری نە تەمامە.", "گرنێیا ناڤییە، دیارکەری ناڤییە.", "گرنێیا هەڤالناڤییە، تەمامکەری کارییە.", "گرنێیا هەڤالناڤییە، دیارکەری ناڤییە."], a: 3 },
        { q: "د ڕستەیا (تۆمان ههەڵبژاردبوو.) دا، ئەگەر بکارکاری بکەینە جیهانێ لکاو، ڕستە دێ بیتە:", o: ["هەڵمانت بژاردبوو.", "هەڵتمان بژاردبوو.", "هەڵت بژاردبووین.", "(B + C) ڕاستن"], a: 1 },
        { q: "کاری نەتمام بۆ دەمێ نەهۆ (هـ) د ڕستەبیدا دەرناکەفیت، ئەگەر نیهاد کەسێ:", o: ["ئێکێ تاک بیت.", "سێیێ تاک بیت.", "سێیێ کۆ بیت.", "(C + A) ڕاستن"], a: 3 },
        { q: "بزوینا دویماهییا کێژ نەڤان پەیڤان پاشگرە بۆ دروستکرنا هەڤالناڤێ کراوێ دارێژتی؟", o: ["چاکە", "کردە", "دەستە", "پڕسە"], a: 1 },
        { q: "د کیژ ڕستەیندا ئەگەر (بەکاری) لابدەین و کاری ڕستەیی بکەینە (بوریی نێزیکی دانانیی نەرێ) جیهانێ لکاوێ بکەر ناچیته پشتی ئامرازی نەرێ؟", o: ["وانەکە دەنووسمەوە.", "چیرۆکەکە دەخوێنمەوە.", "چیرۆکەکە بڵاودەکەمەوە.", "پەرتووکەکە دەهێنمەوە."], a: 2 },
        { q: "دەربارەی هەڤالناڤی وەک دیارکەرێ ناڤی، کیژ نەڤان یا دروسته؟", o: ["هەڤالناڤی پله یا هه ڤبەرکرنی لبه ری ناڤی دیارکری دهیت.", "هەڤالناڤی پله یا بالا لپشتی ناڤی دیارکری دهیت.", "ئەگەر ناڤی (هاوەڵ) د گرنیا (هاوڕێی چاک) بکەینە ناسیار،دیارکەری دیارکەر دبنە گرنیا هەڤالناڤی.", "ئەگەر ناڤی (دێ) د گرنیا (دێی کۆن) بکەینە ناسیار، دێ یندڤی ب ناڤبەندێ بین."], a: 3 },
        { q: "د کیژ ڕستەیندا دشێین جیهانێ لکاوێ (مان) بگوهۆڕین ب جیهانێ لکاوێ (ین)؟", o: ["یارمەتیمان بدەن.", "یارمەتیمان دەدات.", "یارمەتیمانیان دا.", "یارمەتیمان دان."], a: 2 },
        { q: "کاری بوریێ تەما مێ ڕاگەهاندنی بکەر نەدیار ژ چاوگی (ڕێکخستنەوە)، دێ بیتە:", o: ["ڕێکخراوەتەوە", "ڕێکخستووەتەوە", "ڕێکخرایەوە", "ڕێکخرابێتەوە"], a: 0 },
        { q: "هەڤالکارین ڕستەیا (ڕۆژانە کاری خۆ ب دڵسۆزی ئەنجام دەدم.) لدوویف ڕێزبەندیا ڕستەیی چەوا هاتینە دروستکرن؟", o: ["(ناڤ+ پاشگر) ، (پێشگر+هەڤالناڤێ لێکدای+پاشگر)", "(ناڤ+ پاشگر) ، (پێشگر+هەڤالکارێ لێکدای+پاشگر)", "(هەڤالناڤ+پاشگر) ، (پێشگر+هەڤالناڤێ لێکدای+پاشگر)", "(ناڤ+ پاشگر) ، (پێشگر+ناڤێ لێکدای+پاشگر)"], a: 0 },
        { q: "د کیژ ڕستەیی تەمامکەری بەنداو دەردەکەڤیت؟", o: ["ڕەنگە خانووەکەی بۆ بکڕیبیێت.", "دەبوو دیارییەکەی لێ وەرگرتبا.", "لەوانەیە هەواڵەکەی پێ گەیشتبێت.", "هەمی بەرسڤ ڕاستن."], a: 2 },
        { q: "د ڕستەیا (ل باخچەی مە دارەک هشکبوو.) کاری ڕستەیی چییە？", o: ["تەمامی تێنەپەڕ ب ڕامانا (وجود).", "کاری نەتمامە.", "تەمامی تێنەپەڕی لێکدایە.", "تەمامی تێپەڕە ب ڕامانا (خۆدانی)."], a: 2 },
        { q: "کێژ نەڤان چاوگان ئەگەر کاری داخوازی لێ بهێته دروستکرن جیهانێ لکاوێ کەسێ دووێ تاک دێ دەرکەڤیت؟", o: ["ڕوێشتن", "داخستن", "بوون", "بردن"], a: 2 },
        { q: "د ڕستەیا (دەبوو خانووەکۆنەکەمان نۆژەنکردبایەوە.)، کیژ ژڤان یا دروسته؟", o: ["ئەگەر بکەر لابدەین ڕستە دێ بیتە (دەبوو نۆژەنمان کردبایەوە.)", "ئەگەر ڕستە بکەینە ڕاگەهاندنی دێ بیتە (خانووە کۆنەکە مانیان نۆژەنکردبووەوە).", "ئەگەر کاری ڕستەیی بکەینە نەبوری ڕستە دێ بیتە (دەبێت خانووەکۆنەکەمان نۆژەنبکەینەوە.)", "چ ژڤان نینن."], a: 3 },
        { q: "کێژ نەڤان هەڤالناڤان ب هەمان دەستوورێ هەڤالناڤی (بەجەرگ) دروستبوویە؟", o: ["بەگۆڕ", "بێ تام", "بەتام", "بەختەوەر"], a: 1 },
        { q: "کیژ نەڤان کاران ب دەستوورێ (قەد +بیە) دروست بوویە د کرما نجییا سەریدا؟", o: ["کرییە", "هاتییە", "نفیسییە", "هەمی ڕاستن."], a: 1 },
        { q: "(. دەبێت قوتابییان ئاگاداربکەنەوە.) کاری ڕستەیی د چ ڕێژەدایە؟", o: ["تەمامی دانانی", "داخوازی", "نەبوریی دانانی", "تەمامی ڕاگەهاندن"], a: 2 },
        { q: "د ڕستەیا (پرسیارەکانیان بۆ چاپکردین.)، ئەگەر جیهانێ لکاوێ تەمامکەری بەنداو بگوهۆرین بۆ (مان)، و بەکاری لابدەین، ڕستە دێ بیتە:", o: ["بۆمانیان چاپکرد.", "بۆیانمان چاپکرد.", "بۆمان چاپکرد.", "بۆمان چاپکردن."], a: 0 },
        { q: "د کیژ ڕستەیندا ئەگەر پەیڤا (زۆر) لەبەری پەیڤا (جوان) بهێته بکارنینان دێ بیتە ڕادەییا هەڤالکاری؟", o: ["وێ وێنەیەکی جوان کێشا.", "وی گۆنەکێ جوان تۆمارکر.", "من دارشتنەکا جوان نفیسی.", "دیارییەکا جوان بۆمن هات."], a: 1 },
        { q: "د کیژ ڕستەیندا ئەگەر پەیڤا (زۆر) لەبەری پەیڤا (جوان) بهێته بکارنینان دێ بیتە ڕادەییا هەڤالکاری؟", o: ["پڕۆژەکۆنەکان تەواودەکرین.", "یاریزانانی تیمەکە خەڵاتکران.", "دیارییەکان بۆ مامۆستا دڵسۆزەکان ئامادەکراون.", "درەختی شاخەکان سەوزن."], a: 0 },
        { q: "د ڕستەیا (قوتابییەکانمان لە وەڵامدانەوەی پرسیارەکان مێشک دوودڵن.)، کیژ ژڤان یا دروسته؟", o: ["گرنیا هەڤالناڤی تەمامکەری کاری نەتمامە.", "جیهانێ لکاوێ (مان) نەرکی وی بکەرە.", "تەمامکەری کاری نەتمام پێکهاتییە ژ (هەڤالناڤێ ژمارە + ناڤ).", "(کەمێک) ڕادەییا هەڤالکارییە."], a: 0 },
        { q: "د کیژ نەڤان ڕستەیاندا ئەرکی جیهانێ لکاوێ (م) بکەرە؟", o: ["بۆت بنووسم", "بۆت نووسیبووم.", "بۆمی نووسی.", "بۆت نووسیم."], a: 0 },
        { q: "پشتی خۆپانا (١٩٧٥) نفیسەرین باژێران بزاڤ کرینە د ڕێکا کیژ نەڤان گۆتاران بیروبۆچوون و هەست و سۆزێن نە تەڤمبێژن خۆ نیشابدەن؟", o: ["مێژوویی", "جڤاکی", "ڕۆشنبیرین گشتی", "هەمی ڕاستن"], a: 3 },
        { q: "خودانی هۆزانا . مفا وەگرتییە ژ فۆلکلۆری کوردی، و زمانی هۆزانی یێ وی قۆناغێ دەولەمەندتر کر.", o: ["بێشکەی منال", "کاروانی مە", "ڕێگەی خەبات", "نەسرین"], a: 1 },
        { q: "کێژ نەڤان بەرهەمان ڤەکۆڵینا ڕەخنەییە؟", o: ["کامران و دیارییەک", "کورد و شیعر", "کۆن و تازه لە شیعردا", "کامران و هۆنراوەی نوێ"], a: 3 },
        { q: "کیژ نەڤان ژ گرنگترین تایبەتمەندیێن گۆتاریێ د قۆناغا (١٩٥٨-١٩٧٠) ؟", o: ["پتر گرنگی ب نیشانێن خالبه ندیێ هاتییە دان.", "زمانی گۆتاران ومرارو گەشە ب خۆڤە دیتییە ، چنکو پتر بەڕەڤ کوردیەکا پەتی دبرن.", "زمانی گۆتارێ پوختەتر بوو ژلایێ پەیڤ و زارافانڤە دەولەمەندتربوون.", "دەربڕینا نەڕاستەوخۆ ،نانکوهیما ونیشانە بکارئینان."], a: 2 },

        { q: "زنجیرە ڤەکۆڵینا (شێخ نوری شێخ ساڵح) پتر دچیته خانەیا:", o: ["مێژوویا ئەدەبی", "بیردۆزا ئەدەبی", "ڕەخنەییا ئەدەبی", "مێژوویا ئەدەبی و ڕەخنەیا ئەدەبی"], a: 1 },

        { q: "گرتیدانا چێرۆکنڤیسین کورد ب کێشە ودیاردەبێژن جڤاکی بووە ئەگەرێ ڤێ چەندێ کۆ چێرۆکا کوردی ئێک سەر بە ڕەف ڕێبازا . پێنگاڤان بهاڤێژیت:", o: ["ڕیالیزمی", "ڕۆمانتیکی", "کلاسیکی", "فۆرمالیزمی"], a: 0 },
        { q: "کێژ نەڤان چێرۆکان کارتیکرن نەبوود جیگیرکرنا چێرۆکا ئافنچی چونکو د مەنی خۆدا نەهاتبوو بەڵاڤکرن؟", o: ["لانوکەریم", "پە لکە هه وریكی چڵکن", "مەسەلەی ویژدان", "کاروانی"], a: 2 },
        { q: "د قۆناغا (١٩٥٨ -١٩٧٠) بزاڤین نویخوازیێ د تاقیکرنین کیژ نەڤان هۆزانڤانان کیژ نەڤان هۆزانڤانان کێژ نەڤان هۆزانڤانان نەبوویە شیوازەکێ دیارێ هۆزانا کوردی؟", o: ["کامران موکری", "جگەرخوێن", "گۆران", "سوارەی ئیلخانی زادە"], a: 3 },
        { q: "دەربارەی ڕەخنەیا ڕۆژئاڤا کیژ نەڤان یا ڕاستە؟", o: ["(ئەفلاتۆن) ی بەرهەمی هۆزانی مفادار داناییە.", "(بوالو) ی بیروبۆچوونین (ئەرستۆ) ی جیگیر کرن.", "(سانت بیف) ژ دیارترین ڕەخنەگرین کلاسیکییە.", "گرنگی دان ب بهایین کەسی، ژ پێڤەرین ڕەخنەیا کلاسیکیا نوێ یه."], a: 1 },
        { q: "چ بابەتێ ڕەوانبێژیێ د نەڤێ دێرا هۆزانیدا هەیە؟ (دەمنێك بوو چاوەڕێی بەفرێکی وابووم مژدەبێ باری / سەرم بەفرە کەچی هێشتا شەڕە تۆپەمە بۆ یاری)", o: ["لێکچواندن ب سێ بنەڕەت، و ڕەگەز دۆزیا نە تەما م ل هژمارا پیتان", "لێکچواندن ب دوو بنەڕەت، و ڕەگەزدۆزیا نە تەمام ل جۆری پیتان", "لێکچواندن ب دوو بنەڕەت، و ڕەگەز دۆزیا تەما م", "لێکچواندن ب چوار بنەڕەت، و ڕەگەز دۆزیا نە تەمام ل جۆری پیتان"], a: 1 },
        { q: "دەربارەی (بابەتی ڕەوانبێژیێ) کیژ ڤان نەیا دروسته ؟", o: ["زانستی ڕەوانبێژیێ ل وان هۆنەر و دەستوورو بنەمایان ڤەدکۆلیت کو دبنە جهێ ڕەوانی و جوانی و کاریگە ڕیا ئاخافتنێ و پاراستنا وی ژ تاریاتیێ.", "سیفەتا ڕوویێ لێکچوونێ د (لیچوو) دا بهێزە و ل (لەویچوو ) دا بیهێزه.", "دژی نیکا نەڕێ دوو پەیڤن هه ر ئێک ژ ڕەگەزەکێ سەربەخۆیە و د ڕامانا خۆدا هه ڤدژ و بەروڤاژی نیکن.", "چ ژوان نینن."], a: 1 },
        { q: "چ بابەتەکێ ڕەوانبێژیێ د ڤێ دێرا هۆزانیدا هەیە؟ (چ ڕۆناکی بی، چ تاریکی بی، چ نزمی بی یا بە رزی / بە خۆشی بی وەک یا تاڵێ هەمووی نەڕوا لە سەر نە ڕزی)", o: ["دژی نیکا نەڕێ ڕەگە دۆزی یا تەمام", "دژی نیکا نە ڕێ و دژی نیکا نەڕێ", "دژی نیکا نەڕێ و ڕەگەزدۆزی یا نە تەمام", "دژی نیکا نەڕێ و ڕەگەز دۆزی یا نە تەمام"], a: 2 },
        { q: "د ڤێ دێرا هۆزانیدا (مەعشوق تویی ب فەخرو نازی / عاشق تویی لێک بێ نیازی)، ڕەگەز دۆزیا نە تەما مە د:", o: ["هژمارا (پیتان)", "جۆری (پیتان)", "ڕێزا (پیتان)", "جۆر و هژمارا (پیتان)"], a: 0 },
        { q: "د کیژ نەڤان دێرین هۆزانیدا نیشانەیەک هەیە تاکو بزانین ئه و پەیڤ بۆ ڕامانا بنجی یا خۆ بکارنە هاتییە؟", o: ["لایدا سەرپۆش و پەرچەمی بای شەماڵ / مانگێک هاتەدەر پڕ لە خەت و خاڵ", "ئەم جووتە شێرە دلێرەی شەرزە / لەناو مێژوودا ناویان زۆر بەرزە", "چاوەکەم نە مڕۆ لۆ گوڵشەن گوڵ بە عیشوه خۆی نواند / نە ک نمەک گیربم بە مەرگی تۆ قەسەم هیچ نەمدواند", "هەمی ڕاستن."], a: 3 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];

    const qNumEl = document.getElementById('q-num');
    const qTextEl = document.getElementById('q-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress');
    const quizContainer = document.getElementById('quiz-container');
    const resultContainer = document.getElementById('result-container');
    const scoreBox = document.getElementById('score-box');
    const feedbackText = document.getElementById('feedback-text');
    const reviewList = document.getElementById('review-list');

    function loadQuestion() {
        const currentQuestion = questions[currentQuestionIndex];
        qNumEl.innerText = `پرسیارا ${currentQuestionIndex + 1} ژ ${questions.length}`;
        qTextEl.innerText = currentQuestion.q;
        optionsContainer.innerHTML = '';
        
        const labels = ['A', 'B', 'C', 'D'];
        currentQuestion.o.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = `${labels[index]}) ${option}`;
            button.onclick = () => selectOption(index);
            if (userAnswers[currentQuestionIndex] === index) {
                button.classList.add('selected');
            }
            optionsContainer.appendChild(button);
        });

        nextBtn.disabled = userAnswers[currentQuestionIndex] === undefined;
        nextBtn.innerText = currentQuestionIndex === questions.length - 1 ? "دوماهی هێنان (Finish)" : "دوواتر (Next)";
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
    }

    function selectOption(index) {
        userAnswers[currentQuestionIndex] = index;
        const buttons = optionsContainer.getElementsByClassName('option-btn');
        for (let btn of buttons) {
            btn.classList.remove('selected');
        }
        buttons[index].classList.add('selected');
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            calculateScore();
        }
    }

    function calculateScore() {
        score = 0;
        questions.forEach((question, index) => {
            if (userAnswers[index] === question.a) {
                score += 2;
            }
        });

        quizContainer.style.display = 'none';
        resultContainer.style.display = 'block';
        scoreBox.innerText = `${score} / 100`;

        if (score >= 50) {
            feedbackText.innerText = "پیرۆزە! تە تاقیکردنەوە ب سەرکەفتویی دەرباز کر.";
            feedbackText.className = "text-success";
        } else {
            feedbackText.innerText = "مخابن! نمریا تە یا کەمە، پتر هەوڵ بدە.";
            feedbackText.className = "text-danger";
        }

        showReview();
    }

    function showReview() {
        reviewList.innerHTML = '';
        const labels = ['A', 'B', 'C', 'D'];
        
        questions.forEach((question, index) => {
            const isCorrect = userAnswers[index] === question.a;
            const item = document.createElement('div');
            item.className = `review-item ${isCorrect ? 'correct-item' : 'wrong-item'}`;

            item.innerHTML = `
                <div class="review-q">پرسیارا ${index + 1}: ${question.q}</div>
                <div class="review-ans">بەرسڤا تە: <span class="${isCorrect ? 'text-success' : 'text-danger'}">${labels[userAnswers[index]] ? labels[userAnswers[index]] + ') ' + question.o[userAnswers[index]] : 'بەرسڤ نەدایە'}</span></div>
                ${!isCorrect ? `<div class="review-ans">بەرسڤا دروست: <span class="text-success">${labels[question.a]}) ${question.o[question.a]}</span></div>` : ''}
            `;
            reviewList.appendChild(item);
        });
    }

    loadQuestion();
</script>
