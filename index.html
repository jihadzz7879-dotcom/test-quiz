<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکرنا ویزاری</title>
    <style>
        /* ستایلێ گشتی یێ لاپەرەی */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* کادرێ سەرەکی یێ ڕەش */
        .main-container {
            background-color: #121212;
            border: 1px solid #1a1a1a;
            border-radius: 24px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 500px; /* بۆ هندێ وەک وێنەی درێژ و جوان بیت */
        }

        /* پشکا سەرەکی (ناڤنیشان) */
        .header-section {
            margin-bottom: 30px;
        }

        .main-title {
            color: #d4af37; /* رەنگێ زێری یێ گەش */
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sub-title {
            color: #777777;
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* پشکا دوگمەیان ب شێوازێ لیستێ دا تێکەڵ نەبن */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 16px; /* مەسافە د ناڤبەرا دوگمەیان دا */
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* ستایلێ دوگمەیێن هۆلی و شیک و بەرفرەهـ */
        .subject-btn {
            display: block;
            background-color: #161a23; /* ڕەنگێ شینکا تاریک وەک یێ وێنەی */
            border: 1px solid #252c3a;
            border-radius: 50px; /* هۆلی و بازنەیی یێ تەمام */
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            padding: 16px 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* دەما کلیل یان لێدان دکەڤیتە سەر دوگمێ */
        .subject-btn:hover {
            border-color: #d4af37; /* گۆهرین بۆ زێری */
            background-color: #1f2635;
            transform: scale(1.02); /* کێمەک مەزنتر دبیت */
        }

        /* ناڤێ تە ل بنێ کادری */
        .footer-text {
            color: #444444;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- پشکا سەرەکی -->
        <div class="header-section">
            <div class="main-title">تاقیکرنا ویزاری</div>
            <div class="sub-title">خولا دووێ 2025-2026</div>
        </div>

        <!-- پشکا دوگمەیان - نوکە هەر ئێک دێ ل ڕێزەکێ بیت ب جوانی -->
        <div class="buttons-container">
            <a href="kurdish.html" class="subject-btn">کوردی</a>
            <a href="arabic.html" class="subject-btn">عەرەبی</a>
            <a href="english.html" class="subject-btn">ئینگلیزی</a>
            <a href="yasa.html" class="subject-btn">یاسا</a>
        </div>

        <!-- ناڤێ تە ل بنێ لاپەرەی -->
        <div class="footer-text">GEHAD ZEBARI</div>
    </div>

</body>
</html>
