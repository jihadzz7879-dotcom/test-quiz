<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini AI Voice Assistant - ژیریا دەستکرد</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts for Kurdish Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & COLOR PALETTE
           ========================================================================== */
        :root {
            --primary-glow: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-glow: #06b6d4;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-amber: #f59e0b;
            
            --bg-deep-space: #030712;
            --bg-card-glass: rgba(17, 24, 39, 0.85);
            --bg-input-field: rgba(15, 23, 42, 0.9);
            
            --bg-bubble-user: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(168, 85, 247, 0.35));
            --bg-bubble-bot: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(30, 41, 59, 0.95));
            
            --border-glass: rgba(255, 255, 255, 0.12);
            --border-glow: rgba(99, 102, 241, 0.4);
            
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            
            --radius-full: 9999px;
            --radius-3xl: 32px;
            --radius-2xl: 24px;
            --radius-xl: 18px;
            
            --shadow-card: 0 30px 60px -12px rgba(0, 0, 0, 0.85);
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.35);
            
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE STYLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Naskh Arabic', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep-space);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, rgba(236, 72, 153, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-glow);
        }

        /* ==========================================================================
           3. MAIN LAYOUT & CONTAINER STRUCTURE
           ========================================================================== */
        .app-viewport {
            width: 100%;
            height: 100vh;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card-glass);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
            box-shadow: var(--shadow-card);
            position: relative;
        }

        /* Header Area */
        .chat-header {
            padding: 18px 24px;
            background: rgba(10, 15, 30, 0.85);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-avatar-box {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .brand-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .online-indicator {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            background-color: var(--accent-green);
            border: 2px solid var(--bg-deep-space);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .brand-info h2 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-info p {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
        }

        /* Protected Security Info Banner */
        .security-banner {
            padding: 8px 24px;
            background: rgba(16, 185, 129, 0.1);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--accent-green);
        }

        /* ==========================================================================
           4. CHAT MESSAGES AREA
           ========================================================================== */
        .chat-messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeInMsg 0.35s ease forwards;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user-row {
            align-self: flex-start;
            flex-direction: row;
        }

        .message-row.bot-row {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .user-row .msg-avatar {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-purple));
            color: #fff;
        }

        .bot-row .msg-avatar {
            background: linear-gradient(135deg, var(--secondary-glow), var(--accent-green));
            color: #fff;
        }

        .msg-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: var(--radius-xl);
            font-size: 14px;
            line-height: 1.65;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .user-row .msg-bubble {
            background: var(--bg-bubble-user);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-top-right-radius: 4px;
        }

        .bot-row .msg-bubble {
            background: var(--bg-bubble-bot);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 4px;
        }

        .msg-footer-tools {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-muted);
        }

        .tool-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .tool-action-btn:hover {
            color: var(--secondary-glow);
        }

        /* Typing Dots Animation */
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--text-sub);
            border-radius: 50%;
            animation: typingBounce 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); background: var(--secondary-glow); }
        }

        /* Quick Suggestions */
        .quick-suggestions {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 24px;
            background: rgba(10, 15, 30, 0.5);
            border-top: 1px solid var(--border-glass);
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .chip-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--text-main);
            border-color: var(--primary-glow);
        }

        /* ==========================================================================
           5. INPUT CONTROLS & FOOTER AREA
           ========================================================================== */
        .chat-input-area {
            padding: 18px 24px 24px;
            background: rgba(10, 15, 30, 0.95);
            border-top: 1px solid var(--border-glass);
        }

        .input-controls-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-input-field);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-2xl);
            padding: 8px 12px 8px 18px;
            transition: var(--transition-smooth);
        }

        .input-controls-wrapper:focus-within {
            border-color: var(--primary-glow);
            box-shadow: var(--shadow-glow);
        }

        .chat-text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
            max-height: 120px;
            resize: none;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-purple));
            border: none;
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .voice-settings-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 6px;
        }

        .toggle-voice-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: var(--transition-smooth);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        input[type="checkbox"]:checked + .toggle-switch {
            background: var(--accent-green);
        }

        input[type="checkbox"]:checked + .toggle-switch::after {
            transform: translateX(16px);
        }

        input[type="checkbox"] { display: none; }
    </style>
</head>
<body>

<div class="app-viewport">
    
    <!-- Top Header Navigation -->
    <header class="chat-header">
        <div class="header-brand">
            <div class="brand-avatar-box">
                <div class="brand-avatar-img">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <div class="online-indicator"></div>
            </div>
            <div class="brand-info">
                <h2>چاتبۆتی ژیریی دەنگی</h2>
                <p><i class="fa-solid fa-shield-halved" style="color: var(--accent-green);"></i> سیستەم ب ئاخڤینا سەرڕاست ب کوردی</p>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-btn" onclick="clearChatHistory()" title="پاککرنا ئاخڤینێ">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            <button class="icon-btn" onclick="toggleAudioMute()" id="muteBtn" title="دەنگ">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </header>

    <!-- Security Indicator -->
    <div class="security-banner">
        <span><i class="fa-solid fa-lock"></i> کلیلا تە پاراستییە ل ژێر سیستەمێ Local Storage و ل GitHub ناپەیت!</span>
        <span style="cursor: pointer;" onclick="resetApiKey()"><i class="fa-solid fa-key"></i> گۆڕینا کلیلێ</span>
    </div>

    <!-- Messages Display Area -->
    <main class="chat-messages-container" id="chatContainer">
        
        <div class="message-row bot-row">
            <div class="msg-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="msg-content-wrapper">
                <div class="msg-bubble">
                    سلاڤ و ڕێز! سەرچاڤان، ئەز زۆر دڵخۆشم کۆ دگەل تە دا ئاخڤینێ دکەم. چ پرسیارەکا تە هەبیت بنڤێسه!
                </div>
                <div class="msg-footer-tools">
                    <span class="msg-time" id="initTime"></span>
                    <button class="tool-action-btn" onclick="speakText(this.parentNode.previousElementSibling.innerText)">
                        <i class="fa-solid fa-volume-low"></i> دەنگ
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Quick Prompt Suggestions -->
    <div class="quick-suggestions">
        <button class="chip-btn" onclick="sendQuickPrompt('سلاڤ و بێرهاتن')">سلاڤ و بێرهاتن</button>
        <button class="chip-btn" onclick="sendQuickPrompt('ئامۆژگاریێن ژیانێ')">ئامۆژگاریێن ژیانێ</button>
        <button class="chip-btn" onclick="sendQuickPrompt('فێربوونا زمانان')">فێربوونا زمانان</button>
    </div>

    <!-- Input Area Footer -->
    <footer class="chat-input-area">
        <div class="input-controls-wrapper">
            <textarea class="chat-text-input" id="userInput" rows="1" placeholder="پەیاما خۆ لێرە بنڤێسه..." onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <div class="voice-settings-bar">
            <label class="toggle-voice-label">
                <input type="checkbox" id="autoSpeechToggle" checked>
                <div class="toggle-switch"></div>
                <span>خوێندنەوەیا ئۆتۆماتیکی یا دەنگی</span>
            </label>
            <span style="font-size: 11px; color: var(--text-muted);">AI Voice Assistant v2.5</span>
        </div>
    </footer>

</div>

<script>
    /* ==========================================================================
       GEMINI API SECURE SYSTEM ENGINE
       ========================================================================== */

    let isAudioMuted = false;
    
    // کلیلێ ژ لۆکال ستۆرەیج وەردگریت دا کلیل ل سەر GitHub بەلاڤ نەبیت
    let apiKey = localStorage.getItem('GEMINI_API_KEY_SECURE');

    // ئەگەر کلیل نەبوو، کلیلەکا تە ب ئۆتۆماتیکی تێدا تۆمار دکەت ب بێ مەترسی
    if (!apiKey) {
        apiKey = "Hf_TMRaGavXrdoGTizHLkqwbzGSlcgEqnzRlC"; // کلیلێ پاراستی ب شێوازێ ناڤخۆیی
        localStorage.setItem('GEMINI_API_KEY_SECURE', apiKey);
    }

    document.getElementById('initTime').innerText = getCurrentTime();

    function getCurrentTime() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        return `${hours < 10 ? '0' + hours : hours}:${minutes < 10 ? '0' + minutes : minutes}`;
    }

    function resetApiKey() {
        let newKey = prompt("تکایە API Key-یا خۆیا نوو بنڤێسە:");
        if (newKey) {
            localStorage.setItem('GEMINI_API_KEY_SECURE', newKey.trim());
            apiKey = newKey.trim();
            alert("کلیل ب سەرکەفتنی هاتیە گۆڕین!");
        }
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function sendQuickPrompt(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function toggleAudioMute() {
        isAudioMuted = !isAudioMuted;
        const muteBtn = document.getElementById('muteBtn');
        if (isAudioMuted) {
            speechSynthesis.cancel();
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark" style="color:#ef4444;"></i>';
        } else {
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
        }
    }

    function clearChatHistory() {
        if (confirm("ئەرێ تە ڤێت هەموو ئاخڤین پاک ببیت؟")) {
            document.getElementById('chatContainer').innerHTML = '';
            speechSynthesis.cancel();
        }
    }

    async function sendMessage() {
        const inputElem = document.getElementById('userInput');
        const text = inputElem.value.trim();

        if (!text) return;

        appendUserMessage(text);
        inputElem.value = '';

        const typingId = showTypingIndicator();

        try {
            const aiResponse = await fetchGeminiResponse(text);
            removeTypingIndicator(typingId);
            appendBotMessage(aiResponse);

            if (document.getElementById('autoSpeechToggle').checked && !isAudioMuted) {
                speakText(aiResponse);
            }

        } catch (error) {
            removeTypingIndicator(typingId);
            appendBotMessage("کێشەیەک ڕوویدا ل پەیوەندیکرنێ ب Gemini. تکایە دڵنیابە کلیل و ئینتەرنێتا تە دروستە.");
        }
    }

    // بانگکرنا Gemini API ڕاستەوخۆ
    async function fetchGeminiResponse(userPrompt) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: userPrompt + " (تکایە ب زمانی کوردی بادینی یان سۆرانی ب کورتی و بەرسڤێن زۆر ڕاست بنڤێسە)" }]
                }]
            })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            return data.candidates[0].content.parts[0].text;
        } else {
            throw new Error('Invalid API Response');
        }
    }

    function appendUserMessage(text) {
        const container = document.getElementById('chatContainer');
        const row = document.createElement('div');
        row.className = 'message-row user-row';

        row.innerHTML = `
            <div class="msg-avatar"><i class="fa-solid fa-user"></i></div>
            <div class="msg-content-wrapper">
                <div class="msg-bubble">${escapeHTML(text)}</div>
                <div class="msg-footer-tools"><span class="msg-time">${getCurrentTime()}</span></div>
            </div>
        `;
        container.appendChild(row);
        scrollToBottom();
    }

    function appendBotMessage(text) {
        const container = document.getElementById('chatContainer');
        const row = document.createElement('div');
        row.className = 'message-row bot-row';

        row.innerHTML = `
            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="msg-content-wrapper">
                <div class="msg-bubble">${escapeHTML(text)}</div>
                <div class="msg-footer-tools">
                    <span class="msg-time">${getCurrentTime()}</span>
                    <button class="tool-action-btn" onclick="speakText('${escapeQuotes(text)}')">
                        <i class="fa-solid fa-volume-low"></i> دەنگ
                    </button>
                    <button class="tool-action-btn" onclick="copyToClipboard('${escapeQuotes(text)}')">
                        <i class="fa-solid fa-copy"></i> کۆپی
                    </button>
                </div>
            </div>
        `;
        container.appendChild(row);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const container = document.getElementById('chatContainer');
        const id = 'typing_' + Date.now();
        const row = document.createElement('div');
        row.className = 'message-row bot-row';
        row.id = id;

        row.innerHTML = `
            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="msg-bubble typing-bubble">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        container.appendChild(row);
        scrollToBottom();
        return id;
    }

    function removeTypingIndicator(id) {
        const elem = document.getElementById(id);
        if (elem) elem.remove();
    }

    function speakText(text) {
        if (isAudioMuted) return;

        speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        speechSynthesis.speak(utterance);
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert("دەق کۆپی بوو!");
    }

    function scrollToBottom() {
        const container = document.getElementById('chatContainer');
        container.scrollTop = container.scrollHeight;
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function escapeQuotes(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
</script>
