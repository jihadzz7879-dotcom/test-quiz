<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تاقیکردنەوەیا فیزیایێ</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 40px; border-radius: 25px; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>بەخێر بێن بۆ تاقیکرنا فیزیایێ</h2>
    <div id="form-section">
        <input type="text" id="name" placeholder="ناڤێ تە یێ تەمام">
        <input type="number" id="age" placeholder="تەمەنێ تە">
        
        <select id="gender">
            <option value="">ڕەگەزێ خۆ دیار بکە</option>
            <option value="کور">کور</option>
            <option value="کچ">کچ</option>
        </select>

        <select id="round">
            <option value="">خولا تاقیکرنێ</option>
            <option value="خولا ئێکێ">خولا ئێکێ</option>
            <option value="خولا دووێ">خولا دووێ</option>
        </select>

        <button onclick="startQuiz()">دەستپێکرنا تاقیکرنێ</button>
    </div>
</div>

<script>
function startQuiz() {
    const data = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        round: document.getElementById('round').value
    };

    if(!data.name || !data.age || !data.gender || !data.round) {
        return alert("تکایە هەمی زانیارییان پڕ بکە!");
    }

    alert(`سلاڤ ${data.name}، تو ${data.gender}ی و تەمەنێ تە ${data.age} سالە، تو دێ پشکداری د ${data.round} دا کەی. بەرهەڤی؟`);
    // ل ڤێرێ دێ شاشێ نەخشەیێ تاقیکرنێ نیشان دەی
}
</script>
</body>
</html>
