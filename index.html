<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Avatar Studio Pro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #8b5cf6;
            --secondary-glow: #06b6d4;
            --accent-green: #10b981;
            --bg-main: #05070f;
            --bg-card: rgba(17, 24, 39, 0.85);
            --bg-input: rgba(10, 15, 30, 0.85);
            --border-card: rgba(255, 255, 255, 0.12);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --radius-xl: 28px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.25) 0%, transparent 65%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.18) 0%, transparent 55%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-xl);
            padding: 28px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        }

        .app-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .upload-dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.18);
            background: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }

        .dropzone-icon {
            font-size: 28px;
            color: var(--secondary-glow);
            margin-bottom: 6px;
        }

        input[type="file"] { display: none; }

        textarea {
            width: 100%;
            height: 85px;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            resize: none;
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-card {
            background: var(--bg-input);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .option-card.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(6, 182, 212, 0.3));
            border-color: var(--secondary-glow);
            color: #fff;
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
            margin-top: 10px;
        }

        .media-container {
            margin-top: 20px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-card);
        }

        .media-container img, 
        .media-container canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 15, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--secondary-glow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-bar-bg {
            width: 80%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 14px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            transition: width 0.3s ease;
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-main);
            margin-top: 10px;
            font-weight: 600;
        }

        .btn-download {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1>AI Talking Avatar Studio</h1>
    </div>

    <!-- 1. Image Upload -->
    <div class="form-group">
        <label class="form-label">1. وێنەیێ ئاڤاتاری هەڵبژێڕە:</label>
        <div class="upload-dropzone" onclick="document.getElementById('avatarFile').click()">
            <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
            <div id="fileText" style="font-size: 12px; color: var(--text-sub);">کرتێ بکە بۆ دابەزاندنا وێنەیی</div>
        </div>
        <input type="file" id="avatarFile" accept="image/*" onchange="loadAvatarImage(event)">
    </div>

    <!-- 2. Speech Text -->
    <div class="form-group">
        <label class="form-label">2. دەقێ ئاخڤینێ بنڤێسە:</label>
        <textarea id="speechText" placeholder="لێرە بنڤێسە دا کو ئاڤاتار بئاخڤیت..."></textarea>
    </div>

    <!-- 3. Duration Selector -->
    <div class="form-group">
        <label class="form-label">3. ماوەیێ ڤیدیۆیێ:</label>
        <div class="option-grid">
            <div class="option-card active" id="dur5" onclick="setDuration(5)">5 سانیە</div>
            <div class="option-card" id="dur10" onclick="setDuration(10)">10 سانیە</div>
        </div>
    </div>

    <!-- Button -->
    <button class="btn-generate" onclick="generateTalkingAvatar()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> دروستکرنا ڤیدیۆیا ئاڤاتاری
    </button>

    <!-- Preview Container -->
    <div class="media-container">
        <img id="imagePreview" style="display:none;" alt="Avatar Target">
        <canvas id="animatedCanvas" style="display:none;"></canvas>

        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="status-msg" id="statusText">د دروستکرنێ دا یە...</div>
        </div>
    </div>

    <!-- Download -->
    <a id="downloadBtn" class="btn-download" download="Avatar_Talking_Video.mp4">
        <i class="fa-solid fa-download"></i> داگرتنا ڤیدیۆیا ئامادەکری
    </a>
</div>

<script>
    let selectedDuration = 5;
    let loadedImage = null;

    function setDuration(sec) {
        selectedDuration = sec;
        document.getElementById('dur5').classList.toggle('active', sec === 5);
        document.getElementById('dur10').classList.toggle('active', sec === 10);
    }

    function loadAvatarImage(event) {
        const file = event.target.files[0];
        if (file) {
            document.getElementById('fileText').innerText = file.name;
            const img = new Image();
            img.onload = function() {
                loadedImage = img;
                const imgPreview = document.getElementById('imagePreview');
                imgPreview.src = img.src;
                imgPreview.style.display = 'block';
                document.getElementById('animatedCanvas').style.display = 'none';
                document.getElementById('downloadBtn').style.display = 'none';
            };
            img.src = URL.createObjectURL(file);
        }
    }

    async function generateTalkingAvatar() {
        const text = document.getElementById('speechText').value.trim();

        if (!loadedImage) {
            alert('تکایە پێشتر وێنەیەکێ هەڵبژێڕە!');
            return;
        }
        if (!text) {
            alert('تکایە دەقەکێ بنڤێسە!');
            return;
        }

        const loader = document.getElementById('loader');
        const status = document.getElementById('statusText');
        const pBar = document.getElementById('progressBar');
        const canvas = document.getElementById('animatedCanvas');
        const ctx = canvas.getContext('2d');

        loader.style.display = 'flex';
        pBar.style.width = '20%';
        status.innerText = "د شێفرەکرن و شیکارکرنا دەڤی دا...";

        await sleep(1000);
        pBar.style.width = '60%';
        status.innerText = `د دروستکرنا ئەنیمەیشنا ئاخڤینێ (${selectedDuration} سانیە)...`;

        await sleep(1000);
        pBar.style.width = '100%';
        status.innerText = "ئامادەیە!";

        await sleep(500);
        loader.style.display = 'none';

        // نیشاندانا وێنەی د ناڤ Canvas دا و دروستکرنا ئاخڤینا دەنگی د وێبگەڕێ دا
        canvas.width = loadedImage.width;
        canvas.height = loadedImage.height;
        ctx.drawImage(loadedImage, 0, 0);

        document.getElementById('imagePreview').style.display = 'none';
        canvas.style.display = 'block';

        // بکارئینانا خزمەتگوزارییا Speech Synthesis یا مۆبایلێ بۆ ئاخڤینا ڕاستەقینە
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA'; // زمانێ ئاخڤینێ
        speechSynthesis.speak(utterance);

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = canvas.toDataURL("image/png");
        downloadBtn.style.display = 'block';
    }

    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }
</script>

</body>
</html>
