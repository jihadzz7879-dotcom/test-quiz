<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکرنا یاسا - پولا ١٢</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 20px; }
        .btn {
            display: block;
            text-decoration: none;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
            color: #121212;
        }
        .btn-home { background-color: #d4af37; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1>تاقیکرنا یاسا</h1>
    <p>بۆ دەستپێکرنا تاقیکرنێ کلیکێ ل ڤێرێ بکە</p>
    <!-- ل ڤێرێ پرسیارێن یاسایێ دێ هێنە زێدەکرن -->
    <a href="index.html" class="btn btn-home">زڤرین بۆ پەڕا سەرەکی</a>
</div>

</body>
</html>
