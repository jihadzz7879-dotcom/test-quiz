<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo to Talking Video Generator</title>
    <style>
        :root {
            --bg: #090d16;
            --panel: rgba(21, 29, 44, 0.85);
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --accent: #ec4899;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, #090d16 75%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #a855f7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input[type="file"], textarea, select, input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        .vip-code-group {
            display: none;
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            margin-top: 10px;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(6, 182, 212, 0.5);
        }

        /* بەشێ نمایشێ */
        .display-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 320px;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: opacity 0.3s;
        }

        .progress-bar {
            width: 70%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.1s linear;
        }

        .btn-download {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #10b981;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-download:hover {
            background: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- بەشێ کۆنترۆڵکرن و زانیارییان -->
    <div>
        <h1>📸 وێنەی بکه ڤیدیۆیا ئاخڤتی ب AI</h1>
        
        <div class="form-group">
            <label>1. وێنەیەکێ هەڵبژێڕە (مۆبایل یان کۆمپیتەر):</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="form-group">
            <label>2. ئەو ئاخڤینا تە دڤێت بێژێت بنڤێسە:</label>
            <textarea id="textInput" placeholder="دەقێ خۆ لێرە بنڤێسە..."></textarea>
        </div>

        <div class="form-group">
            <label>3. ماوەیا ڤیدیۆیێ (تەنێ 5s ب بێبەرامبەرە):</label>
            <select id="durationSelect" onchange="checkDuration()">
                <option value="5">5 چرکە (بێبەرامبەر - Free)</option>
                <option value="10">10 چرکە (پێویستی ب کۆدی یە)</option>
                <option value="15">15 چرکە (پێویستی ب کۆدی یە)</option>
                <option value="20">20 چرکە (پێویستی ب کۆدی یە)</option>
            </select>
        </div>

        <div class="form-group vip-code-group" id="vipCodeGroup">
            <label style="color: var(--accent);">🔑 کۆدێ تایبەت (VIP Code) بنڤێسە:</label>
            <input type="text" id="vipCodeInput" placeholder="کۆدێ خۆ لێرە بنڤێسە...">
        </div>

        <button class="btn-main" onclick="generateVideo()">دروستکرنا ڤیدیۆیێ 🚀</button>
    </div>

    <!-- بەشێ نیشاندان و داگرتنێ -->
    <div style="display: flex; flex-direction: column; width: 100%;">
        <div class="display-area">
            <canvas id="previewCanvas" width="400" height="400"></canvas>

            <div class="overlay" id="overlay">
                <span id="statusText">وێنەیەکێ باربکە بۆ دەستپێکرنێ</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        
        <button class="btn-download" id="downloadBtn">⬇️ داگرتنا ڤیدیۆیێ ل سەر مۆبایلێ</button>
    </div>
</div>

<script>
    // کۆدێن تایبەت بۆ ماوەیێن پارەدراو (تو دشێی ڤان کۆدان بگۆڕی)
    const VIP_CODES = {
        "10": "VIP10SEC",
        "15": "VIP15SEC",
        "20": "VIP20SEC"
    };

    const imageInput = document.getElementById('imageInput');
    const textInput = document.getElementById('textInput');
    const durationSelect = document.getElementById('durationSelect');
    const vipCodeGroup = document.getElementById('vipCodeGroup');
    const vipCodeInput = document.getElementById('vipCodeInput');
    
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const downloadBtn = document.getElementById('downloadBtn');

    let loadedImage = null;
    let mediaRecorder;
    let recordedChunks = [];

    // بارکرن و نیشاندانا وێنەی ل سەر Canvas
    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.style.display = 'none', 300);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // پشکنینا پێویستیا کۆدی ل سەر دەمێن جیاواز
    function checkDuration() {
        const selectedVal = durationSelect.value;
        if (selectedVal === "5") {
            vipCodeGroup.style.display = 'none';
        } else {
            vipCodeGroup.style.display = 'block';
        }
    }

    // پرۆسێسا چێکرنا ڤیدیۆ و دەنگی
    function generateVideo() {
        if (!loadedImage) {
            alert('تکایە پێشتر وێنەیەکێ هەڵبژێڕە!');
            return;
        }

        const text = textInput.value;
        if (!text) {
            alert('تکایە دەقێ ئاخڤینێ بنڤێسە!');
            return;
        }

        const durationSec = parseInt(durationSelect.value);

        // پشکنینا کۆدێن VIP
        if (durationSec > 5) {
            const userCode = vipCodeInput.value.trim();
            const correctCode = VIP_CODES[durationSec.toString()];
            if (userCode !== correctCode) {
                alert(`کۆدێ نەدرستە! بۆ ماوەیا ${durationSec} چرکەیان پێویست ب کۆدێ دروست هەیە.`);
                return;
            }
        }

        // ئامادەکرنا دەنگی ب SpeechSynthesis API
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9; // خێڕایی ئاخڤینێ

        // رێکخستنا UI بۆ پرۆسێسێ
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
        progressBar.style.display = 'block';
        downloadBtn.style.display = 'none';
        statusText.innerText = 'د پێوسۆسێ دا یە و تۆمارکرنا ڤیدیۆیێ...';

        recordedChunks = [];
        const stream = canvas.captureStream(30); 
        
        // تۆمارکەر بۆ فایلا WebM
        let options = { mimeType: 'video/webm' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/mp4' };
        }
        
        mediaRecorder = new MediaRecorder(stream, options);
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const videoURL = URL.createObjectURL(blob);
            
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = videoURL;
                a.download = `AI_Talking_Video_${durationSec}s.webm`;
                a.click();
            };
            downloadBtn.style.display = 'block';
        };

        mediaRecorder.start();

        // دەستپێکرنا ئاخڤینێ
        speechSynthesis.speak(utterance);

        const startTime = Date.now();
        const totalMs = durationSec * 1000;

        function animate() {
            const elapsedTime = Date.now() - startTime;
            const progress = Math.min((elapsedTime / totalMs) * 100, 100);
            progressFill.style.width = progress + '%';

            // ڕێنیشاندانا وێنەی ب لڤینێن ئاخڤینێ (Zoom in & Zoom out Effect)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // دروستکرنا لڤینا دەڤی یان ئانیمەیشنا دەمێ ئاخڤینێ
            let scale = 1 + (Math.sin(elapsedTime * 0.01) * 0.03); 
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.drawImage(loadedImage, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            ctx.restore();

            if (elapsedTime < totalMs) {
                requestAnimationFrame(animate);
            } else {
                speechSynthesis.cancel();
                mediaRecorder.stop();
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);
            }
        }

        animate();
    }
</script>

</body>
</html>
