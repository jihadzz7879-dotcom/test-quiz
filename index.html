<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکرنێن ویزاری</title>
    <style>
        :root {
            --primary: #f1c40f;
            --primary-hover: #f39c12;
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --error: #e74c3c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            text-align: center; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        h2 { 
            color: var(--primary); 
            margin-bottom: 25px; 
            font-size: 28px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.3); 
        }
        
        #timer { 
            font-size: 22px; 
            color: var(--primary); 
            padding: 18px; 
            border: 2px dashed var(--primary); 
            border-radius: 20px; 
            margin: 0 auto 35px; 
            width: 90%; 
            max-width: 420px; 
            background: rgba(241, 196, 15, 0.03); 
            box-shadow: inset 0 0 20px rgba(241, 196, 15, 0.05);
            font-weight: bold;
        }
        
        .btn-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%;
        }

        .btn { 
            display: block; 
            width: 90%; 
            max-width: 380px; 
            padding: 16px; 
            margin: 10px 0; 
            background: linear-gradient(135deg, #1c1c1c, #111111); 
            color: var(--text-main); 
            text-decoration: none; 
            border-radius: 50px; 
            border: 1px solid #2a2a2a; 
            transition: all 0.4s ease; 
            font-weight: bold; 
            font-size: 16px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4); 
        }

        .btn:hover { 
            background: #181818; 
            border-color: var(--primary); 
            color: var(--primary); 
            transform: translateY(-4px); 
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.15); 
        }
        
        .hidden { display: none !important; }

        .login-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #1c1c1c 0%, #050505 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
        }

        .login-box { 
            background: var(--card-bg); 
            padding: 45px 35px; 
            border-radius: 32px; 
            border: 1px solid rgba(241, 196, 15, 0.3); 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(241, 196, 15, 0.1); 
            width: 90%; 
            max-width: 420px; 
            box-sizing: border-box; 
        }

        .login-box h3 { color: var(--primary); margin-top: 0; font-size: 26px; font-weight: bold; margin-bottom: 12px; }
        .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        .login-box input { width: 100%; padding: 16px; margin-bottom: 20px; border-radius: 50px; border: 1px solid #333; background: #1a1a1a; color: white; text-align: center; font-size: 18px; font-weight: bold; box-sizing: border-box; outline: none; }
        .login-box input:focus { border-color: var(--primary); box-shadow: 0 0 18px rgba(241, 196, 15, 0.4); }
        .login-box button { width: 100%; padding: 16px; border-radius: 50px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #000; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s ease; }
        #error-msg { font-size: 14px; margin-top: 20px; font-weight: bold; min-height: 22px; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h3>سیستەمێ پاراستنا ئەزموونان</h3>
            <p>تکایە کۆدێ تایبەت یێ چالاککرنێ بنڤیسە. <br><b style="color:var(--error);">تێبینی:</b> پشکنین ب ئۆنڵاین دهێتەکرن، هەر کۆدەک تەنها ل سەر ئێک مۆبایل قفل دبیت.</p>
            <input type="text" id="code-input" placeholder="کۆدی لێرە بنووسە..." onkeypress="handleKeyPress(event)">
            <button id="submit-btn" onclick="validateDeviceCode()">پشکنیـن و دەروازە</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <h2>تاقیکرنێن ویزاری ٢٠٢٦</h2>
        <div id="timer">دەستپێکرنا دەمژمێرێ...</div>
        <div class="btn-container">
            <a href="fizya.html" class="btn">فیزیا</a>
            <a href="mejo.html" class="btn">مێژوو</a>
            <a href="kurdish.html" class="btn">کوردی</a>
            <a href="arabic.html" class="btn">عەرەبی</a>
            <a href="english.html" class="btn">ئینگلیزی</a>
            <a href="yasa.html" class="btn">یاسا</a>
            <a href="ark.html" class="btn">ئارک (ARK)</a>
            <a href="eslame.html" class="btn">ئیسلامی</a>
            <a href="zindawar.html" class="btn">ژیندەوار (زیندەزانی)</a>
            <a href="zindawar1.html" class="btn">ژیندەوار ١</a>
        </div>
    </div>

    <script>
        // !!! لێرە ل شوونا ئەڤی لینکێ خوارێ، دەمێ برە سەر هۆستێ، لینکی خۆ یێ KVDB دابنێ !!!
        const SERVER_URL = "https://kvdb.io/YOUR_SECRET_BUCKET_ID_HERE/";

        // لایستەیا کۆدێن نوو یێن کو تە داخوازی کرین (٧ کۆد)
        const allowedCodes = ["JEKO88", "JEKO77", "JEKO66", "JEKO55", "JEKO44", "JEKO33", "JEKO22"];

        // دروستکرنا ناسنامەکا جیهانی بۆ مۆبایلێ
        if (!localStorage.getItem("device_real_token")) {
            localStorage.setItem("device_real_token", "DEVICE-" + Math.random().toString(36).substr(2, 10).toUpperCase() + Date.now().toString().substr(-4));
        }
        const myToken = localStorage.getItem("device_real_token");

        // پشکنین د دەستپێکێ دا
        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem("is_allowed_access") === "true") {
                showSiteContent();
            }
        });

        async function validateDeviceCode() {
            const inputField = document.getElementById("code-input");
            const btn = document.getElementById("submit-btn");
            const code = inputField.value.trim().toUpperCase();

            if (!code) { showMsg("تکایە سەرەتا کۆدەکێ بنڤیسە!", "var(--error)"); return; }
            if (!allowedCodes.includes(code)) { showMsg("ئەڤ کۆدە خەلەتە و بوو شت نینە!", "var(--error)"); inputField.value = ""; return; }

            btn.disabled = true;
            showMsg("پشکنینا سێرڤەرێ سەرەکی دکەت... چاوەڕێبە...", "var(--primary)");

            try {
                // پشکنینا پێگەیێ کۆدی ل سەر ئەنتەرنێتێ
                const response = await fetch(`${SERVER_URL}${code}`);
                
                if (response.status === 404) {
                    // ئەگەر کۆد یێ پاقژ و نوو بوو، بۆ ڤێ مۆبایلێ پاشەکەوت بکە د سێرڤەری دا
                    await fetch(`${SERVER_URL}${code}`, { method: 'POST', body: myToken });
                    saveAndOpen();
                } else {
                    // ئەگەر پێشتر هاتبیتە لێدان، سەیر دکەت کا هی ڤێ مۆبایلێ یە یان لایەکێ دی؟
                    const serverToken = await response.text();
                    if (serverToken.trim() === myToken) {
                        saveAndOpen();
                    } else {
                        showMsg("ئەڤ کۆدە پێشتر ل سەر مۆبایلەکا دی هاتییە قفلکرن و ناتوانی لێرە لێبدی!", "var(--error)");
                        inputField.value = "";
                        btn.disabled = false;
                    }
                }
            } catch (err) {
                showMsg("تکایە هێڵا ئینتەرنێتێ کۆنترۆل بکە و دووبارە تاقی بکەوە!", "var(--error)");
                btn.disabled = false;
            }
        }

        function saveAndOpen() {
            localStorage.setItem("is_allowed_access", "true");
            showSiteContent();
        }

        function showSiteContent() {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-content").classList.remove("hidden");
            startTimer();
        }

        function showMsg(text, color) {
            const msg = document.getElementById("error-msg");
            msg.innerHTML = text;
            msg.style.color = color;
        }

        function handleKeyPress(event) { if (event.key === "Enter") { validateDeviceCode(); } }

        function startTimer() {
            const examDate = new Date("June 14, 2026 07:30:00").getTime();
            const timerInterval = setInterval(function() {
                const now = new Date().getTime();
                const distance = examDate - now;
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                document.getElementById("timer").innerHTML = days + " ڕۆژ و " + hours + " دەمژمێر و " + minutes + " خولەک و " + seconds + " چرکە ";
                if (distance < 0) { clearInterval(timerInterval); document.getElementById("timer").innerHTML = "تاقیکرن دەستپێکر!"; }
            }, 1000);
        }
    </script>
</body>
</html>
