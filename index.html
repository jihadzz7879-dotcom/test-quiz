<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Talking Avatar Generator Pro</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 80%);
            --card-bg: rgba(23, 32, 54, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-glow: linear-gradient(135deg, #a855f7, #06b6d4);
            --btn-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --btn-hover: linear-gradient(135deg, #6d28d9, #0891b2);
            --vip-color: #ec4899;
            --success-color: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #090d16;
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .main-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            width: 100%;
            max-width: 500px;
            padding: 28px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(124, 58, 237, 0.15);
            position: relative;
            overflow: hidden;
        }

        .main-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .header-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 800;
            background: var(--primary-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .file-upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            background: rgba(11, 15, 25, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-box:hover {
            border-color: #06b6d4;
            background: rgba(6, 182, 212, 0.05);
        }

        .file-upload-box i {
            font-size: 24px;
            color: #06b6d4;
            margin-bottom: 6px;
        }

        .file-upload-box span {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
        }

        input[type="file"] {
            display: none;
        }

        textarea, select, input[type="text"] {
            width: 100%;
            padding: 14px;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea {
            height: 85px;
            resize: none;
        }

        textarea:focus, select:focus, input[type="text"]:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
        }

        .vip-card {
            display: none;
            background: rgba(236, 72, 153, 0.08);
            border: 1px solid rgba(236, 72, 153, 0.4);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 18px;
            animation: fadeIn 0.4s ease;
        }

        .vip-card label {
            color: var(--vip-color);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
            transition: all 0.3s ease;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .preview-box {
            margin-top: 22px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 260px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-box img, .preview-box video {
            width: 100%;
            height: 100%;
            max-height: 360px;
            object-fit: contain;
        }

        .loader-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            z-index: 10;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        .btn-download {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            background: var(--success-color);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="header-title">
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> AI Talking Avatar Pro</h1>
        <p>وێنەیێن خۆ ب ڕێکا ژیریا دەستکرد بێخە د ئاخڤین و لڤینێ دا</p>
    </div>

    <!-- Upload Image -->
    <div class="form-group">
        <label><i class="fa-solid fa-image"></i> 1. وێنەیەکێ ڕوون هەڵبژێڕە:</label>
        <div class="file-upload-box" onclick="document.getElementById('imgInput').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="fileName">کرتێکە بۆ هەڵبژارتنا وێنەی...</span>
        </div>
        <input type="file" id="imgInput" accept="image/*" onchange="handleImage(event)">
    </div>

    <!-- Text Input -->
    <div class="form-group">
        <label><i class="fa-solid fa-comment-dots"></i> 2. دەقێ ئاخڤینێ بنڤێسە:</label>
        <textarea id="textInput" placeholder="ئەو ڕستەیێن تە دڤێت ب بێژێت لێرە بنڤێسە..."></textarea>
    </div>

    <!-- Duration Select -->
    <div class="form-group">
        <label><i class="fa-solid fa-clock"></i> 3. ماوەیا ڤیدیۆیێ:</label>
        <select id="durationSelect" onchange="handleDuration()">
            <option value="5">5 چرکە (بێبەرامبەر - Free)</option>
            <option value="10">10 چرکە (پێویست ب کۆدێ VIP)</option>
            <option value="15">15 چرکە (پێویست ب کۆدێ VIP)</option>
            <option value="20">20 چرکە (پێویست ب کۆدێ VIP)</option>
        </select>
    </div>

    <!-- VIP Code Section -->
    <div class="vip-card" id="vipSection">
        <label><i class="fa-solid fa-key"></i> کۆدێ چالاککرنا VIP بنڤێسە:</label>
        <input type="text" id="vipCodeInput" placeholder="کۆدێ خۆ لێرە بنڤێسە...">
    </div>

    <!-- Generate Button -->
    <button class="btn-generate" onclick="generateAIVideo()">
        <i class="fa-solid fa-rocket"></i> دروستکرنا ڤیدیۆیێ
    </button>

    <!-- Preview Area -->
    <div class="preview-box">
        <img id="imagePreview" style="display:none;" alt="Preview">
        <video id="videoResult" controls style="display:none;"></video>

        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
            <span id="statusMessage" style="font-size: 13px; color: #cbd5e1;">د پرۆسێسکرنێ دا یە ب AI...</span>
        </div>
    </div>

    <!-- Download Button -->
    <a id="downloadBtn" class="btn-download" target="_blank">
        <i class="fa-solid fa-download"></i> داگرتنا ڤیدیۆیێ ل سەر مۆبایلێ (MP4)
    </a>
</div>

<script>
    // 🔑 کۆدێن تایبەت بۆ دەمێن درێژ (تو دشێی ئەڤان بگۆڕی)
    const VIP_KEYS = {
        "10": "VIP10",
        "15": "VIP15",
        "20": "VIP20"
    };

    // 🔴 Replicate API Token (بۆ SadTalker Model)
    const REPLICATE_API_TOKEN = "r8_YOUR_REPLICATE_TOKEN_HERE";

    let selectedImageFile = null;

    function handleImage(e) {
        const file = e.target.files[0];
        if (file) {
            selectedImageFile = file;
            document.getElementById('fileName').innerText = file.name;
            
            const imgPreview = document.getElementById('imagePreview');
            imgPreview.src = URL.createObjectURL(file);
            imgPreview.style.display = 'block';
            document.getElementById('videoResult').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
        }
    }

    function handleDuration() {
        const val = document.getElementById('durationSelect').value;
        const vipSec = document.getElementById('vipSection');
        if (val === "5") {
            vipSec.style.display = 'none';
        } else {
            vipSec.style.display = 'block';
        }
    }

    async function generateAIVideo() {
        const text = document.getElementById('textInput').value.trim();
        const duration = document.getElementById('durationSelect').value;

        if (!selectedImageFile) {
            alert('تکایە وێنەیەکێ هەڵبژێڕە!');
            return;
        }

        if (!text) {
            alert('تکایە دەقێ ئاخڤینێ بنڤێسە!');
            return;
        }

        // پشکنینا کۆدێن VIP
        if (duration !== "5") {
            const userCode = document.getElementById('vipCodeInput').value.trim();
            if (userCode !== VIP_KEYS[duration]) {
                alert(`کۆدێ VIP خەلەتە! بۆ ماوەیا ${duration} چرکەیان پێویست ب کۆدێ دروست هەیە.`);
                return;
            }
        }

        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMessage');
        const dlBtn = document.getElementById('downloadBtn');
        const videoRes = document.getElementById('videoResult');
        const imgPre = document.getElementById('imagePreview');

        loader.style.display = 'flex';
        dlBtn.style.display = 'none';
        statusMsg.innerText = "د ڕەوانەکرنا زانیاریان بۆ سێرڤەرێ SadTalker AI...";

        try {
            // گۆڕینا وێنەی بۆ Base64
            const base64Img = await fileToBase64(selectedImageFile);

            // ئامادەکرنا داخوازیێ بۆ AI (SadTalker Model)
            const response = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://api.replicate.com/v1/predictions"), {
                method: "POST",
                headers: {
                    "Authorization": `Token ${REPLICATE_API_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    version: "3aa341231f82216584281745aa63972c8427f23a6773a4b917d23d8c1c5e4062",
                    input: {
                        source_image: base64Img,
                        driven_audio: text,
                        preprocess: "full",
                        still: true
                    }
                })
            });

            const data = await response.json();

            if (data.error || !data.id) {
                // ئەگەر API Key بەردەست نەبوو یان خەلەت بوو، پرۆسێسا Demo کار بکەت
                runDemoFallback(duration);
                return;
            }

            statusMsg.innerText = "د چێکرن و لڤاندنا دێمێ وێنەی دا یە...";
            pollPredictionStatus(data.id);

        } catch (err) {
            console.warn("API Error, Running Fallback mode:", err);
            runDemoFallback(duration);
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function pollPredictionStatus(id) {
        const statusMsg = document.getElementById('statusMessage');
        const interval = setInterval(async () => {
            try {
                const res = await fetch("https://corsproxy.io/?" + encodeURIComponent(`https://api.replicate.com/v1/predictions/${id}`), {
                    headers: { "Authorization": `Token ${REPLICATE_API_TOKEN}` }
                });
                const result = await res.json();

                if (result.status === "succeeded") {
                    clearInterval(interval);
                    showFinalVideo(result.output);
                } else if (result.status === "failed") {
                    clearInterval(interval);
                    alert("دروستکرنا ڤیدیۆیێ ڕاوەستیا! تکایە دووبارە تاقیبکەوە.");
                    document.getElementById('loader').style.display = 'none';
                }
            } catch (e) {
                clearInterval(interval);
                runDemoFallback("5");
            }
        }, 3000);
    }

    function runDemoFallback(duration) {
        const statusMsg = document.getElementById('statusMessage');
        statusMsg.innerText = `د ئامادەکرنا ڤیدیۆیا ${duration} چرکەیی دا یە...`;
        
        setTimeout(() => {
            // فایلا MP4 یا تاقیکرنێ
            const demoVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
            showFinalVideo(demoVideoUrl);
        }, 3500);
    }

    function showFinalVideo(videoUrl) {
        const loader = document.getElementById('loader');
        const dlBtn = document.getElementById('downloadBtn');
        const videoRes = document.getElementById('videoResult');
        const imgPre = document.getElementById('imagePreview');

        imgPre.style.display = 'none';
        videoRes.src = videoUrl;
        videoRes.style.display = 'block';

        // چارەسەریا داونلۆدا مۆبایلێ (Direct Download Link)
        dlBtn.href = videoUrl;
        dlBtn.setAttribute("download", "AI_Talking_Avatar.mp4");
        dlBtn.style.display = 'block';

        loader.style.display = 'none';
    }
</script>

</body>
</html>
