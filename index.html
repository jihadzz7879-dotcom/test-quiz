<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەرتووکخانا پێشکەفتی یا زانینی</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header Design */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Search & Filter Section */
        .controls {
            max-width: 800px;
            margin: -25px auto 30px auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box:focus {
            border-color: var(--secondary-color);
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            background-color: #eee;
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--secondary-color);
            color: white;
        }

        /* Main Content Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Advanced Card Design */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border-top: 5px solid var(--secondary-color);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card-body {
            padding: 20px;
            flex-grow: 1;
        }

        .badge {
            background-color: #e1f5fe;
            color: var(--secondary-color);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .card-text {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 15px;
        }

        .card-footer {
            padding: 15px 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            text-align: left;
        }

        .read-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .read-btn:hover {
            background-color: var(--secondary-color);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            background-color: var(--primary-color);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>پەرتووکخانا زانیاریێن ب مفای</h1>
        <p>مەزنترین ژێدەر بۆ خواندنا بابەتێن جۆراوجۆر (تەکنەلۆژیا، تەندروستی، مێژوو، زانست)</p>
    </header>

    <div class="container">
        <!-- گەڕیان و فلتەرکرن -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="ل بابەتەکێ ب مفای بگەڕێ...">
            <button class="filter-btn active" onclick="filterCategory('all')">هەمی</button>
            <button class="filter-btn" onclick="filterCategory('تەکنەلۆژیا')">تەکنەلۆژیا</button>
            <button class="filter-btn" onclick="filterCategory('تەندروستی')">تەندروستی</button>
            <button class="filter-btn" onclick="filterCategory('زانست')">زانست</button>
        </div>

        <!-- جهێ نیشاندانا بابەتان -->
        <main class="grid" id="contentGrid">
            <!-- بابەت دێ ب ڕێکا جاڤاسکڕێپت ل خوارێ زێدە بن بۆ ئەوەی کۆد سادە بمینیت -->
        </main>
    </div>

    <footer>
        <p>مافێن پاراستینە © 2026 - پەیجێ خواندنا هزار مفا</p>
    </footer>

    <script>
        // ل ڤێرە ئەڤە داتا بیسا پەیجێ تەیە، تۆ دشێی ب هزاران بابەتان ل ڤێرە زێدە بکەی!
        const articles = [
            {
                title: "ژیڕیا دەستکرد (AI) چایە؟",
                category: "تەکنەلۆژیا",
                desc: "لەسەردەمێ نوو دا ژیڕیا دەستکرد شۆڕشەک د هەمی بواراندا دروستکریە، ل ڤێرە فێری بنەمایێن وێ ببە...",
                link: "#"
            },
            {
                title: "گرنگییا خوارنا ساخلەم",
                category: "تەندروستی",
                desc: "خوارنا تەندروست کاریگەریەکا ڕاستەوخۆ ل سەر دەروون و لەشێ مرۆڤی هەیە. ئەڤ بابەتە دێ ژیانا تە هۆڕ کەت.",
                link: "#"
            },
            {
                title: "نهێنیێن گەردوونێ مەزن",
                category: "زانست",
                desc: "ستێرە، هەسارە و کونێن ڕەش... گەشتەک د ناخێ گەردوونی دا بۆ زانینا تشتێن سەیر و سەمەر.",
                link: "#"
            },
            {
                title: "فێربوونا زمانێ پڕۆگرامسازیێ Python",
                category: "تەکنەلۆژیا",
                desc: "بۆچی پایسۆن ئێکەم هەڵبژاردنە بۆ دەستپێکاران؟ ڕێبەرەکێ خێرا بۆ فێربوونێ.",
                link: "#"
            },
            {
                title: "چەوانیا پاراستنا چاڤان ژ شاشان",
                category: "تەندروستی",
                desc: "ئەگەر تۆ زۆر ل بەر کۆمپیۆتەر یان مۆبایلێ د روونی، ئەڤان ڕێنمایان جێبەجێ بکە بۆ پاراستنا بیناهیا خۆ.",
                link: "#"
            },
            {
                title: "تیۆرا ڕێژەیی یا ئەینشتاین",
                category: "زانست",
                desc: "ب زمانەکێ سادە و خۆش، بزۆران کا دەم و جهـ چەوا پێکڤە گرێداینە د زانستێ فیزیا دا.",
                link: "#"
            }
            // تۆ دشێی ل ڤێرە ب هزاران بابەتێن دی زێدە بکەی ب هەمان شێواز...
        ];

        const grid = document.getElementById('contentGrid');
        const searchInput = document.getElementById('searchInput');

        // نەخشێ نیشاندانا بابەتان
        function displayArticles(data) {
            grid.innerHTML = "";
            if(data.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#999;'>چ بابەت نەهاتنە دیتن!</p>";
                return;
            }
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-body">
                        <span class="badge">${item.category}</span>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-text">${item.desc}</p>
                    </div>
                    <div class="card-footer">
                        <a href="${item.link}" class="read-btn">پتر بخوێنە</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // فلتەرکرن ب کەتەگۆری
        function filterCategory(cat) {
            // گۆڕینی ڕەنگێ دوگمێ چالاک
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(cat === 'all') {
                displayArticles(articles);
            } else {
                const filtered = articles.filter(a => a.category === cat);
                displayArticles(filtered);
            }
        }

        // سیستەمێ گەڕیانێ (Search)
        searchInput.addEventListener('input', (e) => {
            const text = e.target.value.toLowerCase();
            const filtered = articles.filter(a => 
                a.title.toLowerCase().includes(text) || 
                a.desc.toLowerCase().includes(text)
            );
            displayArticles(filtered);
        });

        // ل دەستپێکێ هەمی بابەتان نیشان بدە
        displayArticles(articles);
    </script>
</body>
</html>
