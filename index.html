<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمێ ئەنجامێن پۆلا 12</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
            --glass-bg: rgba(30, 41, 59, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --admin-color: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 60%, #070a13 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
            transition: all 0.4s ease;
        }

        h2 {
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-size: 1.8rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent);
            color: #0b0f19;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        button:hover {
            box-shadow: 0 0 20px var(--accent);
            transform: translateY(-2px);
        }

        .result-box, .admin-box {
            display: none;
            text-align: right;
            margin-top: 1.5rem;
            animation: fadeIn 0.5s ease;
        }

        .student-info {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border-right: 4px solid var(--accent);
        }

        .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .marks-table th, .marks-table td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .marks-table th {
            color: var(--accent);
        }

        .back-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 1.5rem;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        .admin-nav-btn {
            background: transparent;
            color: var(--admin-color);
            border: 1px dashed var(--admin-color);
            font-size: 0.9rem;
            padding: 0.5rem;
            width: auto;
            display: inline-block;
            margin-top: 2rem;
        }

        .admin-nav-btn:hover {
            background: rgba(244, 63, 94, 0.1);
            box-shadow: none;
        }

        .admin-control-group {
            background: rgba(255,255,255,0.03);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- بەشا چوونەژوورێ (Login Section) -->
    <div id="loginSection">
        <h2>پلاتفۆرما ئەنجامێن پۆلا 12</h2>
        <p class="subtitle">خۆلا دووێ 2025-2026 - زانستی و وێژەیی</p>
        
        <div class="input-group">
            <label>پۆل (پشکا خۆ هەلبژێره)</label>
            <select id="studentBranch">
                <option value="scientific">زانستی (Scientific)</option>
                <option value="literary">وێژەیی (Literary)</option>
            </select>
        </div>

        <div class="input-group">
            <label>کۆدێ قوتابی (Student Code)</label>
            <input type="text" id="studentCode" placeholder="بۆ نموونە: 1001">
        </div>

        <div class="input-group">
            <label>ژمارا نهێنی (Password)</label>
            <input type="password" id="studentPass" placeholder="••••••">
        </div>

        <button onclick="loginStudent()">تەماشاکرنا ئەنجامی</button>
        <button class="admin-nav-btn" onclick="showAdminLogin()">چوونەژوورێ وەک ئەدمین ⚙️</button>
    </div>

    <!-- بەشا نیشاندانا ئەنجامان (Results Section) -->
    <div id="resultSection" class="result-box">
        <div class="student-info">
            <h3 id="resName">ناڤ: </h3>
            <p id="resBranch" style="font-size: 0.9rem; color: #94a3b8; margin-top: 0.25rem;">پشکا: </p>
        </div>
        <table class="marks-table">
            <thead>
                <tr>
                    <th>بابەت</th>
                    <th>نمرە</th>
                </tr>
            </thead>
            <tbody id="marksBody">
                <!-- نمرە ل ڤێرە دێ دەرکەڤن -->
            </tbody>
        </table>
        <button class="back-btn" onclick="goBack()">گەڕیانەوه</button>
    </div>

    <!-- بەشا پانێلا ئەدمینی (Admin Control Panel) -->
    <div id="adminSection" class="admin-box">
        <h3 style="color: var(--admin-color); margin-bottom: 1.5rem;">کۆنترۆلا ئەدمینی (دەستکاری کرنا نمرەیان)</h3>
        
        <div class="input-group">
            <label>قوتابی هەلبژێره:</label>
            <select id="adminSelectStudent" onchange="loadAdminStudentMarks()">
                <!-- ناڤێن قوتابیان ل ڤێرە دێ هێن -->
            </select>
        </div>

        <div id="adminMarksEditArea">
            <!-- دەستکاری کرنا نمرەیێن قوتابی ل ڤێرە کەت -->
        </div>

        <button style="background: var(--admin-color); color: white;" onclick="saveAdminChanges()">خەزنکرنا گۆڕانکاریان</button>
        <button class="back-btn" onclick="goBack()">دەرکەفتن ژ ئەدمینی</button>
    </div>
</div>

<script>
    // داتابەیسا قوتابیان (Data Store)
    let studentsData = {
        "1001": { 
            name: "نرمین حسن احمد", pass: "1234", branch: "scientific",
            marks: { "فیزیا": 68, "کیمیا": 92, "عەرەبی": 54, "ئینگلیزی": 88, "زیندەوەر": 66, "بیرکاری": 88, "کوردی": 98 }
        },
        "1002": { 
            name: "ئازاد علی حسین", pass: "5678", branch: "scientific",
            marks: { "فیزیا": 75, "کیمیا": 80, "عەرەبی": 65, "ئینگلیزی": 70, "زیندەوەر": 85, "بیرکاری": 90, "کوردی": 88 }
        },
        "1003": { 
            name: "شهناز صدقی احمد", pass: "4321", branch: "literary",
            marks: { "مێژوو": 95, "جوگرافیا": 88, "عەرەبی": 76, "ئینگلیزی": 82, "فەلسەفە": 90, "کوردی": 94, "ئیسلامی": 100 }
        },
        "1004": { 
            name: "احمد خالد مصطفی", pass: "0000", branch: "scientific",
            marks: { "فیزیا": 50, "کیمیا": 62, "عەرەبی": 60, "ئینگلیزی": 55, "زیندەوەر": 70, "بیرکاری": 58, "کوردی": 72 }
        },
        "1005": { 
            name: "دیلان عمر عثمان", pass: "1111", branch: "literary",
            marks: { "مێژوو": 60, "جوگرافیا": 72, "عەرەبی": 50, "ئینگلیزی": 64, "فەلسەفە": 58, "کوردی": 80, "ئیسلامی": 85 }
        }
    };

    const ADMIN_PASSWORD = "admin123"; // کودی نهێنی یێ ئەدمینی

    // فەنکشنا چوونەژوورا قوتابی
    function loginStudent() {
        let branch = document.getElementById("studentBranch").value;
        let code = document.getElementById("studentCode").value.trim();
        let pass = document.getElementById("studentPass").value;

        if(studentsData[code] && studentsData[code].pass === pass && studentsData[code].branch === branch) {
            let student = studentsData[code];
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("resultSection").style.display = "block";
            
            document.getElementById("resName").innerText = "ناڤ: " + student.name;
            document.getElementById("resBranch").innerText = "پشکا: " + (student.branch === "scientific" ? "زانستی" : "وێژەیی");
            
            let tbody = document.getElementById("marksBody");
            tbody.innerHTML = "";
            for (let subject in student.marks) {
                tbody.innerHTML += `<tr><td>${subject}</td><td style="font-weight:bold; color:${student.marks[subject] >= 50 ? '#2ecc71' : '#e74c3c'}">${student.marks[subject]}</td></tr>`;
            }
        } else {
            alert("کۆد، ژمارا نهێنی، یان پشک خەلەتە! ژ پەرستێ دیسا تاقی بکەوه.");
        }
    }

    // پیشاندانا لۆگینا ئەدمینی
    function showAdminLogin() {
        let inputPass = prompt("کۆدێ نهێنی یێ ئەدمینی لێدە:");
        if (inputPass === ADMIN_PASSWORD) {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("adminSection").style.display = "block";
            
            let select = document.getElementById("adminSelectStudent");
            select.innerHTML = "";
            for(let code in studentsData) {
                select.innerHTML += `<option value="${code}">${studentsData[code].name} (${code})</option>`;
            }
            loadAdminStudentMarks();
        } else if(inputPass !== null) {
            alert("کۆدێ ئەدمینی خەلەتە!");
        }
    }

    // بارکرنا نمرەیێن قوتابی بۆ دەستکاری کرنێ د پانێلا ئەدمینی دا
    function loadAdminStudentMarks() {
        let code = document.getElementById("adminSelectStudent").value;
        let student = studentsData[code];
        let area = document.getElementById("adminMarksEditArea");
        area.innerHTML = "";

        for(let subject in student.marks) {
            area.innerHTML += `
                <div class="admin-control-group">
                    <label style="color:var(--accent); font-weight:bold;">${subject}</label>
                    <input type="number" class="admin-mark-input" data-subject="${subject}" value="${student.marks[subject]}" min="0" max="100">
                </div>
            `;
        }
    }

    // خەزنکرنا نمرەیێن نوی یێن ئەدمینی (کێمکرن یان زێدەکرن)
    function saveAdminChanges() {
        let code = document.getElementById("adminSelectStudent").value;
        let inputs = document.querySelectorAll(".admin-mark-input");
        
        inputs.forEach(input => {
            let subject = input.getAttribute("data-subject");
            let newMark = parseInt(input.value);
            if(!isNaN(newMark) && newMark >= 0 && newMark <= 100) {
                studentsData[code].marks[subject] = newMark;
            }
        });

        alert(`گۆڕانکاری ب سەرکەفتی بۆ قوتابی (${studentsData[code].name}) هاتنە خەزنکرن!`);
    }

    // گەریانەوە بۆ پەرپەڕێ سەرەکی
    function goBack() {
        document.getElementById("resultSection").style.display = "none";
        document.getElementById("adminSection").style.display = "none";
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("studentCode").value = "";
        document.getElementById("studentPass").value = "";
    }
</script>

</body>
</html>
