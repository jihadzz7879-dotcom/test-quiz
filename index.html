<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI چاتی کوردی</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --chat-bg: #2d2d2d;
            --text-color: #ffffff;
            --user-msg: #007bff;
            --bot-msg: #444444;
            --input-bg: #3d3d3d;
            --border-color: #555555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background-color: var(--chat-bg);
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .chat-header {
            background-color: #111;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-msg);
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: var(--bot-msg);
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #222;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        .chat-input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .send-btn:hover {
            background-color: #218838;
        }

        /* Loading animation */
        .typing {
            display: flex;
            gap: 4px;
            align-self: flex-end;
            background: var(--bot-msg);
            padding: 15px;
            border-radius: 12px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 چاتی لێهاتوو (سۆرانی و بادینی)
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">سڵاو دڵەکەم! ئەز یێ لێرەم، چەوان دکارم هاریكاریا تە بکەم؟ (بێژە یان بنووسە)</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" class="chat-input" placeholder="پەیامەکەت لێرە بنووسە..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">ناردن</button>
    </div>
</div>

<script>
    // ⚠️ لێرە کلیل یاخود API Key خۆت دابنێ
    const API_KEY = "gen-lang-client-0932685965"; 
    
    // لێرە ناونیشانی API ئەگەر OpenAI بێت یان هەر سێرڤەرێکی تر دابنێ
    const API_URL = "https://api.openai.com/v1/chat/completions"; 

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');

    function appendMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
