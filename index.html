<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پۆلی ١٢ | تاقیکردنەوەکان</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .lang-section {
            border-top: 1px dashed #444;
            padding-top: 20px;
            margin-top: 20px;
        }

        .lang-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        /* ڕەنگە جیاوازەکانی دوگمەکان بۆ جوانی زیاتر */
        .btn-kurdish { background-color: #00b4d8; color: #121212; }
        .btn-english { background-color: #e67e22; color: #121212; }
        .btn-arabic { background-color: #2ecc71; color: #121212; }

        .btn {
            display: block;
            text-decoration: none;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #121212;
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بەخێربێن بۆ بەشی تاقیکردنەوەکان 🌹</h1>
        <p>پۆلی ١٢ | خولی دووێ ٢٠٢٥-٢٠٢٦</p>

        <div class="lang-section">
            <span class="lang-title" style="color: #00b4d8;">کوردی / Badini</span>
            <a href="kurdish.html" class="btn btn-kurdish">تاقیکردنەوەی زمانی کوردی</a>
        </div>

        <div class="lang-section">
            <span class="lang-title" style="color: #e67e22;">English</span>
            <a href="english.html" class="btn btn-english">Take English Test</a>
        </div>

        <div class="lang-section">
            <span class="lang-title" style="color: #2ecc71;">العربية</span>
            <a href="arabic.html" class="btn btn-arabic">امتحان اللغة العربية</a>
        </div>
    </div>

</body>
</html>
