<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ئەزموونێن ڤیزاری 2026</title>
    <style>
        body { background: radial-gradient(circle, #1a2a6c, #121212); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; min-height: 100vh; }
        .container { max-width: 450px; margin: auto; }
        
        /* کاریگەرییا زێڕین ل سەر ناڤێ */
        h1 { color: #f1c40f; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        
        /* بۆکسێ کاتێ ب شێوازەکێ مۆدێرن */
        .glass-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); margin: 25px 0; }
        
        /* دوگمەیێن بابەتان ب جوڵە */
        .subject-btn { display: block; width: 100%; padding: 18px; margin: 12px 0; background: linear-gradient(90deg, #1a2a6c, #2d3e8e); color: white; border: none; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.4s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .subject-btn:hover { transform: scale(1.05); background: linear-gradient(90deg, #f1c40f, #d4ac0d); color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h1>تاقیکرنا ڤیزاری</h1>
    <p style="color: #f1c40f;">دەستپێکێ ب تەرکیز ب دە!</p>

    <div class="glass-box">
        <p style="font-size: 14px;">"سەرکەفتن یا ل پێشیا تە یە، هەر چرکەکا تە بکاربێنی، تو نێزیکتر دبیت ژ ئارمانجا خۆ."</p>
        <h2 id="timer" style="color: #fff; margin: 10px 0;">دەم دهێتە بارکرن...</h2>
        <div style="font-size: 12px; color: #aaa;">هەمی چرکەک ب تەرکیز بخوینە!</div>
    </div>

    <a href="kurdish.html" class="subject-btn">کوردی</a>
    <a href="arabic.html" class="subject-btn">عەرەبی</a>
    <a href="english.html" class="subject-btn">ئینگلیزی</a>
    <a href="yasa.html" class="subject-btn">یاسا</a>
    <a href="mejo.html" class="subject-btn">مێژوو</a>
    <a href="zindawar.html" class="subject-btn">زیندەوەر</a>
    <a href="fizya.html" class="subject-btn" style="background: #e74c3c;">فیزیا</a>
</div>

<script>
    const targetDate = new Date("June 14, 2026 07:30:00").getTime();
    setInterval(function() {
        const now = new Date().getTime();
        const dist = targetDate - now;
        const d = Math.floor(dist / (1000 * 60 * 60 * 24));
        const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((dist % (1000 * 60)) / 1000);
        document.getElementById("timer").innerHTML = `${d}رۆژ و ${h}سەعەت و ${m}دەقە و ${s}چرکە`;
    }, 1000);
</script>
</body>
</html>
