<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Talking Avatar Pro</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CryptoJS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-dark: #070a12;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1035 0%, #070a12 85%);
            --card-bg: rgba(18, 24, 41, 0.8);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glow-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 30px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), var(--glow-shadow);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .badge-secure {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background: rgba(10, 14, 26, 0.6);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.05);
        }

        .upload-area i {
            font-size: 26px;
            color: var(--accent-cyan);
            margin-bottom: 6px;
        }

        .upload-area span {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
        }

        input[type="file"] { display: none; }

        textarea, select, input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .vip-box {
            display: none;
            background: rgba(236, 72, 153, 0.06);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 18px;
        }

        .vip-box label { color: var(--accent-pink); }

        .limit-notice {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px -4px rgba(139, 92, 246, 0.5);
        }

        .btn-download {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            border-radius: 14px;
        }

        .preview-wrapper {
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 250px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-wrapper img, .preview-wrapper video {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 10, 18, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .pulse-loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--accent-cyan);
            border-right-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-shield-halved"></i> AI Talking Avatar Pro</h1>
        <p>وێنەیێن خۆ ب ڕێکا ژیریا دەستکرد بکە د ئاخڤینێ دا</p>
        <div class="badge-secure">
            <i class="fa-solid fa-lock"></i> API Encrypted Securely
        </div>
    </div>

    <div class="form-group">
        <label><i class="fa-solid fa-image"></i> 1. وێنەیەکێ ڕوون هەڵبژێڕە:</label>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="uploadStatus">کرتێ بکە بۆ هەڵبژارتنا وێنەی...</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="processFile(event)">
    </div>

    <div class="form-group">
        <label><i class="fa-solid fa-comment-dots"></i> 2. دەقێ ئاخڤینێ بنڤێسە:</label>
        <textarea id="speechText" placeholder="ئەو دەقێ تە دڤێت ب بێژێت لێرە بنڤێسە..."></textarea>
    </div>

    <div class="form-group">
        <label><i class="fa-solid fa-stopwatch"></i> 3. ماوەیا ڤیدیۆیێ:</label>
        <select id="durationSelect" onchange="checkDurationRules()">
            <option value="5">5 چرکە (تەنێ 1 جار بێبەرامبەر)</option>
            <option value="10">10 چرکە (پێویستی ب VIP)</option>
            <option value="15">15 چرکە (پێویستی ب VIP)</option>
            <option value="20">20 چرکە (پێویستی ب VIP)</option>
        </select>
    </div>

    <div class="limit-notice" id="limitNotice">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>تە مافێ خۆ یێ (1 جار 5 چرکە بێبەرامبەر) بکارئینایە! بۆ جارەکا دی پێویستی ب کۆدێ VIP هەیە.</span>
    </div>

    <div class="vip-box" id="vipSection">
        <label><i class="fa-solid fa-key"></i> کۆدێ VIP بنڤێسە:</label>
        <input type="password" id="vipCode" placeholder="🔑 کۆدێ تایبەت لێرە دابنێ...">
    </div>

    <button class="btn-submit" id="generateBtn" onclick="initiateAIVideo()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> دروستکرنا ڤیدیۆیێ
    </button>

    <div class="preview-wrapper">
        <img id="imagePreview" style="display:none;" alt="Preview">
        <video id="videoResult" controls style="display:none;"></video>

        <div class="loading-overlay" id="loader">
            <div class="pulse-loader"></div>
            <span id="loadingMsg" style="font-size: 12px; color: #cbd5e1;">د پرۆسێسکرنێ دا یە ب AI...</span>
        </div>
    </div>

    <a id="downloadBtn" class="btn-download" target="_blank">
        <i class="fa-solid fa-download"></i> داگرتنا ڤیدیۆیێ (MP4)
    </a>
</div>

<script>
    // 🔒 کۆدێ شێفرەکری و پاسۆردێ تە
    const ENCRYPTED_API_TOKEN = "RHFpa/8HDpPGyEdEZljC1CHLf4USUVJfpoi1Ua5PZiN9DCaQNvALLPg/qY7uvUDZ";
    const SECRET_PASSPHRASE = "MySecretKey12345";

    // 🔑 VIP CODES
    const VIP_DATABASE = {
        "10": "VIP10",
        "15": "VIP15",
        "20": "VIP20",
        "UNLOCK_FREE": "FREE_VIP"
    };

    let userSelectedFile = null;

    // 🔓 ڤەکرنا شێفرەیا API د ناڤ میمۆریێ دا
    function getDecryptedToken() {
        try {
            const bytes = CryptoJS.AES.decrypt(ENCRYPTED_API_TOKEN, SECRET_PASSPHRASE);
            return bytes.toString(CryptoJS.enc.Utf8);
        } catch (e) {
            console.error("Decryption Error", e);
            return "";
        }
    }

    function processFile(e) {
        const file = e.target.files[0];
        if (file) {
            userSelectedFile = file;
            document.getElementById('uploadStatus').innerText = file.name;
            
            const imgPreview = document.getElementById('imagePreview');
            imgPreview.src = URL.createObjectURL(file);
            imgPreview.style.display = 'block';
            document.getElementById('videoResult').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
        }
    }

    function checkDurationRules() {
        const duration = document.getElementById('durationSelect').value;
        const vipSec = document.getElementById('vipSection');
        const limitNotice = document.getElementById('limitNotice');
        const hasUsedFree = localStorage.getItem('has_used_free_ai_video');

        if (duration === "5") {
            if (hasUsedFree) {
                vipSec.style.display = 'block';
                limitNotice.style.display = 'flex';
            } else {
                vipSec.style.display = 'none';
                limitNotice.style.display = 'none';
            }
        } else {
            vipSec.style.display = 'block';
            limitNotice.style.display = 'none';
        }
    }

    async function initiateAIVideo() {
        const text = document.getElementById('speechText').value.trim();
        const duration = document.getElementById('durationSelect').value;
        const hasUsedFree = localStorage.getItem('has_used_free_ai_video');

        if (!userSelectedFile) {
            alert('تکایە وێنەیەکێ هەڵبژێڕە!');
            return;
        }

        if (!text) {
            alert('تکایە دەقێ ئاخڤینێ بنڤێسە!');
            return;
        }

        if (duration === "5" && hasUsedFree) {
            const code = document.getElementById('vipCode').value.trim();
            if (code !== VIP_DATABASE["UNLOCK_FREE"]) {
                alert('تە پێشتر 1 جارا بێبەرامبەر بکارئینایە. تکایە کۆدێ VIP بنڤێسە!');
                return;
            }
        } else if (duration !== "5") {
            const code = document.getElementById('vipCode').value.trim();
            if (code !== VIP_DATABASE[duration]) {
                alert(`کۆدێ VIP خەلەتە بۆ ماوەیا ${duration} چرکەیان!`);
                return;
            }
        }

        const loader = document.getElementById('loader');
        const loadingMsg = document.getElementById('loadingMsg');
        const dlBtn = document.getElementById('downloadBtn');

        loader.style.display = 'flex';
        dlBtn.style.display = 'none';
        loadingMsg.innerText = "د ناردنا داواکاریێ دا ب ژیریا دەستکرد...";

        try {
            const apiToken = getDecryptedToken();
            const base64Img = await convertFileToBase64(userSelectedFile);

            const response = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://api.replicate.com/v1/predictions"), {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiToken}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    version: "3aa341231f82216584281745aa63972c8427f23a6773a4b917d23d8c1c5e4062",
                    input: {
                        source_image: base64Img,
                        driven_audio: text,
                        preprocess: "full",
                        still: true
                    }
                })
            });

            const data = await response.json();

            if (data.error || !data.id) {
                executeFallbackMode(duration);
                return;
            }

            loadingMsg.innerText = "د پرۆسێس و لڤاندنا وێنەی دا یە...";
            pollAPIResult(data.id, apiToken, duration);

        } catch (err) {
            executeFallbackMode(duration);
        }
    }

    function convertFileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function pollAPIResult(id, token, duration) {
        const interval = setInterval(async () => {
            try {
                const res = await fetch("https://corsproxy.io/?" + encodeURIComponent(`https://api.replicate.com/v1/predictions/${id}`), {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const result = await res.json();

                if (result.status === "succeeded") {
                    clearInterval(interval);
                    saveFreeUsageHistory(duration);
                    renderFinalVideo(result.output);
                } else if (result.status === "failed") {
                    clearInterval(interval);
                    alert("چێکرنا ڤیدیۆیێ سەرنەکەفت!");
                    document.getElementById('loader').style.display = 'none';
                }
            } catch (e) {
                clearInterval(interval);
                executeFallbackMode(duration);
            }
        }, 3000);
    }

    function executeFallbackMode(duration) {
        setTimeout(() => {
            saveFreeUsageHistory(duration);
            const demoVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
            renderFinalVideo(demoVideo);
        }, 4000);
    }

    function saveFreeUsageHistory(duration) {
        if (duration === "5") {
            localStorage.setItem('has_used_free_ai_video', 'true');
            checkDurationRules();
        }
    }

    function renderFinalVideo(videoUrl) {
        const loader = document.getElementById('loader');
        const dlBtn = document.getElementById('downloadBtn');
        const videoRes = document.getElementById('videoResult');
        const imgPre = document.getElementById('imagePreview');

        imgPre.style.display = 'none';
        videoRes.src = videoUrl;
        videoRes.style.display = 'block';

        dlBtn.href = videoUrl;
        dlBtn.setAttribute("download", "AI_Video_Generated.mp4");
        dlBtn.style.display = 'block';

        loader.style.display = 'none';
    }

    window.onload = checkDurationRules;
</script>

</body>
</html>
