<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەنجامێن خولا دووێ 2025-2026</title>
    <style>
        :root {
            --primary-color: #4a00e0;
            --secondary-color: #8e2de2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 30px;
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        h2 {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .login-box {
            margin-bottom: 25px;
        }

        input[type="number"] {
            width: 70%;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(74, 0, 224, 0.2);
        }

        button {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
            width: 50%;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--error-color);
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        .results-section {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .subject-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary-color);
            box-shadow: 0 5px 15px rgba(142, 45, 226, 0.1);
        }

        .subject-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .grade {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-color);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .subject-card.show-grade .grade {
            opacity: 1;
            transform: scale(1);
        }

        .subject-card.show-grade {
            background: #eeecfb;
            border-color: var(--primary-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>سیستەمێ ئەنجامێن ئەزموونان</h1>
    <h2>خولا دووێ (2025-2026)</h2>

    <div class="login-box" id="loginBox">
        <input type="number" id="studentCode" placeholder="کۆدێ قوتابی داخل بکە...">
        <br>
        <button onclick="checkCode()">لێگەڕیان</button>
        <p class="error-msg" id="errorMsg">کۆد خەلەتە! ژمارە 1039 تاقی بکە.</p>
    </div>

    <div class="results-section" id="resultsSection">
        <h3>سلاڤ قوتابی! کلیکێ ل سەر هەر بابەتەکی بکە بۆ دیتنا نمرێ:</h3>
        
        <div class="subjects-grid">
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">فیزیا</div>
                <div class="grade">85</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">کیمیا</div>
                <div class="grade">92</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">زیندەوەر (ئەحیا)</div>
                <div class="grade">78</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">بیرکاری</div>
                <div class="grade">95</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">مێژوو</div>
                <div class="grade">88</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">عەرەبی</div>
                <div class="grade">80</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">ئینگلیزی</div>
                <div class="grade">87</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">ئابوری</div>
                <div class="grade">74</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">جوگرافی</div>
                <div class="grade">90</div>
            </div>
            <div class="subject-card" onclick="toggleGrade(this)">
                <div class="subject-name">کوردی</div>
                <div class="grade">99</div>
            </div>
        </div>
    </div>
</div>

<script>
    function checkCode() {
        const codeInput = document.getElementById('studentCode').value;
        const errorMsg = document.getElementById('errorMsg');
        const resultsSection = document.getElementById('resultsSection');

        // پشکنین دکەت کا کۆد 1039 یە یان نە
        if (codeInput === "1039") {
            errorMsg.style.display = "none";
            resultsSection.style.display = "block";
        } else {
            errorMsg.style.display = "block";
            resultsSection.style.display = "none";
        }
    }

    function toggleGrade(card) {
        // دەمێ تبلا خۆ ددەتێ (کلیک دکەت) نمرێ نیشان ددەت یان بەرزە دکەت
        card.classList.toggle('show-grade');
    }
</script>

</body>
</html>
