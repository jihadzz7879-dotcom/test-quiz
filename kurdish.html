<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەیا کوردی - پۆلا ١٢</title>
    <style>
        /* ڕەنگێن سەرەکی - ل سەرەتادا سپی جێگیرە */
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
        }

        /* ستایلێ مۆدێ ڕەش (Dark) */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
        }

        /* ستایلێ مۆدێ نیلی (Navy Blue) */
        [data-theme="navy"] {
            --bg-color: #0b192c;
            --card-bg: #1e3a8a;
            --text-main: #eff6ff;
            --text-muted: #93c5fd;
            --border-color: #1e40af;
            --primary-color: #38bdf8;
            --primary-hover: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* پشکا هەڵبژارتنا ڕەنگان */
        .theme-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .theme-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-white { background: #ffffff; color: #000; border: 1px solid #ccc; }
        .btn-dark { background: #0f172a; color: #fff; }
        .btn-navy { background: #1e3a8a; color: #fff; }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 30px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .selection-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .selection-box { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-group select {
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .form-group select:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start { background-color: var(--primary-color); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .btn-start:hover { background-color: var(--primary-hover); }
        
        .btn-submit { background-color: #0ea5e9; margin-top: 25px; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3); }
        .btn-submit:hover { background-color: #0284c7; }

        .quiz-section, .result-section { display: none; }

        .quiz-info {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: center;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }

        .question-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
        }

        .option-item:hover { background-color: var(--bg-color); }
        .option-item input { width: 19px; height: 19px; cursor: pointer; }

        /* ستایلێن ئەنجام و ڕاستکرنەوەیێ */
        .correct-answer {
            background-color: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--success) !important;
            color: #10b981;
            font-weight: bold;
        }

        .wrong-answer {
            background-color: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--danger) !important;
            color: #ef4444;
        }

        .correct-hint {
            margin-top: 12px;
            font-weight: bold;
            color: var(--success);
            font-size: 15px;
            padding-right: 10px;
            border-right: 3px solid var(--success);
        }

        .result-card {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }

        .result-card h2 { margin-bottom: 15px; font-size: 26px; }
        .score-text { font-size: 22px; margin-bottom: 10px; opacity: 0.9; }
        .percentage-text { font-size: 38px; font-weight: bold; letter-spacing: 1px; }

        footer {
            text-align: center;
            margin-top: auto;
            padding: 20px;
            width: 100%;
            font-size: 14px;
            color: var(--text-muted);
        }

        footer .developer {
            font-weight: bold;
            color: var(--text-main);
            font-size: 17px;
            margin-top: 5px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="theme-switcher">
        <button class="theme-btn btn-white" onclick="setTheme('light')">سپی ☀️</button>
        <button class="theme-btn btn-dark" onclick="setTheme('dark')">ڕەش 🌙</button>
        <button class="theme-btn btn-navy" onclick="setTheme('navy')">نیلی 🔹</button>
    </div>

    <div class="container">
        <header>
            <h1>تاقیکردنەوەیا کوردی - پۆلا دوازدێ</h1>
            <p>پرسیارێن وزاری یێن خولا ئێکێ و دووێ (٢٠١٩ - ٢٠٢٥)</p>
        </header>

        <div id="setup-section">
            <div class="selection-box">
                <div class="form-group">
                    <label>سالی هه‌ڵبژێره‌:</label>
                    <select id="year-select">
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>خولی هه‌ڵبژێره‌:</label>
                    <select id="exam-select">
                        <option value="خولا ئێکێ">خولی ئێکێ (50 پرسیار)</option>
                        <option value="خولا دووێ">خولی دووێ (50 پرسیار)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-start" onclick="startQuiz()">دەستپێکرنا تاقیکردنەوەیێ</button>
        </div>

        <div id="result-section" class="result-section">
            <div class="result-card">
                <h2>ئەنجامێ تاقیکردنەوەیێ</h2>
                <div class="score-text" id="score-display">نمرە: 0 / 0</div>
                <div class="percentage-text" id="percentage-display">ڕێژە: 0%</div>
            </div>
        </div>

        <div id="quiz-section" class="quiz-section">
            <div id="quiz-info" class="quiz-info"></div>
            <form id="quiz-form">
                <div id="questions-container"></div>
                <button type="button" class="btn btn-submit" onclick="submitQuiz()">بۆچوونا ئەنجامان و پشکنین</button>
            </form>
        </div>
    </div>

    <footer>
        <p>هەمی ماف پاراستینە بۆ گەشەپێدەرێ بەرنامەی</p>
        <div class="developer">Developed by: JEHAD ZEBARI</div>
    </footer>

    <script>
        // گوهۆرینا ڕەنگێ باکگراوندێ پەیجێ
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
        }

        const sampleQuestions = [
            { id: 1, text: "پرسیارا ئێکێ: ڕێزمانا کوردی د چەند پشکان دا لێکۆڵینەوەیێ دکەت؟", options: ["A) دوو پشک", "B) سێ پشک", "C) چوار پشک", "D) پێنج پشک"], correct: 2 },
            { id: 2, text: "پرسیارا دووێ: کام ژ ئەڤان ناڤان ناڤێ ناسراوە؟", options: ["A) کورتەچیرۆک", "B) قوتابخانا ئەحمەد", "C) دەریایێ ڕەش", "D) جانتا"], correct: 1 },
            { id: 3, text: "پرسیارا سیێ: فۆنەتیک ل سەر چ دکۆڵیت؟", options: ["A) ڕستە", "B) پەیڤ", "C) دەنگ", "D) ڕامان"], correct: 2 },
            { id: 4, text: "پرسیارا چوارێ: کام هۆنراوە بۆ نیشتمانی نڤیسیە؟", options: ["A) هێمن", "B) قانع", "C) نالی", "D) بێکەس"], correct: 1 },
            { id: 5, text: "پرسیارا پێنجێ: کلیل و دەرگەهـ چ جۆرە پەیوەندیەک د ناڤبەرا واندا هەیە؟", options: ["A) هاوواتا", "B) دژواتا", "C) هاوپێوەند", "D) هیچ کام"], correct: 2 }
        ];

        let currentQuestions = [];

        function startQuiz() {
            const year = document.getElementById('year-select').value;
            const exam = document.getElementById('exam-select').value;
            
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            document.getElementById('quiz-info').innerText = `تاقیکردنەوەیا سالا ${year} - ${exam}`;
            
            currentQuestions = [...sampleQuestions]; 
            generateQuestions(currentQuestions);
        }

        function generateQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            questions.forEach((q, qIndex) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                
                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <li class="option-item" id="opt-label-${qIndex}-${oIndex}">
                            <input type="radio" name="question-${qIndex}" value="${oIndex}" id="opt-${qIndex}-${oIndex}">
                            <label for="opt-${qIndex}-${oIndex}">${opt}</label>
                        </li>
                    `;
                });

                questionCard.innerHTML = `
                    <div class="question-text">${q.text}</div>
                    <ul class="options-list">${optionsHTML}</ul>
                    <div class="correct-hint" id="hint-${qIndex}" style="display:none;"></div>
                `;
                container.appendChild(questionCard);
            });
        }

        function submitQuiz() {
            let score = 0;
            const total = currentQuestions.length;

            currentQuestions.forEach((q, qIndex) => {
                const selectedRadio = document.querySelector(`input[name="question-${qIndex}"]:checked`);
                const correctIndex = q.correct;
                
                document.getElementById(`opt-label-${qIndex}-${correctIndex}`).classList.add('correct-answer');

                if (selectedRadio) {
                    const userAns = parseInt(selectedRadio.value);
                    if (userAns === correctIndex) {
                        score++;
                    } else {
                        document.getElementById(`opt-label-${qIndex}-${userAns}`).classList.add('wrong-answer');
                        const hintBox = document.getElementById(`hint-${qIndex}`);
                        hintBox.style.display = 'block';
                        hintBox.innerText = `وەڵامێ دروست: ${q.options[correctIndex]}`;
                    }
                } else {
                    const hintBox = document.getElementById(`hint-${qIndex}`);
                    hintBox.style.display = 'block';
                    hintBox.innerText = `تە وەڵام نەدایە! وەڵامێ دروست: ${q.options[correctIndex]}`;
                }

                document.querySelectorAll(`input[name="question-${qIndex}"]`).forEach(input => input.disabled = true);
            });

            const scoreOutOf100 = Math.round((score / total) * 100);

            document.getElementById('result-section').style.display = 'block';
            document.getElementById('score-display').innerText = `نمرە: ${score} ژ ${total} پرسیاران`;
            document.getElementById('percentage-display').innerText = `ڕێژەیا سەرکەفتنێ: ${scoreOutOf100}%`;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
