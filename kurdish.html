<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەیا کوردی - پۆلا ١٢</title>
    <style>
        /* ستایلێ مۆدێرن - سپییا گەش */
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-blur: blur(16px);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --primary-gradient: linear-gradient(135deg, #4f46e5, #7c3aed);
            --accent-glow: rgba(99, 102, 241, 0.15);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        /* ستایلێ شاهانە یێ ڕەش (Amoled Dark) */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #020408 100%);
            --card-bg: rgba(15, 23, 42, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --accent-glow: rgba(168, 85, 247, 0.2);
        }

        /* ستایلێ گەش یێ نیلی (Cyber Navy) */
        [data-theme="navy"] {
            --bg-gradient: linear-gradient(135deg, #060c18 0%, #02040a 100%);
            --card-bg: rgba(13, 27, 56, 0.85);
            --text-main: #f0fdf4;
            --text-muted: #38bdf8;
            --border-color: #1e3a8a;
            --primary-gradient: linear-gradient(135deg, #06b6d4, #3b82f6);
            --accent-glow: rgba(6, 182, 212, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* پانێلا گوهۆڕینا ڕەنگان */
        .theme-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .theme-panel span { font-size: 14px; font-weight: 700; color: var(--text-muted); }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .dot-white { background: #ffffff; border-color: #4f46e5; }
        .dot-dark { background: #0f172a; border-color: #818cf8; }
        .dot-navy { background: #1e3a8a; border-color: #06b6d4; }
        .color-dot:hover { transform: scale(1.2); }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 36px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p { color: var(--text-muted); font-size: 16px; font-weight: 500; }

        .selection-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .selection-box { grid-template-columns: 1fr; }
            .container { padding: 25px 15px; }
        }

        .form-group select {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            outline: none;
            font-size: 16px;
            font-weight: 700;
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            background: var(--primary-gradient);
            box-shadow: 0 10px 25px var(--accent-glow);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px var(--accent-glow); }

        .btn-submit { background: linear-gradient(135deg, #0ea5e9, #2563eb); margin-top: 30px; }
        .btn-reset { background: linear-gradient(135deg, #f59e0b, #d97706); margin-top: 15px; }

        .quiz-section, .result-section { display: none; }

        /* ئاگەهدارکرنا بەرسڤ نەدانێ */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* کارتێن پرسیاران */
        .question-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            position: relative;
        }

        /* کادرێ تێبینیێ ئەگەر وەڵام نەهاتبیتە دان د ناو کارتێ دا */
        .unanswered-card {
            border-color: var(--warning) !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .question-badge {
            display: inline-block;
            background: var(--primary-gradient);
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }

        .option-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            cursor: pointer;
        }

        .option-item:hover {
            border-color: #6366f1;
            background: var(--accent-glow);
            transform: translateX(-4px);
        }

        .option-item input {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #6366f1;
        }

        .option-item label {
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
        }

        /* وەڵامێن ڕاست و خەلەت */
        .correct-answer {
            background: rgba(16, 185, 129, 0.12) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
        }

        .wrong-answer {
            background: rgba(239, 68, 68, 0.12) !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
        }

        .correct-hint {
            margin-top: 15px;
            font-weight: 700;
            color: var(--success);
            font-size: 15px;
            padding: 10px 15px;
            background: rgba(16, 185, 129, 0.05);
            border-radius: 10px;
        }

        /* پشکا ئەنجامی */
        .result-card {
            background: var(--primary-gradient);
            color: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 35px;
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.25);
        }

        .result-card h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
        .score-circle {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 900;
            margin: 20px auto;
            border: 3px solid rgba(255,255,255,0.4);
        }

        footer { text-align: center; margin-top: auto; padding: 40px 20px; }
        footer p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        /* ئەنیمەیشنا ناڤێ تە */
        footer .developer {
            font-weight: 900;
            font-size: 24px;
            margin-top: 6px;
            letter-spacing: 2px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.2)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 12px rgba(124, 58, 237, 0.6)); }
        }
    </style>
</head>

    <div class="container">
        <header>

<script>
    const questions = [
        { q: "د ڕستەیا (تابلۆکۆنەکانم بۆ بگەرێنەوە.) چ دەرنەکەفتییە؟", o: ["تەمامکەری بەنداو", "بکەر", "ئامرازی دانەپاڵ", "(B + C) ڕاستن"], a: 2 },
        { q: "د ڕستەیا هاوەڵییا مەڕجیدا کێژ نەڤان کاران نەشێت بیتە کاری وەڵاما مەڕجی؟", o: ["پێشدەکەوێت", "تەواوکەردە", "مەهێنە", "سەردەکەوین"], a: 1 },
        { q: "د کیژ نەڤان ڕستانەیااندا ڕێژەیا کاری بوریێ نێزیکە؟", o: ["دەبوو پەرتووکەکانت کۆکردبایەوە.", "دەبوو لە ناهەنگەکە ئامادەبووبا.", "یارییەکە درەنگ تەواوبوو.", "هەمی ڕاستن"], a: 3 },
        { q: "کێژ نەڤان هەڤالناڤە و پێکهاتییە ژ (ناڤ + ئامراز + ناڤ)؟", o: ["ڕوو بە خاڵ", "گوڵە هێرۆ", "ڕەشەبا", "هەمی ڕاستن"], a: 0 },
        { q: "د ڕستەیا (ئەو قوتابییەکێ زۆر چەلەنگە.) دا، (زۆر چەلەنگ) چییە？", o: ["گرنێیا هەڤالناڤییە، تەمامکەری کاری نە تەمامە.", "گرنێیا ناڤییە، دیارکەری ناڤییە.", "گرنێیا هەڤالناڤییە، تەمامکەری کارییە.", "گرنێیا هەڤالناڤییە، دیارکەری ناڤییە."], a: 3 },
        { q: "د ڕستەیا (تۆمان ههەڵبژاردبوو.) دا، ئەگەر بکارکاری بکەینە جیهانێ لکاو، ڕستە دێ بیتە:", o: ["هەڵمانت بژاردبوو.", "هەڵتمان بژاردبوو.", "هەڵت بژاردبووین.", "(B + C) ڕاستن"], a: 1 },
        { q: "کاری نەتمام بۆ دەمێ نەهۆ (هـ) د ڕستەبیدا دەرناکەفیت، ئەگەر نیهاد کەسێ:", o: ["ئێکێ تاک بیت.", "سێیێ تاک بیت.", "سێیێ کۆ بیت.", "(C + A) ڕاستن"], a: 3 },
        { q: "بزوینا دویماهییا کێژ نەڤان پەیڤان پاشگرە بۆ دروستکرنا هەڤالناڤێ کراوێ دارێژتی؟", o: ["چاکە", "کردە", "دەستە", "پڕسە"], a: 1 },
        { q: "د کیژ ڕستەیندا ئەگەر (بەکاری) لابدەین و کاری ڕستەیی بکەینە (بوریی نێزیکی دانانیی نەرێ) جیهانێ لکاوێ بکەر ناچیته پشتی ئامرازی نەرێ؟", o: ["وانەکە دەنووسمەوە.", "چیرۆکەکە دەخوێنمەوە.", "چیرۆکەکە بڵاودەکەمەوە.", "پەرتووکەکە دەهێنمەوە."], a: 2 },

    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress');
    const quizContainer = document.getElementById('quiz-container');
    const resultContainer = document.getElementById('result-container');
    const scoreBox = document.getElementById('score-box');
    const feedbackText = document.getElementById('feedback-text');
    const reviewList = document.getElementById('review-list');

    function loadQuestion() {
        const currentQuestion = questions[currentQuestionIndex];
        qNumEl.innerText = `پرسیارا ${currentQuestionIndex + 1} ژ ${questions.length}`;
        qTextEl.innerText = currentQuestion.q;
        optionsContainer.innerHTML = '';
        
        const labels = ['A', 'B', 'C', 'D'];
        currentQuestion.o.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = `${labels[index]}) ${option}`;
            button.onclick = () => selectOption(index);
            if (userAnswers[currentQuestionIndex] === index) {
                button.classList.add('selected');
            }
            optionsContainer.appendChild(button);
        });

        nextBtn.disabled = userAnswers[currentQuestionIndex] === undefined;
        nextBtn.innerText = currentQuestionIndex === questions.length - 1 ? "دوماهی هێنان (Finish)" : "دوواتر (Next)";
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
    }

    function selectOption(index) {
        userAnswers[currentQuestionIndex] = index;
        const buttons = optionsContainer.getElementsByClassName('option-btn');
        for (let btn of buttons) {
            btn.classList.remove('selected');
        }
        buttons[index].classList.add('selected');
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            calculateScore();
        }
    }

    function calculateScore() {
        score = 0;
        questions.forEach((question, index) => {
            if (userAnswers[index] === question.a) {
                score += 2;
            }
        });

        quizContainer.style.display = 'none';
        resultContainer.style.display = 'block';
        scoreBox.innerText = `${score} / 100`;

        if (score >= 50) {
            feedbackText.innerText = "پیرۆزە! تە تاقیکردنەوە ب سەرکەفتویی دەرباز کر.";
            feedbackText.className = "text-success";
        } else {
            feedbackText.innerText = "مخابن! نمریا تە یا کەمە، پتر هەوڵ بدە.";
            feedbackText.className = "text-danger";
        }

        showReview();
    }

    function showReview() {
        reviewList.innerHTML = '';
        const labels = ['A', 'B', 'C', 'D'];
        
        questions.forEach((question, index) => {
            const isCorrect = userAnswers[index] === question.a;
            const item = document.createElement('div');
            item.className = `review-item ${isCorrect ? 'correct-item' : 'wrong-item'}`;

            item.innerHTML = `
                <div class="review-q">پرسیارا ${index + 1}: ${question.q}</div>
                <div class="review-ans">بەرسڤا تە: <span class="${isCorrect ? 'text-success' : 'text-danger'}">${labels[userAnswers[index]] ? labels[userAnswers[index]] + ') ' + question.o[userAnswers[index]] : 'بەرسڤ نەدایە'}</span></div>
                ${!isCorrect ? `<div class="review-ans">بەرسڤا دروست: <span class="text-success">${labels[question.a]}) ${question.o[question.a]}</span></div>` : ''}
            `;
            reviewList.appendChild(item);
        });
    }

    loadQuestion();
</script>

</body>

        </div>

    <script>
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
        }

        const sampleQuestions = [
            { id: 1, text: "ڕێزمانا کوردی د چەند پشکان دا لێکۆڵینەوەیێ دکەت؟", options: ["دوو پشک", "سێ پشک", "چوار پشک", "پێنج پشک"], correct: 2 },
            { id: 2, text: "کام ژ ئەڤان ناڤان ناڤێ ناسراوە؟", options: ["کورتەچیرۆک", "قوتابخانا ئەحمەد", "دەریایێ ڕەش", "جانتا"], correct: 1 },
            { id: 3, text: "فۆنەتیک ل سەر چ دکۆڵیت؟", options: ["ڕستە", "پەیڤ", "دەنگ", "ڕامان"], correct: 2 }
        ];

        let currentQuestions = [];

        function startQuiz() {
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('error-box').style.display = 'none';
            currentQuestions = [...sampleQuestions]; 
            generateQuestions(currentQuestions);
        }

        function generateQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            questions.forEach((q, qIndex) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                questionCard.id = `q-card-${qIndex}`;
                
                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <li class="option-item" id="opt-label-${qIndex}-${oIndex}">
                            <input type="radio" name="question-${qIndex}" value="${oIndex}" id="opt-${qIndex}-${oIndex}" onchange="removeWarning(${qIndex})">
                            <label for="opt-${qIndex}-${oIndex}">${opt}</label>
                        </li>
                    `;
                });

                questionCard.innerHTML = `
                    <div class="question-badge">پرسیارا ${q.id}</div>
                    <div class="question-text">${q.text}</div>
                    <ul class="options-list">${optionsHTML}</ul>
                    <div class="correct-hint" id="hint-${qIndex}" style="display:none;"></div>
                `;
                container.appendChild(questionCard);
            });
        }

        // لادانی نیشانەی ئاگەهدارکردنێ دەما قوتابی وەڵامەک هەڵدەبژێریت
        function removeWarning(qIndex) {
            document.getElementById(`q-card-${qIndex}`).classList.remove('unanswered-card');
        }

        function submitQuiz() {
            let score = 0;
            const total = currentQuestions.length;
            let allAnswered = true;
            const errorBox = document.getElementById('error-box');

            // پشکنین کا ئایا هەمی پرسیار هاتینە بەرسڤدان؟
            currentQuestions.forEach((q, qIndex) => {
                const selectedRadio = document.querySelector(`input[name="question-${qIndex}"]:checked`);
                if (!selectedRadio) {
                    allAnswered = false;
                    document.getElementById(`q-card-${qIndex}`).classList.add('unanswered-card');
                }
            });

            // ئەگەر پرسیارەکا بەرسڤ نەدای هەبیت تاقیکردنەوەیێ ڕادەگرین
            if (!allAnswered) {
                errorBox.style.display = 'block';
                // فۆکەس و چوون بەرەو سەرێ پەیجێ بۆ دیتنا پەیاما خەلەتیێ
                window.scrollTo({ top: 150, behavior: 'smooth' });
                return;
            }

            // ئەگەر هەمی هاتبنە بەرسڤدان، پەیامێ لادەین و ئەنجامان پیشان دەین
            errorBox.style.display = 'none';

            currentQuestions.forEach((q, qIndex) => {
                const selectedRadio = document.querySelector(`input[name="question-${qIndex}"]:checked`);
                const correctIndex = q.correct;
                
                document.getElementById(`opt-label-${qIndex}-${correctIndex}`).classList.add('correct-answer');

                const userAns = parseInt(selectedRadio.value);
                if (userAns === correctIndex) {
                    score++;
                } else {
                    document.getElementById(`opt-label-${qIndex}-${userAns}`).classList.add('wrong-answer');
                    const hintBox = document.getElementById(`hint-${qIndex}`);
                    hintBox.style.display = 'block';
                    hintBox.innerText = `✕ وەڵامێ خەلەت! وەڵامێ دروست: [ ${q.options[correctIndex]} ]`;
                }

                document.querySelectorAll(`input[name="question-${qIndex}"]`).forEach(input => input.disabled = true);
            });

            const scoreOutOf100 = Math.round((score / total) * 100);

            document.getElementById('result-section').style.display = 'block';
            document.getElementById('score-display').innerText = `نمرەیا تە: ${score} ژ ${total} پرسیاران`;
            document.getElementById('percentage-display').innerText = `%${scoreOutOf100}`;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetQuiz() {
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('setup-section').style.display = 'block';
            document.getElementById('quiz-form').reset();
        }
    </script>
