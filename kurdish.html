<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەیا کوردی - پۆلا ١٢</title>
    <style>
        /* ستایلێ سەرەکی - سپییا مۆدێرن و ڕوون */
        :root {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-blur: blur(12px);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(226, 232, 240, 0.8);
            --primary-glow: linear-gradient(135deg, #6366f1, #4f46e5);
            --btn-shadow: rgba(79, 70, 229, 0.3);
            --success: #10b981;
            --danger: #ef4444;
        }

        /* ستایلێ شاهانە یێ ڕەش (Premium Dark) */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.5);
            --primary-glow: linear-gradient(135deg, #818cf8, #6366f1);
            --btn-shadow: rgba(99, 102, 241, 0.4);
        }

        /* ستایلێ کوور یێ نیلی (Deep Navy Neon) */
        [data-theme="navy"] {
            --bg-gradient: linear-gradient(135deg, #0b1528 0%, #030712 100%);
            --card-bg: rgba(15, 32, 67, 0.75);
            --text-main: #f0fdf4;
            --text-muted: #38bdf8;
            --border-color: rgba(30, 58, 138, 0.6);
            --primary-glow: linear-gradient(135deg, #06b6d4, #0ea5e9);
            --btn-shadow: rgba(14, 165, 233, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* پشكا گوهۆرینا ڕەنگان ب شێوازێ ناڤ و لۆگۆ */
        .theme-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .theme-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .theme-btn {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-white { background: #ffffff; border: 2px solid #6366f1; }
        .btn-dark { background: #0f172a; border: 2px solid #818cf8; }
        .btn-navy { background: #1e3a8a; border: 2px solid #06b6d4; }
        .theme-btn:hover { transform: scale(1.2) rotate(15deg); }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        header h1 {
            font-size: 34px;
            font-weight: 800;
            background: var(--primary-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 17px;
            font-weight: 500;
        }

        .selection-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 35px;
        }

        @media (max-width: 600px) {
            .selection-box { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .form-group select {
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .form-group select:focus {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 16px;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--btn-shadow);
        }

        .btn-start { background: var(--primary-glow); }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 12px 28px var(--btn-shadow); }
        
        .btn-submit { background: linear-gradient(135deg, #0ea5e9, #2563eb); margin-top: 30px; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4); }

        .quiz-section, .result-section { display: none; }

        .quiz-info {
            background: rgba(99, 102, 241, 0.1);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 30px;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 28px;
            border-radius: 24px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.02);
        }

        .question-text {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .option-item:hover { 
            background: rgba(99, 102, 241, 0.08); 
            border-color: #6366f1;
            transform: translateX(-5px);
        }
        
        .option-item input { width: 22px; height: 22px; cursor: pointer; accent-color: #6366f1; }

        /* ستایلێن ئەنجام و فیدباکێ پاش تاقیکردنەوەیێ */
        .correct-answer {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .wrong-answer {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        .correct-hint {
            margin-top: 15px;
            font-weight: 700;
            color: var(--success);
            font-size: 16px;
            padding: 10px 15px;
            background: rgba(16, 185, 129, 0.05);
            border-radius: 8px;
            border-right: 4px solid var(--success);
        }

        /* دیمەنێ ئەنجامێ نێۆن و لۆگۆیی */
        .result-card {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c084fc 100%);
            color: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 35px;
            box-shadow: 0 20px 40px rgba(124, 58, 237, 0.3);
            animation: pulse 2s infinite;
        }

        .result-card h2 { margin-bottom: 15px; font-size: 30px; font-weight: 800; }
        .score-text { font-size: 24px; margin-bottom: 12px; opacity: 0.9; font-weight: 600; }
        .percentage-text { font-size: 46px; font-weight: 900; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        footer {
            text-align: center;
            margin-top: auto;
            padding: 30px;
            width: 100%;
        }

        footer p { font-size: 14px; color: var(--text-muted); font-weight: 500; }

        /* ناڤێ تە ب فۆنتەکێ گەلەک نازک و سایبەر */
        footer .developer {
            font-weight: 900;
            color: var(--text-main);
            font-size: 20px;
            margin-top: 8px;
            letter-spacing: 2px;
            background: var(--primary-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body>

    <!-- پشکا گوهۆڕینی ڕەنگان ب شێوازێ بازنەیی -->
    <div class="theme-container">
        <span class="theme-title">دیزاینا شاشێ:</span>
        <button class="theme-btn btn-white" onclick="setTheme('light')" title="مۆدێ سپی"></button>
        <button class="theme-btn btn-dark" onclick="setTheme('dark')" title="مۆدێ ڕەش"></button>
        <button class="theme-btn btn-navy" onclick="setTheme('navy')" title="مۆدێ نیلی"></button>
    </div>

    <div class="container">
        <header>
            <h1>تاقیکردنەوەیا کوردی - پۆلا دوازدێ</h1>
            <p>بانکا پرسیارێن وزاری یێن خولا ئێکێ و دووێ (٢٠١٩ - ٢٠٢٥)</p>
        </header>

        <!-- ناڤبەرا ڕێکخستنێ -->
        <div id="setup-section">
            <div class="selection-box">
                <div class="form-group">
                    <label>سالی هه‌ڵبژێره‌</label>
                    <select id="year-select">
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>خولی هه‌ڵبژێره‌</label>
                    <select id="exam-select">
                        <option value="خولا ئێکێ">خولی ئێکێ (50 پرسیار)</option>
                        <option value="خولا دووێ">خولی دووێ (50 پرسیار)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-start" onclick="startQuiz()">دەستپێکرنا تاقیکردنەوەیێ</button>
        </div>

        <!-- پشکا ئەنجامان -->
        <div id="result-section" class="result-section">
            <div class="result-card">
                <h2>پیرۆزە! تاقیکردنەوە ب دوماهی هات</h2>
                <div class="score-text" id="score-display">نمرە: 0 / 0</div>
                <div class="percentage-text" id="percentage-display">0%</div>
            </div>
        </div>

        <!-- پشکا پرسیاران -->
        <div id="quiz-section" class="quiz-section">
            <div id="quiz-info" class="quiz-info"></div>
            <form id="quiz-form">
                <div id="questions-container"></div>
                <button type="button" class="btn btn-submit" onclick="submitQuiz()">نیشادانا ئەنجامی و پشکنین</button>
            </form>
        </div>
    </div>

    <footer>
        <p>دیزاین و گەشەپێدان بۆ قوتابیێن پۆلا ١٢</p>
        <div class="developer">JEHAD ZEBARI</div>
    </footer>

    <script>
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
        }

        // داتابەیسەکا کورت و مۆدێرن بۆ تاقیکردنەوەیێ
        const sampleQuestions = [
            { id: 1, text: "پرسیارا ئێکێ: ڕێزمانا کوردی د چەند پشکان دا لێکۆڵینەوەیێ دکەت؟", options: ["A) دوو پشک", "B) سێ پشک", "C) چوار پشک", "D) پێنج پشک"], correct: 2 },
            { id: 2, text: "پرسیارا دووێ: کام ژ ئەڤان ناڤان ناڤێ ناسراوە؟", options: ["A) کورتەچیرۆک", "B) قوتابخانا ئەحمەد", "C) دەریایێ ڕەش", "D) جانتا"], correct: 1 },
            { id: 3, text: "پرسیارا سیێ: فۆنەتیک ل سەر چ دکۆڵیت؟", options: ["A) ڕستە", "B) پەیڤ", "C) دەنگ", "D) ڕامان"], correct: 2 }
        ];

        let currentQuestions = [];

        function startQuiz() {
            const year = document.getElementById('year-select').value;
            const exam = document.getElementById('exam-select').value;
            
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            document.getElementById('quiz-info').innerText = `📊 تۆ د تاقیکردنەوەیا سالا ${year} - ${exam} دای`;
            
            currentQuestions = [...sampleQuestions]; 
            generateQuestions(currentQuestions);
        }

        function generateQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            questions.forEach((q, qIndex) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                
                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <li class="option-item" id="opt-label-${qIndex}-${oIndex}">
                            <input type="radio" name="question-${qIndex}" value="${oIndex}" id="opt-${qIndex}-${oIndex}">
                            <label style="cursor:pointer; width:100%;" for="opt-${qIndex}-${oIndex}">${opt}</label>
                        </li>
                    `;
                });

                questionCard.innerHTML = `
                    <div class="question-text">${q.text}</div>
                    <ul class="options-list">${optionsHTML}</ul>
                    <div class="correct-hint" id="hint-${qIndex}" style="display:none;"></div>
                `;
                container.appendChild(questionCard);
            });
        }

        function submitQuiz() {
            let score = 0;
            const total = currentQuestions.length;

            currentQuestions.forEach((q, qIndex) => {
                const selectedRadio = document.querySelector(`input[name="question-${qIndex}"]:checked`);
                const correctIndex = q.correct;
                
                document.getElementById(`opt-label-${qIndex}-${correctIndex}`).classList.add('correct-answer');

                if (selectedRadio) {
                    const userAns = parseInt(selectedRadio.value);
                    if (userAns === correctIndex) {
                        score++;
                    } else {
                        document.getElementById(`opt-label-${qIndex}-${userAns}`).classList.add('wrong-answer');
                        const hintBox = document.getElementById(`hint-${qIndex}`);
                        hintBox.style.display = 'block';
                        hintBox.innerText = `💡 وەڵامێ ڕاست: ${q.options[correctIndex]}`;
                    }
                } else {
                    const hintBox = document.getElementById(`hint-${qIndex}`);
                    hintBox.style.display = 'block';
                    hintBox.innerText = `⚠️ تە وەڵام نەدایە! وەڵامێ ڕاست: ${q.options[correctIndex]}`;
                }

                document.querySelectorAll(`input[name="question-${qIndex}"]`).forEach(input => input.disabled = true);
            });

            const scoreOutOf100 = Math.round((score / total) * 100);

            document.getElementById('result-section').style.display = 'block';
            document.getElementById('score-display').innerText = `نمرەیا تە: ${score} ژ ${total} پرسیاران`;
            document.getElementById('percentage-display').innerText = `%${scoreOutOf100}`;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
