<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەیا کوردی - پۆلا ١٢</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .selection-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .selection-box {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-group select {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            background-color: #fff;
        }

        .form-group select:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-start { background-color: var(--primary-color); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); }
        .btn-start:hover { background-color: var(--primary-hover); }
        
        .btn-submit { background-color: #0ea5e9; margin-top: 20px; }
        .btn-submit:hover { background-color: #0284c7; }

        .quiz-section, .result-section {
            display: none;
        }

        .quiz-info {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            color: var(--primary-color);
        }

        .question-card {
            background: #fff;
            border: 2px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-item:hover { background-color: #f8fafc; }
        .option-item input { width: 18px; height: 18px; cursor: pointer; }

        /* ستایلێن پشکنینێ */
        .correct-answer {
            background-color: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
        }

        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        .correct-hint {
            margin-top: 10px;
            font-weight: bold;
            color: var(--success);
            font-size: 14px;
        }

        /* ستایلا پشکا ئەنجامی */
        .result-card {
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .result-card h2 { color: #166534; margin-bottom: 15px; }
        .score-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .percentage-text { font-size: 32px; color: var(--primary-color); font-weight: bold; }

        footer {
            text-align: center;
            margin-top: auto;
            padding: 20px;
            width: 100%;
            font-size: 14px;
            color: var(--text-muted);
        }

        footer .developer {
            font-weight: bold;
            color: var(--text-main);
            font-size: 16px;
            margin-top: 5px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>تاقیکردنەوەیا کوردی - پۆلا دوازدێ</h1>
            <p>پرسیارێن وزاری یێن خولا ئێکێ و دووێ (٢٠١٩ - ٢٠٢٥)</p>
        </header>

        <!-- پشکا هەڵبژارتنا سال و خولێ -->
        <div id="setup-section">
            <div class="selection-box">
                <div class="form-group">
                    <label for="year-select">سالی هه‌ڵبژێره‌:</label>
                    <select id="year-select">
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="exam-select">خولی هه‌ڵبژێره‌:</label>
                    <select id="exam-select">
                        <option value="خولا ئێکێ">خولی ئێکێ (50 پرسیار)</option>
                        <option value="خولا دووێ">خولی دووێ (50 پرسیار)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-start" onclick="startQuiz()">دەستپێکرنا تاقیکردنەوەیێ</button>
        </div>

        <!-- پشکا ئەنجامان -->
        <div id="result-section" class="result-section">
            <div class="result-card">
                <h2>ئەنجامێ تاقیکردنەوەیێ</h2>
                <div class="score-text" id="score-display">نمرە: 0 / 0</div>
                <div class="percentage-text" id="percentage-display">ڕێژە: 0%</div>
            </div>
        </div>

        <!-- پشکا نیشادانا پرسیاران -->
        <div id="quiz-section" class="quiz-section">
            <div id="quiz-info" class="quiz-info"></div>
            <form id="quiz-form">
                <div id="questions-container"></div>
                <button type="button" class="btn btn-submit" onclick="submitQuiz()">بۆچوونا ئەنجامان و پشکنین</button>
            </form>
        </div>
    </div>

    <footer>
        <p>هەمی ماف پاراستینە بۆ گەشەپێدەرێ بەرنامەی</p>
        <div class="developer">Developed by: JEHAD ZEBARI</div>
    </footer>

    <script>
        // داتابەیسەکا نموونەیی بۆ تاقیکردنەوەیا کارکرنێ (دشێی پسیارێن ڕاستەقینە لێرە دابنێی)
        const sampleQuestions = [
            { id: 1, text: "پرسیارا ئێکێ: ڕێزمانا کوردی د چەند پشکان دا لێکۆڵینەوەیێ دکەت؟", options: ["A) دوو پشک", "B) سێ پشک", "C) چوار پشک", "D) پێنج پشک"], correct: 2 }, // وەڵامێ دروست index 2 یە واتە C
            { id: 2, text: "پرسیارا دووێ: کام ژ ئەڤان ناڤان ناڤێ ناسراوە؟", options: ["A) کورتەچیرۆک", "B) قوتابخانا ئەحمەد", "C) دەریایێ ڕەش", "D) جانتا"], correct: 1 },
            { id: 3, text: "پرسیارا سیێ: فۆنەتیک ل سەر چ دکۆڵیت؟", options: ["A) ڕستە", "B) پەیڤ", "C) دەنگ", "D) ڕامان"], correct: 2 },
            { id: 4, text: "پرسیارا چوارێ: کام هۆنراوە بۆ نیشتمانی نڤیسیە؟", options: ["A) هێمن", "B) قانع", "C) نالی", "D) بێکەس"], correct: 1 },
            { id: 5, text: "پرسیارا پێنجێ: کلیل و دەرگەهـ چ جۆرە پەیوەندیەک د ناڤبەرا واندا هەیە؟", options: ["A) هاوواتا", "B) دژواتا", "C) هاوپێوەند", "D) هیچ کام"], correct: 2 }
        ];

        let currentQuestions = [];

        function startQuiz() {
            const year = document.getElementById('year-select').value;
            const exam = document.getElementById('exam-select').value;
            
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            document.getElementById('quiz-info').innerText = `تاقیکردنەوەیا سالا ${year} - ${exam}`;
            
            // ئەڤە بۆ نموونەیە هەکە ۵ پرسیار بن، بەس سیستەم بۆ ۵۰ پرسیاران ژی ب هەمان شێوەیە
            currentQuestions = [...sampleQuestions]; 
            generateQuestions(currentQuestions);
        }

        function generateQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            questions.forEach((q, qIndex) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                questionCard.id = `qcard-${qIndex}`;
                
                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <li class="option-item" id="opt-label-${qIndex}-${oIndex}">
                            <input type="radio" name="question-${qIndex}" value="${oIndex}" id="opt-${qIndex}-${oIndex}">
                            <label for="opt-${qIndex}-${oIndex}">${opt}</label>
                        </li>
                    `;
                });

                questionCard.innerHTML = `
                    <div class="question-text">${q.text}</div>
                    <ul class="options-list">${optionsHTML}</ul>
                    <div class="correct-hint" id="hint-${qIndex}" style="display:none;"></div>
                `;
                container.appendChild(questionCard);
            });
        }

        function submitQuiz() {
            let score = 0;
            const total = currentQuestions.length;

            currentQuestions.forEach((q, qIndex) => {
                const selectedRadio = document.querySelector(`input[name="question-${qIndex}"]:checked`);
                const correctIndex = q.correct;
                
                // نیشادانا وەڵامێ ڕاست یێ سەرەکی هەمیشە ب سەوزی
                document.getElementById(`opt-label-${qIndex}-${correctIndex}`).classList.add('correct-answer');

                if (selectedRadio) {
                    const userAns = parseInt(selectedRadio.value);
                    if (userAns === correctIndex) {
                        score++; // ئەگەر وەڵام ڕاست بوو نمرە زێدە دبیت
                    } else {
                        // ئەگەر وەڵام خەلەت بوو، یێ خەلەت سوور دکەت
                        document.getElementById(`opt-label-${qIndex}-${userAns}`).classList.add('wrong-answer');
                        // نیشادانا تێبینیەکا بچویک بۆ دیارکرنا وەڵامێ ڕاست
                        const hintBox = document.getElementById(`hint-${qIndex}`);
                        hintBox.style.display = 'block';
                        hintBox.innerText = `وەڵامێ دروست: ${q.options[correctIndex]}`;
                    }
                } else {
                    // ئەگەر قوتابی چ وەڵام نەدابن، تێبینی بۆ دچیت کا یێ ڕاست کیشکە
                    const hintBox = document.getElementById(`hint-${qIndex}`);
                    hintBox.style.display = 'block';
                    hintBox.innerText = `تە وەڵام نەدایە! وەڵامێ دروست: ${q.options[correctIndex]}`;
                }

                // قفلکرنا دەستکاریێ دا وەڵام نەهێنە گوهۆڕین پشتی ئەنجامان
                document.querySelectorAll(`input[name="question-${qIndex}"]`).forEach(input => input.disabled = true);
            });

            // ئەژمارکرنا ڕێژا ۱۰۰%
            const scoreOutOf100 = Math.round((score / total) * 100);

            // نیشادانا تابلۆیا ئەنجامان
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('score-display').innerText = `نمرە: ${score} ژ ${total} پرسیاران`;
            document.getElementById('percentage-display').innerText = `ڕێژە: ${scoreOutOf100}%`;

            // سەرکەفتن بۆ سەرێ پەیجێ بۆ دیتنا نمرێ
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
