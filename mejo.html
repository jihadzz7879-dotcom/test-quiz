<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەزموونا مێژوویێ - پۆلا ١٢</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --gold-primary: #d4af37;
            --gold-secondary: #aa841b;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --correct-color: #2e7d32;
            --wrong-color: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gold-primary);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--gold-primary);
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .quiz-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .question-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #202020;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            font-size: 15px;
        }

        .option-label:hover {
            border-color: var(--gold-secondary);
            background-color: #252525;
        }

        .option-label input[type="radio"] {
            accent-color: var(--gold-primary);
            width: 18px;
            height: 18px;
        }

        /* Result Styles */
        .correct-choice {
            background-color: var(--correct-color) !important;
            border-color: #4caf50 !important;
        }

        .wrong-choice {
            background-color: var(--wrong-color) !important;
            border-color: #f44336 !important;
        }

        .feedback-text {
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            color: #000;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #result-box {
            display: none;
            background-color: var(--card-bg);
            border: 2px solid var(--gold-primary);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }

        #result-box h2 {
            color: var(--gold-primary);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 36px;
            font-weight: bold;
            margin: 15px 0;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ئەزموونا گشتی یا مێژوویێ</h1>
        <p>پۆلا دوازدێ ئامادەیی (پسیارێن ویزاری ٥٠ دانە)</p>
    </header>

    <div id="result-box">
        <h2>ئەنجامێ ئەزموونا تە</h2>
        <div class="score-display" id="score-text">0 / 100</div>
        <p id="score-details"></p>
    </div>

    <form id="quizForm" class="quiz-form">
        <!-- Questions generated by JS -->
    </form>

    <button type="button" class="submit-btn" id="submitBtn" onclick="checkAnswers()">ڕەوانەکرن و پشکنینا ئەنجامی</button>
</div>

        { id: 3, q: "کیش ژڤان دەقەواژان ڕاستن:", key: "B", choices: { A: "ڕێککەفتنناما ئەماسیە بۆ ماوێ هەشتی سالان جەنگ و کوشتنی دناڤبەرا دەولەتی عوسمانی و ئێرانی ڕاگرت.", B: "ل سالا (١٨٤٩ز) و پشتی هنگێ دەڤەرا شەهرەزوور ئێکەسەر ب ئایستەنبۆلێ ڤە هاتە گریدان.", C: "ماددێ پێنجێ یا ڕێککەفتناما ئەرزەڕۆما دوویێ کارۆبارێن بازرگانیێ بخۆڤە گرتبوو.", D: "ژلایی هەڤبەندیێن ڕامیاریڤە هەرێمێن ڕۆژئافایێن ئیمپراتۆریەتێ تامۆسانی ب ئاڤ ل بن دەسهەلاتا عوسمانیێدا بوون" } },
        { id: 4, q: "ل سوریا ژی چەند سەرهەلدانەک ل هەمبەر کاربدەستێن عوسمانی سەرهەلدا وەکێ سەرهەلدانا سالا ........... ل ( جەبەلێ عەرەب ):", key: "A", choices: { A: "١٨٨٦ز", B: "١٨٩٩ز", C: "١٧٩٨ز", D: "١٨٥١ز" } },

    // Generate HTML for Questions dynamically
    const form = document.getElementById('quizForm');
    questionsData.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${q.id}`;

        let optionsHTML = '';
        for (const [letter, text] of Object.entries(q.choices)) {
            optionsHTML += `
                <label class="option-label" id="label-${q.id}-${letter}">
                    <input type="radio" name="question-${q.id}" value="${letter}">
                    <span>${letter} ) ${text}</span>
                </label>
            `;
        }

        card.innerHTML = `
            <div class="question-title">${q.id}. ${q.q}</div>
            <div class="options-container">
                ${optionsHTML}
            </div>
            <div class="feedback-text" id="feedback-${q.id}"></div>
        `;
        form.appendChild(card);
    });

    function checkAnswers() {
        let correctCount = 0;
        const totalQuestions = questionsData.length;

        questionsData.forEach(q => {
            const selectedInput = document.querySelector(`input[name="question-${q.id}"]:checked`);
            const feedbackText = document.getElementById(`feedback-${q.id}`);
            
            // Reset background for options
            for (const letter of Object.keys(q.choices)) {
                const lbl = document.getElementById(`label-${q.id}-${letter}`);
                if (lbl) lbl.classList.remove('correct-choice', 'wrong-choice');
            }

            if (selectedInput) {
                const userAns = selectedInput.value;
                if (userAns === q.key) {
                    correctCount++;
                    document.getElementById(`label-${q.id}-${q.key}`).classList.add('correct-choice');
                    feedbackText.style.display = 'block';
                    feedbackText.style.color = '#4caf50';
                    feedbackText.innerText = '✓ بەرسفا تە ڕاستە!';
                } else {
                    document.getElementById(`label-${q.id}-${userAns}`).classList.add('wrong-choice');
                    document.getElementById(`label-${q.id}-${q.key}`).classList.add('correct-choice');
                    feedbackText.style.display = 'block';
                    feedbackText.style.color = '#f44336';
                    feedbackText.innerText = `✗ خەلتە! بەرسفا ڕاست: (${q.key})`;
                }
            } else {
                document.getElementById(`label-${q.id}-${q.key}`).classList.add('correct-choice');
                feedbackText.style.display = 'block';
                feedbackText.style.color = '#ff9800';
                feedbackText.innerText = `تە بەرسف نەدایە! بەرسفا ڕاست: (${q.key})`;
            }
        });

        // Score out of 100
        const finalScore = Math.round((correctCount / totalQuestions) * 100);
        
        // Show Results
        const resultBox = document.getElementById('result-box');
        const scoreText = document.getElementById('score-text');
        const scoreDetails = document.getElementById('score-details');

        resultBox.style.display = 'block';
        scoreText.innerText = `${finalScore} / 100`;
        scoreDetails.innerText = `تە بەرسفا ${correctCount} پسیاران ژ کۆما ${totalQuestions} پسیاران ب دروستی دایە.`;

        // Smooth scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
